<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA — Domain 1: Tool Use Quiz</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1a1a24;
    --border: #252533;
    --text: #e4e4ec;
    --dim: #7c7c94;
    --accent: #38bdf8;
    --accent2: #0284c7;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .container { width: 100%; max-width: 720px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--dim); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  /* Pass tracker */
  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(52,211,153,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(56,189,248,0.4); } 50% { box-shadow: 0 0 0 8px rgba(56,189,248,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-bottom: 1.5rem; }
  .domain-tag { font-size: 0.7rem; padding: 0.2rem 0.65rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--dim); }

  .start-stats { display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; }
  .stat { text-align: center; }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }

  .timer { font-size: 0.8rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--dim); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.7rem; color: var(--dim); background: var(--surface2); padding: 0.15rem 0.5rem; border-radius: 4px; }
  .q-prompt { font-size: 1.05rem; font-weight: 500; color: #f0f0f6; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 0.85rem 1rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 0.925rem;
  }
  .option:hover { border-color: var(--accent2); background: #1e1e30; }
  .option.selected { border-color: var(--accent); background: #102438; }
  .option.correct { border-color: var(--green); background: #0f2b1a; }
  .option.wrong { border-color: var(--red); background: #2b0f0f; }
  .option.revealed-correct { border-color: var(--green); opacity: 0.65; }
  .option.disabled { pointer-events: none; }
  .option.disabled:hover { border-color: var(--border); background: var(--surface2); }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 5px; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1rem; padding: 1rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--accent); font-size: 0.85rem; color: var(--dim); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }

  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #0369a1; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--dim); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.35rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--dim); font-size: 0.7rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered { border-color: var(--accent); color: var(--accent); }
  .qnav-dot.answered.active { border-color: var(--accent); background: var(--accent); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 0.5rem; }
  .result-detail { color: var(--dim); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(52,211,153,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf {
    font-size: 0.65rem;
    flex-shrink: 0;
    font-weight: 700;
    letter-spacing: 0.08em;
    border-radius: 99px;
    padding: 0.15rem 0.5rem;
    border: 1px solid var(--border);
  }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 {
    font-size: 0.85rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.65rem;
  }
  .topic-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem;
    align-items: center;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 0.4rem;
    font-size: 0.82rem;
    background: var(--surface2);
  }
  .topic-item .topic-score {
    font-variant-numeric: tabular-nums;
    color: var(--dim);
  }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint {
    margin-top: 0.75rem;
    font-size: 0.72rem;
    color: var(--dim);
    text-align: right;
  }
  .keyboard-hint kbd {
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.05rem 0.35rem;
    background: var(--surface2);
    color: #d8d8e7;
  }

  .celebration {
    display: inline-block;
    margin-bottom: 0.8rem;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.22rem 0.65rem;
    border-radius: 999px;
    border: 1px solid var(--green);
    color: var(--green);
    background: rgba(52,211,153,0.12);
  }

  footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: var(--dim); }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--dim)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

// ── question bank (30 total) ──────────────────────────────────
var BANK = [
  { source:"Tool Definitions", prompt:"Which is the <strong>single most important factor</strong> in tool performance according to Anthropic?", opts:["The tool's input_schema complexity and number of required parameters","The quality and detail of the tool's description field","The number of input_examples provided for the tool","The model version used (Opus vs Sonnet vs Haiku)"], ans:1, expl:"Anthropic explicitly states: <strong>\"Provide extremely detailed descriptions. This is by far the most important factor in tool performance.\"</strong> Descriptions should cover what the tool does, when to use it, what each parameter means, and any caveats or limitations. Aim for at least 3-4 sentences per tool description." },
  { source:"Tool Definitions", prompt:"Your tool definition has <code>input_schema.required = [\"location\"]</code> and <code>input_schema.properties.unit = {type: \"string\", enum: [\"celsius\", \"fahrenheit\"]}</code>. Which statement is correct?", opts:["Both 'location' and 'unit' must be provided by Claude in every tool call","'location' is required; 'unit' is optional but if provided must be 'celsius' or 'fahrenheit'","'unit' is required because it has an enum constraint","The enum on 'unit' means Claude will randomly select between the two values"], ans:1, expl:"Parameters listed in <strong>required</strong> MUST be provided. Parameters NOT in required are optional. When a parameter has an <strong>enum</strong>, it restricts acceptable values — if Claude provides the parameter, it must be one of the enum values. Claude can also omit optional parameters entirely." },
  { source:"Tool Definitions", prompt:"What are the four fields in a tool definition? Which are required?", opts:["All four are required: name, description, input_schema, input_examples","name, description, and input_schema are required; input_examples is optional","Only name and description are required; input_schema is inferred","All fields are optional — Claude infers missing ones from context"], ans:1, expl:"<strong>name</strong>, <strong>description</strong>, and <strong>input_schema</strong> are required. <strong>input_examples</strong> is optional. The name must match <code>^[a-zA-Z0-9_-]{1,64}$</code>. Additional optional properties include cache_control, strict, defer_loading, and allowed_callers." },
  { source:"Tool Descriptions", prompt:"Which tool description follows Anthropic's best practices?", opts:["\"Gets the stock price for a ticker.\"","\"Retrieves the current stock price for a given ticker symbol. The ticker symbol must be a valid symbol for a publicly traded company on a major US stock exchange like NYSE or NASDAQ. The tool will return the latest trade price in USD. It should be used when the user asks about the current or most recent price of a specific stock. It will not provide any other information about the stock or company.\"","\"get_stock_price: Returns stock data. Parameters: ticker (string).\"","\"Fetches real-time financial market data including stock prices, forex rates, crypto values, and commodity prices for the specified instruments.\""], ans:1, expl:"Option B covers all 4 elements of a good description: <strong>(1) what it does</strong>, <strong>(2) when to use it</strong>, <strong>(3) what parameters mean</strong>, and <strong>(4) important caveats/limitations</strong> (doesn't provide company info). Option A is too brief. Option C is a technical summary, not a description. Option D over-promises features." },
  { source:"Tool Descriptions", prompt:"Where do you document a tool's caveats or limitations (e.g., \"this tool will not return company information\")?", opts:["In a separate 'limitations' JSON field in the tool definition","In the description field — there is no separate JSON structure for caveats","In the input_schema under a 'caveats' property","In the system prompt as a separate instruction"], ans:1, expl:"Caveats and limitations go in the <strong>description</strong> field. There is no separate JSON structure for them. Anthropic recommends: <em>\"Any important caveats or limitations, such as what information the tool does not return.\"</em> This is part of the 4-element rule for good descriptions." },
  { source:"Tool Consolidation", prompt:"Your team has three tools: <code>create_pr</code>, <code>review_pr</code>, and <code>merge_pr</code>. What is the recommended consolidation pattern?", opts:["Keep them separate — each operation is distinct enough to warrant its own tool","Group them into a single tool (e.g., <code>github_pr</code>) with an <code>action</code> parameter","Create a single <code>manage_github</code> tool for ALL GitHub operations","Remove two of them and only keep the most commonly used one"], ans:1, expl:"Anthropic recommends <strong>consolidating related operations into fewer tools</strong> using an action parameter. This reduces selection ambiguity and makes the tool surface easier to navigate. Option C goes too far — over-consolidation makes tools harder to describe clearly." },
  { source:"Tool Consolidation", prompt:"Why does Anthropic recommend consolidating related tools?", opts:["To reduce API latency by sending fewer tool definitions per request","To reduce selection ambiguity — fewer tools means Claude is less likely to pick the wrong one","To reduce the number of API calls needed per user query","To save on storage costs for tool definitions"], ans:1, expl:"The primary reason is <strong>reducing selection ambiguity</strong>. Fewer, more capable tools make your tool surface easier for Claude to navigate. A secondary benefit is reduced context consumption (fewer definitions loaded). Storage and latency are not the driving factors." },
  { source:"Tool Namespacing", prompt:"Your agent has access to GitHub, Slack, and Asana tools. What naming convention does Anthropic recommend?", opts:["Postfix naming: list_prs_github, send_message_slack, search_tasks_asana","Service-prefixed naming: github_list_prs, slack_send_message, asana_search_tasks","No prefix needed — descriptive names like 'list_prs' are sufficient","All-caps prefix: GITHUB_PR_LIST, SLACK_SEND_MSG"], ans:1, expl:"Anthropic recommends <strong>prefix-based namespacing</strong> (service name first). Examples from docs: <code>github_list_prs</code>, <code>slack_send_message</code>. Anthropic notes that prefix vs suffix naming has non-trivial effects on evaluation performance — test your own choices." },
  { source:"Input Examples", prompt:"You add <code>input_examples</code> to a tool. Which constraints apply? Select all that correctly identify the rules.", opts:["Examples must include all parameters including optional ones","Each example must be valid according to the input_schema — invalid = 400 error","Examples work on all tool types including server-side tools like web search","Examples are NOT supported for server-side tools (web search, code execution)"], ans:3, expl:"<strong>Schema validation</strong> is enforced: each example must be valid according to the tool's <code>input_schema</code>. Invalid examples return a 400 error. Examples do NOT need to include optional params. They are <strong>not supported for server-side tools</strong>. Token cost: ~20-50 tokens (simple) or ~100-200 (complex)." },
  { source:"Input Examples", prompt:"What's the approximate token cost for input_examples?", opts:["They are free — examples don't consume tokens","~20-50 tokens for simple examples, ~100-200 tokens for complex nested objects","~500 tokens per example regardless of complexity","Zero tokens — examples are processed client-side"], ans:1, expl:"Input examples add to prompt tokens: <strong>~20-50 tokens</strong> for simple examples and <strong>~100-200 tokens</strong> for complex nested objects. Budget accordingly when adding many examples." },
  { source:"Model Selection", prompt:"You're building tool use where queries are straightforward (e.g., \"get weather in Tokyo\") and inputs unambiguous. Which model and what's the warning?", opts:["Claude Opus 4.7 — handles all tool use best regardless","Claude Sonnet 4.6 — safest default for any tool use","Claude Haiku — fast/cheap for straightforward tools, but may infer (guess) missing parameters","Any model works equally — tool use performance is model-independent"], ans:2, expl:"Haiku is appropriate for straightforward tools but <strong>may infer missing parameters</strong> rather than seeking clarification. For ambiguous inputs, Opus or Sonnet is safer. Opus 4.7 <strong>seeks clarification when needed</strong> and handles multiple tools best." },
  { source:"Model Selection", prompt:"Which Claude model seeks clarification when tool parameters are ambiguous, rather than guessing?", opts:["Claude Haiku — it's designed for interactive clarification","Claude Opus 4.7 — handles ambiguous queries best and seeks clarification","Claude Sonnet 4.6 — it has the best clarification capabilities","All models behave identically with ambiguous tool parameters"], ans:1, expl:"<strong>Claude Opus 4.7</strong> handles ambiguous queries best and <strong>seeks clarification when needed</strong> rather than guessing at missing parameters. This is a key differentiator from Haiku which may infer (guess) missing parameters." },
  { source:"Tool Choice", prompt:"You want Claude to explain its reasoning BEFORE calling a tool, while using extended thinking. Which tool_choice works?", opts:["tool_choice: {type: \"tool\", name: \"get_weather\"}","tool_choice: {type: \"any\"}","tool_choice: {type: \"auto\"} + user message: \"Use the get_weather tool in your response\"","tool_choice: {type: \"none\"} — avoid tools entirely"], ans:2, expl:"<strong>Extended thinking is incompatible with tool_choice: any and tool_choice: tool</strong> (they return errors). The workaround is <strong>tool_choice: auto</strong> + explicit user instructions. When using any/tool, the API <strong>prefills the assistant message</strong> — Claude cannot emit natural language before the tool call." },
  { source:"Tool Choice", prompt:"What are the four tool_choice options and their behaviors?", opts:["start/stop/pause/resume","auto (Claude decides) / any (must use some tool) / tool (must use specific tool) / none (no tools)","required/optional/conditional/never","open/closed/partial/complete"], ans:1, expl:"<strong>auto</strong>: Claude decides whether to call tools (default). <strong>any</strong>: MUST call some tool, but can choose which one. <strong>tool</strong>: MUST call a specific named tool. <strong>none</strong>: MUST NOT call any tools. Only auto and none are compatible with extended thinking." },
  { source:"Tool Choice", prompt:"When tool_choice is 'any' or 'tool', what happens to the assistant's response?", opts:["Claude first explains what it will do, then calls the tool","The API prefills the assistant message — Claude CANNOT emit natural language before the tool_use block","Claude can choose between responding naturally or calling the tool","The tool call is silently injected after the natural response"], ans:1, expl:"The API <strong>prefills the assistant message</strong> to force a tool to be used. Models will <strong>not emit a natural language response or explanation before tool_use content blocks</strong>, even if explicitly asked to do so. If you need both, use <strong>auto</strong> + prompting." },
  { source:"Extended Thinking", prompt:"On Claude Opus 4.7, what happens if you set <code>thinking: {type: \"enabled\", budget_tokens: 12000}</code>?", opts:["The API accepts it and Claude uses extended thinking with 12,000 budget tokens","The API returns a 400 error — Opus 4.7 only supports adaptive thinking","The API silently converts it to adaptive thinking","The API ignores the thinking config and runs without thinking"], ans:1, expl:"On <strong>Claude Opus 4.7, manual extended thinking (budget_tokens) is no longer supported and returns a 400 error</strong>. Opus 4.7 only supports <code>thinking: {type: \"adaptive\"}</code> with the optional <code>effort</code> parameter. Opus 4.6 and Sonnet 4.6 still accept manual mode but it's deprecated." },
  { source:"Extended Thinking", prompt:"What must you preserve when passing conversation history during tool use with extended thinking?", opts:["Only the text content blocks — thinking blocks can be discarded","Only the tool_use blocks","The complete assistant message including thinking blocks (with signatures) must be preserved","Nothing special — extended thinking has no additional requirements during tool use"], ans:2, expl:"During tool use, you must pass <strong>thinking blocks back to the API for the last assistant message</strong>. Include the complete unmodified block (with signature) back to maintain reasoning continuity. This is a critical requirement for multi-turn tool use with thinking." },
  { source:"Extended Thinking", prompt:"What is the relationship between budget_tokens and max_tokens in manual extended thinking mode?", opts:["budget_tokens must be greater than max_tokens","budget_tokens must be less than max_tokens","They are independent — no relationship required","budget_tokens and max_tokens must be equal"], ans:1, expl:"<strong>budget_tokens must be less than max_tokens.</strong> Because of this constraint, extended thinking cannot be combined with max_tokens: 0 (cache pre-warming). When using interleaved thinking with tools, you can exceed this limit as the token limit becomes your entire context window." },
  { source:"Adaptive Thinking", prompt:"What does adaptive thinking automatically enable that makes it especially effective for agentic workflows?", opts:["Faster API response times by skipping the thinking step","Interleaved thinking — Claude can think between tool calls, not just before them","Automatic tool selection without needing tool definitions","Zero token cost for the thinking process"], ans:1, expl:"Adaptive thinking <strong>automatically enables interleaved thinking</strong> on all supported models. Claude can reason after receiving a tool result before deciding its next step — crucial for multi-step agentic workflows." },
  { source:"Adaptive Thinking", prompt:"Which models support adaptive thinking, and which require it?", opts:["All Claude models support adaptive thinking","Opus 4.7 (required, only mode), Opus 4.6 (recommended, manual deprecated), Sonnet 4.6 (recommended), Mythos Preview (default)","Only Opus 4.7 and Opus 4.6","Adaptive thinking is a premium feature requiring a separate license"], ans:1, expl:"<strong>Opus 4.7</strong>: adaptive is the <strong>only</strong> mode (manual returns 400). <strong>Opus 4.6/Sonnet 4.6</strong>: adaptive recommended, manual deprecated. <strong>Mythos Preview</strong>: adaptive is the default. Older models don't support adaptive." },
  { source:"Interleaved Thinking", prompt:"You need interleaved thinking (thinking between tool calls) on Claude Opus 4.6. Which mode enables this?", opts:["Manual extended thinking: thinking: {type: \"enabled\", budget_tokens: 10000}","Adaptive thinking: thinking: {type: \"adaptive\"} — interleaved is auto-enabled","Disabled thinking — Opus 4.6 always does interleaved reasoning","Manual thinking with the interleaved-thinking-2025-05-14 beta header"], ans:1, expl:"<strong>On Opus 4.6, interleaved thinking is NOT available in manual mode.</strong> Only adaptive mode auto-enables it. Sonnet 4.6 has it in manual via beta header + in adaptive automatically. Opus 4.7 has it auto-enabled with adaptive (its only mode)." },
  { source:"Interleaved Thinking", prompt:"What is interleaved thinking and why does it matter?", opts:["It's thinking compressed into fewer tokens for cost savings","Extended thinking with tool use — Claude can think between tool calls, enabling more sophisticated multi-step reasoning","It's a mode where the user can interrupt Claude's thinking","It's the default on all models and requires no configuration"], ans:1, expl:"<strong>Interleaved thinking</strong> = extended thinking with tool use, where Claude can reason between tool calls rather than only before them. This enables <strong>more sophisticated reasoning</strong> during agentic workflows, as Claude can re-evaluate strategy after each tool result." },
  { source:"Thinking Display", prompt:"You set <code>thinking: {type: \"adaptive\", display: \"omitted\"}</code>. Which statement about cost is correct?", opts:["Omitted display reduces both latency AND cost","Omitted display reduces latency but you are still charged for full thinking tokens","Omitted thinking is completely free since no thinking tokens are visible","Omitted display costs MORE than summarized because of encryption overhead"], ans:1, expl:"With <code>display: \"omitted\"</code>, thinking field is empty but <strong>signature</strong> still carries encrypted full thinking. You are <strong>billed for full thinking tokens</strong> regardless. The benefit is <strong>faster time-to-first-text-token when streaming</strong> (no thinking deltas), not cost savings." },
  { source:"Thinking Display", prompt:"On Claude Opus 4.7, what is the default display value and how do you get summarized thinking?", opts:["Default is 'summarized' — no action needed","Default is 'omitted' — you must explicitly set display: \"summarized\" to see thinking","Default is 'disabled' — thinking is off by default","Default is 'full' — all thinking is always visible"], ans:1, expl:"On Opus 4.7 (and Mythos Preview), display <strong>defaults to \"omitted\"</strong>. To see summarized thinking, explicitly set <code>display: \"summarized\"</code>. On Opus 4.6 and Sonnet 4.6, the default is \"summarized\"." },
  { source:"Effort Parameter", prompt:"Your adaptive thinking queries frequently hit <code>stop_reason: \"max_tokens\"</code>. What should you do?", opts:["Increase max_tokens and/or lower the effort level (e.g., high → medium)","Switch to manual thinking with budget_tokens","Disable thinking entirely","Reduce the number of tools available"], ans:0, expl:"At higher effort levels (high, max), Claude may think extensively and exhaust max_tokens. The fix: <strong>increase max_tokens</strong> (hard limit) or <strong>lower effort level</strong> (soft guidance). Effort is guidance; max_tokens is the real ceiling." },
  { source:"Effort Parameter", prompt:"Which effort levels are available across all adaptive thinking models?", opts:["Only 'high' and 'low'","'max', 'high' (default), 'medium', and 'low'","'xhigh' and 'max' are universally available","All five levels (max, xhigh, high, medium, low) are available on all models"], ans:1, expl:"<strong>max, high (default), medium, low</strong> are available on all adaptive models. <strong>xhigh</strong> is <strong>Opus 4.7 exclusive</strong>. Effort is soft guidance — max_tokens is the hard limit." },
  { source:"Tool Use System Prompt", prompt:"How is the system prompt constructed when you call the API with tools?", opts:["Your system prompt replaces the tool-related prompt entirely","You must manually construct a combined prompt","The API auto-constructs a prompt from: formatting instructions + tool definitions (JSON Schema) + your system prompt + tool configuration","Tool definitions are sent separately and don't appear in the system prompt"], ans:2, expl:"The API <strong>automatically constructs</strong> the system prompt combining formatting instructions, tool definitions in JSON Schema, your user-specified system prompt, and tool configuration. You do NOT write this manually. This is why good tool descriptions matter — they become part of the system prompt." },
  { source:"Tool Responses", prompt:"Your tool returns <code>{\"uuid\": \"a1b2c3...\", \"256px_image_url\": \"...\", \"mime_type\": \"application/pdf\"}</code>. What's the improvement?", opts:["Add more fields for maximum flexibility","Replace with semantic identifiers: name, image_url, file_type","Return raw binary data instead of JSON","The current format is fine — agents parse technical identifiers easily"], ans:1, expl:"Anthropic recommends <strong>semantic, human-readable identifiers</strong> over opaque ones. Agents grapple with natural language far better than cryptic identifiers. Replace <code>256px_image_url</code> with <code>image_url</code>, <code>mime_type</code> with <code>file_type</code>. Return only high-signal fields." },
  { source:"Tool Responses", prompt:"What is the <code>response_format</code> enum pattern for tool responses?", opts:["A way to format tool responses as XML instead of JSON","An optional parameter (e.g., 'concise' vs 'detailed') letting the agent control response verbosity, similar to GraphQL field selection","A required parameter specifying whether to return HTTP 200 or 400","A way to specify language (English/Spanish/etc) for tool responses"], ans:1, expl:"Anthropic demonstrates a <code>response_format</code> enum with values like <strong>\"concise\"</strong> and <strong>\"detailed\"</strong>. This lets the agent control verbosity: concise returns only essential fields (~⅓ tokens), detailed includes IDs for chaining further tool calls." },
  { source:"Tool Design", prompt:"An agent with 18 tools has degraded selection accuracy. Research shows agents work best with how many tools?", opts:["10-12 tools","4-5 tools scoped to the agent's specific role","As many as needed — count doesn't matter","1-2 tools maximum"], ans:1, expl:"Anthropic's research shows <strong>agents with 4-5 tools</strong> perform best. Above this, selection reliability degrades. The solution: <strong>scoped tool access</strong> — each agent gets only the tools for its role. If you need 18 tools, create specialized sub-agents with focused tool sets." }
];

var PASS_STORAGE_KEY = 'cca_domain1_pass_count';

function loadPassCount() {
  try {
    var raw = window.localStorage.getItem(PASS_STORAGE_KEY);
    var parsed = parseInt(raw, 10);
    if (Number.isFinite(parsed) && parsed >= 0) return parsed;
  } catch (err) {}
  return 0;
}

function savePassCount(n) {
  try { window.localStorage.setItem(PASS_STORAGE_KEY, String(n)); } catch (err) {}
}

// ── state ──────────────────────────────────────────────────────
var S = {
  screen: 'start',    // 'start' | 'quiz' | 'results'
  pool: [],           // the 20 randomly selected questions (with shuffled options)
  ix: 0,              // current question index
  answers: {},        // {questionIndex: selectedOptIndex}
  revealed: false,
  timeLeft: 90 * 60,
  timerId: null,
  score: null,
  review: [],         // detailed per-question results
  passCount: loadPassCount(),
  warnedFiveMin: false
};

// ── helpers ────────────────────────────────────────────────────
function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Shuffle options within a question — returns {opts: [...], correctIdx}
function shuffleOpts(q) {
  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans)
  };
}

// Build the 20-question deck from the 30-question bank
function buildDeck() {
  var picked = shuffle(BANK).slice(0, 20);
  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      expl: q.expl
    };
  });
}

// ── actions ────────────────────────────────────────────────────
function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = 90 * 60;
  S.warnedFiveMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 300 && !S.warnedFiveMin) {
      S.warnedFiveMin = true;
      window.alert('5 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  render();
}

function reveal() {
  S.revealed = true;
  render();
}

function goNext() {
  S.revealed = false;
  if (S.ix < S.pool.length - 1) { S.ix++; }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) { S.revealed = false; S.ix--; render(); }
}

function goTo(idx) {
  S.revealed = false; S.ix = idx; render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  S.pool.forEach(function(q, i) {
    var isCorrect = S.answers[i] === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: S.answers[i], isCorrect: isCorrect });
  });
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score === 1000) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: 90 * 60, timerId: null, score: null, review: [], passCount: 0, warnedFiveMin: false
  };
  savePassCount(0);
  render();
}

// ── render ─────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

// ── start screen ─────────────────────────────────────────────
function renderStart() {
  var tags = [
    'Tool Definitions','Descriptions','Input Schema','Input Examples',
    'Tool Consolidation','Namespacing','Model Selection','Tool Choice',
    'Extended Thinking','Adaptive Thinking','Interleaved Thinking',
    'Effort Parameter','Thinking Display','Tool Responses'
  ];
  return '<div class="card" style="text-align:center">' +
    '<h2>CCA Domain 1: Tool Use Quiz</h2>' +
    '<p>30 question bank. Each attempt randomly selects <strong>20</strong> questions with <strong>shuffled answer orders</strong>. Pass = 100% (20/20). You must pass <strong>3 times</strong> to complete this domain.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2,3].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 3 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Domain complete! 3 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + tags.map(function(t) { return '<span class="domain-tag">' + t + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">30</div><div class="stat-label">Bank</div></div>' +
      '<div class="stat"><div class="stat-value">20</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">90 min</div><div class="stat-label">Time</div></div>' +
      '<div class="stat"><div class="stat-value">1000/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--dim);margin-bottom:1.5rem">Questions drawn from Anthropic tool use docs, extended thinking docs, adaptive thinking docs, and Writing Tools for Agents. Matches the Obsidian CCA-Study knowledge graph.</p>' +
    '<p style="font-size:0.75rem;color:var(--dim);margin-bottom:1.2rem">Progress is saved in this browser until you reset it.</p>' +
    '<button class="btn btn-primary" id="btnStart">Start Quiz (20 Qs)</button>' +
  '</div>';
}

// ── quiz screen ──────────────────────────────────────────────
function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 300 ? 'danger' : S.timeLeft < 900 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + q.opts[i] + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    var isCorrect = answered === q.correctIdx;
    expHTML = '<div class="explanation show"><strong>' + (isCorrect ? 'Correct' : 'Incorrect') + '</strong> — ' + q.expl + '</div>';
  }

  return (
    '<div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div>' +
    '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
    '<div class="card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / 20</span><span class="q-source">' + q.source + '</span></div>' +
      '<div class="q-prompt">' + q.prompt + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>\u2190 Previous</button>' +
        '<span>' +
          (!S.revealed && answered >= 0 ? '<button class="btn btn-primary" id="btnCheck">Check Answer</button>' : '') +
          (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next \u2192') + '</button>' : '') +
        '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer · <kbd>Enter</kbd> check/next · <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += ' answered';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

// ── results screen ───────────────────────────────────────────
function renderResults() {
  var s = S.score;
  var perfect = s === 1000;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '—') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + r.q.source + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 3; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + src2 + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  return (
    '<div class="result-card">' +
      (perfect && S.passCount >= 3
        ? '<div class="celebration">Domain Mastered</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 3 passes complete! Domain mastered.</p>'
        : perfect
          ? '<div class="celebration">Perfect Run</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect score! ' + (3 - S.passCount) + ' more perfect pass' + (3 - S.passCount > 1 ? 'es' : '') + ' needed.</p>'
          : '') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (perfect ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>20</span> correct · <span>' + (perfect ? 'PERFECT' : 'Keep studying') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">New Quiz (Shuffled)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
      '</div>' +
    '</div>'
  );
}

// ── event delegation ──────────────────────────────────────────
document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;

  // start button
  if (t.id === 'btnStart') startQuiz();

  // option click
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }

  // check answer
  if (t.id === 'btnCheck') reveal();

  // next
  if (t.id === 'btnNext') goNext();

  // prev
  if (t.id === 'btnPrev') goPrev();

  // qnav dot
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }

  // retry
  if (t.id === 'btnRetry') startQuiz();

  // review answers
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    // show all answers as revealed
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }

  // reset
  if (t.id === 'btnReset') restart();
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;

  if ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D')) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }

  if (e.key === 'Enter') {
    if (!S.revealed && S.answers[S.ix] !== undefined) reveal();
    else if (S.revealed) goNext();
    e.preventDefault();
  }

  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }

  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

// ── initial render ────────────────────────────────────────────
render();
})();
</script>
