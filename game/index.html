<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architect's Ascent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Press Start 2P', monospace;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  image-rendering: pixelated;
}

#game {
  width: 800px;
  height: 600px;
  border: 4px solid #4a9;
  background: #111122;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(68,170,153,0.3);
}

/* SCREENS */
.screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.screen.active { display: flex; flex-direction: column; }

/* TITLE SCREEN */
#title-screen {
  background: linear-gradient(180deg, #0a0a2e 0%, #1a1a3e 50%, #0a0a1a 100%);
  align-items: center;
  justify-content: center;
  text-align: center;
}
#title-screen h1 {
  font-size: 24px;
  color: #4af;
  text-shadow: 0 0 20px rgba(68,170,255,0.5);
  margin-bottom: 8px;
  animation: glow 2s ease-in-out infinite alternate;
}
#title-screen .subtitle {
  font-size: 10px;
  color: #8ad;
  margin-bottom: 40px;
}
@keyframes glow {
  from { text-shadow: 0 0 10px rgba(68,170,255,0.3); }
  to { text-shadow: 0 0 30px rgba(68,170,255,0.8), 0 0 60px rgba(68,170,255,0.3); }
}
.tower-art {
  font-size: 10px;
  line-height: 1.2;
  color: #4a9;
  margin-bottom: 30px;
  white-space: pre;
}
.blink {
  animation: blink 1s step-end infinite;
  font-size: 12px;
  color: #fff;
  cursor: pointer;
}
@keyframes blink { 50% { opacity: 0; } }

/* MAP SCREEN */
#map-screen { background: #0d0d20; }
.map-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #1a1a30;
  border-bottom: 3px solid #333;
  font-size: 8px;
}
.map-header .stats { display: flex; gap: 20px; }
.stat-label { color: #888; }
.stat-val { color: #4f4; }
.stat-val.xp { color: #ff4; }
.map-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}
.floor-row {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  margin: 3px 0;
  border: 2px solid #333;
  border-radius: 4px;
  cursor: pointer;
  font-size: 8px;
  transition: all 0.2s;
}
.floor-row:hover { border-color: #4a9; background: #1a1a30; }
.floor-row.locked { opacity: 0.4; cursor: not-allowed; }
.floor-row.locked:hover { border-color: #333; background: transparent; }
.floor-row.cleared { border-color: #4f4; }
.floor-row.current { border-color: #ff4; background: #2a2a10; }
.floor-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-right: 12px;
}
.floor-info { flex: 1; }
.floor-name { color: #fff; margin-bottom: 4px; }
.floor-domain { color: #888; font-size: 7px; }
.floor-score { color: #4f4; font-size: 8px; min-width: 80px; text-align: right; }

/* BATTLE SCREEN */
#battle-screen { background: #0a0a1a; }
.battle-top {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  background: #1a1a30;
  border-bottom: 3px solid #333;
}
.enemy-info, .player-info { font-size: 8px; }
.hp-bar {
  width: 160px;
  height: 12px;
  background: #333;
  border: 2px solid #555;
  margin-top: 4px;
  position: relative;
}
.hp-fill {
  height: 100%;
  background: #4f4;
  transition: width 0.5s;
}
.hp-fill.low { background: #f44; }
.hp-fill.mid { background: #ff4; }
.enemy-name { color: #f66; }
.player-name { color: #4af; text-align: right; }

.battle-arena {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}
.enemy-sprite {
  text-align: center;
  font-size: 9px;
  line-height: 1.3;
  color: #f66;
  margin: 8px 0;
  white-space: pre;
  min-height: 80px;
}
.question-box {
  background: #1a1a30;
  border: 2px solid #4a9;
  border-radius: 4px;
  padding: 12px;
  margin: 8px 0;
  font-size: 8px;
  line-height: 1.6;
  max-height: 140px;
  overflow-y: auto;
}
.question-num { color: #ff4; margin-bottom: 8px; font-size: 7px; }
.answers {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.answer-btn {
  background: #1a1a30;
  border: 2px solid #444;
  color: #ddd;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 10px;
  text-align: left;
  cursor: pointer;
  line-height: 1.5;
  transition: all 0.15s;
}
.answer-btn:hover { border-color: #4af; background: #1a1a40; }
.answer-btn.correct { border-color: #4f4; background: #1a3a1a; color: #4f4; }
.answer-btn.wrong { border-color: #f44; background: #3a1a1a; color: #f44; }
.answer-btn.reveal { border-color: #4f4; background: #1a3a1a; }
.answer-btn.disabled { pointer-events: none; opacity: 0.6; }

.battle-msg {
  text-align: center;
  font-size: 9px;
  padding: 8px;
  min-height: 24px;
}
.battle-msg.hit { color: #4f4; }
.battle-msg.miss { color: #f44; }

/* RESULT SCREEN */
#result-screen {
  background: #0d0d20;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.result-title { font-size: 20px; margin-bottom: 16px; }
.result-title.win { color: #4f4; }
.result-title.lose { color: #f44; }
.result-stats { font-size: 9px; line-height: 2.5; margin-bottom: 24px; }
.result-xp { color: #ff4; font-size: 12px; margin-bottom: 30px; }

/* EXPLANATION POPUP */
.explanation-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 10;
  justify-content: center;
  align-items: center;
}
.explanation-overlay.active { display: flex; }
.explanation-box {
  background: #1a1a30;
  border: 3px solid #4a9;
  border-radius: 6px;
  padding: 20px;
  max-width: 600px;
  max-height: 400px;
  overflow-y: auto;
  font-size: 8px;
  line-height: 1.8;
}
.explanation-box h3 { color: #4af; margin-bottom: 12px; font-size: 10px; }
.explanation-box .correct-label { color: #4f4; margin-bottom: 8px; }

/* BUTTONS */
.game-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  padding: 12px 24px;
  background: #1a1a30;
  border: 3px solid #4a9;
  color: #4a9;
  cursor: pointer;
  transition: all 0.2s;
}
.game-btn:hover { background: #4a9; color: #111; }
.game-btn.small { font-size: 8px; padding: 8px 16px; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #4a9; }
</style>
</head>
<body>

<div id="game">
  <!-- TITLE SCREEN -->
  <div id="title-screen" class="screen active">
    <div class="tower-art">       /\
      /  \
     / ** \
    /______\
    |      |
    | DOOR |
    |______|
   /________\</div>
    <h1>ARCHITECT'S ASCENT</h1>
    <div class="subtitle">Claude Certified Architect -- Foundations</div>
    <br><br>
    <div class="blink" onclick="startGame()">[ PRESS START ]</div>
  </div>

  <!-- MAP SCREEN -->
  <div id="map-screen" class="screen">
    <div class="map-header">
      <div>
        <span class="stat-label">TITLE:</span>
        <span class="stat-val" id="map-title">Apprentice</span>
      </div>
      <div class="stats">
        <div><span class="stat-label">LV</span> <span class="stat-val" id="map-level">1</span></div>
        <div><span class="stat-label">XP</span> <span class="stat-val xp" id="map-xp">0</span></div>
        <div><span class="stat-label">STREAK</span> <span class="stat-val" id="map-streak">0</span></div>
        <div><span class="stat-label">W/L</span> <span class="stat-val" id="map-record">0/0</span></div>
      </div>
    </div>
    <div class="map-body" id="floor-list"></div>
  </div>

  <!-- BATTLE SCREEN -->
  <div id="battle-screen" class="screen">
    <div class="battle-top">
      <div class="enemy-info">
        <div class="enemy-name" id="enemy-name">???</div>
        <div class="hp-bar"><div class="hp-fill" id="enemy-hp" style="width:100%"></div></div>
        <div style="font-size:7px;color:#888;margin-top:2px;" id="enemy-hp-text">10/10 HP</div>
      </div>
      <div class="player-info">
        <div class="player-name" id="player-name">Apprentice</div>
        <div class="hp-bar"><div class="hp-fill" id="player-hp" style="width:100%"></div></div>
        <div style="font-size:7px;color:#888;margin-top:2px;text-align:right;" id="player-hp-text">10/10 HP</div>
      </div>
    </div>
    <div class="battle-arena">
      <div class="enemy-sprite" id="enemy-sprite"></div>
      <div class="battle-msg" id="battle-msg"></div>
      <div class="question-box">
        <div class="question-num" id="q-num">Q1/10</div>
        <div id="q-text"></div>
      </div>
      <div class="answers" id="answers"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="screen">
    <div class="result-title" id="result-title">VICTORY</div>
    <div class="result-stats" id="result-stats"></div>
    <div class="result-xp" id="result-xp"></div>
    <br>
    <button class="game-btn" onclick="showMap()">CONTINUE</button>
  </div>

  <!-- EXPLANATION OVERLAY -->
  <div class="explanation-overlay" id="explanation-overlay">
    <div class="explanation-box" id="explanation-box">
      <h3>EXPLANATION</h3>
      <div class="correct-label" id="expl-correct"></div>
      <div id="expl-text"></div>
      <br>
      <button class="game-btn small" id="expl-btn" onclick="closeExplanation()">NEXT</button>
    </div>
  </div>
</div>

<script>
// ==================== GAME STATE ====================
const state = {
  xp: 0, level: 1, streak: 0, wins: 0, losses: 0,
  floors: Array(11).fill(null).map(() => ({ cleared: false, bestScore: 0 })),
  currentFloor: 0,
  // battle state
  battleQuestions: [], currentQ: 0, score: 0,
  playerHP: 10, playerMaxHP: 10,
  enemyHP: 10, enemyMaxHP: 10,
};

// Load saved state
try {
  const saved = localStorage.getItem('architects-ascent');
  if (saved) Object.assign(state, JSON.parse(saved));
} catch(e) {}

function saveState() {
  localStorage.setItem('architects-ascent', JSON.stringify(state));
}

// ==================== FLOOR DATA ====================
const floors = [
  { name: "The Loop Chamber", domain: "D1: Agentic Loops", icon: "~", enemy: "Loop Terminator", sprite: `  [@@]
 /|##|\\
  |##|
 / \\/ \\
STOP_REASON?`, color: "#f66" },
  { name: "Coordination Hall", domain: "D1: Multi-Agent", icon: "*", enemy: "Rogue Subagent", sprite: `  (00)
 <|__|>
  |  |
 _/  \\_
HUB-SPOKE!`, color: "#f84" },
  { name: "The Hook Forge", domain: "D1: Hooks & Workflows", icon: "J", enemy: "Prompt Whisperer", sprite: `  {^^}
  |/\\|
  |\\/|
 /    \\
JUST PROMPT IT`, color: "#fa4" },
  { name: "The Tool Armory", domain: "D2: Tool Design & MCP", icon: "+", enemy: "Tool Hoarder", sprite: `  [**]
 /|18|\\
  |18|
 / !! \\
ALL THE TOOLS`, color: "#ff4" },
  { name: "The Config Maze", domain: "D3: Claude Code Config", icon: "#", enemy: "Config Phantom", sprite: `  (~~)
  |??|
  |..|
 _/  \\_
~/.claude/???`, color: "#4f4" },
  { name: "The Pipeline Forge", domain: "D3: Plan Mode & CI/CD", icon: "|", enemy: "CI Gremlin", sprite: `  [!!]
 <|--|>
  |--|
 /    \\
claude -p ???`, color: "#4fa" },
  { name: "Prompt Workshop", domain: "D4: Prompt Engineering", icon: "?", enemy: "Vague Instructor", sprite: `  (  )
  |be|
  |ok|
 _/  \\_
BE CONSERVATIVE`, color: "#4af" },
  { name: "Validation Gauntlet", domain: "D4: Validation & Batch", icon: "!", enemy: "Self-Review Shadow", sprite: `  {==}
  |me|
  |ok|
 /    \\
I REVIEWED MYSELF`, color: "#84f" },
  { name: "The Memory Halls", domain: "D5: Context & Reliability", icon: "~", enemy: "Context Glutton", sprite: `  [##]
 /|40|\\
  |FL|
 / DS \\
DUMP EVERYTHING`, color: "#f4f" },
  { name: "Synthesis Chamber", domain: "D5: Advanced Context", icon: "^", enemy: "Accuracy Mirage", sprite: `  (97)
  |%%|
  |OK|
 _/  \\_
97% SHIP IT!`, color: "#f48" },
  { name: "THE FINAL TOWER", domain: "ALL DOMAINS", icon: "X", enemy: "THE ARCHITECT", sprite: `  /\\
 /  \\
/EXAM\\
|    |
|PASS|
|____|`, color: "#fff" },
];

// ==================== QUESTIONS ====================
const questions = [
  // FLOOR 0: Agentic Loops
  [
    { q: "Your agentic loop checks if the response contains 'I've completed the task' to stop iterating. The agent sometimes says this mid-conversation while still needing tools. What should you change?", a: ["Add more termination phrases for robustness.", "Check stop_reason: continue on 'tool_use', terminate on 'end_turn'.", "Set a max iteration count as the primary stop.", "Parse the response for tool call JSON."], c: 1, e: "stop_reason is the reliable API mechanism. Parsing natural language is an anti-pattern." },
    { q: "Your loop does not append tool results to conversation history. The agent re-calls the same tools repeatedly. Why?", a: ["Context window is too small.", "Tool results must be appended so the model can reason about them next iteration.", "The model needs a prompt instruction not to repeat calls.", "You need a deduplication layer."], c: 1, e: "Without appending results, the model has no record of previous outputs and cannot incorporate them." },
    { q: "A developer uses max_iterations=5 as the PRIMARY stopping condition. The agent hits it mid-task. The fix proposed is max=20. What is better?", a: ["Use stop_reason=='end_turn' as primary, iteration cap as safety fallback only.", "Set max_iterations=50.", "Remove the cap entirely.", "Use a timer-based cutoff instead."], c: 0, e: "stop_reason should drive the loop. Iteration caps are safety fallbacks, not primary control." },
    { q: "After the model returns stop_reason:'tool_use', you execute the tool. What happens next?", a: ["Send only the tool result as the next user message.", "Append assistant response + tool result to history, send full updated history.", "Summarize the tool result in the system prompt.", "Store the result in a database with a reference ID."], c: 1, e: "Full conversation history including the tool call and result must be sent in the next request." },
    { q: "Your loop terminates when response.content[0].type=='text'. Why is this wrong?", a: ["Content can have both text and tool_use blocks. The model often explains reasoning alongside tool calls.", "Text content only appears in errors.", "Content always has exactly one element.", "Tool calls never mix with text."], c: 0, e: "A response can contain both text and tool_use blocks. Check stop_reason, not content type." },
    { q: "What distinguishes model-driven decision-making from a pre-configured decision tree?", a: ["Model-driven is slower but more accurate.", "Claude reasons about which tool to call based on context, rather than following a fixed sequence.", "Decision trees use the API, model-driven uses local inference.", "Model-driven requires fewer tools."], c: 1, e: "Model-driven loops dynamically decide based on context. Decision trees follow hard-coded logic." },
    { q: "The response has stop_reason:'max_tokens'. What does this mean?", a: ["The model finished normally.", "The response was truncated -- increase max_tokens or continue the conversation.", "The model hit an error.", "The model wants a tool but ran out of space."], c: 1, e: "max_tokens means the response was cut off before the model finished. It needs continuation." },
    { q: "Which is the correct agentic loop control flow?", a: ["Check if response has tool JSON -> execute -> loop until no JSON.", "Check stop_reason -> if tool_use: execute, append, next request -> if end_turn: return.", "Execute all defined tools -> append -> check for 'done' in text.", "If text content: return -> if tool content: execute and loop."], c: 1, e: "The canonical flow: send request, check stop_reason, handle tool_use or end_turn accordingly." },
    { q: "Your agent enters an infinite loop calling the same two tools alternately. Best mitigation?", a: ["Parse tool results for the word 'error' and terminate.", "Keep a safety iteration cap as fallback; monitor for repeated identical calls to diagnose root cause.", "Ask the model 'Are you done?' after each call.", "Limit each tool to one call per session."], c: 1, e: "Safety caps prevent runaway loops. Monitoring repeated calls identifies prompt or tool design issues." },
    { q: "For a billing dispute agent, a junior dev suggests hard-coding the tool call sequence. What is the tradeoff?", a: ["Hard-coding is always better for guaranteed order.", "Hard-coding ensures sequence but loses adaptability. A hybrid (programmatic for critical steps, model-driven for adaptive) is often best.", "Model-driven is always better for flexibility.", "No difference -- the model follows the same sequence either way."], c: 1, e: "Hybrid: programmatic enforcement for non-negotiable steps, model-driven for adaptive decisions." },
  ],
  // FLOOR 1: Multi-Agent
  [
    { q: "Your synthesis agent misses document analysis findings. The coordinator passes web search results directly but only a summary reference for doc analysis. Fix?", a: ["Increase synthesis context window.", "Include complete doc analysis findings directly in the synthesis subagent's prompt.", "Have synthesis call doc analysis directly.", "Reword the coordinator prompt."], c: 1, e: "Subagent context must be explicitly provided. Subagents do not inherit parent context." },
    { q: "Web search and doc analysis can run independently; fact-checking needs both results. Optimal pattern?", a: ["Run all three sequentially.", "Emit two Task calls in one response for parallel execution, then invoke fact-checking with both results.", "Run all three in parallel with polling.", "Pipeline: web search -> doc analysis -> fact check."], c: 1, e: "Parallel via multiple Task calls in one response. Fact-checking waits for both to complete." },
    { q: "Coordinator's allowedTools does not include 'Task'. What happens when it tries to spawn subagents?", a: ["Falls back to inline processing.", "Cannot spawn subagents -- Task not in allowed tools.", "Spawns with restricted permissions.", "Automatically gains Task access."], c: 1, e: "allowedTools must explicitly include 'Task' for subagent spawning." },
    { q: "Three subagents research overlapping topics producing duplicates. Best fix?", a: ["Deduplicate after all complete.", "Partition scope (distinct subtopics or source types) to minimize overlap.", "Reduce to one subagent.", "Each subagent checks with coordinator first."], c: 1, e: "Partitioning at assignment time prevents duplication more efficiently than post-hoc filtering." },
    { q: "A subagent sends an error message directly to another subagent. Why is this problematic?", a: ["All inter-subagent communication must route through the coordinator for observability and control.", "The other agent might not be running.", "Direct communication needs a different format.", "Errors should be logged to files instead."], c: 0, e: "Hub-and-spoke: coordinator manages all communication for observability, error handling, and control." },
    { q: "What should an AgentDefinition include?", a: ["Only a system prompt -- everything else is inherited.", "Descriptions, system prompts, and tool restrictions for each subagent type.", "Only tool restrictions.", "A reference to the coordinator's configuration."], c: 1, e: "AgentDefinitions need descriptions, prompts, and tool restrictions. Subagents don't inherit from coordinator." },
    { q: "Subagent results have metadata mixed into prose. Source attribution is lost after synthesis. Fix?", a: ["Use regex to find URLs in the text.", "Use structured data formats to separate content from metadata.", "Add attributions after synthesis.", "Tell synthesis to preserve URLs."], c: 1, e: "Structured formats (JSON, delimited sections) keep content and metadata separate through synthesis." },
    { q: "The coordinator always routes through the full pipeline even for simple queries. Better approach?", a: ["Add timeouts to each agent.", "Analyze query requirements and dynamically select which subagents to invoke.", "Create a separate simple-query coordinator.", "Add a classifier model before the coordinator."], c: 1, e: "The coordinator should dynamically assess complexity and invoke only needed subagents." },
    { q: "A colleague writes step-by-step procedural coordinator instructions. Why might this be suboptimal?", a: ["Procedural instructions are always better.", "Coordinator prompts should specify goals and quality criteria to enable adaptability.", "Procedural instructions use more tokens.", "The coordinator cannot follow steps."], c: 1, e: "Goal-oriented prompts let the coordinator adapt strategy. Procedures lock in one approach." },
    { q: "You want to explore two testing strategies from a shared analysis baseline. Best approach?", a: ["Start two new sessions, re-running analysis in each.", "Use fork_session to branch from the shared baseline.", "Use one session sequentially, clearing context between.", "Create two subagents with copies of the analysis."], c: 1, e: "fork_session creates independent branches from a shared baseline -- purpose-built for this." },
  ],
  // FLOOR 2: Hooks & Workflows
  [
    { q: "The agent skips get_customer before process_refund 8% of the time despite prompt instructions. Strongest guarantee?", a: ["Add CAPITALIZED instructions.", "Add few-shot examples.", "Implement a programmatic prerequisite blocking process_refund until get_customer returns a verified ID.", "Add a confidence check."], c: 2, e: "Programmatic enforcement = deterministic. Prompt-based = probabilistic. Financial consequences need guarantees." },
    { q: "Customer: 'Return my headphones AND change my shipping address.' Agent handles address but forgets the return. Fix?", a: ["Add 'address all parts' to prompt.", "Decompose multi-concern requests into distinct items, investigate each, synthesize unified resolution.", "Limit to one request per message.", "Add a checklist tool."], c: 1, e: "Explicit decomposition into distinct items with parallel handling prevents dropped concerns." },
    { q: "PostToolUse hook gets dates in Unix, ISO 8601, and MM/DD/YYYY from different tools. What should it do?", a: ["Add format instructions to prompt.", "Normalize all dates to consistent format before model processes them.", "Create separate agents per tool.", "Store dates in a database."], c: 1, e: "PostToolUse hooks normalize heterogeneous data before the model sees it." },
    { q: "Company caps automated refunds at $500. Agent occasionally processes $600+. Guaranteed compliance?", a: ["Bold the limit in the prompt.", "Implement a hook that blocks process_refund above $500 and redirects to escalation.", "Add a confirmation step.", "Log all refund amounts."], c: 1, e: "Tool call interception hooks deterministically enforce business rules." },
    { q: "What is the key distinction between hooks and prompt instructions for enforcement?", a: ["Hooks are faster to implement.", "Hooks provide deterministic guarantees; prompts provide probabilistic compliance.", "Prompts are more reliable because models understand context.", "They provide equivalent compliance rates."], c: 1, e: "Hooks = deterministic (100%). Prompts = probabilistic (non-zero failure). Critical rules need hooks." },
    { q: "Resuming a session after code changes. The context has stale analysis. What to do?", a: ["Trust the model to detect changes.", "Start completely fresh.", "Resume and inform the agent about specific file changes for targeted re-analysis.", "Delete the session and all state."], c: 2, e: "Inform the resumed session about specific changes for targeted updates, preserving valid context." },
    { q: "Long investigation session has stale tool results from 3 hours ago. You want to continue in a new session. Best approach?", a: ["Resume the existing session.", "Start new session with structured summary of key findings injected into initial context.", "Export and paste the full transcript.", "Resume with --resume and hope."], c: 1, e: "Structured summaries preserve key findings while discarding stale data." },

// ==================== AUDIO ====================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, duration, type='square') {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = 0.1;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}

function sfxHit() { playSound(880, 0.1); setTimeout(()=>playSound(1320, 0.15), 50); }
function sfxMiss() { playSound(200, 0.3, 'sawtooth'); }
function sfxWin() { [0,100,200,300].forEach((d,i)=>setTimeout(()=>playSound(440*(i+1)/2, 0.2), d)); }
function sfxLose() { [0,200,400].forEach((d,i)=>setTimeout(()=>playSound(300-i*80, 0.3, 'sawtooth'), d)); }
function sfxSelect() { playSound(660, 0.05); }
function sfxStart() { [0,80,160].forEach((d,i)=>setTimeout(()=>playSound(440+i*220, 0.1), d)); }

// ==================== SCREENS ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ==================== TITLE ====================
function startGame() {
  sfxStart();
  showMap();
}

// ==================== MAP ====================
function getTitle() {
  if (state.xp >= 25000) return "Certified Architect";
  if (state.xp >= 20000) return "Master Architect";
  if (state.xp >= 14000) return "Architect";
  if (state.xp >= 9000) return "Builder";
  if (state.xp >= 5000) return "Journeyman";
  if (state.xp >= 2000) return "Apprentice II";
  return "Apprentice";
}

function getLevel() {
  if (state.xp >= 25000) return 6;
  if (state.xp >= 20000) return 5;
  if (state.xp >= 14000) return 4;
  if (state.xp >= 9000) return 3;
  if (state.xp >= 5000) return 2;
  return 1;
}

function showMap() {
  showScreen('map-screen');
  state.level = getLevel();
  document.getElementById('map-title').textContent = getTitle();
  document.getElementById('map-level').textContent = state.level;
  document.getElementById('map-xp').textContent = state.xp;
  document.getElementById('map-streak').textContent = state.streak;
  document.getElementById('map-record').textContent = `${state.wins}/${state.losses}`;

  const list = document.getElementById('floor-list');
  list.innerHTML = '';

  floors.forEach((floor, i) => {
    const fi = state.floors[i];
    const isUnlocked = i === 0 || state.floors[i-1].cleared;
    const isCurrent = isUnlocked && !fi.cleared;
    const row = document.createElement('div');
    row.className = `floor-row${fi.cleared ? ' cleared' : ''}${isCurrent ? ' current' : ''}${!isUnlocked ? ' locked' : ''}`;

    row.innerHTML = `
      <div class="floor-icon" style="color:${floor.color}">${fi.cleared ? '&#10003;' : floor.icon}</div>
      <div class="floor-info">
        <div class="floor-name">F${i+1}: ${floor.name}</div>
        <div class="floor-domain">${floor.domain}</div>
      </div>
      <div class="floor-score">${fi.bestScore > 0 ? fi.bestScore+'/10' : isUnlocked ? 'ENTER' : 'LOCKED'}</div>
    `;

    if (isUnlocked) {
      row.onclick = () => { sfxSelect(); startBattle(i); };
    }
    list.appendChild(row);
  });
  saveState();
}

// ==================== BATTLE ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startBattle(floorIdx) {
  state.currentFloor = floorIdx;
  const floorQs = questions[floorIdx];
  // Shuffle questions and pick 10 (or all if fewer)
  state.battleQuestions = shuffle(floorQs).slice(0, 10);
  // Shuffle answer order for each question
  state.battleQuestions = state.battleQuestions.map(q => {
    const indices = q.a.map((_, i) => i);
    const shuffled = shuffle(indices);
    return {
      q: q.q,
      a: shuffled.map(i => q.a[i]),
      c: shuffled.indexOf(q.c),
      e: q.e
    };
  });
  state.currentQ = 0;
  state.score = 0;
  state.playerHP = 10;
  state.playerMaxHP = 10;
  state.enemyHP = 10;
  state.enemyMaxHP = 10;

  const floor = floors[floorIdx];
  document.getElementById('enemy-name').textContent = floor.enemy;
  document.getElementById('enemy-name').style.color = floor.color;
  document.getElementById('enemy-sprite').textContent = floor.sprite;
  document.getElementById('enemy-sprite').style.color = floor.color;
  document.getElementById('player-name').textContent = getTitle();

  showScreen('battle-screen');
  showQuestion();
}

function showQuestion() {
  const q = state.battleQuestions[state.currentQ];
  document.getElementById('q-num').textContent = `Q${state.currentQ + 1}/${state.battleQuestions.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('battle-msg').textContent = '';
  document.getElementById('battle-msg').className = 'battle-msg';

  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.a.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = `${labels[i]}) ${a}`;
    btn.onclick = () => selectAnswer(i);
    answersDiv.appendChild(btn);
  });

  updateBars();
}

function selectAnswer(idx) {
  const q = state.battleQuestions[state.currentQ];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach(b => b.classList.add('disabled'));

  const isCorrect = idx === q.c;

  if (isCorrect) {
    btns[idx].classList.add('correct');
    state.score++;
    state.enemyHP = Math.max(0, state.enemyHP - 1);
    sfxHit();
    document.getElementById('battle-msg').textContent = 'HIT! Critical knowledge strike!';
    document.getElementById('battle-msg').className = 'battle-msg hit';
    shakeEnemy();
  } else {
    btns[idx].classList.add('wrong');
    btns[q.c].classList.add('reveal');
    state.playerHP = Math.max(0, state.playerHP - 1);
    sfxMiss();
    document.getElementById('battle-msg').textContent = 'MISS! The enemy strikes back!';
    document.getElementById('battle-msg').className = 'battle-msg miss';
  }

  updateBars();

  // Show explanation
  setTimeout(() => {
    showExplanation(q, isCorrect);
  }, 800);
}

function showExplanation(q, isCorrect) {
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('expl-correct').textContent =
    (isCorrect ? 'CORRECT!' : 'WRONG!') + ` Answer: ${labels[q.c]}) ${q.a[q.c]}`;
  document.getElementById('expl-correct').style.color = isCorrect ? '#4f4' : '#f44';
  document.getElementById('expl-text').textContent = q.e;

  const isLast = state.currentQ >= state.battleQuestions.length - 1 || state.playerHP <= 0 || state.enemyHP <= 0;
  document.getElementById('expl-btn').textContent = isLast ? 'SEE RESULTS' : 'NEXT QUESTION';

  document.getElementById('explanation-overlay').classList.add('active');
}

function closeExplanation() {
  document.getElementById('explanation-overlay').classList.remove('active');
  state.currentQ++;

  if (state.currentQ >= state.battleQuestions.length || state.playerHP <= 0 || state.enemyHP <= 0) {
    endBattle();
  } else {
    showQuestion();
  }
}

function shakeEnemy() {
  const sprite = document.getElementById('enemy-sprite');
  sprite.style.transition = 'transform 0.1s';
  sprite.style.transform = 'translateX(-10px)';
  setTimeout(() => { sprite.style.transform = 'translateX(10px)'; }, 100);
  setTimeout(() => { sprite.style.transform = 'translateX(-5px)'; }, 200);
  setTimeout(() => { sprite.style.transform = 'translateX(0)'; }, 300);
}

function updateBars() {
  const ehp = document.getElementById('enemy-hp');
  const php = document.getElementById('player-hp');
  const epct = (state.enemyHP / state.enemyMaxHP) * 100;
  const ppct = (state.playerHP / state.playerMaxHP) * 100;

  ehp.style.width = epct + '%';
  php.style.width = ppct + '%';

  ehp.className = 'hp-fill' + (epct <= 30 ? ' low' : epct <= 60 ? ' mid' : '');
  php.className = 'hp-fill' + (ppct <= 30 ? ' low' : ppct <= 60 ? ' mid' : '');

  document.getElementById('enemy-hp-text').textContent = `${state.enemyHP}/${state.enemyMaxHP} HP`;
  document.getElementById('player-hp-text').textContent = `${state.playerHP}/${state.playerMaxHP} HP`;
}

function endBattle() {
  const total = state.battleQuestions.length;
  const won = state.score >= 7;
  const perfect = state.score === 10;

  let xpGained = 0;
  if (won) {
    xpGained = perfect ? 1000 : 500;
    state.wins++;
    state.streak++;
    state.floors[state.currentFloor].cleared = true;
    if (state.score > state.floors[state.currentFloor].bestScore) {
      state.floors[state.currentFloor].bestScore = state.score;
    }
    sfxWin();
  } else {
    xpGained = state.score * 25; // consolation XP
    state.losses++;
    state.streak = 0;
    sfxLose();
  }

  // Streak multiplier
  const mult = state.streak >= 30 ? 3 : state.streak >= 21 ? 2.5 : state.streak >= 14 ? 2 : state.streak >= 7 ? 1.5 : 1;
  xpGained = Math.floor(xpGained * mult);
  state.xp += xpGained;
  state.level = getLevel();

  document.getElementById('result-title').textContent = won ? (perfect ? 'PERFECT VICTORY!' : 'VICTORY!') : 'DEFEATED';
  document.getElementById('result-title').className = 'result-title ' + (won ? 'win' : 'lose');

  const floor = floors[state.currentFloor];
  document.getElementById('result-stats').innerHTML = `
    <div>Floor: ${floor.name}</div>
    <div>Enemy: ${floor.enemy}</div>
    <div>Score: ${state.score}/${total} ${won ? '(PASS)' : '(Need 7+)'}</div>
    <div>Streak: ${state.streak} ${mult > 1 ? `(${mult}x multiplier!)` : ''}</div>
  `;
  document.getElementById('result-xp').textContent = `+${xpGained} XP`;

  showScreen('result-screen');
  saveState();
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (document.getElementById('title-screen').classList.contains('active')) {
    if (e.key === 'Enter' || e.key === ' ') startGame();
    return;
  }
  if (document.getElementById('explanation-overlay').classList.contains('active')) {
    if (e.key === 'Enter' || e.key === ' ') closeExplanation();
    return;
  }
  if (document.getElementById('battle-screen').classList.contains('active')) {
    const btns = document.querySelectorAll('.answer-btn:not(.disabled)');
    if (btns.length === 0) return;
    const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
    const idx = keyMap[e.key.toLowerCase()];
    if (idx !== undefined && idx < btns.length) {
      btns[idx].click();
    }
  }
  if (document.getElementById('result-screen').classList.contains('active')) {
    if (e.key === 'Enter' || e.key === ' ') showMap();
  }
});

}
