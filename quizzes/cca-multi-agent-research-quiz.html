<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - Multi-Agent Research System Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #34d399;
    --accent2: #059669;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "Multi-Agent Research System",
    "prompt": "A legal contract analysis subagent retrieves a clause library from an internal repository. The HTTP request returns a 401 Unauthorized error. The subagent has a retry loop configured with exponential backoff. After 3 retries still returning 401, it escalates to the coordinator with a full attempt log. A junior engineer argues the subagent should have retried longer because authentication errors can be transient. What is the correct assessment?",
    "opts": [
      "The engineer is correct — 401 errors from OAuth systems are often transient when tokens expire mid-request and should be retried up to 10 times before escalation",
      "The subagent is correct — a 401 is an access failure, but it is non-transient and non-retryable without credential refresh; retrying the same request will produce the same result",
      "The subagent should have silently switched to a public fallback clause database and completed the task without escalating, since the coordinator's context is better used for business logic",
      "The subagent is correct — any error after 3 retries should be escalated regardless of whether further retries could succeed, because local retry budgets are fixed at 3"
    ],
    "ans": 1,
    "expl": "A 401 Unauthorized error signals that the request lacked valid credentials, not that the server was temporarily unavailable. Retrying an identical request with the same credentials will return the same 401 — the failure is deterministic, not transient. The correct local recovery path would be a token refresh, but if that is outside the subagent's capability, escalation with a full attempt log is the right move. A is wrong because 401 specifically means authentication failure — if the token expired, the fix is a token refresh, not blind retries of the same request with the same (expired) credentials. C is wrong because silently switching to an unapproved fallback database is a policy decision the subagent cannot make unilaterally — the coordinator must authorize alternative sources. D is wrong because the 3-retry rule is a heuristic for transient errors; the principled distinction is error type (retryable vs non-retryable), not retry count alone."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "A patent database subagent completes a search for prior art on a medical device patent. It returns `status: \"complete\"`, `patents_found: 0`, `query: \"piezoelectric bone anchoring 2018-2024\"`. The coordinator triggers its error-recovery path and resubmits the identical query three times, consuming 12 additional seconds. The final report notes \"prior art search inconclusive due to retrieval failures.\" What is the coordinator's error?",
    "opts": [
      "The coordinator failed to verify that the patent database was online before dispatching the subagent, allowing a potentially unavailable source to cause downstream failures",
      "The coordinator conflated a valid empty result — no matching patents exist — with a retrieval failure, triggering unnecessary retries and mislabeling the finding",
      "The coordinator's retry logic did not implement exponential backoff, causing it to hammer the patent database in rapid succession and triggering a rate limit on the third attempt",
      "The coordinator should have dispatched a second subagent to cross-validate the zero-result finding against a separate database before accepting the empty result"
    ],
    "ans": 1,
    "expl": "`patents_found: 0` with `status: \"complete\"` is an informative finding: the database was reachable, the query was processed, and the result is \"no matching prior art exists in this scope.\" Treating this as a retrieval failure triggers unnecessary retries and ultimately misrepresents the finding in the report. \"No prior art found\" is a meaningful legal finding; labeling it \"inconclusive due to retrieval failures\" changes the legal interpretation entirely. A is wrong because pre-flight database availability checks add overhead and don't prevent failures mid-request — the actual result showed the database was accessible and responded correctly. C is wrong because rate limiting would produce a 429 error, not `status: \"complete\"` — the described behavior does not match rate limiting. D is wrong because cross-validation is a valid research strategy for high-stakes findings, but the first step is correctly interpreting the result before deciding whether validation is warranted — not defaulting to validation because the result is zero."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "A scientific literature synthesis coordinator dispatches 6 parallel subagents to review recent oncology research. After all return, the coordinator observes that subagents 2, 4, and 5 each retrieved and analyzed the same 3 landmark NEJM papers, producing 34,000 tokens of redundant output. Subagent 1 covered a distinct set of conference proceedings with no overlap. What should the coordinator have done differently?",
    "opts": [
      "Implemented a shared citation registry that subagents could write to and read from during execution, allowing later agents to skip sources already claimed by earlier agents",
      "Run the subagents sequentially so each could inspect the previous agent's source list before selecting its own sources, preventing overlap",
      "Partitioned the research space before delegation — assigning distinct publication venues, date ranges, or subtopics to each subagent — so overlap was structurally impossible",
      "Added a deduplication pass after collection that merged identical analyses of the same paper into a single representative summary before synthesis"
    ],
    "ans": 2,
    "expl": "The root cause is ambiguous task boundaries at delegation time. When 3 of 6 agents independently converge on the same 3 landmark papers, the coordinator assigned them overlapping or identical scopes. Explicit pre-delegation partitioning — e.g., agent 2 covers NEJM 2020-2021, agent 4 covers NEJM 2022, agent 5 covers JAMA 2020-2022 — makes overlap structurally impossible without shared runtime state or sequential coordination. A is wrong because a shared citation registry during parallel execution introduces race conditions (two agents may claim the same paper simultaneously) and requires agents to coordinate runtime state, adding complexity and latency to what should be stateless parallel execution. B is wrong because sequential execution eliminates the throughput benefit of parallel dispatching — the correct fix is pre-delegation partitioning, not serialization. D is wrong because post-collection deduplication addresses the symptom (redundant output tokens) without preventing the redundant work from happening — all 34,000 tokens were already generated."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "A regulatory compliance research system uses a `fetch_url` general-purpose tool to retrieve documents. A subagent tasked with analyzing EU GDPR guidance is observed fetching competitor privacy policies from public websites after the GDPR documents mention them as comparison examples. The behavior was not explicitly prohibited in the subagent's prompt. What is the most robust fix?",
    "opts": [
      "Add a monitoring hook to the coordinator that intercepts all tool calls from subagents and blocks any URL not in a pre-approved domain whitelist",
      "Expand the subagent's system prompt with explicit instructions prohibiting external navigation beyond the originally assigned document set",
      "Replace `fetch_url` with a scoped `load_regulatory_document` tool that accepts only document IDs from the internal compliance repository, making external URL fetching structurally impossible",
      "Instruct the subagent to log every URL it intends to fetch and wait for coordinator approval before making each request, creating an approval gate for unanticipated fetches"
    ],
    "ans": 2,
    "expl": "The problem is that the agent has a capability — fetching arbitrary URLs — that exceeds what its task requires. Prompt instructions are probabilistic controls; a sufficiently compelling in-context reference (like a GDPR document explicitly mentioning a competitor policy) can rationalize the behavior. A scoped `load_regulatory_document` tool that only accepts known internal document IDs makes the undesired behavior structurally impossible: the tool simply cannot process an external URL regardless of the model's reasoning. A is wrong because coordinator-level URL interception adds latency on every document fetch and couples the coordinator to implementation details of every subagent's tool use — it's a runtime filter rather than a structural constraint. B is wrong because prompt-level prohibitions are bypassed when the model constructs a plausible rationale; the external URL was explicitly cited in the source document, providing exactly that rationale. D is wrong because requiring coordinator approval on every URL fetch serializes what should be autonomous operation and adds significant latency overhead for a problem that tool scoping already solves cleanly."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "A financial market intelligence subagent encounters a connection timeout when querying a real-time equity data feed. It retries twice with 2-second delays, both also timing out. It then switches to a cached snapshot from 4 hours ago, completes its analysis using the stale data, and returns results to the coordinator without mentioning the data source switch. The coordinator publishes the analysis to a trading desk. What principle did the subagent violate?",
    "opts": [
      "The subagent should have retried at least 5 times before switching data sources, since persistent timeouts on high-frequency financial feeds are often caused by brief network partitions",
      "The subagent violated the principle of transparent failure reporting — switching to a degraded data source without informing the coordinator stripped the coordinator of information needed to assess result validity",
      "The subagent should have requested coordinator authorization before accessing the cached data source, since cached snapshots require explicit permission not covered by the real-time feed authorization",
      "The subagent was wrong to perform local recovery at all; all data source fallback decisions for financial data should be made by the coordinator, never by the subagent autonomously"
    ],
    "ans": 1,
    "expl": "For time-sensitive financial analysis, the age of the data is material to the result's validity. Using a 4-hour-old snapshot without disclosure means the coordinator — and downstream consumers — have no way to assess whether the analysis is still valid. The coordinator may have access to alternative real-time sources, may know that market conditions changed significantly in the past 4 hours, or may decide to hold publication. Transparent failure reporting with structured context (failure type, attempted source, fallback source used, data timestamp) gives the coordinator the information it needs to make that call. A is wrong because additional retries on a timeout condition may be warranted, but the primary violation here is non-disclosure of the data source switch, not the retry count. C is wrong because data source authorization is a permissions concern separate from the disclosure issue — the main violation is opacity, not unauthorized access. D is wrong because local recovery is appropriate for many conditions; the problem is not that the subagent acted autonomously, but that it acted opaquely."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "A supply chain monitoring coordinator assigns three subagents to research disruption risks: agent A covers geopolitical events, agent B covers weather and natural disasters, and agent C covers logistics capacity constraints. After completion, the final report contains strong coverage of geopolitical and weather risks but entirely omits port congestion and shipping rate volatility — topics that fall within logistics capacity. Agent C's logs show it completed successfully. What is the correct diagnosis?",
    "opts": [
      "Agent C's web search tool returned no results for port congestion queries, indicating a search API gap that requires a different search provider for logistics data",
      "The synthesis agent applied topic relevance filtering that inadvertently excluded logistics content as less strategically significant than geopolitical or weather topics",
      "The coordinator's task specification for agent C was underspecified — \"logistics capacity constraints\" did not enumerate port congestion and shipping rates as required subtopics",
      "Agent C deprioritized shipping rate data because it encountered sources of lower credibility than geopolitical or weather sources and applied internal quality filtering"
    ],
    "ans": 2,
    "expl": "Agent C completed successfully — it executed its assigned task without errors. When a correctly executing agent produces output that misses expected subtopics, the cause is an underspecified task prompt. \"Logistics capacity constraints\" is a broad label that agent C interpreted without guidance about which specific dimensions to cover. Explicit enumeration (port congestion, shipping rates, rail capacity, warehouse availability) would have produced the expected coverage. A is wrong because there is no evidence of search API failure — the agent completed successfully, meaning it found and analyzed content within its interpreted scope. B is wrong because synthesis filtering can only exclude findings the agents actually produced — if the synthesis agent filtered port congestion content, agent C must have produced it; the logs would show it. D is wrong because quality filtering is an internal subagent behavior not indicated by the available evidence — the parsimonious explanation is underspecification of scope."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "An enterprise knowledge base query subagent is designed for simple single-document lookups. Instrumentation shows 88% of requests are single-document retrievals averaging 200ms, while 12% involve cross-referencing 5+ documents and require 3-4 seconds. Currently all queries go through a powerful but expensive orchestrated multi-step retrieval agent, adding 800ms overhead to every simple lookup. What tool configuration best optimizes this system?",
    "opts": [
      "Give the knowledge base subagent access to the full multi-step retrieval tool for all queries, since having more capability available never degrades performance for simple cases",
      "Provide the knowledge base subagent with a scoped `lookup_document` tool for the 88% of simple retrievals, while routing complex cross-reference requests to the multi-step retrieval agent through the coordinator",
      "Build a classifier agent that inspects each query before routing it, directing simple queries to a fast lookup path and complex queries to the multi-step agent, adding one classification round-trip to each request",
      "Cache all single-document results with a TTL of 24 hours to eliminate the 800ms overhead for repeat lookups, while routing all cache misses through the multi-step retrieval agent"
    ],
    "ans": 1,
    "expl": "This is the scoped-capability principle: 88% of requests are well-served by a lightweight `lookup_document` tool that executes quickly without coordinator involvement. Giving the subagent this scoped tool for its common case reduces latency for the vast majority of requests while preserving the multi-step agent path for genuinely complex queries. The coordinator only sees complex requests, preserving its bandwidth. A is wrong because adding full multi-step capability to every subagent invocation does add overhead — capability breadth increases the model's reasoning burden about which approach to use, and may route simple lookups through unnecessarily complex paths. C is wrong because a classifier agent adds at least one additional round-trip to every request — a fixed overhead applied to 100% of queries to save overhead on 88% is net negative. D is wrong because caching helps with repeated queries but doesn't reduce latency for first-time lookups, which may represent the majority of a knowledge base's query load in a research context."
  },
  {
    "source": "Multi-Agent Research System",
    "prompt": "A competitive product research system has two agents with similar tool names: a pricing analyst agent with a `compare_products` tool and a feature analyst agent with a `compare_features` tool. The coordinator routes analysis tasks to the wrong agent 38% of the time. An engineer proposes fixing this by adding detailed descriptions to both tools explaining what each covers. A second engineer proposes renaming `compare_products` to `analyze_pricing_and_market_position`. Which fix is more effective?",
    "opts": [
      "The first engineer's fix is sufficient — detailed descriptions give the coordinator enough semantic context to route correctly without changing names that other system components may depend on",
      "The second engineer's fix is more effective — renaming eliminates the shared prefix \"compare_\" that creates semantic ambiguity at the routing stage, making misrouting structurally less likely",
      "Both fixes together are required — renamed tools without updated descriptions still leave routing ambiguous because the coordinator relies equally on both names and descriptions for routing decisions",
      "Neither fix addresses the root cause — the coordinator needs few-shot routing examples in its system prompt showing correct agent selection for 20+ task types to achieve reliable routing"
    ],
    "ans": 1,
    "expl": "The routing confusion stems from the shared \"compare_\" prefix, which creates semantic overlap that the coordinator cannot resolve without deep reasoning about the full description. Renaming `compare_products` to `analyze_pricing_and_market_position` eliminates the ambiguous prefix — the two tool names now have no lexical overlap, making correct routing significantly more reliable even before reading descriptions. A is wrong because descriptions reduce ambiguity but don't eliminate the lexical overlap in the name itself — under novel task phrasings, a coordinator may still anchor on the shared \"compare_\" prefix. C is wrong because the question asks which fix is more effective, and renaming alone provides structural disambiguation; descriptions are supplementary. D is wrong because few-shot examples are a training signal, not a fix for a naming design problem — they add complexity without addressing the root cause of ambiguous tool names."
  },
  {
    "source": "Multi-Agent Research System",

var MODULE_NAME = "Multi-Agent Research System";
var TAGS = ["Coordinator/Subagent", "Synthesis", "Coverage Partitioning", "Context Reliability", "Multi-Agent Trust", "Orchestration"];
var PASS_STORAGE_KEY = 'cca_multi_agent_research_pass_count';
var WRONGS_STORAGE_KEY = 'cca_multi_agent_research_wrong_answers';
var QUESTIONS_PER_ATTEMPT = 20;
var TIMER_MINUTES = 60;
var PASS_SCORE = 1000;

function loadPassCount() {
  try {
    var raw = window.localStorage.getItem(PASS_STORAGE_KEY);
    var parsed = parseInt(raw, 10);
    if (Number.isFinite(parsed) && parsed >= 0) return parsed;
  } catch (err) {}
  return 0;
}

function savePassCount(n) {
  try { window.localStorage.setItem(PASS_STORAGE_KEY, String(n)); } catch (err) {}
}

function loadWrongs() {
  try {
    var raw = window.localStorage.getItem(WRONGS_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (err) {}
  return [];
}

function saveWrongs(arr) {
  try { window.localStorage.setItem(WRONGS_STORAGE_KEY, JSON.stringify(arr)); } catch (err) {}
}

function clearWrongs() {
  try { window.localStorage.removeItem(WRONGS_STORAGE_KEY); } catch (err) {}
}

var S = {
  screen: 'start',
  pool: [],
  ix: 0,
  answers: {},
  revealed: false,
  timeLeft: TIMER_MINUTES * 60,
  timerId: null,
  score: null,
  review: [],
  passCount: loadPassCount(),
  warnedTwoMin: false
};

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function shuffleOpts(q) {
  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  // shuffled[newIdx] = origIdx  →  origToNew[origIdx] = newIdx
  var origToNew = {};
  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

function buildDeck() {
  var picked = shuffle(BANK).slice(0, QUESTIONS_PER_ATTEMPT);
  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
