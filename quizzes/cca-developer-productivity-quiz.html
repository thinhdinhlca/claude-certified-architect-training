<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - Developer Productivity with Claude Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #fb923c;
    --accent2: #ea580c;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "Developer Productivity with Claude",
    "prompt": "Your agentic code-review loop calls `fetch_diff`, `run_static_analysis`, and `query_issue_tracker` on every PR. You observe it alternating between `run_static_analysis` and `query_issue_tracker` indefinitely without ever calling `fetch_diff` or producing output. Each call returns valid data, but the loop never converges. What is the most precise diagnosis?",
    "opts": [
      "The `max_tokens` value is too low, causing the model to truncate its reasoning before reaching the `fetch_diff` call, which triggers a restart from the top of the tool list.",
      "The loop has no semantic termination condition — it relies only on natural language in the model's output to decide when to stop, which never fires when the model stays in tool-calling mode.",
      "The model is stuck because neither `run_static_analysis` nor `query_issue_tracker` produces output that changes the conversation state enough to shift the model's tool selection decision.",
      "The issue tracker tool is returning paginated results; the model keeps re-querying the next page, which looks like spinning but is actually making progress through the dataset."
    ],
    "ans": 2,
    "expl": "When consecutive tool calls return valid but non-progressing data, the model can get locked in a selection loop because its context never changes enough to shift its tool preference. The fix is to detect repeated identical tool call sequences (same tool, same arguments) and inject a state-change signal or escalate to a human. B) is partially right about missing termination but does not identify the specific mechanism causing the lock. A) is unrelated — truncation causes `stop_reason: \"max_tokens\"`, not looping. D) is a benign pattern distinguishable from spinning by checking whether arguments change across calls."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "You are designing a code-generation agent that writes a test file, runs `pytest`, reads the failure output, and fixes the implementation — repeating until all tests pass. A colleague argues for a hard cap of 10 iterations. You want a semantic termination condition instead. Which condition is most appropriate as the *primary* stop signal?",
    "opts": [
      "Stop when the model's response contains the phrase \"all tests passing\" anywhere in its text output.",
      "Stop when `pytest` returns exit code 0 and the tool result confirms zero failures — a deterministic, externally-verified signal.",
      "Stop when `stop_reason == \"end_turn\"` because that indicates the model has decided it is finished with the task.",
      "Stop after the third consecutive identical `pytest` invocation on the same file, regardless of exit code."
    ],
    "ans": 1,
    "expl": "A semantic stop condition should be grounded in an externally verifiable fact — `pytest` exit code 0 — not in natural language output (A) or model self-assessment (C). The test runner is the source of truth. `stop_reason == \"end_turn\"` (C) tells you the model stopped emitting tool calls, but it does not verify the task objective was met. An iteration cap and duplicate-call detection (D) serve as safety backstops, not primary conditions."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "An agentic refactoring loop has been running for 40 iterations. A developer reviewing the logs notices the agent has called `read_file(\"src/utils.py\")` on iterations 3, 11, 22, and 38 with identical arguments and received the same content each time. The agent has also made real forward progress between those re-reads. Is this a problem?",
    "opts": [
      "Yes — any repeated tool call with identical arguments is a spinning indicator and must trigger an automatic loop abort regardless of whether other progress has been made.",
      "No — re-reading a stable file multiple times during a long task is normal; the agent may need to refresh its working context for a file it partially processed earlier.",
      "Yes — the agent should cache the file content after the first read and never call `read_file` again for the same path within a single session, treating redundancy as a bug.",
      "No — but only if the re-reads happen at regular intervals; irregular re-read timing is the actual indicator of a stuck loop."
    ],
    "ans": 1,
    "expl": "Distinguishing spinning from legitimate repetition requires checking whether the *overall loop* is making forward progress, not whether individual tool calls recur. Re-reading a shared utility file across a 40-iteration refactor is expected — the model may need to reconcile the file's current state at different points. A) is too broad; it would abort legitimate long-running tasks. C) would prevent the agent from detecting real file changes between its own edits. D) invents a timing-based heuristic with no basis in loop design documentation."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "Your deployment agent runs this sequence: `validate_config` → `provision_infra` → `deploy_app` → `run_smoke_tests`. It is implemented as a model-driven loop where the model selects each tool. In production, you discover the model occasionally skips `validate_config` when it \"remembers\" having validated the same config in a previous session. What is the correct architectural fix?",
    "opts": [
      "Increase the system prompt instructions to say \"ALWAYS call validate_config first, no exceptions\" and add the instruction in bold to emphasize priority.",
      "Use `tool_choice: {\"type\": \"tool\", \"name\": \"validate_config\"}` for the first turn to programmatically force validation before handing control back to the model for subsequent steps.",
      "Remove `validate_config` from the model's tool list and call it programmatically in the orchestrator before initiating the model-driven loop.",
      "Both B and C are correct — the choice depends on whether validation requires model reasoning or is a pure infrastructure check."
    ],
    "ans": 3,
    "expl": "Both approaches enforce the prerequisite deterministically. If `validate_config` requires the model to reason about the config content (e.g., detect semantic errors), forced `tool_choice` (B) keeps it in the model-driven flow while guaranteeing execution. If it is a pure programmatic check (e.g., schema validation), calling it outside the loop (C) is cleaner and removes the model from the critical path. A) relies on the model following instructions — the documented anti-pattern for safety-critical prerequisites."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "A developer implements loop resumption after human interruption: when a developer pauses the agent mid-task, approves a plan change, and resumes, the agent starts from the beginning because none of the completed work is preserved. What state should the loop persist to enable mid-task resumption?",
    "opts": [
      "Only the final assistant message from before the pause, so the model can regenerate the full plan from that checkpoint without needing the intermediate tool call history.",
      "The complete conversation history including all tool calls, tool results, assistant reasoning, and the current iteration counter, so the model resumes with full context of what it has already done.",
      "The list of completed tool names and their arguments only — the actual results can be discarded to save storage because the model can re-derive them from the tool arguments.",
      "A natural-language summary of completed steps generated by the model at pause time, which is smaller than the full history and sufficient for the model to reconstruct its working state."
    ],
    "ans": 1,
    "expl": "Resumption requires full conversation history — tool calls, tool results, and assistant reasoning — because the model's next decision depends on what it has already learned. The iteration counter is needed for safety cap enforcement. A) loses tool result data needed for reasoning. C) discards results that the model cannot always re-derive and that may have changed (e.g., file contents). D) introduces lossy compression; a summary omits specific values (file paths, line numbers, error messages) the model needs to continue precisely."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "You are building a CI pipeline where `claude -p` analyzes test failure logs and outputs a JSON object with a `root_cause` and `suggested_fix` field. On 15% of runs the agent enters a research loop — calling `search_docs` and `read_file` repeatedly — and never emits the final JSON, causing a pipeline timeout. The model never returns `stop_reason: \"max_tokens\"`. What is the most likely cause and fix?",
    "opts": [
      "The model's extended thinking budget is exhausted mid-loop; increase `budget_tokens` from the default 1024 to 10000 to give it enough reasoning space to converge.",
      "The model lacks a clear output signal — add an explicit instruction in the prompt: \"Once you have enough information, stop calling tools and emit only the JSON object on a single line.\"",
      "The `stop_reason` field is missing in the response because the `--output-format json` flag suppresses it; switch to `--output-format text` to restore proper loop termination signals.",
      "The search and read tools are returning too much data per call, flooding the context window; truncate tool outputs to 500 tokens per response to force faster convergence."
    ],
    "ans": 1,
    "expl": "When the model has no explicit instruction to switch from information-gathering mode to output mode, it can continue calling tools indefinitely — especially when each call returns potentially relevant new data. Adding a clear trigger (\"once you have enough information, stop and emit JSON\") gives the model a behavioral anchor to transition states. A) conflates extended thinking budget with loop convergence — the issue is a missing output trigger, not reasoning depth. C) `--output-format json` does not suppress `stop_reason` in the underlying API response. D) truncating tool outputs is a useful secondary measure but does not address the missing convergence instruction."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "An MCP tool called `update_ticket` has this description: \"Updates a ticket.\" In production, the agent calls it with `status`, `assignee`, and `priority` all set in the same call when it should be setting only `status`. What description change best prevents over-parameterization?",
    "opts": [
      "Add a warning: \"Do not pass more than one field at a time to this tool.\"",
      "Rewrite to specify each parameter's purpose, when to omit it, and provide a minimal example: \"Updates one or more fields of an existing ticket. Pass only the fields you intend to change — omitting a field leaves it unchanged. E.g., `{\\\"ticket_id\\\": \\\"T-42\\\", \\\"status\\\": \\\"closed\\\"}` closes ticket T-42 without touching assignee or priority.\"",
      "Split into three tools: `set_ticket_status`, `set_ticket_assignee`, and `set_ticket_priority` with one-field-per-tool descriptions.",
      "Add JSON schema `maxProperties: 2` to limit the number of fields the model can pass per call."
    ],
    "ans": 1,
    "expl": "The root cause is that the description gives the model no guidance on when to include or omit each field. Rewriting with a concrete minimal example — showing a single-field update — teaches the model that partial updates are the normal pattern. C) solves the over-parameterization but creates fragmentation; three round trips to change all three fields is worse than one. A) is a negative constraint without positive guidance; the model may still pass all fields if it does not understand partial-update semantics. D) restricts `ticket_id` + one field max, which incorrectly prevents legitimate multi-field updates."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "You are designing a documentation assistant MCP server. A product manager asks you to create a single `search_docs` tool that accepts a `mode` parameter with values `\"semantic\"`, `\"keyword\"`, and `\"title_exact\"` to unify three different search backends. What is the primary risk of this design?",
    "opts": [
      "Having a `mode` parameter prevents the MCP server from caching results because the cache key would need to include the mode value, tripling storage requirements.",
      "The model must reason about which mode to pass on every call, reintroducing the same selection problem that separate tool names would have solved at the routing level.",
      "MCP servers do not support enum-constrained parameters; the `mode` field would need to be a free-text string, making validation impossible server-side.",
      "The unified tool will always default to `\"semantic\"` mode because LLMs prefer semantic search, making `\"keyword\"` and `\"title_exact\"` modes unreachable in practice."
    ],
    "ans": 1,
    "expl": "Merging semantically distinct operations behind a `mode` parameter moves the selection decision from tool routing (where tool names provide a clear signal) to parameter interpretation (where the model must reason about an enum value). This is the same ambiguity problem as having poorly named tools, just pushed one level deeper. A) is a fabricated performance concern. C) MCP tools do support enum-constrained parameters via JSON Schema. D) is an overgeneralization — mode selection depends on the prompt and context, not a fixed preference."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "Your MCP server's `run_query` tool returns the full raw SQL result set as a JSON array, sometimes with 2,000+ rows. The agent's context window fills quickly, degrading performance on long sessions. Where is the best place to address this?",
    "opts": [
      "Add a `PostToolUse` hook that detects large tool results and summarizes them with a secondary model call before injecting them into the conversation.",
      "Truncate or paginate the tool result at the MCP server level — return at most 50 rows plus a `has_more` field and a cursor for subsequent pages.",
      "Increase the context window by switching to claude-opus-4 which supports a larger token limit, giving the agent more headroom before degradation occurs.",
      "Instruct the model in the system prompt to ignore rows beyond the first 50 and treat large results as if they were truncated automatically."
    ],
    "ans": 1,
    "expl": "Tool result verbosity should be controlled at the source — the MCP server. Returning paginated results with a cursor keeps individual tool results small, lets the agent fetch only what it needs, and avoids filling the context with unneeded data. A) adds latency and token cost for every large result, even when the agent only needed the first few rows. C) is a scaling workaround, not a fix — the root cause is unbounded output. D) relies on the model following a truncation instruction, which is probabilistic and wastes tokens even on \"ignored\" rows."
  },
  {
    "source": "Developer Productivity with Claude",
    "prompt": "A junior developer asks whether their `file_writer` MCP tool should validate that the `path` parameter does not contain `..` segments before writing. They argue: \"The model is smart enough not to send path traversal attacks to itself.\" What is the correct position?",
    "opts": [
      "Agree — LLMs have internal safety filtering that prevents them from constructing malicious paths, making server-side path validation redundant.",
      "Validate at the tool boundary regardless of trust in the model — tools are callable by any agent, script, or future integration, and defense-in-depth requires validation that does not depend on the caller's good behavior.",
      "Move path validation into a `PreToolUse` hook instead of the server, so validation logic can be updated without redeploying the MCP server.",
      "Validate only in production environments; skip validation in development to reduce friction during local testing."
    ],
    "ans": 1,
    "expl": "Tool boundary validation is a defense-in-depth principle: the server should not trust its callers, including models. A model can be prompt-injected, misled by a malicious tool result, or replaced by a different caller in future integrations. Validating at the server makes the tool safe regardless of caller. A) is false — models do not have reliable internal path traversal filtering. C) hooks are a valid additional layer but should not be the *only* layer; the MCP server itself must validate its own preconditions. D) removes protection during the development phase where accidental misuse is most likely."
  },

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  // shuffled[newIdx] = origIdx  →  origToNew[origIdx] = newIdx
  var origToNew = {};
  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

function buildDeck() {
  var picked = shuffle(BANK).slice(0, QUESTIONS_PER_ATTEMPT);
  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
