<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - Customer Support Resolution Agent Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A SaaS support agent has two tools: `get_account_status` (returns subscription tier, billing date, seat count, and feature flags for an account) and `search_database` (accepts free-text queries and returns loosely ranked rows from multiple tables). A customer asks why their team lost access to the reporting dashboard after their renewal. The agent consistently calls `search_database(\"reporting access renewal\")` instead of `get_account_status`. What should you fix first?",
    "opts": [
      "Add a routing classifier that detects billing-related intent and hardcodes `get_account_status` for those tickets",
      "Rewrite `search_database`'s description to explicitly state it should not be used for structured account lookups where a specific account tool exists",
      "Improve `get_account_status`'s description with explicit use cases, input format, and a negative example noting it is preferred over `search_database` for account-level questions",
      "Merge both tools into `unified_account_search` with a `mode` parameter to eliminate selection ambiguity"
    ],
    "ans": 2,
    "expl": "The model selects tools primarily from their descriptions. A vague `get_account_status` description lets `search_database` appear equally valid. Enriching the specific tool description with use cases and scope boundaries corrects the selection signal at its source. A hardcodes routing before diagnosing description quality. B only pushes traffic away from `search_database` without guiding toward the correct tool. D collapses tool specificity and loses the ability to invoke both in parallel for different query types."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A developer-tools support agent must verify user identity before calling `get_api_key_details`, which returns sensitive credentials. The verification step calls `verify_identity` and returns a boolean. A customer asks to rotate their API key, and the agent calls `get_api_key_details` and `rotate_api_key` in the same tool-call batch before `verify_identity` completes. What is the correct design rule the agent violated?",
    "opts": [
      "The agent should have called all three tools in one batch to minimize round-trip latency",
      "`rotate_api_key` should have been called first to confirm the account exists before verifying identity",
      "Tools with downstream security dependencies must be called sequentially: prerequisite tools must complete and return success before dependent tools are invoked",
      "Identity verification should be handled by the system prompt policy, not by calling a tool at all"
    ],
    "ans": 2,
    "expl": "When one tool's output is a required precondition for another — especially a security gate — the calls must be sequential. Batching skips the gate. A optimizes latency at the cost of safety, which is the wrong trade-off for security-sensitive flows. B inverts the logical dependency: you cannot operate on a resource before confirming the requester is authorized. D misplaces responsibility — a system prompt cannot dynamically verify an identity at runtime; that requires a live tool call."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A travel booking support agent calls `get_flight_details` mid-conversation, but the airline API returns a 503. The customer is waiting for their itinerary confirmation and there is no fallback tool. What is the correct agent behavior?",
    "opts": [
      "Silently retry `get_flight_details` up to five times before acknowledging the failure, to avoid alarming the customer prematurely",
      "Escalate immediately to a human agent because any tool failure constitutes a case the agent cannot handle",
      "Acknowledge the partial information already in context, inform the customer of the temporary issue, and offer to continue once the service is restored or ask if they want to be connected to a human",
      "Continue the conversation as if the tool call succeeded, using the last known itinerary data from context to fill in the gap"
    ],
    "ans": 2,
    "expl": "Graceful degradation means the agent stays useful with what it has, communicates the limitation honestly, and gives the customer actionable options. A hides the failure and stalls the customer without their knowledge. B over-escalates — a transient API error does not require human intervention when partial progress and honest communication can maintain the conversation. D fabricates state that may be stale or wrong, which erodes trust and can cause downstream errors."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A financial account support agent handles both balance inquiries and dispute filings. Balance inquiries require only `get_balance`, but dispute filings require `get_balance`, `get_transaction_history`, and `get_account_flags` before a determination can be made. A customer message says: \"I need to open a dispute on a charge.\" When should the agent batch tool calls vs. call them sequentially?",
    "opts": [
      "Call all three tools sequentially — `get_balance` first, then `get_transaction_history`, then `get_account_flags` — so each result can be validated before the next call",
      "Call `get_transaction_history` and `get_account_flags` in one batch, then call `get_balance` only if the dispute warrants a credit — deferring unnecessary calls saves latency",
      "Batch `get_balance`, `get_transaction_history`, and `get_account_flags` in a single turn because none depends on the output of another and all are required before proceeding",
      "Ask the customer to confirm the charge amount before calling any tools, to avoid unnecessary API calls"
    ],
    "ans": 2,
    "expl": "When multiple tools are required and none has an input that depends on another tool's output, batching them in one turn minimizes round-trips without sacrificing correctness. A sequences calls that have no dependency, wasting latency. B defers a required tool on a speculative condition — `get_balance` is needed for context regardless of credit decision. D adds an unnecessary clarification round-trip when all required data can be fetched in parallel immediately."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A telecom support agent's tool registry is temporarily unavailable due to a platform outage. The agent has no access to `check_service_status`, `get_account_details`, or `update_plan`. A customer contacts support to ask whether there is an outage in their area. What is the best response strategy?",
    "opts": [
      "Attempt to call `check_service_status` anyway — the agent should always try tools even if the registry is reportedly unavailable",
      "Tell the customer the agent cannot help with any questions during a tool outage and terminate the conversation",
      "Use knowledge from the current conversation context and any cached state to answer what is possible, clearly flag what cannot be confirmed without live tools, and offer escalation or a callback",
      "Fabricate a plausible answer about service status to keep the customer satisfied while the outage resolves"
    ],
    "ans": 2,
    "expl": "When tools are unavailable, the agent should degrade gracefully: serve what it can from context, be transparent about limitations, and give the customer a path forward. A wastes a turn trying a known-unavailable resource. B abandons the customer entirely, when contextual help plus escalation is still possible. D invents facts about live service status, which is unsafe and damages trust when the fabrication is discovered."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A healthcare appointment scheduling agent has `search_available_slots`, `book_appointment`, and `get_patient_record` in its tool set. A returning patient asks to reschedule a follow-up that was mentioned in a previous session. The current session has no prior context from that session. What is the correct approach before calling `book_appointment`?",
    "opts": [
      "Call `book_appointment` with a placeholder appointment ID and let the system return an error that reveals the original booking details",
      "Call `get_patient_record` to retrieve the previous appointment details, then call `search_available_slots` to find alternatives, and only then present options to the patient",
      "Ask the patient for the original appointment date before calling any tools, since `get_patient_record` contains sensitive data and should be minimized",
      "Call `search_available_slots` first to show the patient options, then retrieve their record only if they select a slot"
    ],
    "ans": 1,
    "expl": "The agent must retrieve the existing appointment context before taking any booking action — `get_patient_record` gives the appointment ID and prior context needed to safely reschedule. `search_available_slots` follows so options are relevant to the provider and care type. A exploits an error path to extract data, which is an unsafe and unreliable pattern. C adds an unnecessary human round-trip when the tool can retrieve the data; minimizing tool calls does not justify burdening the patient with questions the system can answer. D presents slots without knowing the original provider or appointment type, producing irrelevant options."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "An enterprise B2B support agent handles escalations across three tiers: Tier 1 (self-service guidance), Tier 2 (technical engineers), and Tier 3 (account executives for strategic issues). A customer contacts support saying their entire organization's SSO integration has been broken for two hours, affecting 500 users, and their internal IT team has already ruled out their own IdP. At what tier should the agent escalate?",
    "opts": [
      "Tier 1 — provide SSO troubleshooting documentation and have the customer re-test, since there is no confirmed vendor-side outage",
      "Tier 2 — route to a technical engineer who can inspect backend SSO configuration and logs",
      "Tier 3 — the blast radius (500 users, 2 hours) and failed self-service attempts make this a strategic account issue requiring executive involvement",
      "Do not escalate — the agent should attempt to resolve this by calling `reset_sso_config` before involving humans"
    ],
    "ans": 1,
    "expl": "The symptoms (vendor-side scope after IdP ruled out, broad impact) require a technical engineer with backend access — that is precisely Tier 2's function. Tier 1 documentation has already implicitly been exhausted when IT self-diagnosed. C jumps to Tier 3, which handles strategic/commercial issues, not technical outages. D proposes a destructive action (`reset_sso_config`) without human oversight on a production system affecting 500 users — agents should not take high-blast-radius irreversible actions autonomously."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A SaaS subscription support agent is handling a customer who wants to cancel their enterprise contract. The cancellation requires legal review of the contract's termination clause, a prorated credit calculation, and coordination with the account team. The agent has a `cancel_subscription` tool but no tools for legal review or account team notification. What is the correct behavior?",
    "opts": [
      "Call `cancel_subscription` immediately since the customer explicitly requested it and the tool exists",
      "Explain that cancellation requires multiple teams, summarize the steps involved, and escalate with a structured handoff including account ID, contract type, and the customer's stated reason",
      "Ask the customer to wait 24 hours and contact their account executive directly — the support agent cannot initiate this process",
      "Offer the customer a discount or plan downgrade first, and only escalate if they decline all retention offers"
    ],
    "ans": 1,
    "expl": "Complex multi-department issues — especially those with legal, financial, and relationship dimensions — require escalation with full context. A structured handoff (account state, contract type, reason) enables the receiving team to act without re-interviewing the customer. A acts unilaterally on an incomplete process, potentially creating a disputed cancellation. C abandons the customer without creating a handoff trail. D inserts retention logic that has not been authorized in the agent's system prompt and delays a customer who has made a clear decision."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A customer has contacted a telecom support agent three times in five days about the same intermittent data throttling issue. Each time, the agent has walked them through the same troubleshooting steps. The issue remains unresolved. The current session is the fourth contact. What should the agent do?",
    "opts": [
      "Run through the standard troubleshooting steps one more time — the issue may resolve itself on this attempt",
      "Escalate to a network engineering team with a summary of all prior contacts, steps attempted, and current account and device state",
      "Offer the customer a partial credit for the inconvenience and close the ticket as resolved",
      "Ask the customer to factory-reset their device, since that step has not been tried in prior sessions"
    ],
    "ans": 1,
    "expl": "Repeated failed resolution attempts are an explicit escalation trigger. At the fourth contact for the same unresolved issue, the standard procedure has demonstrably failed and human escalation with full case history is required. A ignores the failure signal and wastes the customer's time. C closes an open technical issue with a credit — the underlying problem remains and the customer will contact again. D introduces a destructive customer action (factory reset) without engineering-level diagnosis of a network-side issue."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A financial support agent is escalating a complex wire transfer dispute to a compliance specialist. The agent has gathered: account number, transaction ID, dispute amount, the customer's stated reason, two prior resolution attempts (both failed), and the current account hold status. What context should be included in the escalation handoff?",
    "opts": [
      "Only the transaction ID and dispute amount — the specialist will re-gather everything else to avoid bias from the prior agent's framing",
      "A full transcript of every message exchanged, without summarization, to preserve all context",
      "A structured summary: account ID, transaction ID, issue type, dispute amount, prior resolution attempts and outcomes, current account state, and any customer-stated urgency",
      "The customer's emotional state and a sentiment score, since compliance specialists prioritize distressed customers"
    ],
    "ans": 2,
    "expl": "A structured handoff gives the receiving specialist exactly what is needed to act without re-interviewing the customer: the facts, what was tried, and the current state. A forces the specialist to re-collect known information, wasting their time and re-burdening the customer. B dumps raw transcript with no signal extraction — finding the relevant facts inside a long conversation is inefficient. D prioritizes sentiment over operational facts; compliance decisions are driven by transaction data and prior actions, not emotional scoring."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "Your system prompt defines escalation triggers as: (1) customer requests a human, (2) three failed resolution attempts, (3) account hold value exceeds $10,000. A customer is frustrated but has not requested a human, this is their first contact, and their account hold is $800. They are using increasingly emotional language. Should the agent escalate?",
    "opts": [
      "Yes — emotional language always overrides system prompt escalation criteria and requires immediate human handoff",
      "No — none of the defined triggers have been met; the agent should apply empathy in tone but continue attempting resolution",
      "Yes — agent judgment about emotional distress should always supersede hardcoded trigger lists",
      "No — escalation is never warranted until all three criteria are met simultaneously"
    ],
    "ans": 1,
    "expl": "When a system prompt defines explicit escalation criteria, the agent should honor them as policy. None of the three criteria are met here. The correct response is to adjust tone (apply empathy, acknowledge frustration) while continuing the resolution attempt. A treats emotional language as an absolute override, which would cause constant false-positive escalations on any frustrated customer. C suggests the agent should dynamically override explicit policy, which undermines system prompt authority. D is close but slightly wrong: a single criterion being met (e.g., customer requests human) is sufficient — the three don't need to be simultaneous."
  },
  {
    "source": "Customer Support Resolution Agent",
    "prompt": "A developer-tools support agent is managing a conversation that has reached turn 18. The customer reported a webhook delivery failure in turn 2, provided their endpoint URL in turn 4, shared error logs in turn 7, and confirmed a fix attempt failed in turn 14. The agent must now call `retry_webhook_delivery`. What context management approach is correct?",
    "opts": [

var MODULE_NAME = "Customer Support Resolution Agent";
var TAGS = ["Tool Selection", "Escalation Criteria", "Context Management", "Summarization", "Multi-Concern Routing", "Validation"];
var PASS_STORAGE_KEY = 'cca_customer_support_pass_count';
var WRONGS_STORAGE_KEY = 'cca_customer_support_wrong_answers';
var QUESTIONS_PER_ATTEMPT = 20;
var TIMER_MINUTES = 60;
var PASS_SCORE = 1000;

function loadPassCount() {
  try {
    var raw = window.localStorage.getItem(PASS_STORAGE_KEY);
    var parsed = parseInt(raw, 10);
    if (Number.isFinite(parsed) && parsed >= 0) return parsed;
  } catch (err) {}
  return 0;
}

function savePassCount(n) {
  try { window.localStorage.setItem(PASS_STORAGE_KEY, String(n)); } catch (err) {}
}

function loadWrongs() {
  try {
    var raw = window.localStorage.getItem(WRONGS_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (err) {}
  return [];
}

function saveWrongs(arr) {
  try { window.localStorage.setItem(WRONGS_STORAGE_KEY, JSON.stringify(arr)); } catch (err) {}
}

function clearWrongs() {
  try { window.localStorage.removeItem(WRONGS_STORAGE_KEY); } catch (err) {}
}

var S = {
  screen: 'start',
  pool: [],
  ix: 0,
  answers: {},
  revealed: false,
  timeLeft: TIMER_MINUTES * 60,
  timerId: null,
  score: null,
  review: [],
  passCount: loadPassCount(),
  warnedTwoMin: false
};

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function shuffleOpts(q) {
  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  // shuffled[newIdx] = origIdx  →  origToNew[origIdx] = newIdx
  var origToNew = {};
  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

function buildDeck() {
  var picked = shuffle(BANK).slice(0, QUESTIONS_PER_ATTEMPT);
  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
