<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - Error Propagation Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #f87171;
    --accent2: #dc2626;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "Error Propagation",
    "prompt": "A web search subagent returns two types of non-success outcomes: an HTTP 504 timeout on one query and a valid API response containing `{\"results\": [], \"total\": 0}` on another. The coordinator receives both and must decide next steps. Which approach correctly handles these distinct outcomes?",
    "opts": [
      "Aggregate both into a single \"search failure\" metric and retry the affected queries uniformly",
      "Treat the 504 as a retryable access failure and treat the empty results as a valid informative finding requiring no retry",
      "Return a generic \"search unavailable\" error for both to simplify coordinator logic",
      "Retry both immediately since neither produced usable content for the final report"
    ],
    "ans": 1,
    "expl": "A 504 timeout is an access failure — the data may exist but was unreachable, making a retry appropriate. Zero results is a valid semantic outcome — the search succeeded and found nothing, which is itself informative. Conflating them destroys the semantic distinction. A is wrong because merging both into a single metric causes unnecessary retries on valid empty results and potentially masks persistent access failures. C is wrong because returning a generic error loses both the access failure context (needed for intelligent retry) and the valid empty-result finding (informative data about the research domain). D is wrong because retrying a successful \"0 results\" query wastes resources and misrepresents the outcome as an error when it is a legitimate finding."
  },
  {
    "source": "Error Propagation",
    "prompt": "A document analysis subagent encounters a corrupted PDF that cannot be parsed. The subagent has already attempted two parsing strategies without success. Which error handling approach is most appropriate?",
    "opts": [
      "Silently skip the document and continue processing the remaining files",
      "Terminate the entire workflow to prevent any partial results from entering the output",
      "Retry the same parsing strategies with exponential backoff until the document succeeds",
      "Return a structured error to the coordinator with the document identifier, failure type, and the two attempted strategies"
    ],
    "ans": 3,
    "expl": "A corrupted file is not a transient error — retrying the same strategies will not succeed. The coordinator has broader context to decide whether to skip, attempt alternative parsing, or notify the user; structured error context enables that decision. A is wrong because silent skip hides the failure, leaving the coordinator unaware of the gap and unable to make an informed recovery decision. B is wrong because terminating the workflow kills all progress already made on other documents — a single corrupted file does not justify discarding the entire job. C is wrong because corruption is a persistent failure, not a transient one; exponential backoff on a fundamentally broken file wastes time and produces no new information."
  },
  {
    "source": "Error Propagation",
    "prompt": "Your system classifies errors into three categories: tool execution errors (the tool ran but returned an error), model behavior errors (the model generated incorrect tool arguments), and orchestration errors (the coordinator failed to route tasks correctly). A subagent calls `search_academic_db` but receives `{\"error\": \"rate_limit_exceeded\", \"retry_after\": 30}`. Which category does this belong to, and what is the correct recovery owner?",
    "opts": [
      "Tool execution error — the subagent should handle this locally by waiting and retrying before escalating",
      "Orchestration error — the coordinator should pause the entire pipeline until the rate limit resets",
      "Model behavior error — the coordinator should update its prompt to prevent the subagent from calling rate-limited tools",
      "Orchestration error — the coordinator should re-route this task to a different subagent with a lower-volume search tool"
    ],
    "ans": 0,
    "expl": "A rate limit error is a tool execution error: the tool ran, received a valid API response, and that response indicates a recoverable transient condition. The subagent is the lowest capable layer for handling it — waiting 30 seconds and retrying is a straightforward local recovery without coordinator involvement. B is wrong because pausing the entire pipeline is disproportionate; only the affected tool call needs to wait, and other parallel work can continue. C is wrong because this is not a model behavior error; the model correctly called a valid tool with valid arguments. The error is in the external API response, not in model reasoning. D is wrong because re-routing to a different subagent escalates unnecessarily — the original subagent can resolve this transiently without architectural changes."
  },
  {
    "source": "Error Propagation",
    "prompt": "A subagent's tool call fails with a JSON schema validation error: the tool expected `{\"query\": string, \"max_results\": integer}` but received `{\"query\": string, \"max_results\": \"50\"}`. The model passed the count as a string instead of an integer. Which error category is this, and what is the correct fix?",
    "opts": [
      "Tool execution error — retry the tool call immediately since schema errors are often transient",
      "Model behavior error — update the tool description to emphasize that max_results must be an integer type",
      "Orchestration error — the coordinator should validate all tool arguments before passing them to subagents",
      "Tool execution error — add input sanitization in the tool handler to coerce string integers to integers"
    ],
    "ans": 1,
    "expl": "When the model passes the wrong type for a parameter, this is a model behavior error — the tool schema was not clear enough to guide correct argument construction. Updating the tool description (or using `strict: true` schema enforcement) addresses the root cause: ambiguous type signaling. A is wrong because schema validation errors are not transient — retrying the same call with the same arguments will produce the same error. C is wrong because pre-validation by the coordinator adds a layer of complexity without addressing why the model generated the wrong type in the first place. D is wrong because adding coercion in the tool handler treats the symptom, not the cause — the model will continue generating wrong types on other calls, and type coercion can mask legitimate errors."
  },
  {
    "source": "Error Propagation",
    "prompt": "A multi-agent research system has three error types observed in production: (1) a subagent's web search tool returns HTTP 429 (rate limited), (2) a subagent returns results from a source the coordinator did not request, and (3) the coordinator routes a task to the wrong subagent because two tools have similar names. Match each error to its correct category: tool execution, model behavior, orchestration.",
    "opts": [
      "1=model behavior, 2=orchestration, 3=tool execution",
      "1=orchestration, 2=model behavior, 3=tool execution",
      "1=tool execution, 2=orchestration, 3=model behavior",
      "1=tool execution, 2=model behavior, 3=orchestration"
    ],
    "ans": 3,
    "expl": "HTTP 429 is a tool execution error — the tool ran and the external API rejected it; retry logic in the subagent is the correct response. Returning results from an unrequested source is a model behavior error — the model made an autonomous decision to query a different source, which is a reasoning or instruction-following issue. Misrouting due to similar tool names is an orchestration error — the coordinator was confused by ambiguous tool descriptions, causing a routing failure. A is wrong because a 429 rate limit is caused by tool execution, not by the coordinator's routing logic. B is wrong because returning wrong-source results is a model behavior issue, not an orchestration routing decision. C is wrong because tool name ambiguity causing misrouting is an orchestration-layer problem, not a raw tool execution failure or model behavior error."
  },
  {
    "source": "Error Propagation",
    "prompt": "A coordinator receives the following error payload from a subagent: `{\"status\": \"error\", \"message\": \"Search failed\"}`. The coordinator cannot determine whether to retry, reroute, or skip. What is the minimum additional structure the subagent should include to enable intelligent recovery?",
    "opts": [
      "Include error type (access_failure vs not_found), the attempted query, whether the error is recoverable, and any partial results obtained",
      "Add an HTTP status code so the coordinator can apply standard HTTP retry semantics",
      "Add a timestamp and request ID so the coordinator can log the failure for audit purposes",
      "Return the full stack trace from the tool execution so the coordinator can diagnose the root cause"
    ],
    "ans": 0,
    "expl": "Intelligent recovery requires: error type (determines retry vs skip strategy), the attempted query (enables modified retry), recoverability flag (prevents futile retries on persistent failures), and partial results (preserves value from what succeeded). These four fields give the coordinator everything it needs to make an informed decision. B is wrong because HTTP status codes apply only to HTTP tool calls and collapse the semantic distinction between different failure modes. C is wrong because timestamps and request IDs serve logging and auditing purposes but provide no information the coordinator needs to choose a recovery strategy. D is wrong because stack traces expose implementation internals that the coordinator cannot act on — the coordinator needs semantic error information, not debugging artifacts."
  },
  {
    "source": "Error Propagation",
    "prompt": "A subagent encounters a transient database connection error on its first attempt. The subagent has a retry policy configured. At what point should the subagent escalate to the coordinator rather than continuing local retries?",
    "opts": [
      "Immediately for any error that occurs more than once within a single task execution",
      "After exhausting local retries or determining the error is persistent, returning the final error state with context about what was attempted",
      "After the first failure, to give the coordinator maximum time to find an alternative",
      "Never — the subagent should retry indefinitely until it succeeds or the overall task times out"
    ],
    "ans": 1,
    "expl": "The principle of handling errors at the lowest capable layer means the subagent should resolve transient failures locally. Escalation is correct when retries are exhausted or the error is identified as persistent — at that point, the subagent returns structured context (what was attempted, how many times, what the error was) so the coordinator can make an informed decision. A is wrong because two occurrences is not a reliable threshold for \"persistent\" — some transient errors may occur twice in rapid succession before resolving. C is wrong because escalating after the first failure is premature — it increases coordinator involvement unnecessarily for errors the subagent can resolve in seconds. D is wrong because indefinite retries without escalation can block the pipeline forever on persistent failures and prevent the coordinator from attempting alternative paths."
  },
  {
    "source": "Error Propagation",
    "prompt": "A web search subagent successfully queries three sources but fails on a fourth due to an access restriction. The subagent has partial results from the three successful sources. Which approach best applies local recovery principles?",
    "opts": [
      "Return the three successful results with a structured annotation indicating the fourth source was inaccessible and why",
      "Return only a success flag since the subagent completed the majority of its work",
      "Discard all results and return a failure, since incomplete results may mislead the coordinator",
      "Retry the fourth source five more times before returning any results to the coordinator"
    ],
    "ans": 0,
    "expl": "Local recovery includes maximizing what can be recovered — three valid results are valuable partial output. The structured annotation on the fourth source tells the coordinator exactly what happened, enabling it to decide whether to attempt an alternative source or proceed with the available data. B is wrong because returning only a success flag without the failure annotation hides the gap — the coordinator cannot reason about coverage or decide whether to seek alternative sources. C is wrong because discarding successful results to maintain a \"clean\" all-or-nothing response abandons real value; partial results with transparency are more useful than nothing. D is wrong because an access restriction (not a transient error) will not resolve through retries — continuing to attempt it delays delivery of the three available results."
  },
  {
    "source": "Error Propagation",
    "prompt": "Three parallel research subagents are launched simultaneously. After 45 seconds, subagent A returns complete results, subagent B returns partial results with a coverage annotation, and subagent C returns `{\"error\": \"timeout\", \"recoverable\": true, \"query\": \"climate policy EU 2024\"}`. The coordinator must decide next steps. What is the correct approach?",
    "opts": [
      "Discard all results and relaunch all three subagents since the pipeline did not complete successfully",
      "Wait for subagent C to self-recover before aggregating any results to ensure consistency",
      "Proceed with A's complete results and B's annotated partial results; retry subagent C's query with the preserved query context",
      "Use subagent A's results only and discard subagents B and C since their results are unreliable"
    ],
    "ans": 2,
    "expl": "Partial success should be handled by preserving all usable results. A's complete results and B's annotated partial results have clear value. C returned a recoverable error with the original query context — the coordinator can issue a targeted retry for that specific query without restarting the full pipeline. A is wrong because discarding all results to restart from scratch wastes the work of both A and B, which completed correctly — total reruns are only justified when results are corrupted or interdependent. B is wrong because \"waiting for C to self-recover\" is not a defined behavior — subagent C returned an error and will not automatically retry; the coordinator must issue the retry explicitly. D is wrong because B's partial results with coverage annotations are explicitly useful — the coordinator knows exactly what B covered and what it missed, enabling informed synthesis."
  },
  {
    "source": "Error Propagation",
    "prompt": "A coordinator orchestrates five subagents in parallel for a market research task. Subagents 1, 2, and 3 succeed. Subagent 4 returns a structured error with `\"recoverable\": false`. Subagent 5 returns a structured error with `\"recoverable\": true`. Which response best describes the correct coordinator behavior?",
    "opts": [
      "Halt the entire workflow since not all subagents completed successfully",
      "Proceed using results from 1, 2, 3; mark subagent 4's domain as a permanent coverage gap; retry subagent 5's query",
      "Retry both subagents 4 and 5 before proceeding to ensure maximum coverage",
      "Discard subagent 4's domain from the final report without annotation to keep the output clean"
    ],
    "ans": 1,
    "expl": "The `recoverable` flag is the key discriminator: subagent 4's failure is permanent — retrying would waste resources and the gap should be annotated. Subagent 5's failure is recoverable — the coordinator should retry it with the preserved query context. Results from 1, 2, and 3 should be preserved regardless. A is wrong because halting on any non-complete subagent ignores the recoverable/unrecoverable distinction and discards substantial completed work. C is wrong because retrying a non-recoverable failure (subagent 4) is explicitly wasteful — the `recoverable: false` flag signals the error will persist. D is wrong because silently dropping subagent 4's domain without annotation hides a coverage gap from downstream synthesis, preventing informed confidence assessment."
  },
  {
    "source": "Error Propagation",
    "prompt": "A subagent should return errors via tool result content rather than by raising exceptions. A developer argues that raising an exception is equivalent since both stop execution. Why is the tool result approach preferred in multi-agent systems?",
    "opts": [
      "Tool result content is visible to the model in the conversation history; exceptions break the agentic loop and are not model-visible",
      "Exceptions require the orchestrator to have access to the subagent's runtime, which is a security concern",
      "Tool results can be retried automatically while exceptions require manual intervention",
      "Exceptions are slower to process than structured tool results, so tool results reduce latency"
    ],
    "ans": 0,
    "expl": "The agentic loop depends on the model reasoning about tool outcomes. When a tool result contains error information, the model can read it, understand what happened, and decide the next action. An unhandled exception breaks the loop entirely — the model never sees what went wrong and cannot reason about recovery. B is wrong because exceptions do not require runtime access to the subagent — the concern is not security but model visibility into error state. C is wrong because neither mechanism provides automatic retry; retry logic must be explicitly implemented regardless of how the error is surfaced. D is wrong because the choice between exceptions and tool results is not about latency — both involve a round trip, and structured result serialization is not meaningfully slower than exception propagation."

function loadPassCount() {
  try {
    var raw = window.localStorage.getItem(PASS_STORAGE_KEY);
    var parsed = parseInt(raw, 10);
    if (Number.isFinite(parsed) && parsed >= 0) return parsed;
  } catch (err) {}
  return 0;
}

}

}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function shuffleOpts(q) {
  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  // shuffled[newIdx] = origIdx  →  origToNew[origIdx] = newIdx
  var origToNew = {};
  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
