<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - Batch vs Sync API Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #4ade80;
    --accent2: #16a34a;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "Batch vs Sync API",
    "prompt": "Your CI pipeline runs nightly security audits on 8,000 code repositories. Each audit is a standalone Claude API call with no dependency on other audit results. The pipeline runs at 2 AM and results are reviewed at 9 AM. Which API approach is optimal?",
    "opts": [
      "Synchronous API with a thread pool of 50 concurrent workers to maximize throughput",
      "Message Batches API to process all 8,000 requests asynchronously with a 50% cost reduction",
      "Synchronous API with exponential backoff to handle rate limits automatically",
      "Message Batches API with streaming enabled to get results as they complete"
    ],
    "ans": 1,
    "expl": "The workload has all batch-optimal characteristics: high volume, independent requests, no real-time requirement, and a 7-hour window before results are needed. The Batches API delivers 50% cost savings and higher throughput for exactly this pattern. A is wrong because synchronous concurrent calls forgo the 50% discount and add infrastructure complexity without any latency benefit when results aren't needed until morning. C is wrong because synchronous processing with backoff still pays full price and introduces rate-limit management burden the Batches API handles automatically. D is wrong because streaming is not supported for batch requests — it is a documented incompatibility of the Batches API."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "A developer builds a code review tool that runs in a pre-merge GitHub Actions workflow. When a developer pushes a commit, the workflow calls the Claude API to analyze the diff and must post a blocking status check before the PR can be merged. The developer is considering switching to the Batches API to reduce costs. What is the critical reason this switch is not appropriate?",
    "opts": [
      "The Batches API does not support code analysis tasks",
      "The Batches API requires a minimum of 100 requests, which a single PR diff does not satisfy",
      "GitHub Actions does not support polling-based workflows required by the Batches API",
      "The Batches API processes asynchronously and can take up to 24 hours, making it incompatible with a blocking pre-merge gate that developers are waiting on"
    ],
    "ans": 3,
    "expl": "The Batches API is explicitly designed for latency-tolerant workloads. A pre-merge gate that blocks developer merges requires an immediate response — waiting up to 24 hours would halt all development. The synchronous API is the correct choice for any workflow where a human is waiting for the result. A is wrong because the Batches API supports all request types available in the Messages API, including code analysis. B is wrong because the Batches API has no minimum request count — it accepts a single request up to 100,000 requests per batch. C is wrong because polling is a standard pattern in CI systems and GitHub Actions supports it natively."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "Your platform processes customer feedback submissions. For each submission you need Claude to: (1) classify the sentiment, (2) based on that classification, decide whether to escalate, and (3) if escalating, generate a draft response tailored to the sentiment. Steps 2 and 3 depend on the output of step 1. Which API strategy is correct?",
    "opts": [
      "Use the synchronous API for all three steps because the chain of dependent calls requires each step's output to feed into the next",
      "Use the Batches API for all three steps since they can be submitted together in one batch",
      "Use the Batches API for steps 1 and 3, and synchronous API for step 2 only",
      "Use the Batches API for step 1 across all submissions, then make synchronous calls for steps 2 and 3"
    ],
    "ans": 0,
    "expl": "Chained dependent calls are fundamentally incompatible with the Batches API. Each request in a batch is processed independently with no mechanism to pass results between steps within a single logical workflow. Steps 2 and 3 require the output of prior steps, which requires synchronous execution where each response is available before the next call is made. B is wrong because the Batches API cannot wire outputs of one request as inputs to another within the same batch — each request is entirely independent. C is wrong because step 3 also depends on step 2's output, making asynchronous processing of step 3 impossible without first completing step 2 synchronously. D is wrong because even if step 1 runs as a batch, the results still need to feed into steps 2 and 3 sequentially for each submission, making a batched step 1 add complexity without enabling the dependent steps."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "A team is running large-scale evaluations of a new prompt template against 50,000 test cases. Each evaluation is a single Claude API call comparing the model's output to a reference answer. The team wants to minimize cost. One engineer suggests using the synchronous API with aggressive parallelism. Another proposes the Batches API. What is the decisive factor favoring the Batches API?",
    "opts": [
      "The Batches API can process more than 50,000 requests in a single batch submission",
      "The Batches API guarantees results within 1 hour for batches of this size",
      "The Batches API provides a documented 50% cost reduction on all usage compared to standard API prices",
      "The Batches API eliminates the need for custom retry logic on individual request failures"
    ],
    "ans": 2,
    "expl": "The 50% cost reduction is the documented, concrete financial advantage of the Batches API for exactly this type of high-volume, latency-tolerant evaluation workload. At 50,000 requests, this is a substantial savings. A is wrong because a single Message Batch is limited to 100,000 requests or 256 MB, whichever comes first — 50,000 is within range but the batch limit is not the deciding factor for the comparison. B is wrong because the Batches API documentation states most batches finish within 1 hour but explicitly does not guarantee it — processing can take up to 24 hours. D is wrong because while the Batches API does isolate per-request failures, the synchronous API with retry logic also handles errors — this is not the decisive differentiator."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "An engineer wants to use the Batches API for an agentic pipeline that performs web research. The pipeline submits a research question, receives an answer, calls a `search_web` tool to gather more data, feeds the search results back to Claude, and iterates until sufficient evidence is collected. Why is this incompatible with the Batches API?",
    "opts": [
      "Web search tools exceed the Batches API's per-request token limit",
      "The Batches API uses a fire-and-forget model — there is no mechanism to intercept a tool call mid-request, execute the tool externally, and return results to continue the same logical interaction",
      "The Batches API does not accept requests with tool definitions",
      "The Batches API does not support multi-turn conversations in a single request"
    ],
    "ans": 1,
    "expl": "The Batches API's asynchronous fire-and-forget architecture means each request completes in isolation. An agentic tool loop requires the model to pause at a tool call, have the tool executed externally, receive the result, and continue reasoning — this iterative interception is structurally impossible in the batch model. A is wrong because token limits apply uniformly and are not specific to web search tools or incompatible with the Batches API. C is wrong because the Batches API supports tool definitions and tool use within a single batch request — the limitation is iterative multi-turn tool loops, not the presence of tools. D is wrong because the Batches API does support multi-turn conversations passed in the `messages` parameter — what it cannot do is extend a conversation mid-processing via external tool results."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "You are designing a content moderation system for a social media platform. New posts arrive continuously and must be reviewed within 2 seconds to prevent harmful content from being visible to users. Your initial design submits each post to the Batches API. A colleague flags this as wrong. What is the correct reason?",
    "opts": [
      "The Batches API is asynchronous and cannot guarantee sub-second or even sub-hour response times, making it incompatible with a 2-second SLA for real-time moderation",
      "Content moderation is a use case the Batches API explicitly excludes from its terms of service",
      "The Batches API cannot handle the volume of social media posts efficiently due to its 100,000-request batch limit",
      "The Batches API does not support the text classification task type required for moderation"
    ],
    "ans": 0,
    "expl": "The Batches API is designed for latency-tolerant workloads. Its documentation states batches can take up to 24 hours and provides no guaranteed SLA for completion time. A 2-second requirement demands synchronous API calls with immediate responses. B is wrong because content moderation is explicitly listed as a valid Batches API use case — it is appropriate when moderation is asynchronous (e.g., post-publication review), just not for real-time blocking moderation. C is wrong because 100,000 requests per batch is a high-capacity limit that would handle most moderation volumes — the limitation is latency, not capacity. D is wrong because text classification is fully supported by the Batches API, which accepts any Messages API request type."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "A streaming use case requires real-time token-by-token output from Claude to power a live typing indicator in a user-facing chat interface. A cost-conscious developer proposes routing these requests through the Batches API to take advantage of the 50% discount. What is the problem?",
    "opts": [
      "The Batches API requires a minimum batch size of 10 requests before processing begins",
      "Streaming requests require a different API key scope than the Batches API accepts",
      "Streaming is explicitly not supported for batch requests — the Batches API cannot return incremental token output",
      "The Batches API does not support models capable of streaming"
    ],
    "ans": 2,
    "expl": "The Anthropic documentation explicitly states streaming is not supported for batch requests. The Batches API returns complete responses only, making it structurally incompatible with streaming use cases that require incremental token delivery. A is wrong because the Batches API has no minimum batch size requirement and will process a batch with a single request. B is wrong because the Batches API uses standard API keys — there is no special scope distinction for streaming versus batch requests. D is wrong because the Batches API supports all active Claude models — model support is not the constraint."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "After submitting a Message Batch containing 5,000 requests, your application needs to retrieve results. Which is the correct retrieval pattern?",
    "opts": [
      "Stream results using server-sent events on the same connection used to create the batch",
      "Results are returned inline in the response to the POST /v1/messages/batches request once all requests complete",
      "Subscribe to a webhook URL registered at batch creation time to receive results as they become available",
      "Poll the batch status endpoint to check processing state, then fetch results from the separate results endpoint when the batch shows a completed status"
    ],
    "ans": 3,
    "expl": "The Batches API is asynchronous. After submission, you poll the batch status endpoint to monitor processing. When all requests have completed, results are retrieved via a separate results endpoint — they are not returned inline in the creation response. A is wrong because server-sent events and streaming are explicitly not supported for batch requests; the connection used to create the batch does not stay open for result delivery. B is wrong because the batch creation response returns only the batch object (ID, status, counts) — results are never returned inline in the creation call. C is wrong because the Batches API does not support webhooks — there is no documented mechanism to register a callback URL for result delivery."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "You submit a Message Batch with 1,000 requests and assign each request a `custom_id`. Results come back in a different order than the requests were submitted. How should you match each result to its original request?",
    "opts": [
      "Re-sort results by `created_at` timestamp, which corresponds to submission order",
      "Use the `custom_id` field in each result object to match it back to the original request with the same `custom_id`",
      "Results are always returned in submission order, so array index position corresponds to submission order",
      "Use the numeric sequence embedded in the batch's result `id` field, which mirrors submission order"
    ],
    "ans": 1,
    "expl": "The `custom_id` is specifically designed for result matching. Since batch results are not guaranteed to arrive in submission order, each result carries the `custom_id` assigned at request time to enable reliable correlation. The docs explicitly note that order is not guaranteed and recommend meaningful `custom_id` values. A is wrong because `created_at` timestamps reflect when the batch was created, not individual request processing order, and sorting by them does not reliably recover submission order. C is wrong because the documentation explicitly states order is not guaranteed — results can arrive in any order depending on processing. D is wrong because the batch result `id` field is the unique identifier of the result object itself, not a sequential mirror of submission order."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "Your team submits a batch of 10,000 document summarization requests. After 26 hours, you check the batch and find its status is `expired` with only 7,400 requests completed. What does this mean and what is the correct handling?",
    "opts": [
      "The batch errored due to a service outage — all 10,000 requests need to be resubmitted in a new batch",
      "The 2,600 incomplete requests were automatically moved to a retry queue and will complete within 48 hours",
      "Expired status means the batch is still processing but has exceeded the expected SLA — wait another 24 hours for it to complete",
      "The batch exceeded the 24-hour processing window and expired. The 7,400 completed results are available; the remaining 2,600 requests must be resubmitted in a new batch"
    ],
    "ans": 3,
    "expl": "Batches expire after 24 hours if processing has not completed. Results for completed requests within the expired batch are still available for 29 days from batch creation. Incomplete requests get an `expired` result status and must be collected and resubmitted in a new batch. A is wrong because this is not a service outage — the 7,400 completed results are available and should not be discarded by resubmitting all 10,000. B is wrong because there is no automatic retry queue for expired requests — the caller is responsible for identifying incomplete requests and resubmitting them. C is wrong because `expired` is a terminal state, not an in-progress one — the batch will not continue processing."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "A Message Batch containing 500 requests is in progress. Request #247 encounters an API error due to invalid parameters in its `params` object. What happens to the other 499 requests?",
    "opts": [
      "The entire batch is paused and marked `failed` until the error is corrected and the batch resubmitted",
      "The batch is automatically retried from request #247 onward after a 5-minute delay",
      "The other 499 requests continue processing independently — individual request failures do not abort the batch",
      "Requests after #247 in submission order are skipped; requests before it continue normally"
    ],
    "ans": 2,
    "expl": "The documentation explicitly states that the failure of one request in a batch does not affect the processing of other requests. Each request is independent. The failed request receives an `errored` result status, and all other requests proceed to completion. A is wrong because batch-level failure on a single request error would make the Batches API impractical for large workloads — this is explicitly not how it behaves. B is wrong because the Batches API does not perform automatic per-request retries — the caller must inspect result statuses and resubmit failed requests as needed. D is wrong because requests are not processed in strict submission order and there is no positional dependency between requests in a batch."
  },
  {
    "source": "Batch vs Sync API",
    "prompt": "After a Message Batch completes, you retrieve results and find that 23 requests have a result type of `errored`. The rest succeeded. What is the correct approach?",
    "opts": [

function loadPassCount() {
  try {
    var raw = window.localStorage.getItem(PASS_STORAGE_KEY);
    var parsed = parseInt(raw, 10);
    if (Number.isFinite(parsed) && parsed >= 0) return parsed;
  } catch (err) {}
  return 0;
}

function savePassCount(n) {
  try { window.localStorage.setItem(PASS_STORAGE_KEY, String(n)); } catch (err) {}
}

function loadWrongs() {
  try {
    var raw = window.localStorage.getItem(WRONGS_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (err) {}
  return [];
}

function saveWrongs(arr) {
  try { window.localStorage.setItem(WRONGS_STORAGE_KEY, JSON.stringify(arr)); } catch (err) {}
}

function clearWrongs() {
  try { window.localStorage.removeItem(WRONGS_STORAGE_KEY); } catch (err) {}
}

var S = {
  screen: 'start',
  pool: [],
  ix: 0,
  answers: {},
  revealed: false,
  timeLeft: TIMER_MINUTES * 60,
  timerId: null,
  score: null,

};

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function shuffleOpts(q) {
  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  // shuffled[newIdx] = origIdx  →  origToNew[origIdx] = newIdx
  var origToNew = {};
  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

function buildDeck() {
  var picked = shuffle(BANK).slice(0, QUESTIONS_PER_ATTEMPT);
  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
