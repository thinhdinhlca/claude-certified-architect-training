<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - MCP & Tool Design Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #2dd4bf;
    --accent2: #0d9488;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "MCP & Tool Design",
    "prompt": "MCP is often described as \"the USB-C for AI integrations.\" What does this metaphor capture about the protocol?",
    "opts": [
      "MCP is a hardware standard that devices must physically connect through, similar to how USB-C works in electronics",
      "MCP provides a universal, standardized interface that replaces custom one-off integrations, allowing an AI application to connect with any MCP-compatible tool or data source through the same protocol",
      "MCP was designed by the same standards organization that created the USB-C specification, ensuring hardware-level compatibility between AI devices",
      "MCP is the fastest protocol for AI data transfer, just as USB-C offers the highest data throughput among physical connectors"
    ],
    "ans": 1,
    "expl": "MCP is a software protocol layer that replaces the N×M combinatorial problem of custom point-to-point integrations — just as USB-C replaced a drawer full of proprietary cables with a single universal connector. A is wrong because MCP is a software protocol, not a hardware standard, and there is no physical connector or device requirement in the spec. C is wrong because MCP is an Anthropic-led open protocol, not a product of any USB standards body. D is wrong because throughput is not MCP's differentiator — standardized discovery, lifecycle management, and capability negotiation are."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "What is the primary problem that the Model Context Protocol (MCP) solves in the AI ecosystem?",
    "opts": [
      "Reducing the cost of LLM API calls by compressing prompt data before transmission over the network",
      "Providing a standard protocol for AI models to securely access external tools, data sources, and context without requiring custom integration code for each connection",
      "Standardizing model weight formats so that different LLM vendors can share parameter data across training pipelines",
      "Replacing the need for fine-tuning by allowing models to dynamically load capabilities through protocol extensions"
    ],
    "ans": 1,
    "expl": "MCP eliminates the N×M integration problem by providing a single standard protocol for tool discovery, capability negotiation, and execution — any MCP host connects to any MCP server without bespoke glue code. A is wrong because MCP does not compress or optimize prompt data; it is a connection and capability protocol, not a compression layer. C is wrong because MCP has nothing to do with model weight formats or cross-vendor training pipelines. D is wrong because MCP does not replace fine-tuning; it expands runtime access to external context and tools without changing model weights."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "In MCP architecture, there are three key roles: Host, Client, and Server. Which statement correctly describes their relationships?",
    "opts": [
      "The Host application creates one Client per MCP server, and each Client maintains a 1:1 connection with exactly one Server",
      "The Host acts as a central load balancer, distributing requests across a pool of Clients which then fan out to any available Server in the cluster",
      "The Client is embedded within the Server process, and the Host connects directly to the Server through the Client's local API",
      "Multiple Hosts share a single Client instance which multiplexes connections to all configured Servers simultaneously"
    ],
    "ans": 0,
    "expl": "In the MCP architecture the Host (e.g., Claude Desktop) owns and creates one Client per configured Server, with each Client maintaining a strict 1:1 transport connection to exactly one Server — this isolation prevents one server's failures or behavior from affecting another's connection. B is wrong because MCP has no load-balancer or fan-out concept; each Client connects to exactly one Server, not a pool. C is wrong because Clients live inside the Host process, not inside the Server process — the Server is a separate entity that the Client connects to. D is wrong because Clients are not shared across Hosts; each Host owns its own set of dedicated Clients."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "A developer is integrating MCP into a custom chat application. Their app needs to connect to three different MCP servers: a filesystem server, a database server, and a weather API server. How many MCP clients should the host application create?",
    "opts": [
      "One client that connects to all three servers through a single multiplexed transport connection",
      "Three clients — one for each server — because every MCP client maintains a 1:1 connection with exactly one server",
      "One client per active user session, with the client dynamically routing requests to the appropriate server based on the tool being called",
      "The number depends on the transport type — stdio servers can share one client, but HTTP servers each require their own dedicated client"
    ],
    "ans": 1,
    "expl": "The MCP spec mandates a 1:1 Client-to-Server relationship regardless of transport type — three servers means three clients, each with its own dedicated transport connection and initialization handshake. A is wrong because MCP has no multiplexing concept at the client layer; each client manages exactly one server connection, not a shared channel to multiple servers. C is wrong because clients are created per server at configuration time, not per user session, and routing is the Host's responsibility, not a client-level concern. D is wrong because the 1:1 rule applies equally to stdio and Streamable HTTP — the transport type does not change client cardinality."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "An MCP server exposes an `execute_sql_query` capability. The model decides when to call it, provides SQL parameters, and the server runs the query and returns results. Which MCP primitive does this represent?",
    "opts": [
      "A Resource — because the capability provides access to database data that the model reads at application-controlled times",
      "A Prompt — because the server is injecting the query results as templated context into the model's conversation",
      "A Tool — because it represents a model-controlled, executable function that the model invokes with parameters and receives dynamic, computed results",
      "A Notification — because the server pushes query results to the model whenever database changes occur"
    ],
    "ans": 2,
    "expl": "Tools are the MCP primitive for model-controlled, executable functions — the model decides when to invoke them, supplies parameters, and receives dynamic computed results, which matches exactly how `execute_sql_query` behaves. A is wrong because Resources are application-controlled and read-only; the application (not the model) decides which resource to expose, and the data is not computed on demand with model-supplied parameters. B is wrong because Prompts are server-defined, user-selectable templates that are chosen before the model runs, not dynamically invoked functions that the model calls mid-conversation. D is wrong because Notifications are one-way signals from server to client about state changes; they do not carry query results and are not a primitive the model invokes."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "Your application lets users browse a file tree. When a user clicks a file, you want the AI model to be able to read its contents. Which MCP primitive should you expose for this?",
    "opts": [
      "A Tool named `read_file` — because reading a file is an action that the model must actively execute by calling a function",
      "A Resource — because the file's contents are application-controlled, read-only data that the application decides to expose, and the model accesses them without choosing which specific file to read",
      "A Prompt template with a `{fileContent}` placeholder — so the file content is always injected as conversation context before the model responds",
      "A Capability declaration — because file reading is an implicit server capability that the client must negotiate during initialization"
    ],
    "ans": 1,
    "expl": "Resources represent application-controlled, read-only data — the user click (not the model) triggers the selection, the application decides which file to expose, and the model accesses its content as provided context, matching the Resource primitive exactly. A is wrong because a Tool would make the model responsible for deciding which file to read and when — that control belongs to the user and application here, not the model. C is wrong because a Prompt template is a server-defined template the user selects before the conversation; it is not the right primitive for exposing dynamic file content selected at runtime by a user action. D is wrong because Capability declarations are part of the initialization handshake between client and server and do not represent data or actions accessible during a session."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "A developer defines conversation starters like \"Summarize this meeting\" and \"Draft an email response\" that include dynamic information from the current context. Which MCP primitive best fits this use case?",
    "opts": [
      "Tools — because each conversation starter triggers a specific server-side function to generate a response",
      "Resources — because conversation starters are static text blocks served as read-only data from the server",
      "Prompts — because they are server-defined, user-selectable templates that include dynamic context and are explicitly chosen by the user before being sent to the model",
      "Sampling requests — because the server needs to generate completions from the model based on the conversation starter text"
    ],
    "ans": 2,
    "expl": "Prompts are the MCP primitive for server-defined, user-selectable templates that can include dynamic context injected at selection time — exactly what \"Summarize this meeting\" and \"Draft an email response\" are. A is wrong because Tools are model-invoked functions for executing actions; conversation starters are user-selected templates, not functions the model decides to call. B is wrong because Resources are application-controlled data blobs accessed as read-only context; they are not templates that structure how the user starts a conversation. D is wrong because Sampling requests are how MCP servers ask the host/model to generate a completion on the server's behalf — the opposite direction of what a conversation starter needs."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "What is the Host application's primary responsibility regarding MCP clients?",
    "opts": [
      "The Host directly encodes and decodes JSON-RPC messages for all server communication, bypassing the client layer entirely",
      "The Host manages the lifecycle of multiple clients, creates one client per configured server, and orchestrates which client receives which user intent based on the current conversation",
      "The Host serves as a reverse proxy, forwarding MCP messages from the AI model to remote servers and caching responses for subsequent requests",
      "The Host introspects each server's source code to generate appropriate tool definitions, eliminating the need for servers to self-describe"
    ],
    "ans": 1,
    "expl": "The Host owns the user experience and is responsible for reading server configurations, creating and destroying Clients (one per configured Server), and deciding which Client should handle a given user request — Clients handle the actual transport and protocol mechanics. A is wrong because JSON-RPC encoding is the Client's responsibility; the Host operates at a higher orchestration level and does not bypass the Client layer. C is wrong because the Host is not a reverse proxy or caching layer — it creates discrete Clients that each own their own direct connection to a single Server. D is wrong because Servers self-describe their tools via `tools/list` during the session; the Host never reads server source code."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "An MCP host application crashes while clients are mid-conversation with their respective servers. When the host process restarts, what happens to the client-server connections?",
    "opts": [
      "All connections automatically resume — MCP servers maintain persistent state independently of the host process lifecycle",
      "All previous client-server connections are terminated, and the host must create new clients and re-initialize each server connection from scratch",
      "Only Streamable HTTP connections survive the crash; stdio-based connections are permanently lost and cannot be recovered",
      "Each server caches its session state and restores the conversation context when the host reconnects, preserving tool call history"
    ],
    "ans": 1,
    "expl": "MCP Clients live inside the Host process — when the Host crashes, every Client and its associated transport connection is destroyed simultaneously, and the Host must re-create every Client, re-establish every transport, and complete the full initialization handshake for each Server from scratch on restart. A is wrong because MCP servers do not maintain independent persistent state tied to a disconnected client; session state is tied to the active transport connection, which is gone when the Host crashes. C is wrong because both stdio and Streamable HTTP connections are managed by Client objects inside the Host process — both are lost when the Host crashes; there is no transport-specific survival rule. D is wrong because MCP specifies no server-side session caching or reconnection protocol; servers do not restore conversation context for a new connection."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "A developer is building a local-first MCP server for static code analysis. The server runs as a subprocess and should communicate without any network stack. Which transport should they use?",
    "opts": [
      "Streamable HTTP on localhost — because it still avoids remote network configuration while providing the same API surface",
      "stdio — because it communicates over standard input/output streams of a subprocess, requires zero network configuration, and involves no ports or TLS",
      "WebSocket transport — because it enables persistent bidirectional communication between the host process and the server process",
      "Unix domain sockets — because they are the standard inter-process communication mechanism defined by the MCP specification"
    ],
    "ans": 1,
    "expl": "stdio transport communicates exclusively over the stdin/stdout streams of a locally spawned subprocess — it requires no ports, no TLS certificates, and no network stack at all, making it the perfect fit for a local-first subprocess server. A is wrong because even localhost HTTP still requires binding a TCP port and initializing a network stack, violating the \"without any network stack\" requirement. C is wrong because WebSockets require an HTTP upgrade handshake and a TCP port, which is a network stack dependency; additionally, WebSockets are not a standard MCP transport defined in the spec. D is wrong because Unix domain sockets are not a transport type defined by the MCP specification — only stdio and Streamable HTTP are standard MCP transports."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "A team wants to deploy their MCP server as a cloud service so remote users can access it. The server also needs to authenticate incoming connections. Which transport should they use?",
    "opts": [
      "stdio transport with SSH tunneling — because the SSH layer provides both remote access and authentication without changing the MCP transport",
      "Streamable HTTP transport — because it operates over standard HTTP(S), supports bearer token and other HTTP authentication mechanisms, and is designed for remote MCP server access",
      "Both stdio and Streamable HTTP simultaneously — stdio for local sessions and HTTP for remote sessions, with automatic transport failover",
      "gRPC transport — because MCP's protocol buffer layer enables authentication middleware that stdio and HTTP lack"
    ],
    "ans": 1,
    "expl": "Streamable HTTP is the MCP transport designed for remote deployment — it operates over standard HTTPS, supports bearer tokens and other HTTP authentication headers natively, and can be hosted as a standard cloud service behind a load balancer or API gateway. A is wrong because stdio is inherently a local subprocess transport that communicates via stdin/stdout; SSH tunneling is an external wrapper, not a change to the MCP transport, and the underlying stdio transport still cannot accept independent remote connections. C is wrong because an MCP server exposes one transport per connection endpoint, not simultaneous dual-transport with failover; that is not a concept in the MCP specification. D is wrong because gRPC is not a transport defined by the MCP specification — only stdio and Streamable HTTP are standard MCP transports."
  },
  {
    "source": "MCP & Tool Design",
    "prompt": "A developer deploys a local MCP server using stdio transport and tests it successfully. They then try to access that same server from a different machine on the same network and it fails. What is the reason?",
    "opts": [
      "stdio transport communicates through stdin/stdout of a local subprocess — it has no network interface, no listening port, and cannot accept connections from any remote machine",

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {

  return m + ':' + (sec < 10 ? '0' : '') + sec;

function shuffleOpts(q) {

  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
