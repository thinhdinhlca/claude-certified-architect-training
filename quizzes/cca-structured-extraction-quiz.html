<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA - Structured Data Extraction Quiz</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #10101a;
    --surface2: #17172200;
    --surface3: #1e1e2c;
    --border: #252535;
    --border2: #2e2e42;
    --text: #e4e4f0;
    --text2: #a8a8c0;
    --text3: #7878a0;
    --accent: #fbbf24;
    --accent2: #d97706;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --radius: 13px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 2rem;
  }
  code {
    font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', monospace;
    background: rgba(96,165,250,0.12);
    color: #93c5fd;
    padding: 0.1em 0.38em;
    border-radius: 5px;
    font-size: 0.855em;
    border: 1px solid rgba(96,165,250,0.2);
  }
  .container { width: 100%; max-width: 780px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 28px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
  .card p { color: var(--text2); margin-bottom: 1rem; line-height: 1.7; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.35s ease; border-radius: 2px; }

  .pass-tracker { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .pass-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.3s ease; }
  .pass-dot.earned { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .pass-dot.current { border-color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 8px rgba(96,165,250,0); } }

  .domain-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.6rem; }
  .domain-tag { font-size: 0.78rem; padding: 0.3rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text2); }

  .start-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.9rem; margin-bottom: 1.3rem; }
  .stat { text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; background: var(--surface2); }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.3rem; }

  .timer { font-size: 0.85rem; font-variant-numeric: tabular-nums; text-align: right; margin-bottom: 0.5rem; color: var(--text2); }
  .timer.warning { color: var(--amber); }
  .timer.danger { color: var(--red); }

  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .quiz-top .progress-wrap { flex: 1; margin: 0; }
  .timer-wrap { text-align: center; min-width: 90px; margin-left: 1rem; }

  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .q-num { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .q-source { font-size: 0.75rem; color: var(--text3); background: var(--surface2); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .q-prompt { font-size: 1.1rem; font-weight: 500; color: #fff; margin-bottom: 1.25rem; line-height: 1.65; }

  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 1rem 1.15rem; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.15s ease; font-size: 1rem;
  }
  .option:hover { border-color: rgba(96,165,250,0.5); background: var(--surface3); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.12); }
  .option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(251,113,133,0.1); }
  .option.revealed-correct { border-color: var(--green); opacity: 0.7; }
  .option.disabled { pointer-events: none; }
  .option.disabled.selected { opacity: 1; }
  .option .letter {
    width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center;
    background: var(--border); border-radius: 6px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
  }
  .option.selected .letter { background: var(--accent); color: #fff; }
  .option.correct .letter { background: var(--green); color: #000; }
  .option.wrong .letter { background: var(--red); color: #fff; }
  .option.revealed-correct .letter { background: var(--green); color: #000; }

  .explanation {
    margin-top: 1.25rem; padding: 1.25rem; background: var(--surface2); border-radius: var(--radius);
    border-left: 3px solid var(--border); font-size: 0.9rem; color: var(--text2); line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #fff; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
  .btn {
    padding: 0.65rem 1.5rem; border-radius: var(--radius); border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent2); }
  .btn-outline { background: transparent; color: var(--text3); border: 1px solid var(--border); font-size: 0.75rem; padding: 0.4rem 0.8rem; }

  .question-nav { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .qnav-dot {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text3); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  .qnav-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
  .qnav-dot.answered-correct { border-color: var(--green); color: var(--green); }
  .qnav-dot.answered-wrong { border-color: var(--red); color: var(--red); }
  .qnav-dot.answered-correct.active { border-color: var(--green); background: var(--green); color: #fff; }
  .qnav-dot.answered-wrong.active { border-color: var(--red); background: var(--red); color: #fff; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; }
  .result-detail { color: var(--text3); font-size: 0.9rem; margin-top: 0.5rem; }
  .result-detail span { color: #fff; font-weight: 600; }

  .pass-summary { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
  .pass-square {
    width: 56px; height: 56px; border-radius: var(--radius); border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700; transition: all 0.3s ease;
  }
  .pass-square.cleared { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }

  .review-list { margin-top: 1.5rem; text-align: left; max-height: 400px; overflow-y: auto; }
  .review-item {
    padding: 0.65rem 1rem; background: var(--surface2); border-radius: 6px;
    margin-bottom: 0.4rem; font-size: 0.825rem; display: flex; align-items: center; gap: 0.5rem;
  }
  .review-item .rf { font-size: 0.65rem; flex-shrink: 0; font-weight: 700; letter-spacing: 0.08em; border-radius: 99px; padding: 0.15rem 0.5rem; border: 1px solid var(--border); }
  .review-item .rf-ok { border-color: var(--green); color: var(--green); }
  .review-item .rf-bad { border-color: var(--red); color: var(--red); }

  .topic-breakdown { margin-top: 1.25rem; text-align: left; }
  .topic-breakdown h3 { font-size: 0.85rem; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.65rem; }
  .topic-item { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.82rem; background: var(--surface2); }
  .topic-item .topic-score { font-variant-numeric: tabular-nums; color: var(--text3); }
  .topic-item .topic-score strong { color: #fff; }

  .keyboard-hint { margin-top: 1rem; font-size: 0.75rem; color: var(--text3); text-align: center; }
  .keyboard-hint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; background: var(--surface2); color: var(--text2); }

  .celebration { display: inline-block; margin-bottom: 0.8rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.22rem 0.65rem; border-radius: 999px; border: 1px solid var(--green); color: var(--green); background: rgba(74,222,128,0.12); }

  .start-actions { text-align: center; }
  .start-actions .btn { min-width: 280px; font-size: 1.15rem; padding: 0.9rem 2rem; border-radius: 14px; }
  .pass-inline { display:flex; align-items:center; justify-content:center; gap:0.7rem; color:var(--text3); margin-bottom: 0.9rem; font-size: 0.95rem; }
  .pass-inline .pass-tracker { margin: 0; }

  @media (max-width: 600px) {
    .start-stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .start-actions .btn { min-width: 0; width: 100%; }
    .q-source { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:3rem;color:var(--text3)">Loading quiz...</div>
</div>
<script>
(function() {
'use strict';

var BANK = [
  {
    "source": "Structured Data Extraction",
    "prompt": "You are building a pipeline to extract structured data from job postings. The `employment_type` field should always be one of: `\"full_time\"`, `\"part_time\"`, `\"contract\"`, `\"internship\"`. Many postings use phrases like \"temp-to-hire,\" \"freelance,\" and \"casual.\" Your strict enum rejects 18% of valid postings at the validation gate. What is the best schema design fix?",
    "opts": [
      "Replace the enum with a free-text `employment_type` string and normalize values offline in a weekly batch job that clusters similar strings together.",
      "Add every known synonym as a distinct enum value, including \"temp-to-hire,\" \"freelance,\" \"casual,\" and all future variants you can anticipate.",
      "Extend the enum with an `\"other\"` value and add a companion `employment_type_raw` string field that captures the exact source phrase, preserving both structured classification and original language.",
      "Add a prompt instruction listing each synonym mapping: \"freelance maps to contract, temp-to-hire maps to contract\" for every variant observed in the dataset."
    ],
    "ans": 2,
    "expl": "The `\"other\"` + raw field pattern keeps controlled vocabulary for downstream analytics while preserving unrecognized source terms for prompt refinement and human review. A) loses real-time structured classification. B) synonym explosion creates enum maintenance debt and treats equivalent concepts as distinct categories. D) prompt synonym lists grow linearly with vocabulary, miss novel variants, and are less reliable than schema-level design."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are extracting financial data from quarterly earnings reports. The schema has `revenue`, `operating_income`, and `net_income` fields. During validation you discover that in 6% of documents `net_income` is greater than `operating_income`, violating standard accounting relationships. Both values are faithfully extracted from the source document. What should your validation layer do?",
    "opts": [
      "Auto-correct `net_income` to be the smaller of the two values, since this accounting relationship is a universal constraint that overrides whatever the document states.",
      "Fail the document and discard the extraction, since violating a fundamental accounting identity signals the model produced fabricated values.",
      "Add a `financial_anomaly` flag alongside both extracted values, preserving accurate extraction while signaling to downstream reviewers that the source document may contain a restatement or non-standard line item.",
      "Swap `net_income` and `operating_income` values and log a correction, since transposition is the most common cause of this relationship violation in extraction pipelines."
    ],
    "ans": 2,
    "expl": "When validly extracted values violate a business rule, the violation may exist in the source document itself — restatements, non-GAAP metrics, one-time items. Preserving both values and flagging the anomaly gives reviewers accurate data to investigate. A) overwrites faithful extraction with an assumption. B) discards accurate data without confirming a model error. D) swapping without evidence introduces errors where the document was correctly extracted."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are normalizing product catalog data extracted from 15 supplier spreadsheets, each using different column naming conventions. The target schema has a `unit_of_measure` enum: `\"each\"`, `\"kg\"`, `\"liter\"`, `\"meter\"`, `\"box\"`. Supplier A uses `\"pc\"`, Supplier B uses `\"piece\"`, and Supplier C uses `\"unit\"` — all meaning `\"each\"`. These appear as validation failures. What is the most maintainable fix?",
    "opts": [
      "Train the prompt with supplier-specific few-shot examples for each of the 15 suppliers, demonstrating the correct enum mapping for each supplier's terminology.",
      "Create a separate extraction schema for each supplier with supplier-specific enum values, then transform to the canonical schema in a downstream ETL step.",
      "Accept free-text in `unit_of_measure` at extraction time and run a nightly scheduled job that maps raw strings to canonical enum values using fuzzy string matching.",
      "Add a post-extraction normalization map (`\"pc\" → \"each\"`, `\"piece\" → \"each\"`, `\"unit\" → \"each\"`) applied before schema validation, and log unmapped values as new variants requiring human review."
    ],
    "ans": 3,
    "expl": "A normalization map applied before validation is explicit, auditable, and maintainable — new variants require only an entry in the map. It cleanly separates extraction (getting the text) from normalization (mapping to canonical form). A) multiplies prompt complexity linearly with suppliers. B) requires maintaining 15 schemas and 15 ETL transforms. C) delays normalization and fuzzy matching produces ambiguous results for novel variants."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are extracting action items from meeting transcripts. Each action item should have `assignee`, `task`, and `due_date` fields. In long transcripts covering 2–3 hours of discussion, the model consistently misses action items mentioned in the first 30 minutes of the recording, even though those items are clearly stated. What is the most likely cause and fix?",
    "opts": [
      "The model has a recency bias for final speaker turns; add a prompt instruction \"search the entire transcript from beginning to end before identifying action items\" to counteract this.",
      "Long transcripts cause the model to over-summarize early content; switch to streaming extraction where each speaker turn is processed as it arrives.",
      "The first 30 minutes of content sits far from the end of the context window; the model attends less reliably to content in the middle of long contexts, so chunk the transcript by time segment and extract action items per chunk, then merge.",
      "Action items in early transcript sections use future-tense constructions the schema's `task` field pattern does not capture; add future-tense variants to the extraction prompt."
    ],
    "ans": 2,
    "expl": "The \"lost in the middle\" effect is well-documented: models attend less reliably to content positioned in the middle of very long contexts. Chunking the transcript by time segment and extracting action items per chunk, then merging and deduplicating results, addresses this reliably. A) adds a prompt instruction that does not overcome attention distribution issues. B) streaming per speaker turn fragments context and breaks multi-speaker action assignments. D) invents a specific linguistic cause that does not explain the early-segment miss pattern."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are building a legal citation extractor for appellate court opinions. Each opinion cites 15–80 cases. Your schema has a `citations` array where each item has `case_name`, `reporter`, `volume`, `page`, and `year`. After extraction, 9% of citations have `volume` and `page` transposed: `{\"volume\": \"421\", \"page\": \"8 F.3d\"}` instead of `{\"volume\": \"8\", \"page\": \"421\"}`. What validation rule most directly catches this class of error?",
    "opts": [
      "Add a `pattern` constraint on `volume` enforcing `^\\d+$` (digits only) and a `pattern` on `reporter` matching known reporter abbreviation formats, so transposed values fail the format check and trigger targeted re-extraction.",
      "Add a `minLength: 3` constraint on `reporter` to reject short strings that might be misclassified volume numbers.",
      "Add a cross-field post-validation rule: if `volume` contains a space or letter, flag the record as a transposition candidate.",
      "Increase `budget_tokens` for extended thinking so the model deliberates more carefully about field order before populating citation arrays."
    ],
    "ans": 0,
    "expl": "Pattern constraints on `volume` (must be digits only) and `reporter` (must match abbreviation formats like `\"F.3d\"`, `\"U.S.\"`) enforce structural correctness at the schema level. A transposed value like `\"8 F.3d\"` in `volume` fails the `^\\d+$` pattern, triggering a schema validation failure and retry. C) is a reasonable complement but does not prevent the error from initially passing schema validation. B) `minLength` on reporter does not address numeric-string confusion. D) extended thinking reduces upfront errors but does not validate output after generation."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You need to extract all parties, their roles, and effective dates from commercial contracts. Some contracts name 2 parties; others name 12. Your current schema has `party_1` through `party_5` as fixed fields, which fails for contracts with more than 5 parties and wastes schema space for 2-party contracts. What schema redesign best handles variable party count?",
    "opts": [
      "Keep `party_1` through `party_10` fixed fields as a conservative upper bound, accepting that most fields will be null for simple contracts.",
      "Replace fixed fields with a single `parties_text` string containing a pipe-delimited serialized list of parties, parsed by downstream code after extraction.",
      "Add an overflow `additional_parties` string field for parties beyond `party_5`, containing concatenated party data in freeform format.",
      "Replace fixed party fields with a `parties` array where each item has `party_name`, `role`, and `effective_date`, with no upper bound on array length."
    ],
    "ans": 3,
    "expl": "An unbounded array with a typed per-item sub-schema handles 2-party and 12-party contracts with equal fidelity. Each party gets the same structured representation regardless of cardinality. A) wastes schema space and silently truncates contracts with more than 10 parties. B) trades structured extraction for string parsing, losing type guarantees and schema enforcement. C) creates an inconsistent structure where parties 1–5 are typed objects and beyond-5 parties are unstructured strings with no schema enforcement."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are extracting structured metadata from scientific papers: `title`, `authors`, `journal`, `publication_year`, `doi`, and `keywords`. For preprints posted on arXiv, `journal` and `doi` are frequently absent. Your retry budget is being exhausted on documents where these fields will never be present. What is the correct first-pass fix?",
    "opts": [
      "Make `journal` and `doi` optional (nullable) in the schema so the model returns null for genuinely absent fields without triggering a required-field validation failure.",
      "Add a document classifier that identifies preprints before extraction and routes them to a reduced schema that omits `journal` and `doi` entirely.",
      "Add a prompt instruction: \"For preprints, set journal to 'arXiv' and doi to the arXiv identifier if available, otherwise return an empty string.\"",
      "Implement a cascading validation rule: only validate `journal` and `doi` if `publication_year` indicates a peer-reviewed publication era (post-2000)."
    ],
    "ans": 0,
    "expl": "Making fields nullable is the correct schema design when source documents legitimately lack those fields. Required-field failures for absent data are a schema design error — retries cannot resolve them because the information does not exist. B) adds upstream complexity and requires maintaining two schemas. C) fabricates `journal` values for preprints and encodes extraction logic as fragile prose. D) `publication_year` does not reliably predict whether a paper was published in a journal."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are processing email threads to extract structured summaries: `topic`, `decision_reached`, `open_questions`, and `next_steps`. A single thread contains 47 messages spanning 3 weeks. The extraction consistently misses decisions made in messages 10–25, confirmed to be within the context window. What multi-pass strategy addresses this?",
    "opts": [
      "Run a first pass extracting a one-sentence summary of each message, then a second pass extracting `decision_reached` and `open_questions` from the summaries, where each decision is explicitly stated in normalized form.",
      "Process the thread in reverse chronological order so the most recent messages appear at the start of context and anchor extraction through backward references to earlier decisions.",
      "Run extraction three times with different random seeds and take the union of all extracted decisions, deduplicating by string similarity.",
      "Truncate the thread to the first 15 and last 15 messages, which statistically capture most decisions, and note the truncation in the output metadata."
    ],
    "ans": 0,
    "expl": "A two-pass approach where the first pass produces per-message summaries creates a dense, normalized representation of the entire thread. The second pass extracts structured fields from these summaries, where decisions are explicitly stated rather than buried in conversational noise across 47 messages. B) reverse ordering distorts temporal context and breaks causal references to earlier decisions. C) multiple random-seed runs introduce non-determinism without addressing the attention issue. D) truncation discards exactly the middle messages where decisions are known to be missed."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "You are extracting named entities from news articles: people, organizations, and locations. Each entity should have `name`, `type`, and a `confidence` score (0–1 float). You want to route low-confidence entities to a human review queue without modifying the entity value itself. What schema design best supports this?",
    "opts": [
      "Add a `confidence` property to each entity object alongside `name` and `type`, so each entity carries its own score as a self-contained unit suitable for threshold-based routing.",
      "Add a parallel `entity_confidence` array of floats in the same order as `named_entities`, relying on index alignment to pair entities with their scores.",
      "Add a root-level `extraction_confidence` float representing the average confidence across all entities for the article.",
      "Add an inline annotation syntax to each entity name string: `\"Apple Inc. [conf:0.92]\"` and parse the score from the string during post-processing."
    ],
    "ans": 0,
    "expl": "Embedding `confidence` as a property of each entity object is self-contained and robust: each entity carries its score with no positional alignment dependency. Downstream code can check `entity.confidence < 0.7` and queue that specific entity for review. B) relies on index alignment between parallel arrays — fragile if either array is reordered or truncated during merging. C) averaging destroys per-entity signal and makes targeted entity-level routing impossible. D) encodes structured data in a string requiring fragile parsing and is rejected by standard JSON validators."
  },
  {
    "source": "Structured Data Extraction",
    "prompt": "Your pipeline extracts contract clause data. The `penalty_amount` field is sometimes expressed as a fixed dollar amount (\"$50,000\") and sometimes as a percentage formula (\"2% of monthly contract value\"). Downstream code expects a `number` type. The model returns null for formula-based penalties, causing downstream systems to treat them as \"no penalty.\" What schema design preserves both types of penalties?",
    "opts": [
      "Change `penalty_amount` to a string type and parse numeric values downstream, using `\"null\"` as the string sentinel for absent penalties.",
      "Add a pre-extraction step that evaluates formula-based penalties against an average contract value estimate, converting them to a numeric approximation before populating the field.",
      "Split into `penalty_amount_fixed` (nullable number) and `penalty_amount_formula` (nullable string), with a `penalty_type` enum (`\"fixed\"`, `\"formula\"`, `\"none\"`) indicating which field applies.",
      "Keep `penalty_amount` as a number and add a `has_formula_penalty` boolean flag so downstream code knows when null means \"formula exists\" versus \"no penalty.\""
    ],
    "ans": 2,
    "expl": "Separating fixed amounts from formula strings into typed fields with a discriminator enum preserves both the structured numeric type and the original formula text while making the distinction explicit. A) degrades type safety across the entire field. B) introduces approximations that may be far from actual values and requires external contract value data. D) a boolean flag preserves intent but loses the formula text itself, making it impossible to evaluate the actual penalty."
  },

}

function savePassCount(n) {
  try { window.localStorage.setItem(PASS_STORAGE_KEY, String(n)); } catch (err) {}
}

function loadWrongs() {
  try {
    var raw = window.localStorage.getItem(WRONGS_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (err) {}
  return [];
}

function saveWrongs(arr) {
  try { window.localStorage.setItem(WRONGS_STORAGE_KEY, JSON.stringify(arr)); } catch (err) {}
}

function clearWrongs() {
  try { window.localStorage.removeItem(WRONGS_STORAGE_KEY); } catch (err) {}
}

var S = {
  screen: 'start',
  pool: [],
  ix: 0,
  answers: {},
  revealed: false,
  timeLeft: TIMER_MINUTES * 60,
  timerId: null,
  score: null,
  review: [],
  passCount: loadPassCount(),
  warnedTwoMin: false
};

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function shuffleOpts(q) {
  var indices = [0,1,2,3];
  var shuffled = shuffle(indices);
  // shuffled[newIdx] = origIdx  →  origToNew[origIdx] = newIdx
  var origToNew = {};
  for (var ni = 0; ni < shuffled.length; ni++) origToNew[shuffled[ni]] = ni;
  return {
    opts: shuffled.map(function(i) { return q.opts[i]; }),
    correctIdx: shuffled.indexOf(q.ans),
    origToNew: origToNew
  };
}

function buildDeck() {
  var picked = shuffle(BANK).slice(0, QUESTIONS_PER_ATTEMPT);
  return picked.map(function(q) {
    var so = shuffleOpts(q);
    return {
      source: q.source,
      prompt: q.prompt,
      opts: so.opts,
      correctIdx: so.correctIdx,
      origToNew: so.origToNew,
      expl: q.expl
    };
  });
}

function startQuiz() {
  S.screen = 'quiz';
  S.pool = buildDeck();
  S.ix = 0;
  S.answers = {};
  S.revealed = false;
  S.score = null;
  S.review = [];
  S.timeLeft = TIMER_MINUTES * 60;
  S.warnedTwoMin = false;
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function() {
    S.timeLeft--;
    if (S.timeLeft === 120 && !S.warnedTwoMin) {
      S.warnedTwoMin = true;
      window.alert('2 minutes remaining. Any unanswered questions will be marked incorrect at 0:00.');
    }
    if (S.timeLeft <= 0) finishQuiz();
    render();
  }, 1000);
  render();
}

function select(optIdx) {
  if (S.revealed) return;
  S.answers[S.ix] = optIdx;
  S.revealed = true;
  render();
}

function goNext() {
  if (S.ix < S.pool.length - 1) {
    S.ix++;
    S.revealed = S.answers[S.ix] !== undefined;
  }
  else { finishQuiz(); }
  render();
}

function goPrev() {
  if (S.ix > 0) {
    S.ix--;
    S.revealed = S.answers[S.ix] !== undefined;
    render();
  }
}

function goTo(idx) {
  S.ix = idx;
  S.revealed = S.answers[idx] !== undefined;
  render();
}

function finishQuiz() {
  if (S.timerId) clearInterval(S.timerId);
  var correct = 0;
  S.review = [];
  var wrongs = loadWrongs();
  S.pool.forEach(function(q, i) {
    var sel = S.answers[i];
    var isCorrect = sel === q.correctIdx;
    if (isCorrect) correct++;
    S.review.push({ q: q, selected: sel, isCorrect: isCorrect });
    if (!isCorrect && sel !== undefined) {
      wrongs.push({
        source: q.source,
        prompt: q.prompt,
        selected: sel,
        correct: q.correctIdx,
        timestamp: Date.now()
      });
    }
  });
  saveWrongs(wrongs);
  S.score = Math.round((correct / S.pool.length) * 1000);
  if (S.score >= PASS_SCORE) {
    S.passCount++;
    savePassCount(S.passCount);
  }
  S.screen = 'results';
  render();
}

function restart() {
  if (S.timerId) clearInterval(S.timerId);
  S = {
    screen: 'start', pool: [], ix: 0, answers: {}, revealed: false,
    timeLeft: TIMER_MINUTES * 60, timerId: null, score: null, review: [], passCount: 0, warnedTwoMin: false
  };
  savePassCount(0);
  render();
}

function render() {
  var app = document.getElementById('app');
  if (S.screen === 'start') app.innerHTML = renderStart();
  else if (S.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (S.screen === 'results') app.innerHTML = renderResults();
}

function letters() { return ['A','B','C','D']; }

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Inline markdown: escape HTML, render backtick code spans, bold, and newlines
function md(s) {
  return escapeHtml(String(s))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/[*][*]([^*]+)[*][*]/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function relabelSegment(seg, origToNew) {
  return seg.replace(/^([A-D])\s+(is\s+(?:wrong|incorrect))/i, function(_, letter, rest) {
    var origIdx = letter.toUpperCase().charCodeAt(0) - 65;
    var newIdx = origToNew[origIdx];
    return letters()[newIdx] + ' ' + rest;
  });
}

function buildVerboseExplanation(q, answered) {
  var correctIdx = q.correctIdx;
  var correctLetter = letters()[correctIdx];
  var selectedLetter = answered >= 0 ? letters()[answered] : '-';
  var isCorrect = answered === correctIdx;

  var raw = q.expl || 'No explanation provided.';
  var segments = raw
    .replace(/\.\s+([A-D])\s+is\s+(wrong|incorrect)/gi, '.\n$1 is $2')
    .replace(/\.\s+Option\s+([A-D])/gi, '.\nOption $1')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(Boolean);

  if (q.origToNew) {
    segments = segments.map(function(seg, i) {
      return i === 0 ? seg : relabelSegment(seg, q.origToNew);
    });
    // Sort wrong-option segments A→B→C→D by their remapped leading letter
    var first = segments[0];
    var rest = segments.slice(1).sort(function(a, b) {
      var la = a.match(/^([A-D])\s+is/i); var lb = b.match(/^([A-D])\s+is/i);
      if (!la || !lb) return 0;
      return la[1].toUpperCase().charCodeAt(0) - lb[1].toUpperCase().charCodeAt(0);
    });
    segments = [first].concat(rest);
  }

  var segHTML = '';
  for (var si = 0; si < segments.length; si++) {
    if (si === 0) {
      segHTML += '<div style="margin-top:0.6rem">' + md(segments[si]) + '</div>';
    } else {
      segHTML += '<div style="margin-top:0.55rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:0.5rem">' + md(segments[si]) + '</div>';
    }
  }

  return (
    '<div class="explanation show" style="border-left-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' +
      '<strong>' + (isCorrect ? 'Correct' : 'Incorrect') + ' — Correct answer: ' + correctLetter + '</strong><br>' +
      (isCorrect
        ? '<span style="color:var(--green);font-weight:600">Your answer: ' + selectedLetter + '.</span>'
        : '<span style="color:var(--red);font-weight:600">Your answer: ' + selectedLetter + '.</span>') +
      segHTML +
    '</div>'
  );
}

function renderStart() {
  return '<div class="card start-main" style="text-align:center">' +
    '<h2>CCA — ' + escapeHtml(MODULE_NAME) + '</h2>' +
    '<p>' + BANK.length + '-question bank. Each attempt randomly selects <strong>' + QUESTIONS_PER_ATTEMPT + '</strong> questions with <strong>shuffled answer orders</strong>.<br>Pass = <strong>' + PASS_SCORE + '/1000</strong> (perfect). You must pass <strong>2 times</strong>.</p>' +
    '<div class="pass-tracker" id="passTracker">' +
      [1,2].map(function(n) {
        return '<div class="pass-dot' + (n <= S.passCount ? ' earned' : '') + (n === S.passCount + 1 ? ' current' : '') + '"></div>';
      }).join('') +
    '</div>' +
    (S.passCount >= 2 ? '<p style="color:var(--green);font-weight:700;margin-bottom:1rem">Module pass requirement complete: 2 perfect passes achieved.</p>' : '') +
    '<div class="domain-tags">' + TAGS.map(function(t) { return '<span class="domain-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
    '<div class="start-stats">' +
      '<div class="stat"><div class="stat-value">' + BANK.length + '</div><div class="stat-label">Question Bank</div></div>' +
      '<div class="stat"><div class="stat-value">' + QUESTIONS_PER_ATTEMPT + '</div><div class="stat-label">Per Test</div></div>' +
      '<div class="stat"><div class="stat-value">' + TIMER_MINUTES + '</div><div class="stat-label">Minutes</div></div>' +
      '<div class="stat"><div class="stat-value">' + PASS_SCORE + '/1000</div><div class="stat-label">Pass Score</div></div>' +
    '</div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-bottom:1.5rem">Pass policy: ' + QUESTIONS_PER_ATTEMPT + ' questions per attempt, perfect score required, two successful runs needed.</p>' +
    '<div class="start-actions"><button class="btn btn-primary" id="btnStart">Start Quiz (' + QUESTIONS_PER_ATTEMPT + ' Questions)</button></div>' +
    '<p style="font-size:0.8rem;color:var(--text3);margin-top:0.95rem">Progress is saved in this browser until you reset it.</p>' +
  '</div>';
}

function renderQuiz() {
  var q = S.pool[S.ix];
  var answered = S.answers[S.ix] !== undefined ? S.answers[S.ix] : -1;
  var progress = ((S.ix + (answered >= 0 ? 1 : 0)) / S.pool.length) * 100;
  var tc = S.timeLeft < 120 ? 'danger' : S.timeLeft < 300 ? 'warning' : '';

  var optHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var cls = 'option';
    if (answered === i) cls += ' selected';
    if (S.revealed) {
      cls += ' disabled';
      if (i === q.correctIdx) cls += answered === i ? ' correct' : ' revealed-correct';
      else if (answered === i) cls += ' wrong';
    }
    optHTML += '<div class="' + cls + '" data-opt="' + i + '"><span class="letter">' + letters()[i] + '</span><span>' + md(q.opts[i]) + '</span></div>';
  }

  var expHTML = '';
  if (S.revealed) {
    expHTML = buildVerboseExplanation(q, answered);
  }

  return (
    '<div class="quiz-top">' +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
      '<div class="timer-wrap"><div class="timer ' + tc + '">' + fmtTime(S.timeLeft) + '</div></div>' +
    '</div>' +
    '<div class="card quiz-card">' +
      '<div class="q-header"><span class="q-num">Q ' + (S.ix + 1) + ' / ' + S.pool.length + '</span><span class="q-source">' + escapeHtml(q.source) + '</span></div>' +
      '<div class="q-prompt">' + md(q.prompt) + '</div>' +
      '<div class="options" id="optGroup">' + optHTML + '</div>' +
      expHTML +
      '<div class="actions">' +
        '<button class="btn btn-secondary" id="btnPrev"' + (S.ix === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<span>' + (S.revealed ? '<button class="btn btn-primary" id="btnNext">' + (S.ix === S.pool.length - 1 ? 'See Results' : 'Next') + '</button>' : '<span style="color:var(--text3);font-size:0.92rem">Select an answer to reveal feedback</span>') + '</span>' +
      '</div>' +
      '<div class="keyboard-hint"><kbd>1-4</kbd> answer <kbd>Enter</kbd> next <kbd>Left/Right</kbd> navigate</div>' +
    '</div>' +
    '<div class="question-nav" id="qNav">' +
      S.pool.map(function(_, i) {
        var cls2 = 'qnav-dot';
        if (i === S.ix) cls2 += ' active';
        if (S.answers[i] !== undefined) cls2 += S.answers[i] === S.pool[i].correctIdx ? ' answered-correct' : ' answered-wrong';
        return '<div class="' + cls2 + '" data-idx="' + i + '">' + (i + 1) + '</div>';
      }).join('') +
    '</div>'
  );
}

function renderResults() {
  var s = S.score;
  var passed = s >= PASS_SCORE;
  var correctN = 0;
  for (var i = 0; i < S.review.length; i++) { if (S.review[i].isCorrect) correctN++; }

  var reviewHTML = '';
  for (var i2 = 0; i2 < S.review.length; i2++) {
    var r = S.review[i2];
    reviewHTML += '<div class="review-item"' + (r.isCorrect ? ' style="border-left:3px solid var(--green);background:rgba(74,222,128,0.05);"' : ' style="border-left:3px solid var(--red);background:rgba(251,113,133,0.06);"') + '><span class="rf ' + (r.isCorrect ? 'rf-ok">OK' : 'rf-bad">MISS') + '</span><span><strong>Q' + (i2 + 1) + ':</strong> ' + (r.isCorrect ? 'Correct' : 'Picked ' + (r.selected >= 0 ? letters()[r.selected] : '-') + ', answer was ' + letters()[r.q.correctIdx]) + ' — ' + escapeHtml(r.q.source) + '</span></div>';
  }

  var passHTML = '';
  for (var n = 1; n <= 2; n++) {
    passHTML += '<div class="pass-square' + (n <= S.passCount ? ' cleared' : '') + '">' + (n <= S.passCount ? 'OK' : n) + '</div>';
  }

  var bySource = {};
  for (var j = 0; j < S.review.length; j++) {
    var src = S.review[j].q.source;
    if (!bySource[src]) bySource[src] = { total: 0, correct: 0 };
    bySource[src].total++;
    if (S.review[j].isCorrect) bySource[src].correct++;
  }
  var sourceRows = Object.keys(bySource).sort(function(a, b) {
    var aRate = bySource[a].correct / bySource[a].total;
    var bRate = bySource[b].correct / bySource[b].total;
    return aRate - bRate;
  }).map(function(src2) {
    var item = bySource[src2];
    return '<div class="topic-item"><span>' + escapeHtml(src2) + '</span><span class="topic-score"><strong>' + item.correct + '</strong> / ' + item.total + '</span></div>';
  }).join('');

  var weakHTML = '';
  var allWrongs = loadWrongs();
  if (allWrongs.length > 0) {
    var wrongsBySource = {};
    allWrongs.forEach(function(w) {
      if (!wrongsBySource[w.source]) wrongsBySource[w.source] = [];
      wrongsBySource[w.source].push(w);
    });
    var sortedSources = Object.keys(wrongsBySource).sort(function(a, b) {
      return wrongsBySource[b].length - wrongsBySource[a].length;
    });
    weakHTML = '<div class="topic-breakdown"><h3>Weak Areas (' + allWrongs.length + ' total misses)</h3>';
    sortedSources.forEach(function(src3) {
      var items = wrongsBySource[src3];
      weakHTML += '<div style="margin-bottom:0.8rem"><div class="topic-item"><span>' + escapeHtml(src3) + '</span><span class="topic-score"><strong>' + items.length + '</strong> miss' + (items.length > 1 ? 'es' : '') + '</span></div>';
      var seen = {};
      items.forEach(function(w) {
        var key = w.prompt.substring(0, 60);
        if (!seen[key]) seen[key] = 0;
        seen[key]++;
      });
      Object.keys(seen).forEach(function(k) {
        weakHTML += '<div style="font-size:0.75rem;color:var(--text3);padding:0.2rem 0.8rem;margin-left:0.5rem;border-left:2px solid var(--border)">Missed ' + seen[k] + 'x: ' + escapeHtml(k) + '…</div>';
      });
      weakHTML += '</div>';
    });
    weakHTML += '</div>';
  }

  return (
    '<div class="result-card">' +
      (passed && S.passCount >= 2
        ? '<div class="celebration">Playbook Complete</div><p style="color:var(--green);font-size:1.25rem;font-weight:700">All 2 perfect passes complete.</p>'
        : passed
          ? '<div class="celebration">Perfect Pass</div><p style="color:var(--green);font-size:1.1rem;font-weight:700">Perfect this run. ' + (2 - S.passCount) + ' more perfect run' + (2 - S.passCount > 1 ? 's' : '') + ' required.</p>'
          : '<p style="color:var(--red);font-size:1rem;font-weight:700;margin-bottom:0.6rem">Below threshold. Retake immediately after reviewing misses.</p>') +
      '<div class="result-label">Your Score</div>' +
      '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + s + '<span style="font-size:1.5rem">/1000</span></div>' +
      '<div class="result-detail"><span>' + correctN + '</span> of <span>' + S.pool.length + '</span> correct <span>' + (passed ? 'PASS' : 'RETEST') + '</span></div>' +
      '<div class="pass-summary">' + passHTML + '</div>' +
      '<div class="topic-breakdown"><h3>Topic Breakdown</h3>' + sourceRows + '</div>' +
      weakHTML +
      '<div class="review-list">' + reviewHTML + '</div>' +
      '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="btnRetry">Retake (New Shuffled Set)</button>' +
        '<button class="btn btn-secondary" id="btnReview">Review Answers</button>' +
        '<button class="btn btn-outline" id="btnReset">Reset Progress</button>' +
        (allWrongs.length > 0 ? '<button class="btn btn-outline" id="btnClearWrongs" style="border-color:var(--amber);color:var(--amber)">Clear Weak Areas</button>' : '') +
      '</div>' +
    '</div>'
  );
}

document.getElementById('app').addEventListener('click', function(e) {
  var t = e.target;
  if (t.id === 'btnStart') startQuiz();
  if (t.closest) {
    var opt = t.closest('.option');
    if (opt && !S.revealed) {
      select(parseInt(opt.getAttribute('data-opt'), 10));
    }
  }
  if (t.id === 'btnNext') goNext();
  if (t.id === 'btnPrev') goPrev();
  if (t.closest) {
    var dot = t.closest('.qnav-dot');
    if (dot) goTo(parseInt(dot.getAttribute('data-idx'), 10));
  }
  if (t.id === 'btnRetry') startQuiz();
  if (t.id === 'btnReview') {
    S.screen = 'quiz'; S.ix = 0; S.revealed = true;
    for (var k = 0; k < S.pool.length; k++) {
      if (S.answers[k] === undefined) S.answers[k] = S.review[k].selected;
    }
    render();
  }
  if (t.id === 'btnReset') restart();
  if (t.id === 'btnClearWrongs') {
    clearWrongs();
    render();
  }
});

document.addEventListener('keydown', function(e) {
  if (S.screen !== 'quiz') return;
  if (e.key.length === 1 && ((e.key >= '1' && e.key <= '4') || (e.key >= 'a' && e.key <= 'd') || (e.key >= 'A' && e.key <= 'D'))) {
    var idx = -1;
    if (e.key >= '1' && e.key <= '4') idx = parseInt(e.key, 10) - 1;
    else idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx <= 3 && !S.revealed) {
      select(idx);
      e.preventDefault();
    }
  }
  if (e.key === 'Enter') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft') {
    goPrev();
    e.preventDefault();
  }
  if (e.key === 'ArrowRight') {
    if (S.revealed) goNext();
    e.preventDefault();
  }
});

render();
})();
</script>
</body>
</html>
