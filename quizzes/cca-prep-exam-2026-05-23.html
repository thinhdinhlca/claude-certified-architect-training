    .ex { margin-top:12px; border-left:3px solid #355da8; padding:8px 10px; color:#d8e3ff; background:#101a31; border-radius:8px; font-size:14px; line-height:1.45; }
    .small { color:var(--muted); font-size:12px; }

  <div class="wrap" id="app"></div>
  <script>
  const BANK = [{"id": "module-developer-productivity:29", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer implements an agentic loop with `max_iterations = 5` as the primary stopping condition. The agent frequently hits this limit mid-task, producing incomplete responses. The developer's fix is to increase the limit to 20. What is the better approach?", "opts": ["Use `stop_reason == \"end_turn\"` as the primary termination condition, with the iteration cap as a safety fallback only.", "Set `max_iterations = 50` to ensure the agent always has enough room to complete.", "Remove the iteration cap entirely and let the agent run until it finishes naturally.", "Add a timer-based cutoff (e.g., 60 seconds) instead of an iteration count."], "answerIdx": 0, "explanation": "**A)** **A)** The primary loop control should be the model's own `stop_reason`. When the model returns `\"end_turn\"`, it has decided it is done. An iteration cap should exist as a safety fallback to prevent runaway loops, but should not be the primary mechanism for determining when the agent is finished. Removing caps entirely (C) is dangerous. Increasing them (B) just moves the problem. Timer-based cutoffs (D) do not align with task completion. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-ci-cd:7", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your CI pipeline runs Claude Code to generate tests. The generated tests frequently duplicate scenarios already covered by the existing test suite. How should you fix this?", "opts": ["Add a deduplication step that removes duplicate tests after generation.", "Provide existing test files in context so test generation avoids suggesting duplicate scenarios already covered.", "Limit the number of generated tests to reduce the chance of duplication.", "Run generated tests against the existing suite and delete any that test the same thing."], "answerIdx": 1, "explanation": "**B)** **B)** Providing existing test files in the context allows Claude to see what is already covered and generate only new, non-duplicative test scenarios. This is the preventive approach -- avoid generating duplicates in the first place rather than filtering them after (A, D). Limiting count (C) does not ensure the generated tests are unique. (source: practice-tests/test-06-plan-mode-cicd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-multi-agent-research:9", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Two credible sources report different market growth figures: 15% and 22%. How should the synthesis handle this?", "opts": ["Average to 18.5%.", "Use the more recent source.", "Preserve both values with source attribution and annotate the conflict.", "Report the lower value to be conservative."], "answerIdx": 2, "explanation": "**C)** **C)** Preserve both values, annotate the conflict, and let readers evaluate the sources. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:15", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your extraction pipeline reports 97% aggregate accuracy across all document types. After deploying, users report frequent errors on a specific document type (handwritten receipts). What went wrong?", "opts": ["The 97% accuracy is wrong -- the evaluation was flawed.", "Aggregate accuracy metrics mask poor performance on specific document types. You should validate accuracy by document type and field segment before automating.", "Handwritten receipts are impossible to process.", "The model was not trained on handwritten text."], "answerIdx": 1, "explanation": "**B)** **B)** Aggregate accuracy metrics (97% overall) can mask significant performance gaps on specific document types or fields. If handwritten receipts are 5% of the volume but have 60% error rate, the aggregate still looks good. Accuracy must be validated by document type and by field before automating, ensuring consistent performance across all segments. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:30", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You want to ensure your extraction pipeline always calls `extract_metadata` before any enrichment tools. Which `tool_choice` configuration achieves this?", "opts": ["`tool_choice: \"auto\"` with system prompt instructions to call metadata extraction first.", "`tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}` for the first turn, then process subsequent steps in follow-up turns.", "`tool_choice: \"any\"` which guarantees the model calls some tool.", "Define `extract_metadata` first in the tools array, since the model prefers tools listed first."], "answerIdx": 1, "explanation": "**B)** **B)** Forced tool selection (`{\"type\": \"tool\", \"name\": \"...\"}`) ensures a specific tool is called. Use it for the first turn to guarantee metadata extraction, then switch to `\"auto\"` or `\"any\"` for subsequent turns. Option A is probabilistic. Option C guarantees a tool call but not which tool. Option D relies on an unreliable assumption about tool ordering preference. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:12", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your agent has two tools: `analyze_content` (\"Analyzes content for insights\") and `analyze_document` (\"Analyzes documents for insights\"). In production, the agent frequently calls the wrong one. What is the most effective first step?", "opts": ["Add a routing classifier that examines user input and pre-selects the correct tool.", "Rename the tools and update descriptions to clearly differentiate each tool's purpose, expected inputs, outputs, and when to use it versus the alternative (e.g., rename to `extract_web_results` with a web-specific description).", "Consolidate them into a single `analyze` tool.", "Add few-shot examples showing correct tool selection for 20 different scenarios."], "answerIdx": 1, "explanation": "**B)** **B)** Tool descriptions are the primary mechanism LLMs use for tool selection. When tools have overlapping names and near-identical descriptions, the model cannot reliably distinguish them. The fix is to rename tools to reflect their specific purpose and update descriptions with clear differentiation: what inputs each handles, what outputs it produces, and when to use one versus the other. This is the highest-leverage, lowest-effort fix. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:5", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "You are aggregating research findings from 5 subagents into a single prompt for the synthesis agent. The findings from the 3rd and 4th agents (middle of the input) are consistently underrepresented in the final synthesis. What is the cause and fix?", "opts": ["The 3rd and 4th agents produced lower quality findings.", "The \"lost in the middle\" effect: models reliably process information at the beginning and end but may omit findings from middle sections. Place key findings summaries at the beginning and use explicit section headers.", "The synthesis agent's context window is too small.", "The 3rd and 4th agents are taking too long, causing timeout issues."], "answerIdx": 1, "explanation": "**B)** **B)** The \"lost in the middle\" effect is a known LLM behavior where information at the beginning and end of long inputs receives more attention than middle sections. The mitigation is to place key findings summaries at the beginning of the aggregated input and organize detailed results with explicit section headers to help the model navigate the content. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:16", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your CI pipeline needs to run Claude Code for automated code review on every PR. The current command `claude \"Review this PR\"` hangs indefinitely. What is the fix?", "opts": ["Set `CLAUDE_HEADLESS=true` environment variable.", "Add `< /dev/null` to redirect stdin.", "Use the `-p` flag: `claude -p \"Review this PR\"`.", "Add `--batch` flag: `claude --batch \"Review this PR\"`."], "answerIdx": 2, "explanation": "**C)** **C)** The `-p` (or `--print`) flag runs Claude Code in non-interactive mode: it processes the prompt, outputs the result to stdout, and exits without waiting for user input. This is the documented approach for CI/CD pipelines. Options A and D reference non-existent features. Option B is a Unix workaround that does not properly address Claude Code's command syntax. (source: practice-tests/test-06-plan-mode-cicd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:1", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your tool returns multiple customer records for the name \"John Smith.\" The agent selects the most recent account using a heuristic. This occasionally leads to misidentified accounts. What should the agent do instead?", "opts": ["Select the account with the most orders as the most likely match.", "Ask the customer for additional identifiers (email, phone number, or order number) to disambiguate rather than selecting based on heuristics.", "Present all matching accounts to the customer and ask them to confirm.", "Use the phone number from caller ID to automatically select the right account."], "answerIdx": 1, "explanation": "**B)** **B)** When tool results return multiple matches, the agent should request additional identifiers from the customer for disambiguation rather than applying heuristics that may select the wrong record. This is more reliable than presenting all accounts (C), which may expose other customers' information, and safer than any automated selection heuristic (A, D). (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:19", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer needs to find all callers of `processPayment()` across the codebase. Which built-in tool should they start with?", "opts": ["Glob to find all JavaScript files, then Read each one.", "Grep to search for `processPayment` in file contents across the codebase.", "Read to load every file and search manually.", "Bash to run a custom search script."], "answerIdx": 1, "explanation": "**B)** **B)** Grep is the built-in tool for content search -- searching file contents for patterns like function names. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:20", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A team configures their coordinator agent but forgets to include \"Task\" in the `allowedTools` list. What happens when the coordinator tries to spawn a subagent?", "opts": ["The coordinator automatically gains Task tool access when it detects the need for subagents.", "The coordinator cannot spawn subagents because Task is not in its allowed tools.", "The coordinator spawns subagents but they run with restricted permissions.", "The system falls back to running the subagent's work inline within the coordinator's context."], "answerIdx": 1, "explanation": "**B)** **B)** `allowedTools` must explicitly include \"Task\" for a coordinator to invoke subagents. Without it, the coordinator simply cannot call the Task tool and will be unable to delegate work. There is no automatic fallback or permission escalation. (source: practice-tests/test-02-multi-agent.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:1", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Your tool returns multiple customer records for the name \"John Smith.\" The agent selects the most recent account using a heuristic. This occasionally leads to misidentified accounts. What should the agent do instead?", "opts": ["Select the account with the most orders as the most likely match.", "Ask the customer for additional identifiers (email, phone number, or order number) to disambiguate rather than selecting based on heuristics.", "Present all matching accounts to the customer and ask them to confirm.", "Use the phone number from caller ID to automatically select the right account."], "answerIdx": 1, "explanation": "**B)** **B)** When tool results return multiple matches, the agent should request additional identifiers from the customer for disambiguation rather than applying heuristics that may select the wrong record. This is more reliable than presenting all accounts (C), which may expose other customers' information, and safer than any automated selection heuristic (A, D). (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:26", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "You submit 100 documents as a batch. 95 succeed and 5 fail: 3 due to oversized context and 2 due to transient server errors. How should you handle the failures?", "opts": ["Resubmit the entire batch of 100 documents.", "Resubmit only the 5 failed documents (identified by `custom_id`), chunking the oversized ones and retrying the transient failures without modification.", "Discard the 5 failures and report results for the 95 successes only.", "Wait 24 hours and resubmit the 5 failures without changes."], "answerIdx": 1, "explanation": "**B)** **B)** Use `custom_id` to identify failed documents and resubmit only those. Apply appropriate modifications: chunk the 3 oversized documents (address the root cause) and retry the 2 transient failures without modification (since the error was temporary). Resubmitting the entire batch (A) wastes resources. Discarding failures (C) loses data. Waiting without changes (D) does not fix the context size issue. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:18", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A 14-file PR review produces contradictory findings: flagging a pattern as problematic in one file while approving identical code elsewhere. What is the fix?", "opts": ["Use a larger context window model.", "Split into per-file local analysis passes plus a separate cross-file integration pass.", "Require smaller PRs.", "Run three reviews and take majority vote."], "answerIdx": 1, "explanation": "**B)** **B)** Multi-pass review (per-file + integration) addresses attention dilution in large reviews. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:11", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A developer needs to add a null check to a single function in one file. The bug is clear from the stack trace. Which mode should they use?", "opts": ["Plan mode to explore the codebase and understand the full impact before making the change.", "Direct execution -- the change is well-understood, single-file, and has clear scope.", "Plan mode first, then direct execution for the implementation.", "Start in direct execution and switch to plan mode if the fix is more complex than expected."], "answerIdx": 1, "explanation": "**B)** **B)** Direct execution is appropriate for simple, well-scoped changes: a single-file bug fix with a clear stack trace. Plan mode adds unnecessary overhead for changes where the scope and solution are already understood. Plan mode is for complex tasks with multiple valid approaches and architectural decisions. (source: practice-tests/test-06-plan-mode-cicd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:13", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your CI review pipeline needs to output structured findings that can be automatically posted as inline PR comments. Which CLI flags should you use?", "opts": ["`-p --verbose` to get detailed output in text format.", "`-p --output-format json --json-schema <schema>` to produce machine-parseable structured findings.", "`-p --format markdown` to get formatted output.", "`-p > output.json` to redirect output to a JSON file."], "answerIdx": 1, "explanation": "**B)** **B)** `--output-format json` combined with `--json-schema` produces structured output that matches a defined schema, making it machine-parseable for automated posting as inline PR comments. Simple text output (A, C) requires parsing. Redirecting to a file (D) does not make the output structured. (source: practice-tests/test-06-plan-mode-cicd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:16", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Order lookups return 40+ fields. Most requests need only 5 fields. Context is growing rapidly. What should you do?", "opts": ["Use a model with a larger context window.", "Trim tool outputs to only the fields relevant to the current request type.", "Paginate the results.", "Cache frequently accessed fields."], "answerIdx": 1, "explanation": "**B)** **B)** Trimming verbose tool outputs to relevant fields prevents disproportionate context consumption. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:21", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Your coordinator agent always routes every query through the full pipeline: web search -> document analysis -> synthesis -> report generation, even for simple factual questions that only need a web search. What should you change?", "opts": ["Add a timeout to each agent so simple queries complete faster.", "Design the coordinator to analyze query requirements and dynamically select which subagents to invoke rather than always routing through the full pipeline.", "Create a separate \"simple query\" coordinator that only uses web search.", "Add a classifier model before the coordinator that decides the pipeline."], "answerIdx": 1, "explanation": "**B)** **B)** The coordinator should dynamically assess query complexity and invoke only the subagents needed. Simple factual queries might only need web search; complex analytical queries might need the full pipeline. This is a core coordinator responsibility: task decomposition and selective delegation. Option C creates unnecessary infrastructure duplication. Option D adds complexity when the coordinator itself can make this decision. (source: practice-tests/test-02-multi-agent.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:12", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Your web search subagent returns an error: `{\"status\": \"error\", \"message\": \"search unavailable\"}`. The coordinator has no information about what failed, what was attempted, or whether partial results exist. What should the error response include instead?", "opts": ["Just the HTTP status code for programmatic handling.", "Structured error context: failure type (timeout), attempted query, partial results (3 of 5 sources returned), and potential alternative approaches (try alternative search API or narrower query).", "A retry count showing how many times the subagent already retried.", "The full stack trace for debugging."], "answerIdx": 1, "explanation": "**B)** **B)** Structured error context enables the coordinator to make intelligent recovery decisions. Knowing the failure type (timeout vs permission denied), what was attempted (the query), partial results (what succeeded), and alternatives (different API, narrower query) gives the coordinator all the information needed to decide whether to retry, modify the approach, or proceed with partial data. Generic messages (like \"search unavailable\") hide this critical context. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-developer-productivity:28", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You notice your agentic loop terminates when the assistant message contains text content alongside a tool call. The code checks `if response.content[0].type == \"text\": break`. Why is this incorrect?", "opts": ["The `content` array can contain both text blocks and tool_use blocks in the same response. The model often explains its reasoning (text) before or after requesting a tool call.", "Text content is only present in error responses, so this check is correct for normal flow.", "The `content` array always has exactly one element, so checking the first element is fine.", "Tool calls are never mixed with text content in the same response."], "answerIdx": 0, "explanation": "**A)** **A)** A single assistant response can contain both text blocks (the model's reasoning or explanation) and `tool_use` blocks in the same `content` array. Checking for text content as a completion indicator is an anti-pattern because the model frequently explains its reasoning alongside tool calls. The correct check is `stop_reason`, not content type inspection. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:4", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A PostToolUse hook receives dates in three formats from different MCP tools: Unix timestamps, ISO 8601, and \"MM/DD/YYYY\". What should the hook do?", "opts": ["Let the model figure out the formats.", "Normalize all dates to ISO 8601 before the model processes them.", "Convert all to Unix timestamps for consistency.", "Add format labels to each date field."], "answerIdx": 1, "explanation": "**B)** **B)** PostToolUse hooks should normalize heterogeneous data formats to a consistent format before model processing. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:19", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "You are resuming a Claude Code session after making several code changes to files the agent previously analyzed. The session context still contains the old analysis. What should you do?", "opts": ["Resume the session and trust the model to detect that files have changed.", "Start a completely new session and re-analyze everything from scratch.", "Resume the session and inform the agent about specific file changes for targeted re-analysis.", "Delete the session and all associated state before starting fresh."], "answerIdx": 2, "explanation": "**C)** **C)** When resuming sessions after code modifications, inform the agent about specific changes so it can perform targeted re-analysis rather than full re-exploration. This preserves valuable prior context while ensuring stale information is updated. Option A risks the model reasoning about outdated code. Option B wastes time re-analyzing unchanged files. Option D is destructive and unnecessary. (source: practice-tests/test-03-hooks-workflows.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:20", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your MCP server has a `search_issues` tool that returns detailed issue data including summaries, labels, and status. But the agent keeps using the built-in `Grep` tool to search for issue references in code instead. What is the likely cause?", "opts": ["The agent prefers built-in tools by default and cannot be changed.", "The MCP tool's description does not clearly explain its capabilities and outputs, causing the agent to prefer the familiar built-in Grep tool.", "Built-in tools always take priority over MCP tools.", "The MCP server connection is too slow."], "answerIdx": 1, "explanation": "**B)** **B)** When MCP tool descriptions are vague or incomplete, the agent defaults to familiar built-in tools. Enhancing the MCP tool description to clearly explain what it can do, what data it returns, and when it should be used over alternatives prevents this. The fix is to write richer descriptions that help the agent understand the MCP tool's unique value. Built-in tools do not have automatic priority (A, C). (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:16", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A PostToolUse hook receives dates in three formats from different MCP tools: Unix timestamps, ISO 8601, and \"MM/DD/YYYY\". What should the hook do?", "opts": ["Let the model figure out the formats.", "Normalize all dates to ISO 8601 before the model processes them.", "Convert all to Unix timestamps for consistency.", "Add format labels to each date field."], "answerIdx": 1, "explanation": "**B)** **B)** PostToolUse hooks should normalize heterogeneous data formats to a consistent format before model processing. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:22", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "You are designing an agentic loop for a billing dispute agent. The agent must: (1) look up the customer, (2) retrieve the disputed charge, (3) check the refund policy, and (4) either process the refund or escalate. A junior developer suggests hard-coding this sequence. What is the tradeoff?", "opts": ["Hard-coding is always better because it guarantees the correct order.", "Hard-coding ensures the sequence but loses the model's ability to adapt when steps fail or when context makes some steps unnecessary. A hybrid approach using programmatic prerequisites for critical steps and model-driven logic for adaptive steps is often better.", "Model-driven is always better because it is more flexible.", "There is no difference -- the model will follow the same sequence either way."], "answerIdx": 1, "explanation": "**B)** **B)** Neither extreme is always best. Hard-coding ensures order but loses adaptability (e.g., if the customer already provided their ID, `get_customer` might not be needed). Model-driven logic allows adaptation but might skip critical steps. The best approach is a hybrid: use programmatic enforcement for non-negotiable prerequisites (e.g., customer verification before refunds) while letting the model reason about optional or adaptive steps. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:14", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A code review task involves analyzing a PR that modifies 12 files. Which task decomposition pattern is most appropriate?", "opts": ["Dynamic decomposition where the agent explores files in whatever order seems best.", "Prompt chaining: analyze each file individually for local issues, then run a separate cross-file integration pass to catch data flow and consistency issues.", "Analyze all 12 files in a single pass to catch cross-file issues.", "Randomly sample 4 files for review to stay within context limits."], "answerIdx": 1, "explanation": "**B)** **B)** Code reviews are predictable multi-aspect tasks well-suited to prompt chaining. Per-file analysis ensures consistent depth (avoiding the attention dilution of analyzing all files at once). The separate cross-file integration pass catches issues that only emerge when considering how files interact. Single-pass (C) leads to inconsistent depth. Random sampling (D) misses files. Unstructured exploration (A) lacks the systematic coverage a review requires. (source: practice-tests/test-03-hooks-workflows.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:3", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A developer finds that natural language descriptions produce inconsistent results when asking Claude to transform code. They have tried rewording the instructions several times. What technique is most effective for communicating the exact transformation expected?", "opts": ["Add more detailed prose descriptions of the transformation.", "Provide 2-3 concrete input/output examples showing the transformation applied to real code.", "Use technical jargon to be more precise about the transformation.", "Break the transformation into 10 smaller steps."], "answerIdx": 1, "explanation": "**B)** **B)** Concrete input/output examples are the most effective way to communicate expected transformations when prose descriptions are interpreted inconsistently. 2-3 examples demonstrating the exact before-and-after pattern resolve ambiguity that words alone cannot. This is a core iterative refinement technique that consistently outperforms more detailed prose (A), jargon (C), or excessive decomposition (D). (source: practice-tests/test-06-plan-mode-cicd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:9", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "What distinguishes model-driven decision-making in an agentic loop from a pre-configured decision tree?", "opts": ["Model-driven decision-making is slower but more accurate than decision trees.", "In model-driven loops, Claude reasons about which tool to call next based on the current context, rather than following a fixed sequence of tool calls.", "Decision trees use the API while model-driven approaches use local inference.", "Model-driven approaches require fewer tools to be defined."], "answerIdx": 1, "explanation": "**B)** **B)** The key distinction is that in model-driven agentic loops, Claude analyzes the current context (conversation history, tool results, user request) and dynamically decides which tool to call. This contrasts with pre-configured decision trees where the sequence of tool calls is determined by hard-coded logic. Model-driven approaches are more flexible and can adapt to novel situations. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:24", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Subagent findings are returned as prose paragraphs. After synthesis, source attribution is lost. What structural change preserves provenance?", "opts": ["Tell the synthesis agent to \"always cite sources.\"", "Require subagents to output structured claim-source mappings (source URL, document name, excerpt, date) that the synthesis agent must preserve.", "Have synthesis search for URLs in the prose.", "Add a post-processing attribution step."], "answerIdx": 1, "explanation": "**B)** **B)** Structured claim-source mappings are the architectural fix. Prose-based approaches lose information through summarization. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-customer-support:9", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "The agent's `get_customer` and `lookup_order` tools have minimal descriptions: \"Gets customer info\" and \"Gets order info.\" Agents frequently call the wrong one. What is the most effective first step?", "opts": ["Add few-shot examples for each tool call scenario.", "Expand tool descriptions to include input formats, example queries, edge cases, and clear boundaries between the two tools.", "Consolidate into one `lookup` tool.", "Add a routing layer before the agent."], "answerIdx": 1, "explanation": "**B)** **B)** Tool descriptions are the primary mechanism for tool selection. Expanding them with clear differentiation is the highest-leverage, lowest-effort fix. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:14", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Your customer has three open issues: a damaged item return, a billing dispute, and an address change. After resolving the first issue, the agent loses track of the other two. What structural change prevents this?", "opts": ["Add \"Remember to address all issues\" to the system prompt.", "Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer for multi-issue sessions.", "Limit customers to one issue per conversation.", "Create separate conversation threads for each issue."], "answerIdx": 1, "explanation": "**B)** **B)** For multi-issue sessions, structured issue data should be extracted into a separate context layer that tracks each issue's ID, status, and key details. This persists across turns regardless of conversation summarization, ensuring no issues are forgotten. Prompt instructions (A) are unreliable for state tracking. Limiting issues (C) degrades customer experience. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:23", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your team needs both always-loaded universal coding standards AND on-demand task-specific workflows (like code review, deployment checks, migration helpers). How should these be organized?", "opts": ["Put everything in CLAUDE.md -- it handles both standards and workflows.", "Use CLAUDE.md for always-loaded universal standards and skills (.claude/skills/) for on-demand task-specific workflows.", "Use skills for everything since they are more flexible.", "Use .claude/rules/ for workflows and CLAUDE.md for standards."], "answerIdx": 1, "explanation": "**B)** **B)** CLAUDE.md is always loaded and suited for universal standards that should apply to every interaction. Skills are invoked on-demand and suited for task-specific workflows that only apply when explicitly needed. This separation keeps the always-loaded context lean (saving tokens) while providing rich task-specific guidance when needed. (source: practice-tests/test-05-claude-code-config.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:7", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You are building a customer support agent. Your agentic loop currently checks if the assistant's response contains the phrase \"I've completed the task\" to decide when to stop iterating. During testing, the agent sometimes generates this phrase mid-conversation while still needing to call additional tools. What should you change?", "opts": ["Add additional termination phrases like \"No further action needed\" to make detection more robust.", "Check `stop_reason` in the API response: continue when it equals `\"tool_use\"` and terminate when it equals `\"end_turn\"`.", "Set a maximum iteration count and stop after that many loops regardless of the response content.", "Parse the assistant's response for tool call JSON to determine if more tools need to be invoked."], "answerIdx": 1, "explanation": "**B)** **B)** The `stop_reason` field is the reliable, API-provided mechanism for determining whether the model wants to call a tool or has finished its response. Parsing natural language (A, D) is an anti-pattern -- the model may include completion-sounding phrases while still intending to call tools. Arbitrary iteration caps (C) are a secondary safety measure, not a primary stopping mechanism. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:5", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "In your agentic loop, after the model returns a response with `stop_reason: \"tool_use\"`, you execute the requested tool and get a result. What should happen next?", "opts": ["Send a new API request with only the tool result as the user message.", "Append the assistant's response (with the tool call) and the tool result to the conversation history, then send the full updated history in the next API request.", "Parse the tool result and include a summary in the next system prompt update.", "Store the tool result in a database and include a reference ID in the next message."], "answerIdx": 1, "explanation": "**B)** **B)** The complete conversation history, including the assistant's tool call request and the tool's result, must be appended and sent in the next API request. This gives the model full context to reason about the result and decide what to do next. Sending only the tool result (A) loses conversation context. Summarizing in the system prompt (C) or storing externally (D) breaks the conversational flow the model needs. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:10", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Your multi-agent system crashes during a complex research task. On restart, all agent state is lost and the coordinator has to start from scratch. What architectural pattern prevents this?", "opts": ["Use longer-running agent processes that are less likely to crash.", "Design crash recovery using structured agent state exports (manifests): each agent exports state to a known location, and the coordinator loads the manifest on resume and injects prior state into agent prompts.", "Run duplicate agents so one can take over if the other fails.", "Store all intermediate results in a database that the agent can query."], "answerIdx": 1, "explanation": "**B)** **B)** Structured state persistence for crash recovery means each agent periodically exports its current state (findings, progress, next steps) to a known location. On crash recovery, the coordinator loads this manifest and injects the prior state into agent prompts. This allows work to resume from the last checkpoint rather than restarting from scratch. Database storage (D) is similar in concept but a manifest pattern is more directly integrated with the agent architecture. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:30", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your code review prompt says \"check that comments are accurate.\" This produces many false positives where Claude flags comments that are technically imprecise but not misleading. How should you refine the prompt?", "opts": ["Change to \"carefully check that comments are accurate, being conservative in your findings.\"", "Replace with explicit criteria: \"Flag comments only when the claimed behavior directly contradicts the actual code behavior. Do not flag comments that are merely incomplete or use imprecise terminology.\"", "Remove comment checking entirely since it is unreliable.", "Add a confidence threshold: \"Only flag comments you are 95% confident are wrong.\""], "answerIdx": 1, "explanation": "**B)** **B)** Explicit criteria defining what to flag (contradictory behavior) and what to skip (imprecise but not misleading) directly addresses the false positive source. Vague modifiers like \"conservative\" (A) or confidence thresholds (D) do not help the model distinguish between genuinely wrong comments and merely imprecise ones. Removing the category (C) is giving up rather than fixing the problem. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:8", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A subagent encounters a transient timeout error while fetching a document. It has local retry logic that succeeds on the second attempt. Should it report this error to the coordinator?", "opts": ["Yes -- all errors should always be reported to the coordinator.", "No -- subagents should implement local recovery for transient failures and only propagate errors they cannot resolve, along with what was attempted and partial results.", "Yes -- the coordinator needs to know about all timeouts for monitoring.", "No -- errors should be silently swallowed to keep the coordinator's context clean."], "answerIdx": 1, "explanation": "**B)** **B)** Subagents should handle transient failures locally when possible (retry logic for timeouts, exponential backoff). Only propagate to the coordinator errors that cannot be resolved locally. When propagating, include what was attempted and any partial results. This prevents the coordinator from being overwhelmed with recoverable issues while ensuring genuine failures are properly handled. Silent suppression (D) is an anti-pattern. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:9", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "During a complex multi-phase task, the Explore subagent is used for verbose discovery. Why is this preferred over doing discovery in the main conversation?", "opts": ["The Explore subagent has access to more tools than the main conversation.", "The Explore subagent isolates verbose discovery output and returns summaries, preserving main conversation context from being exhausted by exploration data.", "The Explore subagent runs faster than the main conversation.", "The Explore subagent can access files that the main conversation cannot."], "answerIdx": 1, "explanation": "**B)** **B)** The Explore subagent's primary benefit is context isolation. Verbose discovery output (reading many files, searching across the codebase) consumes significant context tokens. By delegating this to the Explore subagent, only the summarized findings return to the main conversation, preventing context window exhaustion during multi-phase tasks. (source: practice-tests/test-06-plan-mode-cicd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:1", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Before batch-processing 10,000 documents, what should you do first?", "opts": ["Submit all 10,000 immediately.", "Refine prompts on a sample set first to maximize first-pass success rates.", "Split into 100 batches of 100.", "Process the first 1,000 synchronously."], "answerIdx": 1, "explanation": "**B)** **B)** Prompt refinement on a sample before scaling reduces iterative resubmission costs. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:22", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "CI review output needs to be structured JSON for automated inline PR comments. Which flags?", "opts": ["`-p --verbose`", "`-p --output-format json --json-schema <schema>`", "`-p --format json`", "`-p | jq`"], "answerIdx": 1, "explanation": "**B)** **B)** `--output-format json` with `--json-schema` produces machine-parseable structured output. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-multi-agent-research:16", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "You need to configure subagent definitions. Which elements should an `AgentDefinition` include?", "opts": ["Only a system prompt -- everything else is inherited from the coordinator.", "Descriptions, system prompts, and tool restrictions for each subagent type.", "Only tool restrictions -- the model determines its own role from context.", "A reference to the coordinator's configuration that the subagent clones."], "answerIdx": 1, "explanation": "**B)** **B)** An `AgentDefinition` should include descriptions (explaining the agent's role and capabilities), system prompts (guiding its behavior), and tool restrictions (limiting which tools it can access). Subagents do not inherit from the coordinator -- they operate with isolated context and need explicit configuration. (source: practice-tests/test-02-multi-agent.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:20", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your manager wants to switch both pre-merge code review and overnight debt analysis to the batch API for 50% savings. What is correct?", "opts": ["Switch both.", "Switch overnight debt analysis to batch; keep pre-merge reviews synchronous. Batch has up to 24-hour processing with no guaranteed latency SLA.", "Keep both synchronous.", "Switch both with timeout fallback."], "answerIdx": 1, "explanation": "**B)** **B)** Batch API is for latency-tolerant workloads only. Pre-merge checks are blocking and need real-time responses. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:15", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your task is to add comprehensive tests to a large legacy codebase with no existing test coverage. Which task decomposition approach is most appropriate?", "opts": ["Prompt chaining: write tests for file A, then file B, then file C, in alphabetical order.", "Dynamic adaptive decomposition: first map the codebase structure, identify high-impact areas, then create a prioritized plan that adapts as dependencies are discovered.", "Write all tests in a single session with comprehensive upfront instructions.", "Use a pre-configured pipeline that generates one test file per source file."], "answerIdx": 1, "explanation": "**B)** **B)** Open-ended tasks with unknown scope require dynamic adaptive decomposition. Start by mapping structure, identify which areas have the highest impact (most critical business logic, most error-prone), then create a prioritized plan. As you discover dependencies between modules, the plan adapts. Alphabetical order (A) ignores priority. Single session (C) will exhaust context. Fixed pipeline (D) does not adapt to discovered dependencies. (source: practice-tests/test-03-hooks-workflows.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:13", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your customer support agent uses an agentic loop. In production, you observe that the agent sometimes enters an infinite loop, calling the same two tools alternately without making progress. What is the best mitigation?", "opts": ["Parse each tool result for the word \"error\" and terminate the loop if detected.", "Maintain a reasonable iteration safety cap as a fallback and monitor for repeated identical tool calls as a signal to investigate prompt or tool design issues.", "After each tool call, ask the model \"Are you done?\" and terminate if it says yes.", "Limit each tool to being called only once per session."], "answerIdx": 1, "explanation": "**B)** **B)** An iteration safety cap prevents infinite loops, while monitoring for repeated identical calls helps identify root causes (poor tool descriptions, ambiguous results). Parsing for \"error\" (A) is unreliable natural language parsing. Asking \"Are you done?\" (C) adds unnecessary turns. Limiting tools to one call (D) is too restrictive -- legitimate workflows may need to call the same tool multiple times with different parameters. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:5", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "The agent escalates based on negative customer sentiment. A frustrated customer with a simple, policy-covered return gets escalated unnecessarily. What is wrong?", "opts": ["The sentiment threshold is too low.", "Sentiment-based escalation is unreliable because sentiment does not correlate with case complexity. Use explicit escalation criteria instead.", "The agent should never escalate.", "Add positive sentiment detection to balance the escalation trigger."], "answerIdx": 1, "explanation": "**B)** **B)** Sentiment != complexity. Explicit criteria (policy gaps, customer explicit requests, inability to progress) are more reliable than sentiment-based triggers. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:24", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "The company policy caps automated refunds at $500. The agent occasionally processes $600+ refunds despite prompt instructions. What provides guaranteed compliance?", "opts": ["Bold the $500 limit in the system prompt.", "Implement a tool call interception hook that blocks `process_refund` when amount exceeds $500 and redirects to human escalation.", "Add a confirmation step where the agent double-checks the amount.", "Log all refund amounts for post-hoc auditing."], "answerIdx": 1, "explanation": "**B)** **B)** Tool call interception hooks provide deterministic enforcement of business rules. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:3", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer needs to find all files in a project that match the pattern `*.test.tsx`. Which built-in tool should they use?", "opts": ["Grep -- search for \"test.tsx\" in file contents.", "Glob -- find files matching the naming pattern `**/*.test.tsx`.", "Read -- read each directory to find test files.", "Bash -- run `find . -name \"*.test.tsx\"`."], "answerIdx": 1, "explanation": "**B)** **B)** Glob is the built-in tool for file path pattern matching -- finding files by name or extension patterns. Grep is for searching file contents (not file names). Read is for loading file contents (not finding files). Bash with `find` works but Glob is the dedicated tool for this purpose and is preferred. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:27", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A subagent successfully queries a database and finds zero results matching the search criteria. It returns `{\"status\": \"error\", \"message\": \"No results found\"}`. Is this correct?", "opts": ["Yes -- no results is an error condition.", "No -- a successful query with zero results is a valid empty result, not an error. The response should indicate success with no matches to prevent the coordinator from treating it as a failure requiring retry.", "Yes -- the coordinator should retry with different search criteria.", "No -- it should return a fabricated result to avoid the empty result."], "answerIdx": 1, "explanation": "**B)** **B)** A successful query that returns zero results is fundamentally different from a failed query. The query executed correctly -- there simply were no matches. Reporting this as an error causes the coordinator to apply recovery strategies (retries, alternative approaches) that are inappropriate since the \"failure\" is actually valid information. The distinction between access failures (needing retry) and valid empty results is critical. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:13", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Your coordinator agent needs to invoke three subagents: web search, document analysis, and fact checking. The web search and document analysis can run independently, but fact checking needs the results from both. What is the optimal execution pattern?", "opts": ["Run all three sequentially: web search, then document analysis, then fact checking.", "Have the coordinator emit two Task tool calls in a single response (web search + document analysis) for parallel execution, then invoke fact checking in the next turn with both results.", "Run all three in parallel and have fact checking poll for results from the other two.", "Create a pipeline where web search feeds into document analysis which feeds into fact checking."], "answerIdx": 1, "explanation": "**B)** **B)** Parallel subagent execution is achieved by emitting multiple Task tool calls in a single coordinator response. Since web search and document analysis are independent, they can run in parallel. Fact checking depends on both results, so it must run after both complete. Option A is unnecessarily sequential. Option C is not how subagent coordination works (no polling). Option D creates false dependencies between web search and document analysis. (source: practice-tests/test-02-multi-agent.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-developer-productivity:6", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your customer support agent uses an agentic loop. In production, you observe that the agent sometimes enters an infinite loop, calling the same two tools alternately without making progress. What is the best mitigation?", "opts": ["Parse each tool result for the word \"error\" and terminate the loop if detected.", "Maintain a reasonable iteration safety cap as a fallback and monitor for repeated identical tool calls as a signal to investigate prompt or tool design issues.", "After each tool call, ask the model \"Are you done?\" and terminate if it says yes.", "Limit each tool to being called only once per session."], "answerIdx": 1, "explanation": "**B)** **B)** An iteration safety cap prevents infinite loops, while monitoring for repeated identical calls helps identify root causes (poor tool descriptions, ambiguous results). Parsing for \"error\" (A) is unreliable natural language parsing. Asking \"Are you done?\" (C) adds unnecessary turns. Limiting tools to one call (D) is too restrictive -- legitimate workflows may need to call the same tool multiple times with different parameters. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:17", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your customer support agent handles multi-turn conversations. After 15 turns, it refers to a refund of \"$47\" that was actually $147.23 -- the exact amount was lost during context summarization. How should you preserve critical numerical data?", "opts": ["Increase the context window size to avoid summarization.", "Extract transactional facts (amounts, dates, order numbers, statuses) into a persistent \"case facts\" block included in each prompt, outside summarized history.", "Ask the customer to repeat important numbers periodically.", "Store all numbers in a database and query them each turn."], "answerIdx": 1, "explanation": "**B)** **B)** Progressive summarization risks condensing numerical values, dates, and specific details into vague summaries. The solution is to extract critical transactional facts into a structured \"case facts\" block that persists outside the summarized conversation history. This block is included in each prompt, ensuring exact values are always available regardless of how much conversation history is summarized. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:13", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your team wants to share MCP server configurations across all developers working on the project. Where should the configuration be placed?", "opts": ["In each developer's `~/.claude.json` file.", "In the project's `.mcp.json` file, committed to version control, with `${GITHUB_TOKEN}` style environment variable expansion for credentials.", "In the project's CLAUDE.md file with server connection strings.", "In a shared Google Doc that developers reference when setting up their environment."], "answerIdx": 1, "explanation": "**B)** **B)** Project-scoped MCP configuration goes in `.mcp.json` at the project root. This file is version-controlled so all developers get the same configuration. Environment variable expansion (e.g., `${GITHUB_TOKEN}`) allows each developer to use their own credentials without committing secrets. Option A is user-scoped and not shared. Option C is for instructions, not server configuration. Option D is not programmatic. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:6", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your tool returns multiple customer records for the name \"John Smith.\" The agent selects the most recent account using a heuristic. This occasionally leads to misidentified accounts. What should the agent do instead?", "opts": ["Select the account with the most orders as the most likely match.", "Ask the customer for additional identifiers (email, phone number, or order number) to disambiguate rather than selecting based on heuristics.", "Present all matching accounts to the customer and ask them to confirm.", "Use the phone number from caller ID to automatically select the right account."], "answerIdx": 1, "explanation": "**B)** **B)** When tool results return multiple matches, the agent should request additional identifiers from the customer for disambiguation rather than applying heuristics that may select the wrong record. This is more reliable than presenting all accounts (C), which may expose other customers' information, and safer than any automated selection heuristic (A, D). (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:25", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A PR modifies 14 files. Your single-pass review produces detailed feedback for some files, superficial comments for others, and contradictory findings -- flagging a pattern as problematic in one file while approving identical code elsewhere. What is the root cause?", "opts": ["The model cannot handle 14 files.", "Attention dilution: when processing many files at once, the model gives inconsistent depth and may not notice the same pattern appearing in different files.", "The review prompt is too short.", "The files are too similar, confusing the model."], "answerIdx": 1, "explanation": "**B)** **B)** Attention dilution occurs when the model processes too much content at once, leading to inconsistent depth across files and contradictory findings. The model may deeply analyze some files while skimming others, and fail to maintain consistent judgment about code patterns across the full set. The fix is multi-pass review: per-file local analysis plus cross-file integration pass. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:18", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your web search subagent returns an error: `{\"status\": \"error\", \"message\": \"search unavailable\"}`. The coordinator has no information about what failed, what was attempted, or whether partial results exist. What should the error response include instead?", "opts": ["Just the HTTP status code for programmatic handling.", "Structured error context: failure type (timeout), attempted query, partial results (3 of 5 sources returned), and potential alternative approaches (try alternative search API or narrower query).", "A retry count showing how many times the subagent already retried.", "The full stack trace for debugging."], "answerIdx": 1, "explanation": "**B)** **B)** Structured error context enables the coordinator to make intelligent recovery decisions. Knowing the failure type (timeout vs permission denied), what was attempted (the query), partial results (what succeeded), and alternatives (different API, narrower query) gives the coordinator all the information needed to decide whether to retry, modify the approach, or proceed with partial data. Generic messages (like \"search unavailable\") hide this critical context. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:3", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "The web search subagent times out. It returns: `{\"status\": \"error\", \"message\": \"search unavailable\"}`. The coordinator cannot make a recovery decision. What should the error response include?", "opts": ["Just the HTTP status code.", "Structured error context: failure type, attempted query, partial results, and potential alternative approaches.", "A retry counter.", "The full stack trace."], "answerIdx": 1, "explanation": "**B)** **B)** Structured error context enables intelligent coordinator recovery decisions. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:28", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "You want to explore two different testing strategies for a legacy codebase from a shared analysis baseline. You have already completed an initial codebase analysis. What is the best approach?", "opts": ["Start two completely new sessions, re-running the codebase analysis in each.", "Use `fork_session` to create independent branches from the shared analysis baseline to explore each strategy without re-doing the initial analysis.", "Use the same session for both explorations sequentially, clearing context between them.", "Create two subagents that each receive a copy of the analysis and explore one strategy."], "answerIdx": 1, "explanation": "**B)** **B)** `fork_session` creates independent branches from a shared analysis baseline. Both branches retain the initial codebase analysis context and can explore divergent approaches independently. Option A wastes time re-running analysis. Option C risks context contamination between explorations. Option D could work but `fork_session` is the purpose-built mechanism for this exact use case. (source: practice-tests/test-02-multi-agent.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:30", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "The system researches \"impact of AI on creative industries\" but the report covers only visual arts, missing music, writing, and film. The coordinator decomposed the topic into \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" What is the root cause?", "opts": ["The synthesis agent lacks gap-detection instructions.", "The coordinator's task decomposition is too narrow, only covering visual arts subtopics.", "The web search agent's queries are not broad enough.", "The document analysis agent filters out non-visual content."], "answerIdx": 1, "explanation": "**B)** **B)** The coordinator's decomposition directly caused the coverage gap by only assigning visual arts subtopics to subagents. (source: practice-tests/full-exam-01.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-customer-support:26", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your customer has three open issues: a damaged item return, a billing dispute, and an address change. After resolving the first issue, the agent loses track of the other two. What structural change prevents this?", "opts": ["Add \"Remember to address all issues\" to the system prompt.", "Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer for multi-issue sessions.", "Limit customers to one issue per conversation.", "Create separate conversation threads for each issue."], "answerIdx": 1, "explanation": "**B)** **B)** For multi-issue sessions, structured issue data should be extracted into a separate context layer that tracks each issue's ID, status, and key details. This persists across turns regardless of conversation summarization, ensuring no issues are forgotten. Prompt instructions (A) are unreliable for state tracking. Limiting issues (C) degrades customer experience. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:11", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A customer explicitly says \"I want to speak to a human agent.\" Your agent has already identified that the issue is a simple order status question it could answer in one tool call. What should the agent do?", "opts": ["Answer the question first to demonstrate capability, then offer to transfer if the customer still wants a human.", "Honor the customer's explicit request immediately and transfer to a human agent.", "Ask the customer why they want a human agent to determine if escalation is necessary.", "Provide the order status and mention that a human agent is also available."], "answerIdx": 1, "explanation": "**B)** **B)** When a customer explicitly requests a human agent, honor that request immediately without first attempting investigation. The customer has stated their preference, and ignoring it to demonstrate capability (A, D) or questioning their decision (C) creates friction and violates the escalation principle. (source: practice-tests/test-09-context-reliability.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}];
  const MODULES = [{"id": "ci-cd", "name": "Claude Code for CI/CD"}, {"id": "multi-agent-research", "name": "Multi-Agent Research System"}, {"id": "developer-productivity", "name": "Developer Productivity with Claude"}, {"id": "customer-support", "name": "Customer Support Resolution Agent"}];
  const META = {

  const S = { ix:0, answers:Array(BANK.length).fill(-1), revealed:false, timer:null, left:META.timedMinutes*60, done:false };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function letter(i) { return ['A','B','C','D'][i] || '?'; }
  function fmt(sec) { const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

  function renderStart() {
    const mods = MODULES.map(m => `<span class="pill">${esc(m.name)}</span>`).join(' ');
    return `
      <div class="card">
        <h1 class="title">CCA Prep-Style Exam</h1>
        <div class="meta">60 questions, 90 minutes, 4 modules, 15 questions per module.</div>
        <div class="meta">Generated: ${esc(META.generatedAt)} | seed: ${META.seed ?? 'random'}</div>
        <div style="margin-top:10px" class="row">${mods}</div>
        <div style="margin-top:14px"><button class="btn" onclick="startExam()">Start Exam</button></div>
      </div>`;
  }

  function renderExam() {
    const q = BANK[S.ix];
    const selected = S.answers[S.ix];
    let opts = '';
    for (let i=0;i<4;i++) {
      let cls = 'opt';
      if (selected === i) cls += ' sel';
      if (S.revealed) {
        if (i === q.answerIdx) cls += ' good';
        else if (selected === i) cls += ' bad';
      }
      opts += `<div class="${cls}" onclick="pick(${i})"><strong>${letter(i)})</strong> ${esc(q.opts[i])}</div>`;
    }

    const ex = S.revealed ? `<div class="ex"><strong>Explanation:</strong> ${esc(q.explanation || 'No explanation provided.')}</div>` : '';

    return `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="small">Q ${S.ix+1} / ${BANK.length} · ${esc(q.moduleName)}</div>
          <div><strong>${fmt(S.left)}</strong></div>

        <div class="qtext">${esc(q.prompt)}</div>
        ${opts}
        ${ex}
        <div class="row" style="margin-top:12px">
          <button class="btn alt" onclick="prevQ()" ${S.ix===0?'disabled':''}>Prev</button>
          <button class="btn" onclick="revealOrNext()">${S.revealed ? (S.ix===BANK.length-1?'Finish':'Next') : 'Check'}</button>
          <button class="btn alt" onclick="finishExam()">Finish Now</button>
        </div>
      </div>`;
  }

  function renderResult() {
    let correct=0;
    for (let i=0;i<BANK.length;i++) if (S.answers[i] === BANK[i].answerIdx) correct++;
    const score = Math.round((correct / BANK.length) * 1000);
    const pass = score >= 720;
    const byMod = {};
    for (const q of BANK) byMod[q.moduleName] = byMod[q.moduleName] || {t:0,c:0};
    for (let i=0;i<BANK.length;i++) {
      const m = byMod[BANK[i].moduleName];
      m.t += 1;
      if (S.answers[i] === BANK[i].answerIdx) m.c += 1;
    }
    const rows = Object.entries(byMod).map(([k,v]) => `<div class="small">${esc(k)}: ${v.c}/${v.t}</div>`).join('');

    return `

        <h2 style="margin:0">Exam Complete</h2>
        <div class="score">${score} / 1000</div>
        <div class="meta">Correct: ${correct} / ${BANK.length} · Result: <strong>${pass ? 'PASS' : 'RETEST'}</strong></div>

        <div class="row" style="margin-top:14px"><button class="btn" onclick="location.reload()">Generate New Run</button></div>
      </div>`;
  }

  function mount() {

    else if (!S.done) app.innerHTML = renderExam();
    else app.innerHTML = renderResult();

  function startExam() {
    S.timer = setInterval(() => {
      S.left--;
      if (S.left <= 0) finishExam();
      else mount();
    }, 1000);
    mount();
  }

  function pick(i) { if (S.done || S.revealed) return; S.answers[S.ix] = i; mount(); }
  function prevQ() { if (S.done || S.ix === 0) return; S.revealed = false; S.ix--; mount(); }
  function revealOrNext() {
    if (S.done) return;
    if (!S.revealed) { if (S.answers[S.ix] < 0) return; S.revealed = true; mount(); return; }
    if (S.ix >= BANK.length - 1) { finishExam(); return; }
    S.ix++; S.revealed = false; mount();
  }

  function finishExam() {
    if (S.done) return;
    S.done = true;
    if (S.timer) clearInterval(S.timer);
    mount();
  }

  mount();
  </script>
