 to surface only high-certainty findings in each area", "Add a preamble to the prompt asking Claude to assess and report its own confidence level for each finding before listing it", "Temporarily disable the style and naming categories; continue running only security and performance while improving the high-FP prompts offline", "Route all findings through a second Claude instance that acts as a filter and re-scores each finding's severity before output"], "answerIdx": 2, "explanation": "**C)** The problem is trust erosion from high-FP categories cascading onto low-FP ones — developers stop reading everything because noise drowns signal. Disabling the high-FP categories immediately removes the noise, preserving trust in the accurate categories (security 8%, performance 17%) while the problematic prompts are improved offline. A is wrong because uniform strictness reduction degrades the already-accurate security and performance categories. B is wrong because developers are already dismissing all findings — asking Claude to self-report confidence produces text that dismissed developers won't read. D adds latency and complexity but does not address why the style and naming prompts are generating false positives in the first place. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:11", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You have a catalog of 10,000 product listings to standardize into a structured schema. Before submitting the full batch, what is the most cost-effective preparation step?", "opts": ["Run prompt refinement on a representative sample of 50–100 listings first, measure field error rates by document type, then fix the prompt before submitting the full batch.", "Submit all 10,000 immediately using the Batches API to begin processing at reduced cost as early as possible, monitoring for failures in real time.", "Process the first 500 synchronously to catch prompt issues, then batch the remaining 9,500 once the synchronous run confirms the prompt is working correctly.", "Split the 10,000 into 10 parallel batches of 1,000 and submit them simultaneously to parallelize processing and surface systematic prompt errors faster."], "answerIdx": 0, "explanation": "**A)** Testing on a small representative sample first maximizes first-pass success rates at scale. A 3% error rate on 10,000 documents means 300 resubmissions with additional API cost and latency. Refining the prompt to reduce error rate from 3% to 0.5% saves 250 resubmissions. B) and D) begin large-scale processing before the prompt is validated, multiplying failures. C) is better than B/D but uses expensive synchronous calls for sample testing when a small batch test achieves the same result at lower cost. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-structured-extraction:10", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction pipeline processes shipping manifests. You run JSON schema validation as a gate; documents failing validation go to a targeted retry. After two passes, 3% still fail. You must choose: (a) return partial results with error annotations, or (b) fail hard and drop the document. When is option (a) the better choice?", "opts": ["Always — partial results with error annotations are always more useful than no results, since operators can correct mistakes manually given sufficient metadata.", "When the failing fields are non-critical metadata (e.g., `carrier_reference_code`) and the core fields needed for downstream processing are present and valid.", "When the extraction is part of a batch job, since batch processing pipelines cannot route individual documents to human review and must always return some result.", "When error rates exceed 5%, because at that threshold a fail-hard policy creates a backlog too large for human reviewers to process within normal SLAs."], "answerIdx": 1, "explanation": "**B)** The decision depends on which fields failed. If non-critical fields fail but the core payload (shipment ID, destination, weight) is valid, partial results are useful and downstream systems can still process the document. If critical fields fail, partial results may cause downstream errors worse than a dropped document. A) overstates — partial results with bad critical fields can corrupt downstream pipelines. C) is false — batch jobs can include per-document error metadata using `custom_id` fields. D) uses an arbitrary threshold unrelated to field criticality. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-structured-extraction:14", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You extract structured data from invoices where input format varies: some are PDFs with structured tables, others are scanned images, and a third group is plain-text emails. Extraction accuracy is high on PDFs but low on scanned images and emails. What approach best addresses this performance gap?", "opts": ["Build a single universal extraction prompt handling all three formats, with detailed instructions for each format type embedded as subsections in the same prompt body.", "Add a document-type classifier as the first step, then route to format-specific extraction prompts with few-shot examples tailored to each input type's layout patterns.", "Run all documents through OCR preprocessing to convert them to a uniform text format before extraction, eliminating format differences that cause accuracy variance.", "Use `tool_choice: \"any\"` with three format-specific extraction tools and rely on the model to select the appropriate schema based on detected document characteristics."], "answerIdx": 1, "explanation": "**B)** Format-specific prompts with tailored few-shot examples are more effective than a universal prompt because each format has different layout patterns, noise characteristics, and extraction challenges. A classifier routes documents to the best prompt for their type. A) creates a prompt too general to handle each format optimally; the model may apply the wrong format's extraction heuristics. C) OCR helps scanned images but does not help plain-text emails, and OCR quality varies with scan quality. D) relies on the model detecting format without explicit guidance, which is less reliable than a dedicated classifier. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-ci-cd:1", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your GitHub Actions workflow calls `claude \"Review this PR for security issues\"` but the job hangs indefinitely waiting for input. No environment changes have been made. What is the most direct fix?", "opts": ["Add the `-p` flag so the command becomes `claude -p \"Review this PR for security issues\"`, enabling non-interactive print mode", "Set `ANTHROPIC_NON_INTERACTIVE=1` in the workflow environment to signal headless execution mode", "Pipe `/dev/null` to stdin with `claude \"Review this PR\" < /dev/null` to suppress the interactive prompt", "Add `--no-tty` to the invocation so Claude detects the missing terminal and skips interactive prompts automatically"], "answerIdx": 0, "explanation": "**A)** `-p` / `--print` is the documented non-interactive flag for CI. It processes the prompt, writes output to stdout, and exits without prompting for further input. B is wrong because `ANTHROPIC_NON_INTERACTIVE` is not a real environment variable in the Claude Code CLI — it will have no effect. C is wrong because redirecting stdin suppresses input but does not prevent Claude from waiting for a terminal interaction prompt; the process may still block. D is wrong because `--no-tty` is not a valid Claude Code CLI flag and will cause an error. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:24", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer wants Claude Code to automatically run `npm run lint` after every file write operation and inject the lint results back into the conversation so the model can fix issues in subsequent turns. Which hook configuration achieves this?", "opts": ["Register a `PreToolUse` hook matching `tool_name: \"Write\"` that runs `npm run lint` before the write and blocks the write if lint errors are detected in the target file's current state.", "Register a `UserPromptSubmit` hook that runs `npm run lint` before every turn and prepends the lint summary to the user's prompt so the model always has current lint status at turn start.", "Register a `PostToolUse` hook matching `tool_name: \"Write\"` that runs `npm run lint` on the written file and injects the lint output into the tool result so the model sees it in the next reasoning step.", "Register a `Stop` hook that runs `npm run lint` at the end of each agentic session and formats all accumulated errors as a final message displayed to the developer in the terminal."], "answerIdx": 2, "explanation": "**C)** `PostToolUse` fires after a tool completes and can modify the tool result that gets returned to the model. Running lint after each write and injecting results into the tool response means the model immediately sees lint feedback and can fix issues in subsequent turns. A) `PreToolUse` runs before the write — at that point the file has not been written yet, so lint checks the old version. B) runs lint before every user message regardless of whether a write occurred — wasteful and not scoped to writes. D) `Stop` runs at session end, too late for the model to act on the feedback within the session. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-code-generation:12", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A skill file at `.claude/skills/db-migrate.md` contains the line `allowed-tools: Bash, Edit`. A developer's personal CLAUDE.md at `~/.claude/CLAUDE.md` has a global policy: `disallow-tools: Bash`. When the developer invokes `/db-migrate`, which tools are available?", "opts": ["Both `Bash` and `Edit`, because skill-level `allowed-tools` is evaluated in its own scope, independent of CLAUDE.md instruction policies.", "Only `Bash`, because `allowed-tools` in a skill whitelist-restricts to that set and the user-level disallow only applies outside skill scope.", "Neither tool, because conflicting tool declarations between user CLAUDE.md and skill frontmatter resolve to fully-restricted for safety.", "Only `Edit`, because the personal CLAUDE.md `disallow-tools: Bash` overrides the skill's allowed-tools list at the session level."], "answerIdx": 0, "explanation": "**A)** `allowed-tools` in a skill frontmatter restricts the skill to only those tools — it does not interact with global disallow policies in CLAUDE.md. The skill executes in its own tool scope, so both `Bash` and `Edit` are available within the skill invocation. D is wrong because personal CLAUDE.md `disallow-tools` is an instruction-based guideline, not a hard enforcement mechanism that overrides skill frontmatter settings. B is wrong because `allowed-tools` functions as a whitelist (only listed tools are usable), not a single-tool selector. C is wrong because there is no \"conflicting policy = fully-restricted\" behavior; the skill's frontmatter governs its own tool access. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-code-generation:17", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You are writing a skill that calls Bash to run database migrations. You want to ensure the skill cannot accidentally invoke `Edit` or `Read` tools — only `Bash`. Which frontmatter configuration achieves this?", "opts": ["Add a `## Restrictions` section in the skill body instructing Claude never to use Edit or Read during migration runs.", "`tool-policy: restrict` combined with `tools: [Bash]` in the skill frontmatter to enforce a hard tool allowlist.", "`disallow-tools: [Edit, Read]` in the skill frontmatter to blocklist those tools while keeping all others accessible.", "`allowed-tools: Bash` in the skill frontmatter to whitelist only Bash, implicitly blocking all other tools."], "answerIdx": 3, "explanation": "**D)** `allowed-tools` in skill frontmatter functions as a whitelist: only the listed tools are available during the skill's execution. Setting `allowed-tools: Bash` means `Edit`, `Read`, and all other tools are implicitly blocked. C is wrong because `disallow-tools` is not a valid skill frontmatter field — the whitelist approach via `allowed-tools` is the supported mechanism. B is wrong because `tool-policy` and `tools` are not valid skill frontmatter keys — the correct field name is `allowed-tools`. A is wrong because prose instructions in the skill body are probabilistic; they don't enforce tool access at the execution layer the way frontmatter does. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-code-generation:21", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer invokes `/explore-codebase`, a skill that reads 200 files and generates a detailed architecture map. After the skill completes, they ask Claude to write a new feature. Claude spends its context budget on the architecture map instead of the feature implementation. What single frontmatter change resolves this without losing the architecture summary?", "opts": ["Add `priority: low` so Claude deprioritizes the skill's output when allocating the context budget for later requests.", "Add `output-format: json` so the architecture map compresses into structured data that consumes fewer main-session tokens.", "Add `context: fork` to run the skill in an isolated sub-agent that returns only a concise summary to the main session.", "Add `max-files: 50` to the skill to limit how many files it reads, keeping output compact enough to avoid context saturation."], "answerIdx": 2, "explanation": "**C)** `context: fork` isolates the skill in a sub-agent. The verbose 200-file analysis stays in the sub-agent's context; only the final summary is returned to the main conversation, freeing up context budget for the feature implementation. A is wrong because `priority: low` is not a valid skill frontmatter field; Claude doesn't have a context budget priority system for skill outputs. B is wrong because `output-format` is not a valid skill frontmatter field, and structured JSON output doesn't meaningfully reduce token consumption for an architecture map. D is wrong because `max-files` is not a valid skill frontmatter field; reducing file reads would degrade analysis quality without solving the context budget problem. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:28", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your team has a project-level `CLAUDE.md` at the project root. A developer adds conflicting instructions to `~/.claude/CLAUDE.md` (their user-level global file). When running Claude Code in the project directory, which instructions take precedence?", "opts": ["User-level `~/.claude/CLAUDE.md` always takes precedence over project-level files because user settings represent explicit personal preferences that override project defaults by design.", "Project-level `CLAUDE.md` takes precedence over the user-level file because project instructions are loaded last and later entries in the merged context override earlier ones deterministically.", "Both files are concatenated and sent as equal-weight context; when they conflict, model behavior is probabilistic and generally biased toward instructions appearing later in the concatenated string.", "Neither file takes absolute precedence — Claude Code detects contradictory instructions, raises a conflict warning, and halts with an error requiring the developer to resolve the conflict manually."], "answerIdx": 2, "explanation": "**C)** Claude Code loads both `~/.claude/CLAUDE.md` and the project-level `CLAUDE.md` and concatenates them into the context. Neither has hard precedence over the other — the model processes both as context and attempts to follow all instructions. When they conflict, the model's behavior is probabilistic and generally biased toward later content. A) and B) both describe deterministic precedence rules that do not match actual behavior. D) describes a conflict detection system that does not exist in Claude Code. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-ci-cd:24", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A review pipeline produces findings in an inconsistent format: sometimes a bulleted list, sometimes a numbered list, sometimes prose paragraphs. The prompt uses the instruction \"return findings in a clear, structured format.\" What is the most reliable fix?", "opts": ["Append \"use consistent formatting throughout\" to the prompt to reinforce the existing instruction", "Add 3–4 few-shot examples showing exactly the desired output format: the issue description, file location, and specific fix recommendation, all in the same layout", "Use a system prompt field instead of a user prompt field for formatting instructions, as system prompts receive higher compliance for structural requirements", "Add a second `claude -p` pass that takes the variable-format output and reformats it into the desired structure"], "answerIdx": 1, "explanation": "**B)** When abstract formatting instructions produce variable results, concrete examples are the most effective intervention. Few-shot examples show the model exactly what \"structured\" means — the specific layout, fields, and ordering — removing ambiguity that prose instructions leave open. A is wrong because \"use consistent formatting\" is as abstract as the original instruction; it addresses the same problem with the same type of instruction. C is wrong in this context because Claude Code's `-p` flag uses a combined prompt, not a separate system/user split in the same way the API does; and even in API usage, system prompt placement is not the primary driver of format compliance. D adds latency and cost and relies on the reformatting pass being reliable, which faces the same underlying problem. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:21", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your `UserPromptSubmit` hook reads `JIRA_CURRENT_SPRINT` from an environment variable and prepends sprint metadata to the prompt. On a developer's machine the hook works correctly. On the CI server the variable is unset and the hook exits with code 1, blocking all CI runs. What is the correct hook behavior when optional context is unavailable?", "opts": ["Log a warning and exit with code 0 returning the original prompt unmodified — hooks that inject optional context should degrade gracefully when the source is unavailable.", "Exit with code 1 to fail loudly — missing sprint context means the model will give incomplete answers, so it is better to block the prompt than return output with missing context.", "Set `JIRA_CURRENT_SPRINT` to a placeholder string like `\"UNKNOWN_SPRINT\"` and inject it into the prompt so the model knows the variable was checked but had no value.", "Catch the missing variable and instead inject the last 5 git log messages as a fallback, since sprint metadata and commit history serve equivalent planning context purposes."], "answerIdx": 0, "explanation": "**A)** Hooks that inject optional context should fail gracefully: return the original prompt unmodified with a non-blocking exit code when the context source is unavailable. B) breaks every CI run where the variable is not set — treating missing optional context as a hard failure is an operational anti-pattern. C) injects a meaningless placeholder that could mislead the model into referencing a non-existent sprint. D) uses a completely different data source as a \"fallback,\" mixing unrelated context types that serve different purposes. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:30", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your team is evaluating whether to add a second self-critique pass (running the evaluator-optimizer twice) versus adding a PostLLMResponse audit hook to catch missing fields before delivery. The agent currently uses a single self-critique pass and misses context-specific details in 12% of responses. Which approach is correct for this failure mode?", "opts": ["Add a second self-critique pass — running the evaluator twice gives the model a second independent chance to catch the same type of omission before delivery", "Add a PostLLMResponse hook with deterministic field-presence checks to catch structurally missing fields before delivery, reserving self-critique for content quality gaps", "Replace the self-critique pass with a PostLLMResponse hook that uses a secondary model call to audit the draft — external auditing is more reliable than self-evaluation", "Add both a second self-critique pass and a PostLLMResponse hook in sequence — layering both mechanisms maximizes the chance of catching any type of omission"], "answerIdx": 1, "explanation": "**B)** The right tool depends on the failure type. PostLLMResponse hooks with deterministic checks (field presence, required values) are reliable for structural gaps — they are code-level, not probabilistic. Self-critique is suited for content quality gaps where the field is present but insufficiently detailed. A adds a second self-critique for a structural presence problem — the same generative process that missed a field once will often miss it again with identical inputs. C replaces one model-based evaluation with another; external auditing via a second model call has a similar failure rate to self-critique and adds cost. D layers both without recognizing that the right mechanism depends on the gap type — structural gaps need deterministic checks, not more generative passes. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:29", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team's CI review pipeline runs `claude -p` without any system prompt or CLAUDE.md, relying entirely on the user-turn prompt for instructions. On a codebase that handles financial transactions, Claude occasionally suggests changes that would alter business logic, not just report findings. What is the most direct architectural fix?", "opts": ["Add explicit instructions at the end of the user-turn prompt to remind Claude that it should only report findings and not propose changes", "Use `--max-tokens 500` to limit response length, which prevents Claude from generating the verbose change proposals that contain business logic modifications", "Create a CI-scoped CLAUDE.md that defines Claude's role as a read-only reviewer with explicit constraints: report findings only, never propose code modifications, never make assumptions about business logic intent", "Switch to a model with stricter instruction-following behavior, as the current model is not adhering to the implicit constraint that a reviewer should not alter code"], "answerIdx": 2, "explanation": "**C)** A CI-scoped CLAUDE.md that explicitly defines the agent's role and constraints is the correct architectural fix for repeated role drift in automated pipelines. It sets the behavioral contract at the context level rather than relying on per-prompt reminders that can be overlooked. A is wrong because adding reminders to the user prompt is a fragile approach — it requires every future prompt to include the constraint and is easily missed during prompt updates. B is wrong because `--max-tokens 500` truncates output arbitrarily and may cut off legitimate findings before they're reported, while not actually preventing the model from including change proposals in what it does output. D is wrong because the problem is not model capability — it is a missing role definition in the prompt architecture. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:3", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer on your team created a `/deploy` skill in `.claude/skills/deploy.md`. You want a personal version of `/deploy` that also runs a pre-flight checklist your team doesn't use. You create `~/.claude/skills/deploy.md`. When you type `/deploy` in a project session, which version runs?", "opts": ["Both run sequentially — personal version first, then project version — and Claude merges their outputs automatically.", "Your personal version in `~/.claude/skills/` because user config always takes precedence over project config in Claude Code.", "Claude prompts you to choose between the two versions at runtime via an interactive disambiguation menu.", "The project version in `.claude/skills/` because project skills take precedence over personal skills with the same name."], "answerIdx": 3, "explanation": "**D)** Project skills take precedence over personal skills when they share the same name. Your personal `~/.claude/skills/deploy.md` is silently shadowed by the project version. B is wrong: user config does NOT take precedence here — it is the opposite for skill name collisions. A is wrong: skills don't merge or chain automatically; only one executes. C is wrong: there is no disambiguation menu — the collision is resolved silently by precedence rules. To use your custom version, you must give it a different name (e.g., `/my-deploy`). (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-customer-support:17", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Analysis shows your agent escalates 88% of tickets where customers use language like \"furious,\" \"unacceptable,\" or \"demanding\" but only 31% of tickets with identical underlying complexity when written calmly. The escalation logic lives entirely in the system prompt. What is the architectural problem?", "opts": ["The system prompt escalation criteria are implicitly keyed on sentiment signals rather than complexity and policy indicators, conflating customer emotional state with case difficulty", "The model needs a larger context window to evaluate emotional tickets fully before applying escalation heuristics to avoid premature triggers", "The escalation tool descriptions are too permissive — they should include explicit sentiment signal thresholds to standardize when the trigger fires", "The base model is oversensitive to charged language — fine-tuning on a labeled dataset of correctly escalated and non-escalated historical tickets would remove this calibration bias"], "answerIdx": 0, "explanation": "**A)** The 88% vs. 31% disparity maps directly to emotional language, confirming the criteria are using sentiment as a proxy for case complexity. The fix is to rewrite escalation criteria around actual complexity indicators — policy gaps, unresolvable tool failures, explicit customer requests — not tone. B misattributes the cause to context length; the problem is in the decision logic. C would institutionalize the anti-pattern by encoding sentiment thresholds into tool definitions. D requires labeled training data and model retraining for a problem solvable by rewriting the system prompt criteria. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:14", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer is using Claude Code in a JetBrains IDE via the Claude Code plugin. After renaming a file through the IDE's refactoring tool, Claude Code still references the old file name in subsequent suggestions. What is the most likely cause and fix?", "opts": ["The JetBrains plugin uses a snapshot of the file tree captured at session start; the developer must restart the Claude Code session after any IDE-level refactoring to sync the file tree state.", "JetBrains IDE refactoring bypasses the filesystem watcher that Claude Code relies on — use `git mv` instead so the rename is reflected in `git status` and picked up by Claude Code's context.", "Ask Claude Code to re-read the affected file or directory explicitly — Claude Code builds context from what it has read in the session, so a re-read updates it with the new file name.", "Clear the Claude Code plugin cache via the plugin settings panel after any rename; the JetBrains plugin caches symbol resolution and requires manual invalidation to prevent stale names."], "answerIdx": 2, "explanation": "**C)** Claude Code builds context from what it has explicitly read in the session. After an IDE-level rename, the model's context still contains the old file name from previous reads. Asking Claude Code to re-read the affected files or directory updates its working context with the new name. A) is plausible but overstates the issue — a full session restart is not required. B) is incorrect — git status is not the primary mechanism Claude Code uses to track file names in context. D) describes a non-existent cache invalidation UI in the JetBrains plugin. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-ci-cd:7", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Your shell script runs `claude -p \"Analyze PR #412\"` and must treat any Claude invocation failure as a pipeline error that blocks the merge. The script currently ignores the process exit code. What is the correct handling pattern?", "opts": ["Check `$?` after the `claude -p` command; a non-zero exit code indicates invocation failure, and the script should `exit 1` to fail the CI step", "Wrap the call in a try/catch block and check whether the output string contains \"error\" or \"failed\" to detect failures", "Run `claude -p` in a subshell and capture stderr; if stderr is non-empty, treat the run as failed regardless of stdout content", "Add a timeout wrapper with `timeout 30 claude -p \"...\"` and treat timeout expiry as the only failure condition worth blocking on"], "answerIdx": 0, "explanation": "**A)** `claude -p` returns a non-zero exit code on invocation failure (rate limit, authentication error, network failure). Checking `$?` is the documented and reliable way to detect these. B is wrong because parsing output text for error strings is brittle — the error message format may change and Claude may produce output that coincidentally contains the word \"error\" in a non-failure context. C is wrong because stderr presence is not the authoritative signal; some diagnostic output goes to stderr even on success. D is wrong because timeout expiry is one failure mode, not the complete set — rate limits, auth failures, and invalid flags all return non-zero without timing out. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-multi-agent-research:9", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "An analysis subagent encounters conflicting statistics from two credible peer-reviewed sources: one reports 34% adoption, the other reports 61% for the same metric in the same year. Both sources appear methodologically sound. What should the subagent do?", "opts": ["Apply an internal heuristic — select the more conservative figure (34%) to avoid overstating findings, note the discrepancy in a footnote, and proceed without escalating", "Proceed with the arithmetic mean (47.5%) to produce a single figure, attribute it to both sources with a caveat about variance, and continue the analysis without escalation", "Immediately halt its analysis task and escalate to the coordinator, providing both figures, so the coordinator can resolve the conflict before analysis continues", "Include both figures in its analysis output with source attribution for each, flag the conflict explicitly, and defer the reconciliation decision to the coordinator"], "answerIdx": 3, "explanation": "**D)** The analysis agent's job is to complete its analysis and surface what it found — including uncertainty. Providing both figures with source attribution and explicit conflict flagging gives the coordinator the full picture without blocking the analysis pipeline. The coordinator has broader context (publication dates, sample sizes, scope definitions) to decide whether the discrepancy matters and how to reconcile it. A is wrong because unilaterally selecting the conservative figure discards information and introduces undisclosed bias — the \"footnote\" approach conceals a decision that should belong to the coordinator. B is wrong because averaging conflicting figures from independent studies produces a statistically meaningless value and misrepresents what the sources actually say. C is wrong because halting blocks progress unnecessarily; the analysis agent can complete its work and surface the conflict in its output without stopping the workflow. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-code-generation:10", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer's skill for generating REST endpoint scaffolding keeps producing handler signatures that don't match your team's conventions. They've tried three different prose descriptions in the skill file. What change will most reliably eliminate the inconsistency?", "opts": ["Add a `model: opus` directive to the skill frontmatter to improve instruction-following fidelity on convention adherence.", "Add 2-3 concrete input-output examples showing an existing endpoint's request shape and the expected scaffolded handler signature.", "Refactor the skill's prose description into numbered steps with explicit constraints on each naming rule.", "Add `context: fork` to the skill so each invocation starts from a clean context without prior convention drift."], "answerIdx": 1, "explanation": "**B)** Concrete input-output examples directly address the root cause: prose descriptions of transformation tasks are ambiguous and interpreted inconsistently. Showing an existing request shape alongside the exact expected handler signature eliminates the ambiguity that numbered steps still leave open. A is wrong because upgrading the model improves general capability but doesn't resolve the interpretation problem — a more capable model will still misinterpret vague prose. C is wrong because numbered prose steps are still prose; they reduce ambiguity somewhat but don't eliminate it the way examples do. D is wrong because `context: fork` isolates context per invocation but doesn't change how the model interprets the convention description — context drift is not the root cause here. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-structured-extraction:26", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You are designing an extraction schema for medical device incident reports. Reports describe the same failure using varied terminology (\"battery drain,\" \"power depletion,\" \"unexpected shutdown\"). Your current schema has a strict `failure_mode` enum with 12 values. How should you design the schema to handle terminological variation without losing structured classification?", "opts": ["Expand the enum to include all known synonyms as distinct values (e.g., `\"battery_drain\"`, `\"power_depletion\"`, `\"unexpected_shutdown\"` as separate entries) to match source language exactly.", "Add a prompt instruction listing all synonym mappings: \"battery drain, power depletion, and unexpected shutdown all map to failure_mode: power_failure\" for each of the 12 categories.", "Keep the structured enum for canonical category classification and add a `source_terms` string array field capturing the exact terminology used in the report for auditing and future enum refinement.", "Replace the enum with a free-text `failure_mode_description` field and cluster similar descriptions into categories in a scheduled offline post-processing job."], "answerIdx": 2, "explanation": "**C)** Keeping the enum preserves structured categorization for downstream analytics while the `source_terms` array preserves the original language for auditing, regulatory traceability, and prompt refinement. A) synonym explosion makes the enum unmanageable and creates artificial distinctions between equivalent failure modes. B) prompt instructions listing all synonyms are fragile, grow linearly with vocabulary, and require constant maintenance as new terminology emerges. D) free-text loses real-time structured classification. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-developer-productivity:27", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer asks Claude Code to create a git branch, commit staged changes, and open a PR in a single session. Claude Code creates the branch, commits, and runs `gh pr create`. The PR opens targeting the wrong base branch because the developer's local `main` was ahead of `origin/main`. Which pattern would have caught this before PR creation?", "opts": ["Add a `PreToolUse` hook matching `tool_name: \"Bash\"` that blocks any `git push` or `gh pr create` command and requires manual approval via a confirmation prompt in the terminal.", "Use `--dangerously-skip-permissions` to allow all git operations without confirmation, then manually retarget the PR base branch in the GitHub UI after the PR is created.", "Before running `gh pr create`, have Claude Code run `git fetch origin` and `git status --short --branch` to verify the local branch is tracking the correct remote base and is synchronized.", "Register a `PostToolUse` hook on `gh pr create` that parses the PR URL from stdout and calls `gh pr edit --base main` automatically to correct the base branch after creation."], "answerIdx": 2, "explanation": "**C)** The root cause is stale local git state. Running `git fetch origin` before `gh pr create` syncs the remote refs, and `git status --branch` surfaces any divergence before the PR is created. This is a pre-flight validation step. A) blocks the command entirely — a blunt instrument that introduces friction without fixing the state validation problem. B) uses a dangerous flag and expects post-hoc manual correction. D) is a compensating action after the PR is already created with the wrong base, which may have already triggered CI on the wrong target branch. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-structured-extraction:9", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You are designing a field-level confidence validation step for a contract extraction pipeline. After schema validation passes, you want to flag individual fields for human review when extraction confidence is low. Which output design pattern enables this most cleanly?", "opts": ["Add a parallel `confidence` object to the schema that mirrors every extraction field with a 0–1 float score, enabling field-level routing decisions without modifying extracted values.", "Ask the model to rate its overall confidence for the entire extraction as a single percentage score alongside the extracted JSON object.", "Instruct the model to add inline JSON comments (`// confidence: 0.4`) to fields it is uncertain about, then parse those comments in a post-processing normalization step.", "Include a `low_confidence_fields` string array listing field names the model is uncertain about, so reviewers see exactly which parts of the extraction need checking."], "answerIdx": 0, "explanation": "**A)** A parallel `confidence` object provides a structured signal for every field without polluting the extracted data. Downstream routing can check `confidence.vendor_address < 0.7` and queue just that field for review. B) aggregates across all fields, masking which specific field is uncertain. C) uses non-standard JSON syntax that is rejected by all standard JSON parsers. D) lists field names without scores, making threshold-based routing impossible to implement consistently. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:1", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your customer support agent has `lookup_order`, `get_account_info`, and `process_refund` in its tool set. It consistently calls `lookup_order` for billing cycle questions, even though `get_account_info` exists for account-level queries. You have not changed any descriptions since deployment. What is the most direct first step?", "opts": ["Add a preprocessing classifier that routes billing vs. order keywords to the correct tool before passing the query to the agent", "Add few-shot examples to the system prompt showing `get_account_info` being selected for billing questions to reinforce the correct pattern", "Review and expand each tool description with input formats, example queries, negative examples (\"not for...\"), and explicit boundaries between overlapping tools", "Consolidate `lookup_order` and `get_account_info` into a single `lookup_customer_data` tool with a `query_type` parameter to simplify selection"], "answerIdx": 2, "explanation": "**C)** Tool descriptions are the primary signal the model uses for tool selection. When selection errors are systematic, descriptions are the root cause and the lowest-effort, highest-leverage fix. A adds routing infrastructure before diagnosing the underlying signal problem. B layers few-shot guidance on top of descriptions that are still ambiguous — examples may not override unclear scope. D removes the ability to invoke tools in parallel for cross-cutting queries by merging them into one. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-structured-extraction:27", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your multi-agent extraction pipeline has a coordinator that spawns specialized subagents for different document sections. After a pipeline crash, the coordinator restarts with no record of which subagents completed and what they extracted. What architectural pattern prevents restarting from scratch?", "opts": ["Store all intermediate extraction results in a central database and have the coordinator query it on startup to reconstruct which sections were processed and what was found.", "Have each subagent write its extracted output and completion status to a structured manifest file at a known path; the coordinator reads this manifest on startup and skips already-completed subagents.", "Run all subagents in parallel so the full extraction completes in one fast pass, minimizing the window during which a crash can cause significant work loss.", "Increase subagent timeout limits so each subagent is less likely to time out before completing, reducing the probability that the coordinator must restart mid-pipeline."], "answerIdx": 1, "explanation": "**B)** Structured manifest files at known paths provide crash-resilient state. On restart, the coordinator reads each subagent's manifest to determine completion status and load extracted data, then resumes from the last checkpoint rather than restarting all subagents from scratch. A) is functionally similar but introduces a database dependency where file manifests are simpler and equally effective. C) parallelism reduces crash window but does not help when crashes do occur during the parallel run. D) reduces crash probability but provides no recovery capability when crashes occur. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:21", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent must ensure `process_refund` is never called with an amount exceeding the original order value. The order amount is retrieved via `lookup_order` three turns earlier and may have been summarized out of the active context window. Where do you enforce this constraint most reliably?", "opts": ["Add a system prompt instruction: \"Before calling `process_refund`, always verify the refund amount against the order total retrieved earlier in this session\"", "Add a PreToolUse hook on `process_refund` that reads the order amount from the persistent case facts block and rejects the call if the refund amount exceeds it", "Add three to four few-shot examples showing correct refund amount validation steps taken before calling `process_refund` in the conversation flow", "Add a PostLLMResponse hook that scans the model's response text for mentioned refund amounts and flags any values that appear too high before delivery"], "answerIdx": 1, "explanation": "**B)** A PreToolUse hook fires deterministically every time `process_refund` is about to execute, reads the order amount from the persistent case facts block — which is immune to summarization — and blocks the call if the constraint is violated. This is code-level enforcement with no failure rate. A is a prompt instruction that can be lost to summarization or overridden by model behavior; the scenario explicitly describes the order amount being removed from active context. C is probabilistic — few-shot examples improve average behavior but cannot guarantee zero over-refund in every case. D fires after the response is generated, not before the tool executes; the refund call may already be committed by the time the hook runs. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:14", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A pipeline using `claude -p` for comment accuracy review produces noisy results: it flags TODO markers and placeholder comments while missing stale behavior descriptions where the code no longer does what the comment says. What prompt change resolves both over-flagging and under-detection?", "opts": ["Add few-shot examples showing correctly ignored TODO markers and correctly flagged stale descriptions so Claude learns the boundary from examples", "Use a two-pass prompt: first extract all comments, then classify each comment as stale or valid in a second call", "Replace the vague instruction \"check that comments are accurate\" with the explicit criterion \"flag only when the comment describes behavior that contradicts what the code actually does\"", "Add a pre-filter step that strips TODO, FIXME, and HACK markers before passing the file to Claude for review"], "answerIdx": 2, "explanation": "**C)** The vague instruction \"check comments are accurate\" is underspecified — it doesn't define what \"accurate\" means for different comment types. The explicit criterion \"flag only when claimed behavior contradicts actual code behavior\" is precise: it excludes TODO markers (which describe future work, not current behavior), while requiring Claude to detect semantic mismatches between description and implementation. A is wrong because few-shot examples are probabilistic — they shift the distribution but don't guarantee the boundary is respected, especially for novel comment patterns. B adds latency and complexity but the classification step faces the same ambiguity as the original prompt. D pre-filters noise but does nothing about the misses (stale behavior descriptions). (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:15", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You build few-shot examples for an extraction prompt processing real estate listings. Your 200 example documents are drawn randomly from the full dataset, which is 90% residential properties. After deployment, commercial property fields have poor extraction accuracy. What caused this and how should you fix it?", "opts": ["Few-shot examples cannot represent commercial properties because the schema field names differ too much from residential; create separate schemas and prompts per property type.", "The model overfits to the dominant document type in few-shot examples; stratify examples across document types rather than sampling randomly from the full distribution.", "The model lacks sufficient training data for commercial real estate terminology and few-shot examples cannot compensate for this knowledge gap.", "The total number of examples (200) is too small to capture variance; a minimum of 500 examples is needed before the distribution skew becomes statistically irrelevant."], "answerIdx": 1, "explanation": "**B)** Few-shot examples teach the model the patterns present in those examples. A 90% residential distribution biases the model toward residential extraction behavior, causing commercial property fields to be extracted using residential heuristics. Stratifying examples to represent minority document types ensures the model learns extraction patterns for each type. A) separate schemas are sometimes valid but stratification should be tried first. C) is false — few-shot examples are specifically designed to compensate for domain gaps. D) quantity does not fix a distribution imbalance; stratification does. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:12", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A ticket arrives with a refund request and a separate shipping complaint. The agent resolves the refund in 2 turns but drops the shipping complaint without acknowledgment in 35% of sessions. No tool calls fail. Single-issue accuracy is above 90% for both concern types independently. What is the most effective fix?", "opts": ["Build a preprocessing routing layer that splits each ticket into sub-tickets and opens a separate agent session for each concern", "Add a PostLLMResponse hook that scans each response for unresolved concern keywords and appends a reminder if any are detected", "Add few-shot examples demonstrating how to explicitly acknowledge all stated concerns at the start of the conversation and track each to resolution before closing", "Require the agent to emit a structured JSON concern checklist before any tool calls and enforce that all items are marked resolved before the session ends"], "answerIdx": 2, "explanation": "**C)** The agent handles each concern type correctly in isolation — the failure is multi-concern tracking, not tool knowledge. Few-shot examples teaching explicit concern acknowledgment and closure tracking are the minimum-complexity fix that directly addresses the behavioral gap. A over-architects a routing layer for a problem solvable at the prompt level. B uses a hook as a compensating control for missing behavior — brittle to phrasing variation and adds per-response inference overhead. D enforces schema structure but does not teach the agent to actually track and resolve each checklist item throughout the conversation. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-structured-extraction:19", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You are choosing between two extraction approaches for a 25-field schema with nested arrays: (A) direct JSON output via text response, and (B) `tool_use` with a strict JSON schema. What is the most accurate description of the core trade-off?", "opts": ["Tool use is only reliable for flat schemas with under 15 fields; nested arrays require direct text output with post-extraction regex parsing to guarantee correct nesting structure.", "Tool use enforces syntactic schema compliance but cannot prevent semantic errors (wrong value in the right field); direct JSON output is more error-prone on syntax but gives the model flexibility to express uncertainty inline.", "Direct JSON output is preferred for narrative string fields because tool use strips leading/trailing whitespace from string values, breaking paragraph formatting in extracted text.", "Tool use doubles extraction latency because the model must call the tool, await a response message, and then format its final output — whereas text output is generated in one uninterrupted forward pass."], "answerIdx": 1, "explanation": "**B)** Tool use with strict schemas eliminates JSON syntax errors and guarantees structural compliance including nested arrays. However, it cannot prevent semantic errors: a `total_amount` field might receive the `subtotal` value, or line items might not sum to the stated total — both structurally valid but semantically wrong. Text-based JSON is more error-prone on both syntax and semantics. A) is false — tool use handles nested arrays correctly. C) is false — tool use does not alter string content. D) is false — tool use is a single API call with no additional roundtrip. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-code-generation:25", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You have a `.claude/rules/graphql-conventions.md` file with `globs: \"src/graphql/**\"` in its frontmatter. A developer edits `src/graphql/schema.graphql`. The rules file does NOT appear to be active during the session. What should you check first?", "opts": ["Whether the `.claude/rules/` directory has a `rules.json` index listing all rule files — Claude Code requires explicit registration before rules activate.", "Whether the rules file has a valid YAML frontmatter block delimited by `---` at the top and bottom — missing delimiters cause silent parse failure.", "Whether the path uses forward slashes — Windows-style backslashes in glob patterns cause silent match failures across all platforms.", "Whether the frontmatter key is `glob` (singular) — the plural `globs` is not recognized by Claude Code's rules evaluation layer."], "answerIdx": 1, "explanation": "**B)** YAML frontmatter must be delimited by `---` at the start and end of the block. Without the opening and closing `---` delimiters, Claude Code does not parse the frontmatter, and the rules file either loads unconditionally or fails silently. This is the most common silent failure mode. A is wrong because `.claude/rules/` does not require a `rules.json` index — files in that directory are automatically discovered by Claude Code. C is wrong because Claude Code runs on macOS/Linux in standard developer environments where forward slashes are the norm; backslashes are a plausible-sounding trap but not the first thing to check. D is wrong because `globs` (plural) is the correct field name — using `glob` singular is the error, not the other way around. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:17", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A `PreToolUse` hook validates `bash` tool calls by checking that commands don't include `rm -rf`. In production, the agent bypasses it by issuing `rm -rf /data` (double space). The hook uses the naive check `if \"rm -rf\" in command`. What is the better validation approach?", "opts": ["Extend the string match to cover `rm -rf` with double space, and add common variants like `rm -r -f` and `rm -fr` to a blocklist covering the known flag permutations.", "Replace the `PreToolUse` hook with a `PostToolUse` hook that detects successful deletions from the tool output and issues a `restore_from_backup` compensating action after the fact.", "Block all `bash` tool calls entirely via the `deny` list in `.claude/settings.json` and route all shell operations through curated MCP tools with their own input validation schemas.", "Parse the command with a shell tokenizer like `shlex.split()` and check the resulting token list for `rm` followed by tokens containing `-r` and `-f` flags, regardless of spacing or flag order."], "answerIdx": 3, "explanation": "**D)** Shell command validation must be done at the token level, not string match level. `shlex.split()` produces the canonical token list, making the check robust to spacing variations, flag reordering (`-rf`, `-fr`, `-r -f`), and quoting. A) is a patch that enumerates known variants but will miss new ones — an arms race. B) is a post-hoc recovery approach that cannot prevent data loss from an already-executed deletion. C) is a valid hardening strategy but eliminates bash tool functionality entirely, acceptable only if all needed operations can be expressed as named tools. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:21", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Two research subagents are running in parallel and are both assigned the broad topic \"regulatory frameworks for autonomous vehicles.\" After completion, the coordinator finds that both agents produced nearly identical analyses of EU and US frameworks, but neither covered Asian markets. What is the coordinator's correct diagnosis and response?", "opts": ["The subagents should have coordinated directly to split coverage before beginning research — enable peer-to-peer communication between them for the next run", "The coordinator's task decomposition did not explicitly partition geographic scope — revise decomposition to assign distinct regions to each subagent before the next run", "The subagents' web search APIs returned geographically biased results — switch to a search provider with broader international coverage", "The synthesis agent failed to identify the geographic gap during integration — add gap detection logic to the synthesis agent's prompt"], "answerIdx": 1, "explanation": "**B)** Both subagents covered the same regions and missed the same region — this is a decomposition failure, not a subagent execution failure or search API limitation. The coordinator assigned both agents the same broad topic without partitioning geographic scope, so both agents naturally followed the same prominent information landscape. Explicit partitioning (agent 1: EU + Americas, agent 2: Asia + rest of world) would have ensured coverage. A is wrong because peer-to-peer coordination between subagents to split their own work scope introduces complex real-time negotiation and removes the coordinator's control over decomposition, which is the coordinator's core responsibility. C is wrong because there is no evidence of search API bias — the agents were not asked to cover Asian markets, so they didn't; the API performed correctly within the assigned scope. D is wrong because gap detection in the synthesis agent addresses the symptom (missing output), not the cause (missing input from subagents who were never assigned the topic). (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-structured-extraction:28", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You are building an extraction system that must handle documents in English, Spanish, French, and German. All few-shot examples are in English. When deployed on Spanish documents, field values are extracted correctly but sometimes mix Spanish and English (e.g., `\"status\": \"completado / completed\"`). What is the most direct fix?", "opts": ["Add a post-processing normalization step that detects and strips English translations from bilingual extracted values before storing results in the database.", "Add a language detection tool call before each extraction to identify the document language, then branch to a language-specific system prompt tailored to each of the four languages.", "Add a system prompt instruction: \"Always return extracted field values in the same language as the source document, not in English or mixed form.\"", "Add language-stratified few-shot examples with at least one example per supported language showing extraction with field values returned in the source document's language."], "answerIdx": 3, "explanation": "**D)** Few-shot examples demonstrate not just field mapping but also output language conventions. English-only examples teach the model that extracted values should be in English, which bleeds into non-English document extractions. Adding stratified examples in each target language shows the model that values should match the source document's language. A) is a fragile workaround that fails for bilingual documents where mixed language is intentional. B) adds complexity; the few-shot stratification fix addresses the root cause directly. C) prompt instructions are less reliable than demonstrated examples for output language; the examples are stronger behavioral signal. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-multi-agent-research:1", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A coordinator dispatches 4 parallel subagents to research AI adoption across manufacturing, healthcare, finance, and retail. After all subagents return, the final report is missing any coverage of logistics and transportation — a major sector in prior briefing notes. The subagent logs show all 4 agents completed their assigned scopes without errors. Where is the root cause?", "opts": ["The coordinator's initial decomposition omitted logistics and transportation from the research scope it assigned to subagents", "The web search subagent's search API returned no results for logistics queries, and the agent did not flag this as a gap", "The synthesis agent filtered out logistics content because it lacked matching keywords in its topic classifier configuration", "The subagents each worked in isolation and none detected that another sector was missing from the combined output"], "answerIdx": 0, "explanation": "**A)** The subagent logs confirm all 4 agents executed their assigned tasks correctly — they covered exactly what the coordinator told them to cover. When subagents perform correctly but coverage is wrong, the fault is always in the coordinator's decomposition, not subagent execution. B is wrong because the subagents had no logistics assignment to even attempt; a failed web search would still be within an assigned scope. C is wrong because the synthesis agent operates on what it receives — it cannot add coverage the subagents never produced. D is wrong because subagents are correctly isolated — detecting cross-agent gaps is the coordinator's responsibility, not each subagent's. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-developer-productivity:1", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A pipeline tool called `process_record` accepts either a raw JSON payload or a file path and behaves differently based on what it detects at runtime. Engineers report the model sends file paths when it should send payloads and vice versa. What is the root cause and fix?", "opts": ["Add a preprocessing step that sniffs the input and normalizes it to JSON before the model call, keeping one unified tool with automatic type detection logic inside the server.", "Use `tool_choice: \"any\"` to force a tool call attempt, then validate parameter type in a PostToolUse hook that returns a corrective error for the wrong format on each turn.", "Expand the `process_record` description to 500+ characters explaining both modes in detail, with inline examples for JSON and file-path variants to improve model discrimination.", "Split into `process_record_from_payload` and `process_record_from_file`, each with a description specifying its exact input type, return shape, and when to use it over the other."], "answerIdx": 3, "explanation": "**D)** When a single tool handles multiple semantically distinct input modes, the model cannot reliably choose the correct mode because the tool's decision surface is underspecified. Splitting into two named tools gives the model a clear structural signal at selection time. A) hides the problem rather than resolving it — the model still sends the wrong input type, and silent coercion masks bugs. B) is a reactive workaround that adds latency and still cannot guarantee correct behavior. C) improves descriptions but does not eliminate the ambiguity baked into a multi-mode interface. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-ci-cd:11", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "Before deploying a new `claude -p` review prompt across 5,000 weekly batch runs, a team wants to validate prompt quality and catch formatting regressions. What is the correct sequencing?", "opts": ["Run a full batch of 5,000 first, then inspect a random 1% sample to identify issues before deploying to production", "Use the Message Batches API on the full 5,000 but set a low `max_tokens` cap to accelerate validation runs before removing the cap for production", "Run the prompt once synchronously on a single document and treat success as sufficient validation before batch deployment", "Iterate the prompt on a representative sample of 20–50 documents with synchronous calls, validate output format and quality, then promote to batch for the full run"], "answerIdx": 3, "explanation": "**D)** Prompt iteration should happen synchronously on a small, representative sample — fast feedback, low cost, ability to inspect and refine before committing to scale. Synchronous calls give immediate results for comparison; once quality is confirmed, batch the full volume. A is wrong because running the full 5,000 before validating means paying for 5,000 calls at the full cost before knowing if the prompt works. B is wrong because `max_tokens` truncation changes the output behavior, making validation results non-representative of production runs. C is wrong because a single document is not a representative sample — edge cases and format variations won't surface until the batch run. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:15", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You want to add an `argument-hint` to a skill so developers know what argument to pass. Where must this be declared, and what does it affect?", "opts": ["Declared in the project `.claude/config.yaml` under the skill's entry; it controls argument validation before the skill body is loaded.", "Declared as a comment at the top of the skill markdown body (e.g., `<!-- argument-hint: branch name -->`); Claude extracts it at parse time.", "Declared in the skill's YAML frontmatter; it surfaces as a placeholder label in the slash command input to guide the developer.", "Declared in CLAUDE.md under a `[skills]` section; it populates the argument placeholder in Claude's slash command autocomplete UI."], "answerIdx": 2, "explanation": "**C)** `argument-hint` is a YAML frontmatter field in the skill file (`.claude/skills/` or `~/.claude/skills/`). It surfaces as a placeholder label when the developer types the slash command, guiding them on what argument to provide. D is wrong because CLAUDE.md does not have a `[skills]` section — skill metadata belongs in the skill file's own frontmatter. B is wrong because HTML comments in the markdown body are not parsed as frontmatter; argument-hint must be in the YAML frontmatter block. A is wrong because `.claude/config.yaml` is not a recognized Claude Code configuration file; skill metadata lives in the skill file's own frontmatter, not a separate config registry. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:7", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer is about to perform a large refactor that will touch 40+ files across 6 packages. The scope and ordering of changes are not yet fully defined. Which Claude Code mode should they use first, and why?", "opts": ["Execute mode immediately, because Claude Code autonomously discovers the correct ordering by reading the codebase before making any changes, without needing a separate plan phase.", "Plan mode first to generate a structured plan across all affected files and packages before any edits are made, then review and selectively approve the plan before execution.", "Use `--dangerously-skip-permissions` in execute mode so the agent can move through all 40 files without prompting for each write operation and finish faster.", "Start in execute mode with a narrow scope of 5 files, then rerun for the remaining files in batches to limit blast radius per session while maintaining full speed."], "answerIdx": 1, "explanation": "**B)** Plan mode is the documented approach for large refactors with undefined scope — it generates a reviewable plan before touching any files, letting the developer validate ordering and coverage before committing. A) risks making incorrect edits before the full impact is understood. C) skips safety checks and is inappropriate when scope is unknown — `--dangerously-skip-permissions` is for trusted automated pipelines with well-understood scope, not exploratory refactoring. D) is a manual batching workaround that fragments the coherence of a single refactor. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:6", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You are running `claude -p` in a CI pipeline to enforce a coding standard. The script must exit with a non-zero code if the model flags any violations. Using `--output-format json`, the model returns `{\"result\": \"No violations found.\"}` or `{\"result\": \"Violation: missing type annotation on line 42.\"}`. How should the CI script reliably detect failures?", "opts": ["Check the exit code of the `claude -p` command directly — it returns 1 when the model identifies a problem and 0 when the content is clean, matching standard Unix convention.", "Design the prompt to return a structured JSON object like `{\"violations\": [...]}` as the model's output, then use `jq '.result | fromjson | .violations | length > 0'` to detect non-empty arrays.", "Stream output with `--output-format stream-json` and detect the `input_json_delta` event type, which is emitted exclusively when the model generates structured violation data in its output.", "Parse `jq '.result'` and use a regex to check for the word \"Violation\" in the result string, then exit 1 if the pattern matches anywhere in the response."], "answerIdx": 1, "explanation": "**B)** The correct pattern is to instruct the model to emit structured JSON as its output content, then double-parse with `jq '.result | fromjson'`. This gives the script a machine-readable, regex-free signal. A) is incorrect — `claude -p` exit codes reflect execution errors, not model-reported content. C) misuses the streaming event type; `input_json_delta` is part of streaming tool call assembly, not a general violation signal. D) relies on natural language parsing of the result string — the model may rephrase the message across runs. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-code-generation:14", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A team member receives a guideline to always prefix commit messages with a JIRA ticket number. Three other team members on the same repo do not receive this guideline. All four share the same project CLAUDE.md. What is the most likely cause?", "opts": ["A `.claude/rules/` file uses a glob pattern that accidentally matches only files under this developer's home directory path.", "The `@import` directive in the project CLAUDE.md fails silently when the target file is absent on the affected developer's machine.", "The project CLAUDE.md has a `user-specific: true` frontmatter field that gates the rule based on the developer's git identity.", "The guideline lives in the developer's personal `~/.claude/CLAUDE.md`, which is not version-controlled and not shared with teammates."], "answerIdx": 3, "explanation": "**D)** User-level config at `~/.claude/CLAUDE.md` is personal to each developer's machine and is not shared via version control. If the guideline lives there instead of the project-level `.claude/CLAUDE.md`, only the developer who wrote it receives it. B is wrong because `@import` failure surfaces as a missing section for everyone, not as a selective per-developer effect; also the question states all four share the same project CLAUDE.md. A is wrong because glob patterns in `.claude/rules/` match file paths in the codebase, not filesystem paths on the developer's machine. C is wrong because `user-specific` is not a valid CLAUDE.md frontmatter field. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:22", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A tool named `get_order` has the description: \"Gets an order.\" The model frequently calls it with a `user_id` parameter instead of the required `order_id`, causing validation errors. Which change most reduces this error?", "opts": ["Add the sentence: \"Do not pass user_id to this tool.\" as a negative constraint appended to the end of the current description.", "Add `\"required\": [\"order_id\"]` to the tool's JSON schema so the model encounters a schema-level constraint and stops attempting to pass user_id as a substitute.", "Rewrite the description to specify the exact required parameter, its type, an example value, the return shape, and when to use it versus `get_orders_by_user` — e.g., \"Fetches a single order record by its unique `order_id` (string, e.g. 'ORD-4829'). Returns status, line items, and shipping. Use when you have a specific order_id; use `get_orders_by_user` when you only have a user_id.\"", "Create a second tool `get_order_v2` with an improved description and mark `get_order` as deprecated by prepending \"DEPRECATED: use get_order_v2\" to its existing description."], "answerIdx": 2, "explanation": "**C)** A comprehensive description specifying the required parameter, its type, an example value, the return shape, and a cross-reference to the alternative tool eliminates the ambiguity that causes wrong-parameter calls. A) negative constraints help marginally but don't provide positive guidance on correct usage. B) JSON schema enforcement prevents schema-invalid calls but doesn't explain what correct input looks like; the model may still try to send user_id and fail validation. D) creates maintenance overhead without fixing the underlying description quality problem. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-structured-extraction:17", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You set `display: 'omitted'` on extended thinking for a document extraction pipeline to reduce response payload size and improve API response latency. What actually happens to the thinking tokens?", "opts": ["Thinking tokens are generated and used normally — they contribute to reasoning and are billed at standard thinking token rates — but are excluded from the returned API response payload.", "Thinking tokens are cached on the server side when omitted, so subsequent requests on similar documents reuse the reasoning step at no additional per-token cost.", "Thinking tokens are not generated when `display: 'omitted'` is set; the model skips the internal reasoning step and proceeds directly to extraction output, reducing both cost and latency.", "`display: 'omitted'` is only valid for streaming responses; in non-streaming mode the API silently falls back to `display: 'none'`, which disables thinking entirely."], "answerIdx": 0, "explanation": "**A)** `display: 'omitted'` controls what is returned in the response, not whether thinking occurs. The model still performs the full reasoning process, the thinking tokens are generated and billed at standard rates, and the full output latency is incurred. Only the thinking content is stripped from the response payload before it reaches the caller. B) thinking is not cached or reused across independent API requests. C) incorrectly states that thinking is skipped. D) confuses `display` behavior with streaming mode; `display: 'omitted'` functions identically in non-streaming mode. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:6", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent uses three third-party MCP tools from different vendors. Tool A returns dates as Unix timestamps, Tool B returns ISO 8601, Tool C returns `MM/DD/YYYY`. You cannot modify the vendor implementations. The agent is inconsis
