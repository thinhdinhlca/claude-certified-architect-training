tently comparing dates across tool results. What is the correct fix?", "opts": ["Add a PostToolUse hook that intercepts results from each tool and transforms date fields to a uniform ISO 8601 format before the model sees them", "Document each tool's date format in the system prompt and instruct the model to perform its own format conversion before comparing dates", "Create a wrapper tool for each third-party tool that normalizes date formats before returning results, and register wrappers instead of originals", "Add a PreToolUse hook that injects date-format conversion instructions into tool call parameters before each tool executes"], "answerIdx": 0, "explanation": "**A)** PostToolUse hooks are the correct interception point for normalizing third-party tool outputs you cannot modify. The normalization is deterministic code, not LLM interpretation, guaranteeing uniform output every call. B relies on the model to convert formats consistently across turns — probabilistic and prone to failure on edge cases. C creates a per-tool wrapper maintenance burden; three separate wrappers must each be updated when any vendor changes their schema, while one hook covers all three. D fires before the tool executes and cannot affect the tool's output format — PreToolUse modifies inputs, not results. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:19", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A coordinator dispatches a research subagent to find recent case studies. The subagent completes its search and returns a structured result with `status: \"complete\"`, `documents_found: 0`, and `search_query: \"enterprise AI case studies 2024\"`. The coordinator logs show it immediately retried the subagent 3 times with identical parameters. What error in the coordinator's logic caused the unnecessary retries?", "opts": ["The coordinator interpreted `documents_found: 0` as a failure condition rather than a valid empty result, triggering its error-recovery retry path", "The coordinator's retry logic did not check for idempotent query parameters, so it assumed different retry attempts might produce different results from a deterministic search", "The coordinator lacked a deduplication layer to detect that the retry queries were identical to the original, which would have short-circuited the redundant attempts", "The coordinator's subagent invocation timeout was too short, causing it to mark the completed subagent as timed-out and retry before receiving the structured result"], "answerIdx": 0, "explanation": "**A)** `documents_found: 0` is a valid informative finding — the search completed successfully and the answer is \"no matching documents.\" A coordinator that treats zero results as a failure condition conflates access failure (the tool was unreachable) with valid empty result (the tool worked and found nothing). Retrying with identical parameters against a correctly functioning search will produce the same result every time. B is wrong because idempotency checks address whether retries are safe to make, not whether retries are appropriate — the problem here is the decision to retry at all, not the mechanics of how retries are issued. C is wrong because deduplication of identical queries is a downstream optimization that would prevent wasted tokens, but the root cause is the incorrect interpretation of `documents_found: 0` as a failure. D is wrong because the scenario states the subagent returned a structured result — a timeout would prevent the coordinator from receiving any result, so this doesn't match the described behavior. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-structured-extraction:23", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction pipeline achieves 96% accuracy validated on your test set. After deploying to production, users report that extractions from handwritten repair forms have a 35% error rate. What is the most likely cause?", "opts": ["The production endpoint uses a different model version than the evaluation environment, and that version has weaker capabilities for processing handwritten text recognition.", "Handwritten documents trigger a known context contamination issue where previous extraction results in the same session bias the model's interpretation of cursive text.", "The model's accuracy degrades after deployment due to output distribution shift caused by repeated sampling of similar documents in a high-volume production environment.", "Aggregate test-set accuracy masked poor performance on handwritten forms; the test set was not stratified to include representative handwritten document samples across form types."], "answerIdx": 3, "explanation": "**D)** Aggregate accuracy metrics hide segment-level performance gaps. If handwritten forms are 3% of test volume but have a 35% error rate, they contribute only ~1 percentage point to the aggregate error rate, buried inside the 4% overall error. Validation must be stratified by document type and field to ensure consistent performance across all segments. A) may occur but is not the likely cause without specific evidence of a model version difference. B) context contamination from previous extractions is not a standard pipeline issue. C) is not a documented model behavior. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-structured-extraction:21", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You process a 300-page government contract for extraction by streaming pages sequentially, one page per API call, accumulating extracted fields across turns. After processing, clause numbers and associated penalty amounts are frequently mismatched. What is the structural cause?", "opts": ["Streaming APIs discard intermediate tool call results from earlier turns, so fields extracted in the first 10 pages are no longer available when processing pages 200–300.", "The model's attention decays across streaming turns; long-running sequential extraction sessions should be replaced with single-pass extraction after document compression.", "Penalty amounts are numeric and trigger a known streaming artifact where floating-point values are occasionally rounded differently in separate streaming turns.", "Clause-penalty pairs span multiple pages; sequential per-page extraction without carry-forward context breaks cross-page entity associations the model cannot re-establish on a new page alone."], "answerIdx": 3, "explanation": "**D)** Cross-page entity associations require shared context. When a clause header is on page 18 and its penalty amount appears on page 19, per-page extraction processes them as independent inputs without knowing they are related. Overlapping chunks (e.g., 10-page chunks with 2-page overlaps at natural section boundaries) maintain context across page boundaries and preserve clause-to-penalty associations. A) is false — tool results are preserved in conversation history across turns. B) \"attention decay\" is real but the fix is overlapping chunks, not compression. C) describes no documented numeric rounding behavior. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-developer-productivity:30", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer runs Claude Code in interactive mode and asks it to refactor a 2,000-line legacy module. Claude Code generates a plan spanning 15 edits across 8 files. The developer approves. During execution, edit #7 fails because the target anchor string no longer exists — a previous edit changed it. How should a well-designed agentic loop handle this?", "opts": ["Halt the entire session and require the developer to manually undo all 6 previous edits, since partial refactoring leaves the codebase in an indeterminate state that cannot be safely continued.", "Silently skip the failing edit, continue with edits #8–#15, and note in the final summary that edit #7 was omitted due to anchor mismatch without surfacing the issue during execution.", "Roll back all previous edits to the pre-session state using git, then re-generate the entire plan from scratch with a smaller batch size to reduce anchor drift risk.", "Surface the error to the model with the full error message, re-read the affected file to get its current state, and let the model produce a corrected edit targeting the updated anchor before continuing."], "answerIdx": 3, "explanation": "**D)** When a tool call fails mid-plan, the correct agentic response is to surface the error to the model with full context (the error message and the current file state), allowing the model to reason about the failure and produce a corrected action. This is the self-correcting loop pattern. A) is overly conservative — partial refactoring is recoverable if the model can adapt. B) silently skipping a failed edit produces a silently broken result, which is a documented anti-pattern. C) a full rollback and re-plan is appropriate only if the plan is fundamentally invalidated, not for a single anchor mismatch. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-ci-cd:9", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A CI pipeline uses the Message Batches API to perform deep code analysis. A new requirement asks the pipeline to fetch up-to-date dependency vulnerability data from an external API mid-analysis and incorporate it into the findings. What is the core constraint that makes this difficult?", "opts": ["The Message Batches API has a lower token limit per request, so adding tool results would exceed the input size for complex analyses", "The Message Batches API does not support tool definitions, so the dependency API call would need to be pre-fetched and injected into the prompt before submission", "The Message Batches API adds too much latency between tool call and tool result, making real-time vulnerability data stale by the time the model processes it", "The Message Batches API is asynchronous and fire-and-forget — there is no mechanism to intercept a tool call mid-request, execute the external API call, and return results for continued analysis within the same logical interaction"], "answerIdx": 3, "explanation": "**D)** This is a structural constraint, not a quality-of-service tradeoff. Batch is fire-and-forget: you submit a request and poll for a completed result. There is no protocol for the model to pause mid-response, signal a tool call, wait for external execution, and resume — that iterative tool-calling loop requires synchronous API. A is wrong because token limits are not the issue; batch supports the same model capabilities. B is wrong because the Batch API does support tool definitions — the real issue is that tool results cannot be fed back during an in-progress batch request. C is wrong because latency is a secondary concern; even with instant tool execution, the batch model has no mechanism to accept mid-request inputs. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:26", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You want to run an architectural analysis as a subagent — isolated from the main session — and return only a summary back to the main conversation. You do NOT want to use a skill file. What is the correct mechanism?", "opts": ["Run `claude -p \"analyze architecture and summarize\" --output summary` in a Bash tool call to capture only the final summary line.", "Use an Explore subagent in the main prompt by structuring the request to invoke Claude Code in a forked context via the `-p` flag with `--no-context` to block history inheritance.", "Invoke Claude Code with `-p` as a subprocess from within a Bash tool call, capturing stdout as the summary returned to the main conversation.", "Set `fork_session: true` as a parameter in the API call's `metadata` field to instruct the orchestrator to isolate this turn's context."], "answerIdx": 2, "explanation": "**C)** When a skill file is not used, the correct mechanism for running Claude as an isolated subagent is calling Claude Code with `-p` as a subprocess via the Bash tool. The subprocess inherits no main-session context by default, runs its analysis, and its stdout (the summary) is captured and returned to the main conversation. A is wrong because `--output summary` is not a valid Claude Code CLI flag. B is wrong because \"Explore subagent\" is a conversational construct, not a CLI mechanism; `--no-context` is not a valid flag. D is wrong because `fork_session` is not a valid parameter in the Anthropic API's `metadata` field — session forking for subagents is done via the `-p` subprocess pattern, not API metadata. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-code-generation:2", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You are onboarding a contractor who needs the GitHub MCP server configured on their machine. The team uses a shared project-scoped `.mcp.json` committed to the repo. The contractor must inject their own GitHub token without modifying the committed file. What is the correct mechanism?", "opts": ["Instruct the contractor to create a user-scoped MCP config at `~/.claude/mcp.json` that overrides the project entry.", "Add a `token_override` field inside the project `.mcp.json` pointing to an environment variable the contractor sets locally.", "Use `${GITHUB_TOKEN}` env var expansion in the project `.mcp.json` so each developer sets the variable in their shell profile.", "Add a `.mcp.local.json` file in the project root that git-ignores contractor-specific overrides per the merge protocol."], "answerIdx": 2, "explanation": "**C)** Project-scoped `.mcp.json` supports `${VAR}` env var expansion, which lets each developer inject credentials via their own shell environment without modifying the committed file. This keeps the config as a single version-controlled source of truth. A is wrong because user-scoped MCP config doesn't override project-scoped entries — they coexist, and the project entry would still require a credential value. B is wrong because `token_override` is not a valid `.mcp.json` field. D is wrong because `.mcp.local.json` is not a recognized Claude Code config file; there is no local-override merge protocol for MCP configs. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-ci-cd:12", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A CLAUDE.md is being written for a CI-only context where Claude Code runs non-interactively as part of a pull request review pipeline. The file should configure Claude's behavior for this automated role. Which element is most important to include?", "opts": ["A list of permitted shell commands Claude may execute so it can run linters and formatters autonomously during review", "Instructions scoped to the review role: what to analyze, what output format to produce, and explicit constraints like \"do not propose code changes, only report findings\"", "The team's coding style guide in full so Claude can enforce standards consistently across all reviewers", "A persona description so Claude maintains a consistent tone across all review comments posted to pull requests"], "answerIdx": 1, "explanation": "**B)** A CI-only CLAUDE.md should define the agent's role, scope, output contract, and constraints. In automated contexts, the most important constraint is limiting the agent to its intended function — reporting findings rather than making changes. This prevents unintended side effects in an unmonitored pipeline. A is wrong because granting shell execution permissions to an automated review agent widens the blast radius significantly and is inappropriate for a read-only review role. C is wrong because pasting the full style guide adds token overhead on every run and is better served by specific, actionable review criteria rather than a reference document. D is wrong because tone consistency is a secondary concern; a non-functioning or out-of-scope agent is worse than a robotic-sounding one. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:18", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A CI pipeline calls Claude Code with `-p \"run tests and summarize failures\"`. The pipeline expects Claude to use `Bash` to run the test suite. On the first run, Claude responds with a plan description instead of executing the command. What is the most likely cause?", "opts": ["The `-p` flag puts Claude in print mode, which disables all tool use and returns only text responses by default.", "Plan mode was triggered automatically because the prompt contained the word \"summarize,\" which Claude interprets as an analysis request.", "The pipeline needs to add `--allowedTools Bash` to explicitly permit tool use in non-interactive mode.", "Claude Code requires a `--no-plan` flag to skip the planning phase when running non-interactively via `-p`."], "answerIdx": 2, "explanation": "**C)** In non-interactive `-p` mode, tool permissions default to a restricted set. Explicitly passing `--allowedTools Bash` grants Claude permission to execute shell commands in the headless context. A is wrong because `-p` (print mode) does not disable tool use globally — it runs a single non-interactive turn, but tools can still be called when permitted. B is wrong because Claude does not enter plan mode based on keyword detection like \"summarize\"; plan mode is an explicit user or config-driven state. D is wrong because `--no-plan` is not a valid Claude Code CLI flag. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:20", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer runs `claude --dangerously-skip-permissions` on their local machine during active development to avoid confirmation prompts. A colleague asks if they should use the same flag in the company's shared staging environment for automated tests. What is the correct guidance?", "opts": ["It is acceptable in staging since staging environments are isolated and not customer-facing, making the risk profile equivalent to a local development machine for routine test runs.", "In staging, use `--trust-all-mcp-servers` instead — it skips MCP-specific permission prompts while retaining file system write confirmations for non-MCP tool calls.", "Use `--dangerously-skip-permissions` in staging only if the Claude Code session runs inside a container with a read-only filesystem mount, which limits the blast radius of unapproved writes.", "`--dangerously-skip-permissions` should never be used in shared environments — it disables all permission checks, meaning any agent running there can read, write, or delete files without confirmation or audit."], "answerIdx": 3, "explanation": "**D)** `--dangerously-skip-permissions` disables all permission safeguards and is documented for use only in fully trusted, isolated single-user environments. Shared staging environments may have multiple users, critical test fixtures, or production-adjacent databases. The flag is inappropriate there regardless of isolation claims. A) understates the risk — staging isolation does not make unrestricted file access safe across multiple users. B) `--trust-all-mcp-servers` addresses MCP server trust, not the full permission model. C) is a partial mitigation that does not address other permission classes (network, bash commands). (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:10", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You are building an automated PR review workflow. The script runs `git diff origin/main...HEAD` and passes it to Claude via `claude -p` to generate a structured review. The model frequently truncates its review mid-point on large PRs with 800+ line diffs. What is the most appropriate fix?", "opts": ["Chunk the diff into 200-line segments, run multiple `claude -p` calls for each segment, and concatenate the resulting review sections into a final document.", "Switch to extended thinking with `budget_tokens: 8000` so the model uses thinking budget to plan the full review before writing output, which significantly reduces output verbosity.", "Increase `max_tokens` in the model call and add `--output-format json` to ensure the full structured review fits within a single response without truncation.", "Pass the raw diff file path and instruct the model to read it via its built-in `Read` tool, so the diff is not included in the prompt token count and does not consume output budget."], "answerIdx": 2, "explanation": "**C)** Truncation in `claude -p` on large inputs is caused by hitting the `max_tokens` output limit. Increasing `max_tokens` is the direct fix. `--output-format json` ensures the full structured output is captured without parsing issues. A) works but produces fragmented reviews that lack cross-hunk context. B) extended thinking increases reasoning quality, not output length — it does not prevent output truncation. D) has the model use Read to fetch the file, which still consumes tokens and does not change the output limit constraint. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-structured-extraction:12", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your document extraction pipeline processes legal briefs that range from 15 to 280 pages. The context window handles approximately 80 pages. What chunking strategy best preserves extraction quality for 280-page documents?", "opts": ["Split into overlapping chunks (e.g., 70-page chunks with 5-page overlaps at boundaries), extract each chunk independently, then merge and deduplicate extracted fields across all chunks.", "Compress the document by removing boilerplate sections (introductions, signature blocks) until the full document fits within the context window before running extraction.", "Stream pages sequentially and ask the model to maintain a running extraction state in its context, updating fields continuously as each new page is processed.", "Truncate all documents to 80 pages and note in the output that the extraction is partial, since key information typically appears in the first half of legal briefs."], "answerIdx": 0, "explanation": "**A)** Overlapping chunks prevent missed information at chunk boundaries where a field value might span two adjacent chunks. Extracting each chunk independently and merging results handles documents larger than the context window without truncation. B) removes content that may contain key fields and requires heuristic decisions about what is \"boilerplate.\" C) sequential streaming without structured external state produces unreliable field accumulation across turns. D) truncates and loses critical clauses that often appear in later sections of legal briefs. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-structured-extraction:4", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction schema for lease agreements has 40 fields. You consider removing `lease_commencement_date` because it is absent from 30% of documents and causes occasional null returns. A teammate argues this would be a mistake. Why?", "opts": ["Removing the field loses the data for the 70% of leases that do have a commencement date; nullable design captures both presence and absence cleanly without data loss.", "Removing a field increases schema complexity because downstream consumers must add special-case logic to handle a missing key rather than a typed null value.", "Null returns for optional fields are treated as schema validation errors in JSON schema tooling, so the current behavior is already correct and no change is needed.", "Removing fields from an established schema breaks backward compatibility with all previously extracted documents already stored in downstream databases."], "answerIdx": 0, "explanation": "**A)** A nullable optional field is the correct design: it returns the value when present and null when absent, preserving data for the majority of documents that include it. Removing the field entirely discards useful information from 70% of leases. B) misdescribes the downstream impact — a nullable field still requires null handling, similar to a missing key. C) is false — null values for nullable fields are valid in JSON schema. D) is a real operational concern but secondary to the data loss problem. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-code-generation:8", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A junior developer asks Claude to \"add Slack notifications to the order pipeline.\" The requirements don't specify whether notifications should be synchronous or async, which events trigger them, or whether they should use Slack's Incoming Webhooks API or the Web API. What should Claude do before writing code?", "opts": ["Implement the simplest possible version using Incoming Webhooks for `order_created` events, then list assumptions in a comment block at the top of the file.", "Enter plan mode to explore integration options and surface the architectural implications of each approach before writing any code.", "Ask a single clarifying question: \"Should this be synchronous or asynchronous?\" and proceed once answered.", "Generate three complete implementations (webhook, async queue, Web API) and ask the developer to choose the one that fits best."], "answerIdx": 1, "explanation": "**B)** When requirements are ambiguous and multiple valid approaches exist with significantly different architectural implications (sync vs. async, different APIs with different retry semantics, different failure modes), plan mode is the correct first step. It surfaces trade-offs before code is written, preventing costly refactors. A is wrong because silently picking one approach and burying assumptions in a comment is the anti-pattern — assumptions should be explicit decisions, not defaults. C is wrong because sync/async is only one of several unresolved decisions; a single clarifying question doesn't resolve the full ambiguity. D is wrong because generating three full implementations wastes context and forces the developer to evaluate code rather than requirements. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:26", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A team stores prompt templates in a shared MCP resource. A `UserPromptSubmit` hook retrieves the relevant template and prepends it to the developer's prompt. In code review sessions, the wrong template is injected because the hook uses repository name substring matching, and the repo `frontend-api-gateway` matches both the `frontend` and `api` templates. What is the correct fix?", "opts": ["Add a `.claude/prompt-template` config file at the project root containing the template key, and have the hook read that file first before falling back to the repository-name heuristic.", "Change the hook to match on the full repository name string rather than substring, so `frontend-api-gateway` maps to its own exact entry rather than matching generic substring templates.", "Register the template selection logic as a dedicated MCP tool called `select_prompt_template` and call it from within the hook via a nested subprocess to get a model-driven selection decision.", "Migrate from `UserPromptSubmit` to a `PreToolUse` hook so template injection happens per-tool-call, giving the model a chance to detect and correct the wrong template before executing."], "answerIdx": 0, "explanation": "**A)** A project-level config file is the deterministic, explicit mechanism for specifying configuration that varies by project. It eliminates ambiguous heuristics like substring matching on repository names. B) improves the match but is still a heuristic — exact string matching still fails for repos with similar full names. C) introduces a subprocess-within-hook architecture that adds latency and creates a circular dependency. D) uses the wrong hook event — template injection belongs at prompt time, not per-tool-call. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}];
  const MODULES = [{"id": "structured-extraction", "name": "Structured Data Extraction"}, {"id": "developer-productivity", "name": "Developer Productivity with Claude"}, {"id": "multi-agent-research", "name": "Multi-Agent Research System"}, {"id": "code-generation", "name": "Code Generation with Claude Code"}, {"id": "ci-cd", "name": "Claude Code for CI/CD"}, {"id": "customer-support", "name": "Customer Support Resolution Agent"}];
  const META = {
    generatedAt: "2026-05-24T11:55:42",
    timedMinutes: 150,
    totalQuestions: BANK.length,
    perModule: BANK.length / MODULES.length,
    seed: null
  };

  const S = { ix:0, answers:Array(BANK.length).fill(-1), revealed:false, timer:null, left:META.timedMinutes*60, done:false };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function mdInline(s) {
    return esc(s)
      .replace(/[*][*](.+?)[*][*]/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }
  function letter(i) { return ['A','B','C','D'][i] || '?'; }
  function fmt(sec) { const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

  function renderStart() {
    const mods = MODULES.map(m => `<span class="pill">${esc(m.name)}</span>`).join(' ');
    return `
      <div class="card">
        <h1 class="title">CCA Prep-Style Exam</h1>
        <div class="meta">${META.totalQuestions} questions, ${META.timedMinutes} minutes, ${MODULES.length} modules, ${META.perModule} questions per module.</div>
        <div class="meta">Generated: ${esc(META.generatedAt)} | seed: ${META.seed ?? 'random'}</div>
        <div style="margin-top:10px" class="row">${mods}</div>
        <div style="margin-top:14px"><button class="btn" onclick="startExam()">Start Exam</button></div>
      </div>`;
  }

  function renderExam() {
    const q = BANK[S.ix];
    const selected = S.answers[S.ix];
    let opts = '';
    for (let i=0;i<4;i++) {
      let cls = 'opt';
      if (selected === i) cls += ' sel';
      if (S.revealed) {
        if (i === q.answerIdx) cls += ' good';
        else if (selected === i) cls += ' bad';
      }
      opts += `<div class="${cls}" onclick="pick(${i})"><strong>${letter(i)})</strong> ${mdInline(q.opts[i])}</div>`;
    }

    const ex = S.revealed ? `<div class="ex"><strong>Explanation:</strong> ${mdInline(q.explanation || 'No explanation provided.')}</div>` : '';

    return `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="small">Q ${S.ix+1} / ${BANK.length} · ${esc(q.moduleName)}</div>
          <div><strong>${fmt(S.left)}</strong></div>
        </div>
        <div class="qtext">${esc(q.prompt)}</div>
        ${opts}
        ${ex}
        <div class="row" style="margin-top:12px">
          <button class="btn alt" onclick="prevQ()" ${S.ix===0?'disabled':''}>Prev</button>
          <button class="btn" onclick="revealOrNext()">${S.revealed ? (S.ix===BANK.length-1?'Finish':'Next') : 'Check'}</button>
          <button class="btn alt" onclick="finishExam()">Finish Now</button>
        </div>
      </div>`;
  }

  function renderResult() {
    let correct=0;
    for (let i=0;i<BANK.length;i++) if (S.answers[i] === BANK[i].answerIdx) correct++;
    const score = Math.round((correct / BANK.length) * 1000);
    const pass = score >= 720;
    const byMod = {};
    for (const q of BANK) byMod[q.moduleName] = byMod[q.moduleName] || {t:0,c:0};
    for (let i=0;i<BANK.length;i++) {
      const m = byMod[BANK[i].moduleName];
      m.t += 1;
      if (S.answers[i] === BANK[i].answerIdx) m.c += 1;
    }
    const rows = Object.entries(byMod).map(([k,v]) => `<div class="small">${esc(k)}: ${v.c}/${v.t}</div>`).join('');

    return `
      <div class="card">
        <h2 style="margin:0">Exam Complete</h2>
        <div class="score">${score} / 1000</div>
        <div class="meta">Correct: ${correct} / ${BANK.length} · Result: <strong>${pass ? 'PASS' : 'RETEST'}</strong></div>
        <div style="margin-top:10px">${rows}</div>
        <div class="row" style="margin-top:14px"><button class="btn" onclick="location.reload()">Generate New Run</button></div>
      </div>`;
  }

  function mount() {
    const app = document.getElementById('app');
    if (!S.done && !S.timer) app.innerHTML = renderStart();
    else if (!S.done) app.innerHTML = renderExam();
    else app.innerHTML = renderResult();
  }

  function startExam() {
    S.timer = setInterval(() => {
      S.left--;
      if (S.left <= 0) finishExam();
      else mount();
    }, 1000);
    mount();
  }

  function pick(i) { if (S.done || S.revealed) return; S.answers[S.ix] = i; mount(); }
  function prevQ() { if (S.done || S.ix === 0) return; S.revealed = false; S.ix--; mount(); }
  function revealOrNext() {
    if (S.done) return;
    if (!S.revealed) { if (S.answers[S.ix] < 0) return; S.revealed = true; mount(); return; }
    if (S.ix >= BANK.length - 1) { finishExam(); return; }
    S.ix++; S.revealed = false; mount();
  }

  function finishExam() {
    if (S.done) return;
    S.done = true;
    if (S.timer) clearInterval(S.timer);
    mount();
  }

  mount();
  </script>
</body>
