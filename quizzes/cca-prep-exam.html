t": "The same Claude Code instance that generated a 400-line authentication module is used to review it for logic errors before merging. The review reports no issues. An external auditor subsequently finds three subtle access-control bugs. What architectural change would have most likely caught the bugs?", "opts": ["Run the review with extended thinking enabled so the model has more reasoning budget to question its own output", "Use an independent Claude Code instance that reviews the PR diff without access to the generation session's conversation history", "Add a detailed review checklist to the prompt that specifically enumerates common access-control bug patterns to look for", "Increase the context window so the reviewer can see the full module plus its surrounding service layer at once"], "answerIdx": 1, "explanation": "**B)** The root cause is confirmation bias: the generating instance retains the reasoning that led to its design decisions, making it systematically less likely to challenge them. A fresh instance, seeing only the final diff, brings no anchoring to the original intent and will evaluate the code on its own merits — mirroring the human peer review pattern. A is wrong because extended thinking in the same session still operates from the same priors; more reasoning budget doesn't change the bias direction. C is wrong because a checklist improves coverage for known patterns but doesn't address the underlying confirmation bias. D is wrong because adding more surrounding context increases the review scope but preserves the same biased session state. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:25", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent processes tool results from a CRM integration and a warehouse management system. The CRM uses snake_case field names; the WMS uses camelCase. The agent occasionally confuses `shipping_address` (CRM) with `shippingAddress` (WMS) and merges them incorrectly. You cannot modify either system. Which hook and timing is correct?", "opts": ["PreToolUse hook on the WMS tool call — inject a field-mapping instruction before each WMS call to normalize the expected output format ahead of time", "PostToolUse hook on both tools — intercept each result and remap field names to a unified schema before the model processes the combined output", "PostLLMResponse hook — scan the model's response for field names and correct any schema inconsistencies before delivering to the customer", "PreToolUse hook on both tools — add a schema normalization payload to each tool call so both systems return consistent field naming"], "answerIdx": 1, "explanation": "**B)** PostToolUse hooks are the correct interception point for normalizing tool output before it enters the model's context. Applying it to both tools guarantees the model always sees a unified schema. A fires before the tool executes and cannot affect what the tool returns — PreToolUse modifies inputs sent to the tool, not the data that comes back. C fires after the model has already processed and potentially confused the inconsistent schemas; it cannot retroactively fix the model's reasoning. D passes normalization instructions as parameters to external systems that have no obligation to honor them, especially for systems you cannot modify. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:20", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team reviews the output of `claude -p --output-format json` and notices the JSON sometimes includes an outer wrapper field `content` containing the structured data, and sometimes the structured data is the top-level object. This inconsistency breaks their parsing script. What is the most reliable fix?", "opts": ["Add explicit instructions to the prompt to always return the structured object at the top level without any wrapper field", "Add a normalization function in the parsing script that detects the presence of a `content` wrapper and unwraps it before processing", "Switch to `--output-format text` and extract JSON from the text output using a regex that matches the opening `{` to the closing `}`", "Combine `--output-format json` with a `--json-schema` flag that provides the exact schema, enforcing top-level structure and required fields"], "answerIdx": 3, "explanation": "**D)** `--json-schema` provides a schema contract that enforces the output structure including top-level shape and required fields, making the output predictable for machine consumption. A is wrong because prompt instructions are probabilistic — they influence but do not enforce output structure, especially across model updates. B is technically workable but adds fragile defensive code; it treats the symptom rather than enforcing the contract. C is wrong because regex JSON extraction from text is fragile, will break on nested objects, and bypasses the native structured output capability. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:8", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "After implementing retry-with-error-feedback, 40% of retry attempts still fail. Investigation reveals these documents share one characteristic: the field being retried is simply not present anywhere in the source document. What should your retry logic do differently?", "opts": ["Increase retries to 5 attempts per document, since the model may locate implicit field values embedded in prose after multiple passes over the same content.", "Switch these documents to a chain-of-thought extraction pass where the model explicitly reasons about each field's presence before populating the output object.", "Lower the JSON schema strictness for retry attempts so that partially complete extractions pass validation rather than being rejected for missing fields.", "Classify retry failures by root cause before retrying: skip additional retries for absent-information failures, mark those fields as null, and reserve retries for format and structural output errors."], "answerIdx": 3, "explanation": "**D)** Retries are effective for output format errors and structural issues but cannot succeed when the required information is simply absent from the source document. Classifying failure types prevents wasted retries on impossible extractions. For absent-information cases, mark the field null and move on. A) wastes resources attempting to extract information that does not exist. B) adds reasoning overhead without changing what information is available. C) weakens the downstream quality bar and masks the real data gap. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:11", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your tool descriptions each use a single line: \"`lookup_order`: retrieves order details\", \"`get_account_info`: retrieves account details.\" The agent selects correctly 70% of the time but fails on cross-cutting queries such as \"what did I order last month and is my account in good standing?\" What targeted improvement addresses the root cause?", "opts": ["Add a pre-routing classifier that parses customer queries for order-related vs. account-related keywords before passing them to the agent", "Merge both tools into a single `get_customer_data` tool with a `query_type` enum to eliminate the selection decision entirely", "Expand each tool description with input formats, 2–3 example queries, explicit negative examples of queries that belong to the other tool, and \"use this instead of X when…\" boundary language", "Add ten few-shot examples in the system prompt — five for each tool — covering the most common query types in isolation"], "answerIdx": 2, "explanation": "**C)** Thin descriptions don't give the model enough signal to distinguish tools on cross-cutting queries. Expanding with positive examples, negative examples, and explicit boundaries directly addresses the ambiguity. A adds routing infrastructure before fixing the primary selection signal. B removes the tools' distinct identities, losing the ability to call both in parallel for cross-cutting queries. D adds few-shot examples on top of descriptions that are still ambiguous — pattern guidance cannot overcome unclear tool scope. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:2", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your `claude -p` invocation generates a commit message and prints it to stdout. A CI script needs to parse the model's output and extract just the subject line. The model sometimes adds preamble like \"Here is your commit message:\" before the subject. What is the cleanest fix?", "opts": ["Add a system prompt instruction: \"Output only the commit message subject line, no preamble or trailing explanation of any kind.\"", "Pass `--output-format json` so the model returns `{\"result\": \"...\"}`, then parse `result` with `jq '.result'` in the pipeline script for reliable extraction.", "Post-process stdout with a regex that strips lines matching `^Here is` or `^Sure,` before passing output to the downstream step in the pipeline.", "Switch to streaming mode with `--stream` and capture only the last line of output, which will always be the completed message after preamble lines have scrolled past."], "answerIdx": 1, "explanation": "**B)** `--output-format json` is the correct mechanism for machine-readable output from `claude -p`. It wraps the model's final answer in a predictable JSON envelope that downstream scripts can parse reliably with `jq`. A) is probabilistic — system prompt instructions reduce but do not eliminate preamble. C) is a fragile heuristic that breaks whenever the model varies its phrasing. D) is incorrect — streaming output does not guarantee the last line is the subject; the model can emit multi-line output. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:11", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer uses extended thinking for a complex architectural query involving 12 inter-dependent components and circular dependency risks. They call the API with `thinking: {type: \"enabled\", budget_tokens: 1024}`. The model returns a shallow two-sentence answer. What is the most likely cause?", "opts": ["Extended thinking is not supported for architecture queries — it is only available for math and code generation tasks as specified in the Anthropic documentation.", "A `budget_tokens` value of 1024 is below the effective threshold for complex reasoning; multi-component dependency analysis requires at least 5000–10000 tokens to produce meaningful chains.", "The API is returning thinking blocks but the client is not rendering them — add `display: \"visible\"` to the thinking config to surface the full reasoning chain in the response.", "Extended thinking is disabled in streaming mode by default; switch to non-streaming with `stream: false` to enable full thinking block generation and output."], "answerIdx": 1, "explanation": "**B)** Extended thinking requires a meaningful `budget_tokens` value to produce useful reasoning chains. 1024 tokens is insufficient for a 12-component dependency analysis — the model exhausts its thinking budget quickly and falls back to a shallow summary. A) is false — extended thinking is a general reasoning mechanism, not task-restricted. C) is a plausible distractor but `display` controls visibility of already-generated thinking, not whether thinking occurs. D) is incorrect — streaming supports extended thinking; the issue is budget size, not streaming mode. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:29", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "When a customer's issue cannot be resolved — for example, because a package is confirmed lost but the replacement order system is down — the agent terminates the session with \"I'm unable to help with this right now.\" No case summary, no timeline, no escalation ticket is created. What should the agent do instead?", "opts": ["Process a refund as an alternative resolution path since the replacement system being down represents a service failure that qualifies for automatic compensation", "Ask the customer to contact support again when the replacement system is back online, since the agent cannot create escalation tickets when downstream systems are unavailable", "Retry the replacement order system call up to five times before terminating, using exponential backoff on each attempt", "Acknowledge the failure, summarize the confirmed facts (package lost, replacement unavailable), provide a realistic resolution timeline, escalate with structured handoff including customer ID and next required action, and confirm the escalation reference to the customer"], "answerIdx": 3, "explanation": "**D)** When the agent cannot resolve an issue, a professional termination still requires: acknowledging what is confirmed (package lost), providing timeline expectations, creating an escalation with structured handoff data, and confirming the case reference to the customer. C applies retry logic to a system-down situation — retries are for transient failures, not sustained outages. B abandons the customer without creating an escalation record, which means the case is lost. A applies compensation logic the agent has no authority to invoke unilaterally for a system failure. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:8", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A synthesis agent processing 68,000 tokens of research findings consistently misses or misattributes findings from sources 8 through 14 in the input, even when those sources contain the most statistically significant data. Sources 1–4 and sources 18–22 are handled correctly. What architectural pattern best addresses this problem?", "opts": ["Place the most critical findings in a summary at the beginning of the input (primacy effect), and organize detailed source results with explicit section headers to aid middle-context navigation", "Rotate the order of sources randomly across multiple synthesis runs, then ensemble the outputs by majority vote across positions", "Switch to streaming the research output incrementally so the synthesis agent processes each source sequentially rather than holding all 68,000 tokens at once", "Reduce the total input to under 20,000 tokens by summarizing each source to a 2-sentence abstract before passing to synthesis"], "answerIdx": 0, "explanation": "**A)** This is the \"lost in the middle\" problem: language models exhibit a primacy effect (strong attention to early content) and recency effect (moderate attention to late content), with degraded attention to content in the middle of long inputs. The fix combines two mechanisms: placing key findings at the start (leverages primacy) and using explicit section headers throughout the middle (provides navigation anchors that help the model locate and attend to middle content). B is wrong because position rotation distributes the attention problem randomly across positions rather than fixing it — ensemble voting across rotations adds massive token cost and still degrades per-position quality. C is wrong because streaming/incremental processing changes the architecture for a different problem (memory management), not for the attention degradation that \"lost in the middle\" describes. D is wrong because compressing to 20K tokens loses the detail the question implies is needed; the problem is attention, not volume alone. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:15", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "After a developer pushes a fix for three issues flagged in a prior review, the automated pipeline re-reviews the entire PR and re-reports the same three issues as new findings. No deduplication logic exists. What context change prevents redundant feedback without post-processing?", "opts": ["Include the prior review's findings in the prompt context so Claude can distinguish between issues it has already reported and new or still-unaddressed ones", "Add a post-processing step that compares the current review output against a stored log of prior findings and removes exact string matches", "Scope subsequent reviews to only the diff since the last review commit, excluding previously reviewed lines from the analysis entirely", "Reset the review scope after each push so each review is treated independently with no knowledge of previous feedback cycles"], "answerIdx": 0, "explanation": "**A)** Including prior findings gives Claude the information it needs to reason about what has been addressed versus what remains open. This uses Claude's reasoning rather than brittle heuristics, and handles cases where a fix partially addresses an issue. B is wrong because string matching is fragile — Claude may describe the same issue with different wording across runs, causing exact-match deduplication to miss true duplicates. C is wrong because scoping only to the new diff means Claude won't catch issues in unchanged code that were previously found but not yet fixed. D is wrong because treating each review independently is exactly the current behavior causing the problem. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:9", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A `PreToolUse` hook validates `write_file` calls by checking the target path is within an allowed directory. It returns `{\"decision\": \"block\", \"reason\": \"Path outside allowed directory.\"}` for violations. A developer reports the agent silently continues writing to blocked paths anyway. What is wrong?", "opts": ["The hook's JSON response uses the wrong field name `decision`; it should return `{\"action\": \"block\", \"reason\": \"...\"}` — the hook runner does not recognize `decision` and falls through to execution.", "`PreToolUse` hooks can block reads but not writes — use a `PostToolUse` hook with a rollback action to undo writes to disallowed paths after they complete successfully.", "The hook is configured with `matcher.tool_name = \"write_file\"` but the actual tool is registered as `WriteFile` (PascalCase); the case-sensitive matcher never fires on any call.", "PreToolUse hooks cannot issue blocking decisions dynamically — block decisions must be registered statically in `.claude/settings.json` under the `deny` list before session start."], "answerIdx": 0, "explanation": "**A)** The hook runner expects `{\"action\": \"block\", \"reason\": \"...\"}` — using `decision` instead of `action` means the runner does not recognize the block instruction and falls through to execution. B) is false — `PreToolUse` hooks can block any tool type, including writes. C) is a plausible trap but tool name matching is typically case-insensitive by default. D) is incorrect — `PreToolUse` hooks are the documented dynamic blocking mechanism; the `deny` list handles static patterns only. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-ci-cd:18", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A multi-file PR touches 14 files across three services. The automated review returns highly variable depth — some files receive thorough analysis, others receive one-line summaries. The team suspects attention dilution from loading all 14 files in a single prompt. What architecture most reliably ensures consistent depth?", "opts": ["Switch to a larger model with a bigger context window so all 14 files fit comfortably with room for thorough reasoning on each", "Use a multi-pass architecture: one focused analysis pass per file for local issues, followed by a separate integration pass that examines cross-file data flow", "Run three independent review instances on all 14 files simultaneously and take a majority vote on which findings to report", "Truncate each file to 200 lines before review so the total context stays manageable and attention is distributed more evenly"], "answerIdx": 1, "explanation": "**B)** Attention dilution in large multi-file prompts is a real effect — splitting into focused per-file passes guarantees consistent depth per file, then a dedicated integration pass catches cross-file concerns. Each pass has a bounded, focused scope. A is wrong because a larger context window reduces the probability of truncation but does not fix attention dilution — the model still distributes attention across a large prompt. C is wrong because three independent instances on the full 14-file context each suffer the same attention dilution; voting on diluted results doesn't improve depth per file. D is wrong because truncating to 200 lines removes code that may be essential for understanding a file's logic, causing false negatives. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:3", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A CI code review pipeline generates duplicate test suggestions on every push because it repeatedly recommends tests that already exist in the codebase. The prompt asks Claude to \"suggest tests for uncovered scenarios.\" What context change resolves this?", "opts": ["Append `--no-duplicates` to the `claude -p` invocation so the CLI deduplicates suggestions before output", "Add instructions telling Claude to avoid suggesting tests that overlap with what the existing suite likely covers based on naming conventions", "Include the actual existing test files in the prompt context so Claude can directly observe which scenarios are already covered", "Switch to a two-pass architecture: first extract covered scenarios, then subtract them from the suggestion list using string matching"], "answerIdx": 2, "explanation": "**C)** Claude can only avoid duplicating existing coverage if it can see what already exists. Providing the test files directly gives Claude ground truth to reason against. A is wrong because `--no-duplicates` is not a valid CLI flag. B is wrong because asking Claude to infer coverage from naming conventions is probabilistic and will still miss semantic duplicates where test names don't match the scenario they cover. D is wrong because string matching on scenario descriptions is a fragile heuristic — two tests covering the same behavior may use completely different phrasing. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:22", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team's automated review pipeline uses `claude -p` with a detailed prompt. During a model upgrade, the output format changes subtly — findings are now grouped by severity instead of by file, which breaks the downstream parser. What is the most durable architecture to prevent format regressions across model updates?", "opts": ["Pin the Claude Code CLI to a fixed version with a lockfile so model upgrades never happen without explicit team approval", "Add format-validation assertions to the CI pipeline itself: after each `claude -p` run, validate the output against the expected JSON schema before passing it downstream", "Maintain a separate prompt for each Claude model version so format instructions can be tuned independently per model", "Use `claude -p --output-format json --json-schema` with a strict schema, and test the schema contract in CI so format regressions are caught before deployment"], "answerIdx": 3, "explanation": "**D)** Enforcing a JSON schema contract with `--json-schema` and testing that contract in CI is the most durable approach: it doesn't rely on a specific model version and catches regressions automatically. A is wrong because pinning model versions delays security patches and improvements and requires manual upgrade ceremonies. B adds a useful layer but relies on post-hoc detection, not prevention. C creates a maintenance burden: N prompt variants for N model versions, with no guarantee of consistency across them. D prevents the regression at the source rather than detecting it after the fact. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-multi-agent-research:29", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A multi-agent research coordinator is building its subagent invocation strategy. For a 12-subtopic research task, the coordinator considers: (A) dispatching all 12 subagents in parallel, or (B) dispatching them in 3 sequential waves of 4, where each wave's results inform the next wave's prompts. The research topics are largely independent, but 3 of the 12 subtopics are likely to produce findings that would change the search strategy for 4 other subtopics. Which strategy is more appropriate?", "opts": ["Strategy A, because parallel execution minimizes total wall-clock time and the coordinator can handle inter-topic dependencies at synthesis time without needing to serialize execution", "Strategy B, because sequential waves allow findings from early subtopics to refine the search strategy for dependent subtopics before those agents are dispatched", "Strategy A, because the coordinator should never serialize execution — all dependency resolution belongs in the synthesis stage to preserve maximum parallelism", "Strategy B, because dispatching 12 parallel subagents simultaneously would exceed typical API concurrency limits, making parallel dispatch technically infeasible for most deployments"], "answerIdx": 1, "explanation": "**B)** Three of 12 subtopics are expected to produce findings that would change the search strategy for 4 others — this is a real dependency that affects output quality, not just integration order. Dispatching all 12 in parallel means the 4 dependent subagents run with uninformed search strategies. Sequential waves allow the coordinator to use wave 1 findings to write better prompts for the dependent subtopics in waves 2 and 3. The 5 subtopics with no dependencies can be front-loaded in wave 1. A is wrong because \"handle dependencies at synthesis\" only works for integration of completed findings — it cannot retroactively improve the search strategy of already-completed subagents who ran with uninformed parameters. C is wrong because the claim that all dependency resolution belongs in synthesis is incorrect when dependencies affect upstream task formulation, not just downstream integration. D is wrong because API concurrency limits vary widely by provider and deployment, and the architectural choice should not be made based on a constraint that is not stated in the scenario. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:13", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A code review pipeline sends the full file content of every changed file to Claude for each PR review. Reviews on small 3-line changes are taking as long as reviews on 200-line refactors. What context scoping change improves performance without degrading review quality?", "opts": ["Switch to sending only the PR title and description as context, letting Claude infer what changed from the commit message", "Send only the raw diff (`git diff`) without surrounding file context so Claude processes only lines that changed", "Send the diff plus a configurable window of surrounding context (e.g., 20 lines before and after each hunk) so Claude understands local intent without loading full files", "Send the full repository contents for every review so Claude has complete dependency context and never misses a cross-file impact"], "answerIdx": 2, "explanation": "**C)** Diff plus a surrounding context window gives Claude what it needs to understand the change in context — function signatures, variable declarations, local control flow — without loading entire files for every review. This scales cost and latency proportionally to change size. A is wrong because PR title and description don't contain the actual code; Claude would be guessing about specific implementation details. B is wrong because raw diff without surrounding context causes Claude to miss the semantic context of a change — a variable rename looks different when you can see its declaration 15 lines above the diff hunk. D is wrong because sending the full repository for every review has unbounded cost and latency that grows with repo size, not change size. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:15", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Complex support cases average 12–15 tool calls: `get_customer`, `lookup_order`, `get_shipment`, `get_billing` — with `get_customer` being called repeatedly across different concern investigations within the same session. What change most effectively reduces both total tool call count and redundant data fetching?", "opts": ["Prompt the agent to batch related tool requests within a single turn and return all results together before proceeding to the next reasoning step", "Pre-fetch results from all available tools at session start using speculative execution and cache them for later turns", "Create composite tools like `get_full_case_context` that bundle multiple lookups into a single call to reduce per-turn round-trips", "Increase `max_tokens` on each API call to give the agent more reasoning space, which will naturally reduce premature tool calls"], "answerIdx": 0, "explanation": "**A)** Batching related tool requests per turn uses Claude's native ability to request multiple tools simultaneously, reducing API round-trips without adding architectural complexity. B calls tools that may be entirely unnecessary for the current case — a billing question doesn't need shipment data — wasting tokens and quota. C creates a combinatorial explosion of composite tools and a maintenance burden each time any individual tool's schema changes. D is wrong because `max_tokens` governs response length, not whether the agent requests tools earlier, batches requests, or avoids redundant calls. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:23", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A security review pipeline uses Claude Code to check for SQL injection, hardcoded secrets, and insecure deserialization. A developer asks why Claude cannot verify whether a found hardcoded secret is still active or has been rotated. What is the correct explanation?", "opts": ["Claude Code performs static analysis — it can identify that a string pattern looks like a credential and flag it, but cannot verify the credential's validity or rotation status without executing against a live external system", "Claude Code does not have access to the secrets management system's API, but could be extended with a tool that queries the secrets vault to verify rotation status", "Claude Code can verify secret rotation status by checking the git commit history for when the string was last changed and comparing it against the team's rotation policy", "Claude Code would need extended thinking mode enabled to reason deeply enough about whether a credential has been rotated across multiple systems"], "answerIdx": 0, "explanation": "**A)** Static analysis identifies patterns in code — it cannot make live network calls to verify whether a credential is valid, has been rotated, or is in active use. That requires runtime verification against external systems. B is technically true as an extension possibility but incorrect as an explanation of the current limitation; the question asks why Claude cannot verify rotation status in a standard review context. C is wrong because git history shows when a value changed in code, not whether the corresponding secret in the secrets management system was rotated. D is wrong because the limitation is not reasoning depth — it's that static analysis fundamentally operates on code text, not live system state. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:18", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent has 7 tools. `get_promotions`, `get_loyalty_points`, and `check_referral_status` are each invoked in fewer than 3% of sessions. Adding these three tools correlates with a 12% increase in incorrect tool selection across all sessions, including cases that never use the rare tools. What does this indicate and what should you do?", "opts": ["Add detailed disambiguation language to each rare tool's description explaining when it applies to help the model rule it out on non-matching queries", "Add targeted few-shot examples for the three rare tools so the model has worked examples for infrequent scenarios rather than defaulting to familiar tools", "Reduce the active tool set to the 4 most-used tools — rare tools add selection surface area without proportionate benefit, increasing overall selection error", "Route rare tool cases to a separate specialized agent that handles promotions and loyalty, invoked only when triage identifies those concerns"], "answerIdx": 2, "explanation": "**C)** Keeping tools the model rarely needs increases the number of candidates evaluated per tool selection decision, raising the error rate even for common tools. The recommended ceiling for reliable selection is approximately 4–5 tools. Removing 3% usage tools reduces selection noise with minimal capability loss. B adds examples but doesn't reduce the selection surface area that is causing noise for all sessions. D creates multi-agent overhead for a problem solvable by trimming the tool set. A improves descriptions but does not address the fundamental issue: more tools means more candidates evaluated simultaneously, regardless of how well each is described. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-developer-productivity:13", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your team runs `claude -p \"Review this code for security issues\" < auth.py` in GitHub Actions on every push. It takes 45 seconds and costs significantly because the model re-reads large shared utility files on every run. What developer productivity pattern reduces repeated context costs?", "opts": ["Enable prompt caching by passing `cache_control: {type: \"ephemeral\"}` on the system prompt and shared utility file content blocks so they hit the server-side cache on subsequent runs within the TTL.", "Pre-chunk all shared utility files into 512-token segments, store them in a vector database, and retrieve only the top-3 relevant segments per run to reduce input token count per call.", "Switch from `claude -p` to the streaming SDK so the CI workflow can interrupt the model mid-response if no security issues are detected in the first 30% of output.", "Add a `UserPromptSubmit` hook that checks a local cache file for previous model responses to the same file hash and short-circuits the model call entirely if a cached response exists."], "answerIdx": 0, "explanation": "**A)** Prompt caching with `cache_control: {type: \"ephemeral\"}` on stable content blocks (system prompts, large shared files) caches those tokens server-side, dramatically reducing cost and latency when the same content is sent repeatedly within the cache TTL. B) is a valid RAG pattern but adds infrastructure complexity and is not the Claude-native answer. C) misunderstands streaming — you cannot interrupt based on content semantics mid-stream to skip processing. D) is a client-side workaround that bypasses the model entirely, missing changes in the code since the last cached run. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:26", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A coordinator receives a research request and considers two approaches: (A) spawn 8 fine-grained subagents each covering one narrow subtopic, or (B) spawn 3 broader subagents each covering a cluster of related subtopics. The research topics are highly interconnected — findings in one area frequently inform interpretation of findings in others. Which approach is more appropriate and why?", "opts": ["Approach A, because fine-grained subagents produce more focused outputs that are easier to synthesize and allow the coordinator to parallelize more aggressively", "Approach A, because narrow subagent scope makes each agent's task simpler, reducing the probability of hallucination or reasoning errors within each individual subagent", "Approach B, because spawning 8 subagents would exceed the coordinator's parallel invocation limit, forcing sequential execution and negating the parallelism benefit", "Approach B, because highly interconnected topics benefit from broader subagent scope — each subagent can cross-reference findings within its cluster, reducing cross-agent dependencies the coordinator must resolve"], "answerIdx": 3, "explanation": "**D)** When topics are highly interconnected, fine-grained partitioning creates many cross-agent dependencies — findings from agent 1 may change the interpretation of findings from agent 5, but in approach A, agents run without access to each other's context. The coordinator must then resolve all these interdependencies at integration time, producing a synthesis challenge. Broader subagent clusters allow each agent to cross-reference related findings internally, producing more coherent outputs that the coordinator can integrate more cleanly. A is wrong because fine-grained outputs are easier to synthesize only when topics are independent — for interconnected topics, they produce fragmented findings that are harder to integrate because each piece requires context from the others. B is wrong because narrower scope does reduce per-agent complexity, but this benefit is outweighed by the cross-agent dependency problem when topics are strongly interconnected. C is wrong because it posits a technical constraint (parallel invocation limit) that is not stated in the scenario and shouldn't be the deciding factor in architectural decomposition decisions. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-developer-productivity:4", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A multi-agent system runs three independent subagents in parallel: one refactors Python files, one updates unit tests, and one regenerates API documentation. The documentation subagent fails because it sees intermediate refactoring artifacts left in the shared conversation context from the Python subagent. What is the correct fix?", "opts": ["Run all subagents sequentially instead of in parallel so each one starts with a clean state from the previous agent's final output rather than intermediate artifacts from siblings.", "Add explicit filtering in the coordinator that strips incomplete tool results from the context before passing it to each subagent at dispatch time.", "Increase each subagent's context window with a larger `max_tokens` value to ensure all intermediate artifacts fit without truncation-related confusion.", "Launch each subagent with `context: fork` so each receives only the coordinator's initial context and cannot see intermediate state written by sibling subagents."], "answerIdx": 3, "explanation": "**D)** `context: fork` creates an isolated context copy for each subagent, preventing cross-contamination of intermediate state between parallel tasks. This is the documented pattern for parallel subagent isolation. A) eliminates parallelism to avoid the problem — not a fix, a regression in throughput. B) requires the coordinator to know which artifacts are \"intermediate,\" which is fragile and task-specific. C) misidentifies the cause — the issue is cross-subagent context pollution, not truncation. (source: docs/exam-debrief-1.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:16", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A ticket arrives: \"I was charged twice for order #4821 on April 3rd.\" The conversation has been summarized twice after turn 28. In its response, the agent references the charge as occurring \"in early April\" rather than April 3rd, and cites an approximate amount instead of the exact figure the customer stated. What is the architectural failure?", "opts": ["The model hallucinated the approximate values — adding a PostLLMResponse hook to flag any dates or amounts not matching original customer input would catch this before delivery", "The summarization trigger is too aggressive at turn 28 — delaying it to turn 35 would preserve precision across more turns before compression occurs", "The summarization prompt is under-specified — adding an explicit instruction to preserve exact dates and amounts verbatim would prevent paraphrasing during compression", "Customer-stated transactional values were not extracted into a persistent case facts block before summarization ran, so dates and amounts were paraphrased during compression"], "answerIdx": 3, "explanation": "**D)** Summarization compresses conversational context by design. Precise values like dates and amounts are paraphrased into approximate descriptions during that process. The correct fix is to extract these values into a persistent structured block before any summarization runs, keeping them immune to compression. C attempts to make a generative process preserve exact values — still lossy and unreliable even with strong instructions. B delays the problem; any summarization window will still paraphrase exact values unless a persistent block protects them. A is a compensating control that detects the failure after it has already occurred, rather than preventing it architecturally. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-structured-extraction:20", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your pipeline uses `tool_use` for structured extraction. Field values are syntactically correct but semantically wrong in 4% of cases (e.g., `contract_start_date` contains the `contract_expiry_date` value). What validation layer catches semantic errors that JSON schema validation misses?", "opts": ["Increase `budget_tokens` for extended thinking so the model reasons more carefully about each field before populating the output, reducing cross-field confusion through deeper deliberation.", "Switch from `tool_use` to direct text-based JSON output, which gives the model more natural language context around each field and reduces systematic cross-field transposition errors.", "Add business-rule validation after schema validation: check field relationships (e.g., `start_date < expiry_date`, line items sum to total) and trigger targeted re-extraction when violations are detected.", "Add a self-review step in the same session where the model inspects its own extraction before returning, catching semantic errors through targeted introspective reasoning."], "answerIdx": 2, "explanation": "**C)** Schema validation catches structure; business-rule validation catches semantics. Rules like `start_date < expiry_date` and `sum(line_items) == total` express cross-field relationships that JSON schema cannot encode but custom validation logic can. Violations trigger targeted re-extraction with the specific semantic error included as feedback. A) extended thinking reduces upfront errors but does not validate the output after generation. B) text output is structurally worse, not better. D) self-review in the same session is unreliable due to generator confirmation bias. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-code-generation:30", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer asks: \"What's the difference between putting instructions in CLAUDE.md vs creating a `.claude/rules/` file for the same content?\" Which answer is most accurate?", "opts": ["CLAUDE.md supports `@import` for composing files; `.claude/rules/` files cannot reference external content and must be entirely self-contained.", "CLAUDE.md is evaluated before tool calls; `.claude/rules/` files are evaluated lazily only when Claude's confidence falls below a threshold.", "CLAUDE.md is human-readable docs; `.claude/rules/` files are machine-parseable structured config evaluated differently by the runtime.", "CLAUDE.md always loads for every session; `.claude/rules/` files use YAML frontmatter `globs` to load conditionally by file path."], "answerIdx": 3, "explanation": "**D)** CLAUDE.md is always loaded (root-level) for every session, making it appropriate for universal standards. `.claude/rules/` files add two capabilities: (1) YAML frontmatter `globs` patterns for path-conditional loading, so rules activate only when relevant files are in scope, and (2) per-topic organization for maintainability. C is wrong because both CLAUDE.md and rules files contain natural language instructions — neither is \"machine-parseable structured config\" evaluated differently by the runtime. A is wrong because the `@import` limitation is a secondary detail, not the defining distinction; path-conditional loading via globs is. B is wrong because \"confidence score threshold\" is not a real mechanism — Claude Code has no lazy-evaluation gate for rules files. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-structured-extraction:6", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You extract structured data from research papers into a schema with a `sample_size` field. Papers that are theoretical (no empirical study) never include a sample size, but the schema marks the field as `required`. The model returns values like `\"Not applicable\"` and `\"0\"` for theoretical papers. What is the correct fix?", "opts": ["Make `sample_size` nullable and add a companion `study_type` enum field (`\"empirical\"`, `\"theoretical\"`) so downstream systems can interpret null sample sizes with full semantic context.", "Add a prompt rule: \"For theoretical papers, set sample_size to -1 as a sentinel value indicating that no empirical data collection occurred.\"", "Create a separate extraction schema for theoretical papers that omits `sample_size` entirely, routed via a pre-extraction document-type classifier.", "Add a `minimum: 1` constraint so sentinel strings like \"Not applicable\" fail validation and trigger a targeted re-extraction pass with explicit error feedback included."], "answerIdx": 0, "explanation": "**A)** Making the field nullable removes the fabrication pressure, and adding a `study_type` field provides semantic context so downstream systems understand why `sample_size` is null. B) encodes meaning in a numeric field via a sentinel value, creating a fragile convention that downstream code must explicitly handle. C) works but duplicates schema maintenance effort across two schemas. D) adds a constraint that prevents string fabrications but does not prevent numeric fabrications like `\"0\"`. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:20", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent's system prompt contains: \"If the customer mentions 'account,' use `get_account_info`. If they mention 'order,' use `lookup_order`.\" Sessions containing the word \"account\" in the opening message select the correct tool 95% of the time. Sessions clearly requiring account context but not using the word \"account\" select the correct tool only 38% of the time. What is the root cause?", "opts": ["The model has a recency bias that overweights tool references appearing earlier in the system prompt, causing it to favor `lookup_order` in ambiguous cases", "The system prompt instructions are too restrictive — removing them entirely and relying on the model's judgment would increase accuracy for non-keyword sessions", "The `get_account_info` tool description is insufficiently detailed — expanding it with more example queries would improve coverage for customers who don't use the keyword", "The system prompt contains keyword-sensitive routing instructions that steer tool selection based on literal word presence rather than semantic intent"], "answerIdx": 3, "explanation": "**D)** The 95% vs. 38% disparity maps precisely to keyword presence. Literal keyword routing fails whenever customers describe account issues without using that exact word. The fix is to replace keyword-triggered instructions with semantic descriptions in the tool definitions. C is plausible but secondary — the scenario explicitly identifies the system prompt instruction as the trigger, making it the root cause to fix first. A introduces a speculative recency bias theory with no supporting evidence; the data pattern clearly correlates with keyword presence, not position. B removes needed guidance entirely instead of replacing brittle literal matching with semantic criteria. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:4", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "An agent's overall escalation rate is 55%. It correctly escalates complex billing disputes but escalates simple password reset and order status requests at nearly the same rate. The system prompt has no defined escalation criteria. What is the best intervention?", "opts": ["Add a self-reported confidence threshold so the agent escalates only when it rates its own certainty about the resolution below 0.7 on an internal scale", "Add a separate issue-type classifier that pre-routes tickets to an escalation queue or self-resolution queue before the main agent processes them", "Add a sentiment detection layer so the agent escalates only when customer frustration signals exceed a defined threshold", "Add explicit escalation criteria with few-shot examples showing when to escalate versus resolve, using concrete case types as positive and negative examples"], "answerIdx": 3, "explanation": "**D)** The root cause is undefined decision boundaries — the agent escalates anything uncertain because it has no criteria to distinguish simple from complex. Few-shot criteria directly teach the boundary without adding infrastructure. A is an anti-pattern: self-reported confidence scores are not calibrated to actual accuracy and are an unreliable basis for routing decisions. B over-architects the solution before the simpler fix of defining criteria is attempted. C is the classic anti-pattern — sentiment does not equal complexity; a frustrated customer asking a simple question should be resolved, not escalated. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:27", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A customer submits a ticket about a return for damaged goods AND a missing promotional credit. During the conversation, the agent confirms the return is eligible and processes it. The customer then asks about the promotional credit. The agent responds: \"I don't see any information about a promotional credit in our conversation.\" The credit was mentioned in the customer's opening message. What is the failure?", "opts": ["The `get_promotions` tool failed silently and did not return the credit data — the agent should have surfaced the tool error rather than denying awareness", "The opening message's promotional credit mention was lost during or before context summarization — transactional facts from the opening message were not persisted in a case facts block", "The agent resolved the return concern first and the sequential resolution order caused the promotional credit to fall below the context attention threshold", "The system prompt does not include explicit instructions to log all customer-stated concerns before beginning any tool action — prompt coverage of concern tracking is missing"], "answerIdx": 1, "explanation": "**B)** Customer-stated facts from early in a conversation — especially from the opening message before any summarization — are at risk of being lost once summarization runs. Extracting all stated concerns and key values into a persistent case facts block at session open prevents this loss regardless of how many summarization passes occur. A is speculative — the scenario describes the agent denying awareness of the mention, not reporting a tool error. C is a plausible-sounding but undocumented \"attention threshold\" concept that doesn't reflect how context summarization works. D is a real contributing factor but B is the more precise architectural cause — the persistent facts block would have preserved the promotional credit data through summarization. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:7", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A synthesis agent is receiving 155,000 tokens of combined input from 6 upstream research subagents, but its context window reliably handles only 50,000 tokens before performance degrades. The upstream agents return full web page content, extracted quotes, reasoning chains, and confidence commentary for every source they process. What is the most effective fix?", "opts": ["Split the synthesis task into 3 sequential batches of roughly 50,000 tokens each, feeding each batch to a fresh synthesis agent instance and merging the 3 outputs", "Add an intermediate summarization agent between the research subagents and the synthesis agent, tasked with condensing each research output before forwarding", "Modify the upstream research subagents to return structured data — key facts, citations, relevance scores — instead of verbose page content and reasoning chains", "Store research outputs in a vector database and have the synthesis agent retrieve only the top-k most relevant chunks via semantic search at synthesis time"], "answerIdx": 2, "explanation": "**C)** The fix is at the source: upstream agents are producing token-heavy output (full page content, reasoning chains) when only the distilled information is needed downstream. Restructuring subagent output to return key facts, citations, and relevance scores eliminates the inflation while preserving everything the synthesis agent needs. This is preferable to all downstream mitigations. A is wrong because batching loses cross-source integration — findings from batch 1 and batch 3 cannot be synthesized together, producing a lower-quality output. B is wrong because an intermediate summarization agent adds latency and an extra component without fixing the root cause (upstream verbosity). D is wrong because vector retrieval over research outputs is over-engineering — the structure of the problem is known, and structured extraction is simpler and more reliable than semantic retrieval here. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:17", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A Claude Code review pipeline consistently produces severity ratings that vary for similar bugs across different PRs. A `null` pointer dereference is rated Critical in one review and Medium in another. What is the most effective fix for classification consistency?", "opts": ["Add a CLAUDE.md mapping table that defines severity levels in prose (Critical = data loss risk, High = service disruption, etc.) and reference it in each review prompt", "Instruct Claude to rate severity relative to the overall risk level of the PR being reviewed, normalizing ratings within each PR's context", "Provide concrete code examples in the prompt for each severity level — showing an actual Critical null dereference, an actual High use-after-free, an actual Medium off-by-one — as classification benchmarks", "Add a post-processing step that normalizes severity using a rule engine based on bug category keywords, overriding Claude's classification for known pattern types"], "answerIdx": 2, "explanation": "**C)** Abstract severity definitions leave room for interpretation — the same concept reads differently depending on prior context. Concrete code examples make classification anchors unambiguous: \"Critical looks like this specific pattern.\" This removes the variability introduced by Claude interpreting prose definitions differently across prompts. A is wrong because prose definitions (Critical = data loss risk) are still abstract — a null pointer dereference might or might not cause data loss depending on context, and Claude may classify that context differently across runs. B is wrong because relative-to-PR rating creates cross-PR inconsistency by design. D adds engineering complexity and creates a rigid rule system that misses novel patterns not covered by the keyword list. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:19", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "Your organization uses a shared `.mcp.json` in every project repo, pointing to internal MCP servers with tokens injected via `${INTERNAL_API_TOKEN}`. A new team member's Claude Code session throws a connection error for those MCP servers. The token is correctly set in their shell environment. What should you check first?", "opts": ["Whether the `.mcp.json` uses double-quoted strings for env var expansion — single quotes disable expansion in some JSON parsers.", "Whether the developer has a conflicting user-scoped MCP config at `~/.claude/mcp.json` that overrides the project entry with a stale server URL.", "Whether the MCP server's `transport` field in `.mcp.json` uses `stdio` vs `sse` — the wrong transport causes connection errors even when auth is valid.", "Whether the developer's shell sets `INTERNAL_API_TOKEN` in `.zshrc` vs `.zprofile` — Claude Code may launch in a non-login shell that doesn't source `.zshrc`."], "answerIdx": 3, "explanation": "**D)** Claude Code launches its own process and may run in a non-login, non-interactive shell depending on how it was started. If the token is set in `.zshrc` (interactive shell) but Claude Code spawns a non-interactive shell, the variable won't be present even though running `echo $INTERNAL_API_TOKEN` in the terminal works. Checking whether the variable is exported to subprocesses is the correct first step. A is wrong because JSON doesn't have single-quoted vs double-quoted distinctions for string values — all JSON strings use double quotes, and Claude Code's env var expansion is not a JSON parser feature. B is wrong because user-scoped MCP config doesn't override project-scoped entries; they coexist. C is wrong because transport mismatch (`stdio` vs `sse`) would surface as a different error, not a credential-level connection failure. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-customer-support:13", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "An agent has `send_refund_notification` and `process_refund` in its tool set. Both have accurate one-line descriptions. The agent consistently calls `send_refund_notification` when a customer says \"issue the refund.\" Keyword steering in the system prompt has been ruled out. What is the most likely root cause?", "opts": ["The descriptions are accurate but provide no sequencing context — expand them with \"use this after X\" and \"fires when Y is complete\" language so the model understands the operational relationship between the two tools", "The model is ignoring tool descriptions due to context window pressure — truncate the system prompt to bring tool definitions closer to the active attention window", "The model has a training-time bias toward notification tools for refund-adjacent language — add negative few-shot examples explicitly showing when not to call `send_refund_notification`", "The tools are too similar in name — rename `send_refund_notification` to `notify_customer_of_pending_refund` to increase semantic distance and reduce selection confusion"], "answerIdx": 0, "explanation": "**A)** When tool names and descriptions are accurate but sequencing is wrong, the missing signal is relational context — the model doesn't know which tool executes the action versus which confirms it. Adding \"use this after `process_refund` completes\" directly resolves the sequencing ambiguity at the root. B is speculative — context window truncation could cause worse problems and doesn't explain a systematic sequencing error. C adds negative examples before confirming that description-level fixes are the right intervention. D is cosmetic; a rename doesn't address the fact that the model lacks context about which tool must precede the other. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:25", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A research workflow uses a coordinator that passes each subagent's complete output to the next subagent in a sequential chain. After 6 sequential subagents, the 7th subagent receives 142,000 tokens of accumulated prior output as context. The 7th subagent's actual task — identify missing perspectives — is an 800-token operation. What is the structural problem with this design?", "opts": ["Sequential chaining prevents the coordinator from parallelizing work across subagents, reducing throughput by the number of subagents in the chain", "Passing each subagent's complete output to the next creates uncontrolled context accumulation — each subagent receives all prior reasoning chains, not just the distilled findings it needs", "The 7th subagent cannot trust earlier subagents' outputs because it has no way to verify the provenance or accuracy of the 142,000 tokens it receives as context", "Sequential context passing violates subagent isolation — subagents should receive only the original coordinator prompt, not intermediate findings from prior subagents"], "answerIdx": 1, "explanation": "**B)** Each subagent receives not just the findings it needs but the complete accumulated output of all prior subagents — including their reasoning chains, intermediate steps, and verbose content. This compounds rapidly: subagent 2 gets subagent 1's full output, subagent 3 gets subagents 1+2's full outputs, and so on. By subagent 7, the vast majority of context is prior reasoning the agent doesn't need. The fix is coordinator-mediated summarization: pass structured findings (key facts, citations) rather than complete raw outputs. A is wrong because sequential vs parallel is a separate architectural decision — the context accumulation problem exists regardless of ordering, and parallelizing a sequential chain would require redesigning the workflow logic entirely. C is wrong because provenance verification is a valid concern in some systems, but the question asks about the structural problem causing 142,000 tokens for an 800-token task — that's accumulation, not trust. D is wrong because subagents legitimately need prior findings to build on earlier work; complete isolation would make sequential chaining impossible by design. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:2", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A document analysis subagent retrieves a PDF from an internal archive. The file transfers successfully (200 OK, full byte count received) but all text extraction calls return empty strings. The agent has a built-in retry loop. What is the correct response?", "opts": ["Retry up to 3 times with exponential backoff, then return a generic \"document unavailable\" message to the coordinator", "Return a structured error to the coordinator with failure type \"corrupt-document\", the document ID, extraction method attempted, and zero partial results", "Attempt an alternative extraction library internally, log the failure, and return an empty document object so the workflow continues uninterrupted", "Halt the entire workflow and surface the corruption error to the end user before the coordinator can make a recovery decision"], "answerIdx": 1, "explanation": "**B)** A file that transfers successfully but yields no extractable text is corrupt — a non-transient, non-retryable condition. Retry logic is appropriate for transient access failures (network timeouts, rate limits), not for corrupted content. The coordinator has broader context to decide: skip this document, try an alternative parser, or notify the user — but it needs structured error context (failure type, document ID, what was tried) to make that decision intelligently. A is wrong because retrying a corrupt file wastes attempts and then still returns generic context that strips the coordinator's recovery options. C is wrong because returning an empty document object silently hides the failure, violating the principle that errors must be surfaced with context. D is wrong because halting the entire workflow preempts the coordinator's decision — it may have good reasons to continue with partial results. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-customer-support:7", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A customer reports a refund was processed 30 days ago. Your system records show no refund was processed for this customer's order at any point. The agent has access to `lookup_order`, `get_transaction_history`, and `escalate_case`. How should it proceed?", "opts": ["Present both the customer's claim and the system records factually, request supporting documentation such as a bank statement or email confirmation, and escalate if the contradiction cannot be resolved with that evidence", "Treat the system record as authoritative, inform the customer that no refund was processed, and close the ticket citing the absence of a transaction record", "Immediately escalate to human review because agents must never attempt to resolve any case involving contradictory information", "Accept the customer's account as accurate — system records can have gaps — and issue a new refund to prevent further escalation"], "answerIdx": 0, "explanation": "**A)** When customer-provided claims contradict system records, the correct approach is to surface both data points, request verifiable evidence, and escalate only after that evidence fails to resolve the contradiction. D risks issuing a duplicate refund based on an unverified claim. B dismisses the customer without investigation — system records can have errors, and this approach damages trust unnecessarily. C over-escalates; the agent can gather additional evidence first, reducing unnecessary escalation load without making a premature policy decision. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:30", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A synthesis agent is consuming outputs from 8 research subagents. The coordinator's logs show that the synthesis agent consistently produces lower-quality integration for findings from subagents 4 and 5 specifically, despite those subagents returning correct and complete data. Inspection reveals subagents 4 and 5 return their findings as dense unstructured prose paragraphs, while subagents 1–3 and 6–8 return structured JSON with explicit field labels for claim, source, confidence, and date. What is the correct fix?", "opts": ["Standardize the output format for subagents 4 and 5 to match the structured JSON schema used by the other six agents, ensuring the synthesis agent receives uniform input across all sources", "Have the synthesis agent process subagents 4 and 5 in a separate pass and merge those results manually with the main synthesis output in a final integration step", "Prompt the synthesis agent to apply special attention to subagents 4 and 5's outputs, instructing it to extract structured information from prose before integrating with the other sources", "Add a normalization agent between subagents 4 and 5 and the synthesis agent that converts prose to structured JSON before the synthesis agent receives it"], "answerIdx": 0, "explanation": "**A)** The root cause is non-uniform output format across subagents. Subagents 4 and 5 produce dense prose that forces the synthesis agent to do implicit structure extraction, which is error-prone compared to consuming explicit field labels. The correct fix is at the source: update subagents 4 and 5 to produce the same structured JSON schema as the other six. This gives the synthesis agent uniform input and eliminates the format-driven quality gap. B is wrong because separate processing passes lose cross-source integration — the synthesis agent cannot cross-reference findings from subagents 4/5 with findings from 1–3 and 6–8 if they are synthesized in separate contexts. C is wrong because prompting the synthesis agent to apply special attention to specific sources adds complexity without fixing the upstream non-uniformity; it also creates a fragile dependency on the synthesis agent knowing which specific sources need special handling. D is wrong because an intermediate normalization agent adds a component and latency to compensate for a fixable source problem — the better fix is to update the subagents that own the output format. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-code-generation:5", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A team wants their `/pr-review` skill available to every developer who clones the repository, without requiring any per-user setup. Where should the skill file be placed?", "opts": ["`~/.claude/skills/pr-review.md` on each developer's machine, synchronized via a setup script in the repo.", "`.claude/skills/pr-review.md` committed to the project repository root.", "`docs/skills/pr-review.md` with an `@import` directive in the project CLAUDE.md pointing to that path.", "`.claude/commands/pr-review.md` committed to the project repository root."], "answerIdx": 3, "explanation": "**D)** Custom slash commands shared across a team are placed in `.claude/commands/` (not `.claude/skills/`). Files committed there are version-controlled and automatically available to all developers who clone or pull the repo. B is wrong because `.claude/skills/` is the correct path for skills but the question references the `/pr-review` slash command pattern — the `.claude/commands/` directory is the right home. A is wrong because `~/.claude/skills/` is user-scoped, not shared. C is wrong because `docs/skills/` is not a recognized skill or command directory, and `@import` in CLAUDE.md loads instruction text, not executable skill definitions. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-structured-extraction:3", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You deploy a contract extraction pipeline. The `governing_law` field is `required` and sometimes fabricated for contracts that reference no jurisdiction. A colleague suggests adding \"Do not invent a jurisdiction if none is stated\" to the system prompt. Why is this less reliable than the schema fix?", "opts": ["Prompt instructions are ignored when `tool_use` is active; only schema constraints are evaluated during tool call resolution at inference time.", "Prompt instructions increase latency because the model must evaluate the instruction against each field before returning output to the API caller.", "Prompt instructions work well for simple strings but fail specifically for legal jurisdiction fields due to geographic entity density in the model's training data.", "The `required` constraint directly overrides any prompt instruction, so the model will still produce a value to satisfy the schema even when told not to."], "answerIdx": 3, "explanation": "**D)** Schema constraints operate at the output enforcement layer. A `required` field tells the model it must produce a value, which creates direct tension with a prompt instruction saying \"don't produce a value.\" The schema wins because it is enforced structurally. Making the field optional/nullable removes the fabrication pressure entirely. A) is false — prompt instructions are always processed. B) describes no documented latency behavior. C) is false and domain-specific with no documented basis. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:2", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your support agent achieves 94% accuracy on single-concern tickets — refund only, shipping only — but drops to 61% on tickets combining both a refund request and a shipping inquiry. There is no preprocessing layer. Single-concern accuracy confirms the agent understands each tool individually. What is the most appropriate fix?", "opts": ["Build a preprocessing layer that decomposes each incoming ticket into individual concerns before the agent sees it, routing each concern to a separate handling pass", "Create a dedicated subagent for each concern type and invoke both in parallel when a multi-concern ticket is detected", "Add an iteration cap of 6 tool calls per turn so the agent cannot over-invest in one concern at the expense of the other", "Add few-shot examples demonstrating correct tool sequencing and concern tracking for multi-concern tickets"], "answerIdx": 3, "explanation": "**D)** The 94% single-concern baseline shows the agent understands both tools and policies individually — it only needs multi-concern pattern guidance. Few-shot examples are the minimum-complexity fix that directly teaches the pattern. A adds latency and architectural overhead for a problem solvable at the prompt level; preprocessing is warranted when there is a fundamental architecture limitation, not when the baseline is strong. B is over-engineering for a guidance gap. C introduces an arbitrary cap that restricts legitimate long-running workflows without addressing the reasoning failure. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-structured-extraction:2", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You are extracting vendor contact data from purchase orders. The `vendor_phone` field is nullable. On 12% of documents the model returns `\"N/A\"` as a string instead of `null`. Downstream code that checks `if field is null` passes these through as valid phone numbers. What schema constraint most directly prevents this?", "opts": ["Add a `minLength: 7` constraint on the phone field so short strings like \"N/A\" fail validation and trigger a retry with specific error feedback.", "Add an `enum` that lists every valid phone format, blocking any value not matching a recognized pattern of digits and separators.", "Change the field type to a union of `string | null` and add a `pattern` constraint (e.g., `^\\+?[\\d\\s\\-()]{7,}$`) so only numeric-format strings or null are accepted.", "Add a prompt instruction: \"Return null, not the string N/A, when a phone number is absent from the document text.\""], "answerIdx": 2, "explanation": "**C)** A `pattern` constraint on the string branch of a nullable union enforces that any non-null value must match a phone number format. `\"N/A\"` fails the pattern and the model is forced to return null instead. A) catches the symptom but `minLength` alone still allows arbitrary short strings like \"no\" or \"n/a\". B) an exhaustive enum for phone numbers is impractical and fragile across international formats. D) prompt instructions are less reliable than schema constraints for enforcing output shape. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-ci-cd:4", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A security team has deployed a Claude Code review pipeline that flags four categories: style (52% false positive rate), naming (49% FP), security vulnerabilities (8% FP), and performance regressions (17% FP). Developers have started dismissing all findings without reading them. What change most effectively restores signal?", "opts": ["Reduce the confidence threshold uniformly across all four categories
