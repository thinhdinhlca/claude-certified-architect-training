  <title>CCA Prep Exam (180Q)</title>
  <style>
    :root { --bg:#0b1020; --card:#121a2e; --text:#e8edf7; --muted:#9fb0d1; --accent:#4f8cff; --good:#1bbf76; --bad:#ef5350; --border:#22304d; }
    * { box-sizing: border-box; }
    body { margin:0; background:linear-gradient(180deg,#0b1020,#0a0f1d); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    .wrap { max-width:960px; margin:0 auto; padding:24px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
    .meta { color:var(--muted); font-size:13px; line-height:1.5; }
    .title { margin:0 0 8px; font-size:24px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .pill { font-size:12px; color:#cfe0ff; border:1px solid #2e4677; padding:4px 8px; border-radius:999px; }
    .btn { background:var(--accent); color:white; border:none; border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
    .btn.alt { background:#1a243b; border:1px solid var(--border); }
    .qtext { font-size:17px; line-height:1.5; margin:10px 0 14px; }
    .opt { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:8px 0; cursor:pointer; }
    .opt:hover { border-color:#3f5f9a; }
    .opt.sel { border-color:#6da1ff; background:#122140; }
    .opt.good { border-color:var(--good); background:#112c20; }
    .opt.bad { border-color:var(--bad); background:#3a1a21; }
    .ex { margin-top:12px; border-left:3px solid #355da8; padding:8px 10px; color:#d8e3ff; background:#101a31; border-radius:8px; font-size:14px; line-height:1.45; }
    .small { color:var(--muted); font-size:12px; }
    .hidden { display:none; }
    .score { font-size:28px; font-weight:700; margin:8px 0; }
    code { font-family:ui-monospace,monospace; background:rgba(79,140,255,0.12); color:#a5c4ff; padding:0.1em 0.38em; border-radius:4px; font-size:0.855em; }
  </style>

  <div class="wrap" id="app"></div>
  <script>
  const BANK = [{"id": "module-multi-agent-research:4", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A subagent performing web research on renewable energy policy times out after 30 seconds on a government database query. A separate subagent researching the same topic returns the message \"Search complete: 0 documents matched your query\" from the same database. The coordinator receives both results. How should the system treat these two outcomes?", "opts": ["Treat both as successful completions, since both agents returned a response rather than an exception, and let the synthesis agent decide what to do with each", "Treat both as failures requiring retry, because neither produced usable document content for the synthesis stage", "Treat the timeout as an access failure requiring retry logic, and treat \"0 results\" as a valid informative finding that requires no retry", "Escalate both to the user for manual resolution, since the database may be unreliable and automated decisions about data gaps are risky"], "answerIdx": 2, "explanation": "**C)** These are semantically distinct outcomes requiring different handling. A timeout is an access failure — the database may be temporarily unavailable, a different query formulation might succeed, or a retry after a delay may work. \"0 results\" is a valid finding: the database was reachable, the query was processed, and the answer is \"no matching documents exist.\" Treating it as a failure would trigger unnecessary retries against a correctly functioning system. A is wrong because conflating access failure with valid empty result loses critical information the coordinator needs to decide next steps. B is wrong because retrying \"0 results\" wastes resources and is semantically incorrect — the subagent did its job. D is wrong because these are routine conditions an automated system should handle without human escalation. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-code-generation:24", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A product manager provides requirements for a payment integration as: \"Users should be able to pay with cards, and it should be secure.\" What is the correct first action before writing any code?", "opts": ["Implement Stripe as the sensible default, document the assumptions in a comment block, and share the file with the PM for review.", "Ask a single clarifying question about the payment processor, then proceed to implementation once that processor is confirmed.", "Generate a requirements checklist from the prose, ask the PM to check off items, and begin coding once 80% of items are confirmed.", "Use plan mode to surface the missing constraints — card types, PCI scope, 3DS, error handling — before proposing any architecture."], "answerIdx": 3, "explanation": "**D)** Underspecified requirements for a payment integration have significant security, compliance, and architectural implications (PCI DSS scope, 3DS authentication, card types, failure handling, refund flows). Plan mode is correct because multiple valid architectures exist with meaningfully different implications, and proceeding without surfacing those decisions risks costly rework. A is wrong because assuming Stripe and burying assumptions in comments is the anti-pattern for ambiguous requirements — it creates undocumented architectural decisions that are hard to reverse. B is wrong because processor choice is only one of many unresolved questions; confirming it doesn't resolve security scope, card types, or failure handling. C is wrong because a checklist approach delegates architectural decisions back to the PM rather than surfacing the technical implications that require engineering judgment. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-code-generation:23", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer's `/refactor-service` skill takes `--service-name` as its argument. After running the skill on a 15-file service, the developer notices the changes were incomplete — several call sites outside the service directory were missed. The skill's `allowed-tools` is set to `Edit, Read`. What is the most likely root cause?", "opts": ["The skill argument was passed without quotes, splitting the service name at the shell level before it reached the skill runner.", "The skill lacks `context: fork`, causing it to lose track of previously edited files partway through the multi-file operation.", "`Edit` without `Bash` in `allowed-tools` blocks the skill from running `grep` or `find` to discover call sites outside known files.", "The skill requires a `glob-scope` frontmatter field to extend its file access beyond the service directory boundary."], "answerIdx": 2, "explanation": "**C)** The skill has `allowed-tools: Edit, Read` but not `Bash`. Locating call sites outside a known directory requires running `grep` or `find` — those are Bash commands. Without `Bash` in `allowed-tools`, the skill can only read files it already knows about, missing call sites it can't discover through targeted reads. A is wrong because skill arguments are passed as strings within the Claude Code environment; shell word-splitting is a concern for shell scripts, not skill invocation. B is wrong because `context: fork` prevents context pollution from bleeding into the main session — it wouldn't cause the skill to drop edits mid-execution. D is wrong because `glob-scope` is not a valid skill frontmatter field — tool access determines what the skill can do, not a scope boundary. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:12", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A `PostToolUse` hook detects that a `create_pr` tool returned `{\"status\": \"failed\", \"error\": \"branch not found\"}`. What should the hook return to handle this correctly?", "opts": ["Return `{\"action\": \"modify_result\", \"result\": {\"status\": \"created\", \"pr_url\": null}}` to suppress the error from the model and avoid triggering unnecessary retry logic in the loop.", "Return `{\"action\": \"pass\"}` and let the model read the raw failure response — the model will detect `status: \"failed\"` and independently decide whether to retry or escalate the issue.", "Return `{\"action\": \"retry\", \"max_attempts\": 3}` to instruct the hook runner to automatically retry the `create_pr` tool up to three times before reporting the failure to the model.", "Return `{\"action\": \"block\", \"reason\": \"PR creation failed: branch not found\"}` to halt the agentic loop and surface the structured error to the operator for investigation."], "answerIdx": 3, "explanation": "**D)** A `PostToolUse` hook that detects a structured failure condition should block with a clear error reason, surfacing the failure to the operator rather than letting the model guess. A) silently masks the failure — an anti-pattern that hides error state from the model and downstream debugging. B) is reasonable but leaves error-handling to probabilistic model behavior rather than deterministic hook logic. C) `retry` is not a documented `PostToolUse` hook action — hooks can block, modify, or pass, not orchestrate retries. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:28", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent's `lookup_order` tool description says: \"Retrieves order information for a given order ID.\" A customer asks \"what's the status of my recent order?\" and the agent asks the customer for their order ID, even though the agent already retrieved the customer's full order history including a recent order earlier in the conversation. What should be added to the tool description?", "opts": ["Add the tool's internal database query syntax so the model can construct more efficient lookup calls", "Add context-sensitivity guidance: \"When recent order history is already present in the session, use the most recent order from that data rather than prompting the customer for an ID\"", "Add the tool's average latency and result schema so the model can decide whether to use it or reference existing context", "Add a list of fields returned so the model understands what data will be available after a successful call"], "answerIdx": 1, "explanation": "**B)** The agent is calling the tool redundantly and then asking the customer for information already available in the session. Adding context-sensitivity guidance teaches the model to prefer existing session data over a redundant tool call and customer interruption. A is irrelevant — database query syntax is internal and not a tool description concern. C adds operational metadata that doesn't address the redundancy problem; the agent needs to know when not to call the tool, not how fast it runs. D describes output schema, which is useful but doesn't address the specific failure mode of ignoring already-available order data. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:5", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Three parallel subagents are assigned to research \"the future of work\" simultaneously. After completion, the coordinator finds that all three agents independently retrieved and analyzed the same 12 McKinsey and WEF reports, producing nearly identical findings across 47,000 tokens of redundant output. What should the coordinator have done before dispatching the subagents?", "opts": ["Deduplicated the combined outputs post-collection using a separate deduplication agent before passing results to synthesis", "Run subagents sequentially so each could read the previous agent's output and avoid duplicating sources", "Instructed each subagent to log retrieved sources to a shared state object so later agents could skip already-covered documents", "Explicitly partitioned the research space before delegation — assigning distinct subtopics, source types, or date ranges to each subagent"], "answerIdx": 3, "explanation": "**D)** The root cause is unclear task boundaries at delegation time. If the coordinator assigns each agent \"research the future of work\" without partitioning (e.g., agent 1 covers labor market shifts, agent 2 covers technology adoption, agent 3 covers policy responses), agents will naturally converge on the same prominent sources. Explicit pre-delegation partitioning preserves the parallelism benefits while eliminating redundant work. A is wrong because post-collection deduplication addresses the symptom (redundant output) without fixing the cause (overlapping task scope), and wastes all the tokens already spent on redundant research. B is wrong because sequential execution eliminates the parallelism that motivated the multi-agent design. C is wrong because shared state logging during parallel execution creates coordination overhead, potential race conditions, and still requires agents to read each other's state mid-task. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:6", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A pipeline using `claude -p` needs its output consumed by a downstream shell script that extracts finding counts, severity levels, and file paths for a GitHub status check. The current natural language output requires fragile regex parsing that breaks when Claude rephrases a summary. What is the most robust fix?", "opts": ["Add detailed formatting instructions to the prompt specifying exactly how counts, severities, and file paths should appear in the response text", "Post-process the output through a second `claude -p` call that converts natural language output into a structured format", "Use `claude -p --output-format json` so the CLI enforces structured JSON output, then consume the JSON fields directly in the shell script", "Use `claude -p` with a CLAUDE.md that contains example JSON output, so the model learns the format from context"], "answerIdx": 2, "explanation": "**C)** `--output-format json` is a native CLI flag that enforces structured JSON output — not a prompt-level suggestion. The shell script can then use `jq` to extract fields without fragile regex. A is wrong because formatting instructions are probabilistic; Claude may still rephrase, especially across model updates. B is wrong because it adds a second API call with its own latency and failure modes, and the second call faces the same formatting reliability problem. D is wrong because CLAUDE.md examples influence behavior but do not enforce structure — Claude can still deviate. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:25", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You want to add streaming to your extraction pipeline to return fields progressively as they are identified rather than waiting for a complete JSON object. What constraint applies when streaming structured extraction via `tool_use`?", "opts": ["Streaming extraction requires extended thinking to be enabled so the model plans all field values before beginning output, preventing field reordering mid-stream during generation.", "Streaming is incompatible with `tool_use` schemas; streaming extraction requires direct text-based JSON output and cannot guarantee schema compliance during progressive delivery.", "Streaming with `tool_use` requires `stream: true` to be set inside the tool definition object, not at the top-level API call, to enable incremental field delivery per tool.", "Streaming a `tool_use` response delivers the tool call input as incremental JSON delta events; the consuming application must buffer until the full tool call completes before parsing or validating the result."], "answerIdx": 3, "explanation": "**D)** When streaming a `tool_use` response, the API delivers the tool call's `input` field as incremental JSON delta events during generation. The consuming application receives partial JSON fragments that are not valid JSON until the tool call completes. It must buffer the complete `input` before parsing it as JSON or validating it against the schema. Attempting to parse mid-stream fragments will produce JSON parse errors. A) extended thinking is not required for streaming and does not prevent field reordering. B) is false — `tool_use` fully supports streaming. C) `stream` is set at the API call level, not inside tool definitions. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-code-generation:28", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A team wants to prevent Claude from writing code before discussing architectural decisions on any task that touches the `src/core/` directory. They want this to be automatic — no developer should need to remember to invoke plan mode. What configuration achieves this?", "opts": ["Add a root-level CLAUDE.md instruction: \"Always discuss architecture before writing code for files in src/core/.\"", "Create `.claude/rules/core-plan-first.md` with `globs: \"src/core/**\"` and a rule stating Claude must use plan mode before editing these files.", "Create a `.claude/rules/core-plan-first.md` file with `globs: \"src/core/**\"` that instructs Claude to present a design discussion before making any edits.", "Add `force-plan-mode: true` to a `.claude/rules/core-architecture.md` file with `globs: \"src/core/**\"` frontmatter."], "answerIdx": 2, "explanation": "**C)** A `.claude/rules/` file with `globs: \"src/core/**\"` frontmatter activates automatically when Claude is working with files in that path. The rule content instructs Claude to present a design discussion before making edits — this is the correct way to enforce a workflow gate path-conditionally without developer action. B describes the same solution but incorrectly claims Claude is forced into \"plan mode\" — rules files contain instructions, they don't programmatically toggle plan mode. A is wrong because a root CLAUDE.md instruction applies globally and still requires the developer to prompt Claude toward architecture discussion; it isn't path-conditional. D is wrong because `force-plan-mode` is not a valid frontmatter field; plan mode cannot be programmatically enforced via config, only instructed via rules. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-ci-cd:27", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A pipeline uses `claude -p` to review PRs and posts findings as GitHub PR review comments. The team wants to add a confidence score to each finding so developers can triage quickly. Stakeholders have previously rejected filtering findings by confidence because they want all findings visible. What approach satisfies both requirements?", "opts": ["Add confidence scores as a separate JSON field and use a GitHub Actions step to hide low-confidence findings behind a collapsible section in the PR comment", "Include the confidence assessment and reasoning inline with each finding in the output so developers see the score and rationale without needing to click through to a separate view", "Post high-confidence findings as blocking review comments and low-confidence findings as informational annotations in a separate PR check status", "Store confidence scores in a separate API call result and surface them only in the CI log, keeping PR comments clean and uncluttered"], "answerIdx": 1, "explanation": "**B)** Including reasoning and confidence inline respects the constraint (all findings visible) while speeding triage — developers can assess severity at a glance without extra clicks. This was the pattern validated in the real exam scenario. A is wrong because hiding low-confidence findings behind collapsible sections violates the stakeholder requirement that all findings be visible. C is wrong because splitting into blocking vs informational comments changes the workflow structure in a way stakeholders may not have approved, and the requirement is to keep all findings visible, not to route them differently. D is wrong because confidence scores in CI logs are invisible to developers doing PR review — they'd have to leave the PR to find the scores. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:5", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A code review agent calls `read_file`, `run_linter`, and `fetch_pr_diff` at the start of every review. All three are independent: none of the tools' inputs depend on the others' outputs. In production, each review takes ~6 seconds. What should you change?", "opts": ["Issue all three tool calls in a single assistant response turn so the executor runs them in parallel, reducing latency to the slowest single tool instead of the sequential sum.", "Reorder the tool calls so `fetch_pr_diff` runs first (it is slowest), then `run_linter`, then `read_file`, to minimize total wall-clock time through better sequential scheduling.", "Replace all three tools with a single composite `review_context` tool that internally fetches all three pieces of data and returns a merged response object to the model.", "Add a `PreToolUse` hook that caches each tool call keyed by input hash, so repeated reviews of unchanged files skip redundant I/O on subsequent runs."], "answerIdx": 0, "explanation": "**A)** When tool inputs are independent, a model can request multiple tools in a single response turn and the executor runs them concurrently. This is the correct pattern for parallel tool use. B) reorders sequential calls — still sequential, no parallelism gain. C) creates a composite tool that hides internal complexity from the model, preventing independent tool selection and reducing reusability. D) is a valid optimization for repeated runs but does not address the initial per-review latency problem. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-developer-productivity:18", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A developer uses extended thinking and notices the API response includes blocks with `type: \"thinking\"` alongside the final text. They want to log the thinking for debugging but not include it in the user-facing output. What is the correct approach?", "opts": ["Set `thinking: {type: \"enabled\", budget_tokens: 5000, display: \"omitted\"}` — this generates thinking internally but strips it from the API response entirely so the response only contains text blocks.", "In client code, iterate the `content` array and separate blocks by `type`: log blocks where `type == \"thinking\"` for debugging, render blocks where `type == \"text\"` for users — both coexist in the full response.", "Pass `strip_thinking: true` in the API request body to exclude thinking blocks from the wire response before they reach the client application layer.", "Wrap the request in a `PostToolUse` hook that intercepts thinking blocks before the text response and redirects them to a separate logging endpoint outside the main conversation flow."], "answerIdx": 1, "explanation": "**B)** Thinking blocks and text blocks coexist in the response's `content` array. The correct approach is to process them separately in client code: log `thinking` blocks for debugging and display `text` blocks to users. A) is a partial truth: `display: \"omitted\"` reduces the rendered thinking in some UIs but does not strip thinking blocks from the API response content array. C) `strip_thinking` is not a documented API request field. D) confuses hook architecture — hooks intercept tool calls, not model response content arrays. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-structured-extraction:18", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "A developer wants to reduce API costs on an extraction pipeline that uses extended thinking. They switch `display` from `'omitted'` to `'none'`, expecting `'none'` to disable thinking and eliminate thinking token charges. What is the actual effect?", "opts": ["No cost reduction — both `'omitted'` and `'none'` are display variants that leave thinking active; neither disables thinking or reduces thinking token billing.", "Cost increases slightly — `'none'` forces thinking tokens to be generated twice: once for internal reasoning and once to produce the hidden summary displayed to no one.", "No change in behavior — `'none'` is not a valid value for the `display` parameter; the API ignores unrecognized values and defaults to `'omitted'` behavior.", "No cost reduction if thinking is still enabled in the config — disabling extended thinking requires setting `thinking: {type: 'disabled'}`, not changing the `display` field."], "answerIdx": 3, "explanation": "**D)** The `display` parameter controls how thinking content appears in the response — it does not enable or disable thinking. To stop generating and billing thinking tokens, the developer must set `thinking: {type: 'disabled'}` or remove the thinking configuration entirely. Changing `display` from `'omitted'` to `'none'` has no effect on thinking token generation or cost. A) misstates that `'none'` is a valid display value alongside `'omitted'`. B) and C) describe non-existent API behaviors. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-multi-agent-research:20", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A research coordinator is designed so that all subagent outputs are collected before any synthesis begins. During a large research run, 5 of 6 subagents complete within 2 minutes, but the 6th subagent is waiting on a rate-limited external API and takes 18 minutes. The coordinator blocks the entire pipeline for 16 minutes waiting for the 6th result. What architectural change best addresses this bottleneck?", "opts": ["Increase the API rate limit allocation for the 6th subagent so it completes within the same 2-minute window as the other five", "Allow synthesis to begin with available results after a configurable timeout, routing the late result through the coordinator to the synthesis agent when it arrives", "Replace the coordinator's synchronous wait with a polling loop that checks subagent status every 30 seconds, preserving the all-or-nothing completion requirement", "Reduce the number of parallel subagents from 6 to 3 to lower the probability that a single slow agent blocks the full pipeline"], "answerIdx": 1, "explanation": "**B)** The bottleneck is the all-or-nothing synchronous barrier. Allowing synthesis to begin with available results after a timeout, then routing the late result through the coordinator to the synthesis agent when it arrives (or as a supplement/amendment), makes productive use of the 16-minute wait. The coordinator routes late results appropriately rather than blocking everything. A is wrong because rate limit increases require negotiation with the external API provider and may not be achievable — this is an infrastructure solution that doesn't address the architectural design flaw. C is wrong because a polling loop preserves the all-or-nothing requirement; it reduces CPU blocking but does not reduce total wall-clock wait time for the pipeline. D is wrong because reducing subagent count reduces research breadth to avoid a timing problem — it trades output quality for latency management, which is the wrong trade-off when a better architectural solution exists. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-code-generation:27", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer creates a personal skill at `~/.claude/skills/lint-fix.md` with `context: fork` and `allowed-tools: Bash`. A new rule in the project's `.claude/rules/no-bash.md` (with `globs: \"**\"`) instructs Claude never to use Bash. When the developer invokes `/lint-fix`, which behavior occurs?", "opts": ["The skill runs with Bash available because skill-level `allowed-tools` frontmatter takes precedence over rules-file instructions within the skill's scope.", "The skill runs without Bash because the project rules file's `globs: \"**\"` overrides all user-level skill frontmatter declarations.", "The skill fails to load because conflicting tool policies between user config and project config prevent the skill from initializing.", "The skill runs with Bash available, but after the skill exits, Claude refuses Bash tool calls for the remainder of the main session per the rules file."], "answerIdx": 0, "explanation": "**A)** `allowed-tools` in skill frontmatter governs tool access within the skill's execution scope. The rules file contains a prose instruction (\"never use Bash\") which is advisory, not a hard enforcement mechanism at the same layer as frontmatter. The skill's frontmatter whitelist takes precedence within the skill's execution context. B is wrong because rules-file instructions are not a hard override of skill frontmatter tool declarations — they operate at the instruction layer, not the config layer. C is wrong because conflicting advisory instructions and frontmatter config don't prevent skill initialization. D is wrong because `context: fork` isolates the skill's execution, and the main session's rules file applies to the main session, not to the forked skill context. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-developer-productivity:8", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your IDE integration runs Claude Code inside VS Code. A developer reports that running `claude` from the VS Code integrated terminal requires confirmation for file edits, but the same command in a standalone terminal does not. What is the most likely explanation?", "opts": ["VS Code overrides Claude Code's permission model by injecting a VS Code-specific settings file that adds confirmation requirements for all write operations in the editor context.", "The standalone terminal session has a project-level `.claude/settings.json` with a broader `allow` list for file writes, while the VS Code terminal inherits user-level settings with more restrictive defaults.", "The VS Code extension bundles an older version of Claude Code that predates the non-interactive permission model, causing confirmations that the standalone binary no longer shows.", "Claude Code detects the `TERM_PROGRAM=vscode` environment variable and automatically switches to interactive confirmation mode for all destructive operations inside VS Code."], "answerIdx": 1, "explanation": "**B)** Permission behavior in Claude Code is controlled by layered settings files: global user settings (`~/.claude/settings.json`) and project-level settings (`.claude/settings.json`). A terminal session run from the project directory picks up the project-level `allow` list; VS Code's terminal may resolve to a different working directory or inherit different settings. A) and D) describe non-existent behaviors — Claude Code does not inspect `TERM_PROGRAM` for permission changes, and VS Code does not inject Claude settings. C) is a plausible distractor but is not the documented reason for permission differences. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-code-generation:13", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "Your team has a `/security-audit` skill that examines auth patterns across the codebase. A new developer notices that after invoking `/security-audit`, Claude's subsequent coding suggestions are noticeably influenced by the security findings — even for unrelated features. What is the cause and fix?", "opts": ["The skill needs a `clear-context: true` frontmatter field to flush accumulated findings after each security review invocation.", "The skill is user-scoped in `~/.claude/skills/` rather than project-scoped; moving it to `.claude/skills/` isolates its execution context.", "The skill is loading too many files; restricting `allowed-tools` to `Read` and re-invoking limits the scope of findings polluting context.", "The skill lacks `context: fork`, so its findings accumulate in the main conversation history and influence subsequent responses."], "answerIdx": 3, "explanation": "**D)** Without `context: fork`, the skill runs in the main conversation context. Its verbose security findings accumulate in the conversation history and become part of the context window that influences all subsequent responses. Adding `context: fork` runs the skill in an isolated sub-agent context, preventing analysis output from polluting the main session. A is wrong because `clear-context` is not a valid skill frontmatter field. B is wrong because whether the skill is user-scoped or project-scoped does not affect context isolation; `context: fork` is the mechanism for that. C is wrong because `allowed-tools: Read` limits which tools run, not whether the output is isolated — the findings still land in main context. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-multi-agent-research:17", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A research coordinator is designing its subagent prompt template. An engineer proposes including `--dangerously-skip-permissions` in the subagent's launch configuration so it can access all internal document stores without requesting individual permissions. What is the correct assessment of this proposal?", "opts": ["Acceptable if the subagent is running in an isolated execution environment where document store access cannot affect production systems", "Not acceptable — subagents should be granted only the specific permissions required for their assigned task, never blanket permission bypass", "Acceptable for read-only subagents since they cannot modify data, making the elevated access scope lower risk than for write-capable agents", "Acceptable only if the subagent's task scope is narrow and well-defined, and the coordinator can audit every tool call the subagent makes"], "answerIdx": 1, "explanation": "**B)** `--dangerously-skip-permissions` bypasses all permission checks, granting the subagent access to everything it can reach. This violates the least-privilege principle: subagents should have exactly the permissions their task requires, no more. This is especially important in multi-agent systems where a compromised or misbehaving subagent's blast radius should be bounded by its permission scope. A is wrong because isolation reduces blast radius but doesn't justify skipping permissions — the principle applies regardless of environment; overly permissioned agents are still a design defect. C is wrong because read-only access to all document stores still exposes sensitive data the agent should never see, and the read/write distinction doesn't change the scope violation — a read-only agent with access to confidential documents is still over-permissioned. D is wrong because narrow task scope and coordinator auditing are good practices, but they don't justify skipping permissions — narrow scope should mean narrow permissions, not blanket bypass with manual oversight as compensation. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-structured-extraction:22", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You submit 1,000 loan applications to the Batches API for structured extraction. Processing time is up to 24 hours and your SLA is 28 hours. After 22 hours, 940 documents complete successfully but 60 fail: 45 due to context overflow and 15 due to transient rate-limit errors. How should you handle the failures to meet the SLA?", "opts": ["Resubmit the 60 using `custom_id` matching: chunk the 45 oversized documents before resubmission and retry the 15 transient failures unchanged. Submit as a single targeted batch immediately.", "Resubmit all 60 failures immediately without modification; the 6-hour buffer before the SLA deadline provides sufficient time for a complete second batch run at full scale.", "Accept partial results for the 45 oversized documents and only resubmit the 15 transient failures, since documents exceeding the context window cannot be processed by the Batches API.", "Escalate all 60 to synchronous API calls to guarantee results within the 6-hour window, since batch resubmission cannot provide latency guarantees for individual documents."], "answerIdx": 0, "explanation": "**A)** Different failure types need different remediation. The 45 context overflow failures require chunking (address the root cause); resubmitting them unchanged will fail again. The 15 transient failures can be retried unchanged. Using `custom_id` to identify failed documents and batching all 60 in one resubmission is efficient and targeted. B) resubmitting oversized documents unchanged wastes the 6-hour buffer. C) oversized documents can be processed if chunked appropriately. D) synchronous calls for 60 documents are expensive and unnecessary. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-code-generation:22", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You need to expose a third-party service through an MCP server. The server is internal to your organization and should not be accessible to external contributors working on forks of the repo. Where should the `.mcp.json` be placed, and what should it contain?", "opts": ["User-level at `~/.claude/mcp.json` on each internal developer's machine, keeping it entirely out of version control.", "Root of the repo as `.mcp.json` with `visibility: internal` to signal the MCP server is not intended for external forks.", "Root of the repo as `.mcp.json` but listed in `.gitignore` to block commits while remaining locally accessible to developers.", "Root of the repo as `.mcp.json` referencing the internal server, relying on contributors lacking credentials to limit access."], "answerIdx": 0, "explanation": "**A)** When an MCP server should not be shared with external contributors, the configuration belongs in user-scoped `~/.claude/mcp.json` — it lives on each internal developer's machine and is never committed to the repo. B is wrong because `visibility: internal` is not a valid `.mcp.json` field; committed files are accessible to all repo forks regardless of metadata. C is wrong because `.gitignore` prevents commits to the local repo but doesn't prevent the file from being inadvertently staged or shared through other means; user-scoped config is the clean isolation point. D is wrong because relying on credential absence as a security control is fragile — the server URL and endpoint details are still exposed, enabling enumeration or accidental misconfiguration. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-customer-support:9", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A customer lookup returns three records with the same name. The agent selects the first result using a recency heuristic and proceeds to pull order history. Approximately 15% of cases result in the agent responding about the wrong customer account. What is the correct fix?", "opts": ["Implement a confidence-scoring approach where the agent selects the match it self-rates highest and proceeds only when that score exceeds 0.85", "Silently select the highest-ranked match and proceed — surfacing ambiguity creates unnecessary friction for customers with simple requests", "Prompt the agent to ask for an additional disambiguating identifier — email, phone number, or recent order number — before proceeding when multiple matches are returned", "Add a PostToolUse hook that suppresses all but the top-ranked match in the tool response so the model sees only one candidate"], "answerIdx": 2, "explanation": "**C)** Only the customer has definitive knowledge of their own identity. One clarifying turn is far cheaper than a 15% wrong-account rate and its downstream consequences. A is the self-reported confidence anti-pattern — model confidence scores are not calibrated to selection accuracy and do not guarantee correct disambiguation. B hides ambiguity behind a heuristic, which is precisely what is causing the current 15% error rate. D forces the model to commit to a single result without evidence, removing the information needed to surface the ambiguity correctly. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:10", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A customer requests a price match to a competitor's advertised price. Your policy documentation covers standard discounts and loyalty tiers but is entirely silent on competitor price matching. Support agents have no pricing authority delegated in the policy. What should the agent do?", "opts": ["Use a self-critique (evaluator-optimizer) pass to generate a policy interpretation, evaluate it for reasonableness, and respond with the highest-confidence interpretation", "Deny the request by citing the absence of a price-match policy in documentation and offer the standard discount as an available alternative", "Apply the most generous available standard discount as a reasonable approximation of a price match and document the rationale", "Escalate to a human agent — this is a genuine policy gap where human judgment is required to interpret company pricing position on competitor matching"], "answerIdx": 3, "explanation": "**D)** A policy gap — where the policy is silent, not merely ambiguous — requires human judgment. The agent has no authority to create a policy position on a financial matter. C misrepresents a standard discount as a price match, which is both inaccurate and sets a precedent the agent has no authority to establish. B makes a policy ruling (denial) where the agent has no delegated authority — the correct action is escalation, not self-adjudication. A is wrong because self-critique improves response quality within existing policy bounds; it cannot generate valid policy positions the agent was never given. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:14", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A subagent encounters a transient network error while fetching from an API (connection reset after 2 seconds, with no response body). The subagent's retry logic is disabled because a previous engineer removed it after it caused issues in a different context. The subagent immediately escalates to the coordinator. What principle does this violate?", "opts": ["All tool calls should include idempotency keys so that retry attempts do not produce duplicate side effects when the original request may have partially succeeded", "Local recovery should happen at the lowest capable level — transient failures should be handled within the subagent before escalating unresolvable errors to the coordinator", "Subagents should validate network connectivity before making any external tool calls to avoid encountering transient errors during task execution", "Coordinators should implement circuit-breaker patterns to detect when a subagent is prematurely escalating retryable failures instead of handling them internally"], "answerIdx": 1, "explanation": "**B)** A transient network error (connection reset) is a classic retryable failure — the service may be momentarily unavailable, and a single retry often resolves it. Escalating immediately to the coordinator for a condition the subagent could have resolved locally adds unnecessary overhead to the coordinator, which must now spend context and decision-making on a routine operational concern. The principle is: handle at the lowest capable level; only escalate what is genuinely unresolvable. A is wrong because idempotency keys address the correctness of retries (preventing duplicate side effects), not the question of whether to retry at all — the principle violated here is about escalation scope, not retry safety. C is wrong because pre-call connectivity validation is impractical and doesn't prevent errors that occur mid-request — it adds overhead without improving reliability. D is wrong because circuit-breaker patterns are the coordinator's defense against systematic failures, not a substitute for subagent-level retry logic on individual transient errors. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-structured-extraction:13", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You process 400-page annual reports by chunking into 80-page segments. After extraction and merge, the `net_revenue` field has conflicting values across chunks: a summary page in chunk 1 reports $4.2B while a detailed table in chunk 3 reports $4,187M. How should the merge step handle this?", "opts": ["Always prefer the value from the earliest chunk, since summary sections in annual reports appear before detailed tables and provide the authoritative figure.", "Preserve both extracted values with their source chunk and page reference, and surface the conflict with a `conflict_detected: true` flag for downstream handling.", "Discard both values and mark the field as requiring human review, since two different extracted values indicate the model made an error in at least one chunk.", "Convert all values to a normalized unit (millions) during extraction and automatically select the higher-precision value as the authoritative result."], "answerIdx": 1, "explanation": "**B)** Conflicting extractions may reflect a real discrepancy in the source document (rounding conventions, different reporting scope, or a restatement) or an extraction inconsistency. Preserving both values with provenance and flagging the conflict gives downstream systems and reviewers the information to resolve it correctly. A) uses an arbitrary position heuristic. C) discards both values and loses all data for that field. D) automatic selection without surfacing the conflict can silently propagate a wrong value. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-code-generation:20", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A team has a large CLAUDE.md with `@import ./docs/api-conventions.md` at the top. They notice that editing non-API files still loads all 3,000 tokens of API conventions. They want API conventions to load only when editing API files. What is the correct solution?", "opts": ["Replace the `@import` with a `.claude/rules/api-conventions.md` file using `globs: \"src/api/**\"` frontmatter so the rules load conditionally.", "Wrap the `@import` directive in a conditional block: `if path matches src/api/** then @import ./docs/api-conventions.md`.", "Move the `@import` directive from root CLAUDE.md to a CLAUDE.md placed inside `src/api/` so it only loads in that directory's scope.", "Add `load: on-demand` as a frontmatter field to the imported file so Claude skips it unless the session involves API files."], "answerIdx": 0, "explanation": "**A)** `@import` in CLAUDE.md loads the referenced file unconditionally for every task — it is not conditional. The correct mechanism for path-conditional rule loading is `.claude/rules/` with YAML frontmatter `globs`. Moving the content to a rules file with `globs: \"src/api/**\"` makes it load only when the active file path matches that pattern. B is wrong because `@import` does not support conditional syntax; there is no `if path matches` block directive in CLAUDE.md. C is wrong because a `src/api/CLAUDE.md` would load when Claude is working in that directory, but cross-cutting API files outside that hierarchy or invocations from the root context won't trigger it reliably. D is wrong because `load: on-demand` is not a valid frontmatter field for imported files. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-multi-agent-research:23", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A coordinator is implementing error escalation policy. An engineer proposes that subagents should escalate to the coordinator any time a tool call returns an error, regardless of the error type. A second engineer proposes that subagents should escalate only when they cannot resolve the error locally using built-in retry logic. Which policy is correct and why?", "opts": ["The first policy, because centralized error visibility gives the coordinator full audit capability and ensures no error goes undetected in the workflow", "The first policy, because subagent retry logic can cause duplicate side effects on non-idempotent tool calls, making coordinator-controlled retry safer for all error types", "The second policy, because all escalations consume coordinator context window tokens, and high-volume routine error reporting would cause the coordinator to hit its context limit during the research task", "The second policy, because the coordinator should only receive escalations for conditions the subagent genuinely cannot handle — local recovery for transient errors reduces coordinator load and preserves its bandwidth for real failures"], "answerIdx": 3, "explanation": "**D)** The principle is: handle at the lowest capable level. Transient errors (network hiccups, rate limits with backoff) are well-defined conditions that subagents can handle locally with retry logic. Escalating every tool error to the coordinator for a decision adds unnecessary overhead, consumes coordinator context, and introduces latency. The coordinator's bandwidth is better used for decisions it uniquely can make — like whether to skip a topic area, adjust scope, or surface a gap to the user. A is wrong because full audit capability is achievable through structured logging, not by routing every error through the coordinator's decision logic — these are separate concerns. B is wrong because the concern about non-idempotent retries is valid in some contexts, but the correct fix is idempotency design in tools and retry guards in subagents, not routing all retries through the coordinator. C is wrong because while context consumption is a real concern, the primary argument for the second policy is design correctness (handle at lowest capable level), not token conservation. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-code-generation:7", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "Your team's CLAUDE.md has grown to 800 lines covering API conventions, testing standards, database patterns, security rules, and deployment checklists. Context window consumption has become noticeable on short tasks. What is the best refactoring approach?", "opts": ["Split the content into multiple CLAUDE.md files at different directory levels, keeping only root-level rules in the root CLAUDE.md.", "Move all 800 lines into `.claude/rules/` as a single file and reference it with a root-level `@import`.", "Move universal coding standards into CLAUDE.md, and convert task-specific workflows into skills invoked on-demand.", "Replace CLAUDE.md entirely with a skills library and instruct developers to invoke the relevant skill at the start of each session."], "answerIdx": 2, "explanation": "**C)** The correct split is: always-needed context (coding standards, testing conventions, security rules) stays in CLAUDE.md because it applies to every task. Task-specific workflows (deployment checklists, migration scripts, PR review procedures) become skills loaded only when invoked, reducing context consumption on unrelated work. A is wrong because directory-level CLAUDE.md hierarchy solves scope problems, not context window bloat from a mixed content file. B is wrong because moving everything to `.claude/rules/` with a single `@import` still loads all 800 lines for every task — the problem is unchanged. D is wrong because removing CLAUDE.md entirely means universal standards are not loaded for tasks where developers don't think to invoke a skill. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-multi-agent-research:28", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A research system has three types of agents: a coordinator, web research subagents, and a synthesis agent. A new engineer proposes adding a fourth type: a \"meta-coordinator\" that supervises the main coordinator and decides when to restart the research if quality is insufficient. What is the primary risk of this design?", "opts": ["The meta-coordinator would need a broader context window than the coordinator to evaluate research quality holistically, but context windows are fixed per model tier, making this architecturally infeasible", "Adding a supervision layer above the coordinator creates a recursive escalation path — if the meta-coordinator encounters errors, there is no higher authority to escalate to, causing unhandled failures", "Same-level review is an anti-pattern: the meta-coordinator supervising the coordinator introduces a coordination overhead loop where quality evaluation can trigger restarts without clear termination conditions, producing runaway re-research cycles", "The meta-coordinator would need access to the synthesis agent's output to evaluate quality, which violates the principle that only the direct coordinator should receive subagent outputs"], "answerIdx": 2, "explanation": "**C)** A supervision agent that can trigger restarts without well-defined termination conditions creates the risk of a runaway loop: research runs, meta-coordinator evaluates quality as insufficient, research restarts, quality again deemed insufficient, repeat. Additionally, the meta-coordinator and coordinator are at the same architectural level (both are orchestrators) — this is analogous to the \"same-session self-review\" anti-pattern, where the reviewer has the same biases and blind spots as the original. A is wrong because context window size is an implementation detail that can be addressed by choosing an appropriate model; it's not an architectural infeasibility argument. B is wrong because the absence of a higher escalation authority is a general property of any top-level component, not a defect specific to this design — the real risk is the restart loop, not the escalation depth. D is wrong because the coordinator receiving subagent outputs is the correct design; the issue isn't about who receives outputs but about the supervision loop structure. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:16", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team wants to place a Claude Code security review at the most effective point in their CI/CD pipeline. They have two candidates: (1) pre-merge, blocking the pull request, or (2) post-merge, running as part of the deployment pipeline. Which placement is correct and why?", "opts": ["Post-merge, because security issues caught before deployment are caught before they cause production impact, and the full merged codebase gives Claude more context than a diff", "Post-merge, because blocking merges on security findings frustrates developers and lowers review adoption across the team", "Pre-merge, but only for files that match a security-sensitive path pattern; all other files should be reviewed post-merge to reduce blocking time", "Pre-merge, because catching security issues before they enter the main branch is more valuable than catching them after — post-merge means the vulnerability is already in the codebase"], "answerIdx": 3, "explanation": "**D)** Pre-merge placement intercepts security issues before they become part of the shared codebase history. Post-merge means the vulnerability is committed, other branches may have already been cut from it, and rollback requires reverting a merged change. The purpose of automated security review is prevention, not detection after the fact. A is wrong because while the full merged codebase provides more context, the cost of post-merge discovery (committed history, potential propagation) outweighs the context benefit. B is wrong because developer friction is a UX concern to optimize around, not a reason to remove pre-merge blocking. C introduces path-based logic that is fragile — security issues can appear in non-sensitive paths (e.g., utility functions called by auth code). (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-multi-agent-research:3", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A research coordinator uses a hub-and-spoke architecture. A junior engineer proposes switching to a peer-to-peer mesh so subagents can share intermediate findings directly, reducing round-trips. What is the strongest argument against this change in a research pipeline context?", "opts": ["Peer-to-peer agents cannot be implemented with the current SDK's subagent invocation model, making the proposal technically infeasible", "Direct agent-to-agent communication doubles token consumption because each message must be serialized and re-embedded in both agents' context windows", "Peer-to-peer topology prevents parallel execution because agents must wait for each other's outputs before proceeding to their own next step", "Removing the coordinator as central hub eliminates centralized error handling, consistent state visibility, and fine-grained control over what each subagent receives"], "answerIdx": 3, "explanation": "**D)** Hub-and-spoke's core value is observability and control: the coordinator sees all interactions, enforces consistent error handling, and precisely controls what information each subagent receives. Peer-to-peer removes that centralized visibility, making it impossible to audit what information flowed where, enforce uniform error policies, or prevent subagents from injecting unreviewed findings into each other's context. A is wrong because peer-to-peer is architecturally possible — the argument against it is design quality, not technical feasibility. B is wrong because token consumption depends on message size and frequency, not topology per se — peer-to-peer with small messages can be more efficient than hub routing large result sets through a coordinator. C is wrong because peer-to-peer does not prevent parallelism; agents can still run concurrently and exchange messages asynchronously. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:25", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team runs `claude -p \"Review PR for test coverage gaps\"` in CI but developers complain the suggestions don't account for the fact that integration tests already cover most of the flagged scenarios. The prompt currently has no knowledge of the test suite structure. What is the highest-leverage context addition?", "opts": ["Add the total test count and overall coverage percentage from the CI coverage report to give Claude a sense of the project's testing maturity", "Include the relevant integration test file contents in the prompt so Claude can directly observe which scenarios are already covered by integration tests", "Instruct Claude in the prompt to assume comprehensive integration test coverage exists for all database interaction code, since the team mentioned that's their strongest area", "Add the test file names and directory tree to the prompt so Claude can infer integration test coverage from the file naming conventions"], "answerIdx": 1, "explanation": "**B)** Coverage percentage and test count are aggregate metrics — they don't tell Claude which specific scenarios are covered. Including the actual test file contents gives Claude the ground truth to reason against: it can read what scenarios are exercised and avoid suggesting duplicates. A is wrong because aggregate metrics (87% coverage) don't tell Claude which specific code paths are untested. C is wrong because instructing Claude to assume coverage doesn't reflect reality — it would suppress findings for code that may genuinely lack tests. D is wrong because inferring coverage from file names is probabilistic; a file named `auth_integration_test.py` could cover 3 or 300 scenarios, and Claude can't tell which ones without reading the file. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:29", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You are running Claude Code non-interactively in a Docker container as part of a CI/CD build step. The container has no home directory (`$HOME` is unset) and no persistent filesystem. Claude Code exits immediately with \"configuration not found.\" What is the minimum fix to make Claude Code run in this environment?", "opts": ["Mount a persistent volume at `/root/.claude` and pre-populate it with a `settings.json` containing the API key, because Claude Code requires a pre-existing configuration directory to start.", "Pass `--config-dir /tmp/claude-config` to redirect all configuration writes to a writable temp path, keeping the container image read-only except for that one directory mount.", "Use `ANTHROPIC_API_KEY` environment variable only — Claude Code can run in a fully stateless mode with no configuration directory when the API key is provided via environment variable alone.", "Set `HOME=/tmp` before invoking Claude Code so it can create its configuration directory at `/tmp/.claude/` and write ephemeral session state without requiring a persistent volume."], "answerIdx": 3, "explanation": "**D)** Claude Code resolves its configuration directory relative to `$HOME`. Setting `HOME=/tmp` is the minimal change that lets it create an ephemeral config directory (`/tmp/.claude/`) for session state without requiring a persistent volume or custom flag. A) requires pre-populating a volume, which is heavier than needed. B) `--config-dir` is not a documented Claude Code flag. C) is partially true — the API key can come from the environment — but Claude Code still needs a writable directory for session state; a stateless zero-filesystem mode is not documented. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-code-generation:1", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "Your team's monorepo contains both `src/api/**` TypeScript files and `**/*.test.tsx` test files scattered throughout the repo. Each needs different naming, import-order, and assertion conventions. New developers keep applying the wrong set of conventions to the wrong files. What is the most reliable fix?", "opts": ["Add a root-level CLAUDE.md section titled \"Per-File Conventions\" with conditional phrasing so Claude infers the right ruleset.", "Create `.claude/rules/` files with YAML frontmatter `globs` patterns targeting each path pattern independently.", "Place a CLAUDE.md inside `src/api/` and another inside each `__tests__/` directory alongside test files.", "Create a skill with `allowed-tools` restricted to `Read` and `Edit` that developers invoke before touching a file."], "answerIdx": 1, "explanation": "**B)** `.claude/rules/` with YAML frontmatter glob patterns is the designated mechanism for path-conditional rule application. The glob patterns (`src/api/**/*.ts`, `**/*.test.tsx`) activate deterministically based on file path — no inference required. A is wrong because root-level prose with conditional headers relies on Claude parsing intent, not rule evaluation; it's non-deterministic. C is wrong because directory-level CLAUDE.md files work for code confined to that directory but break for cross-cutting test files scattered throughout the repo. D is wrong because `allowed-tools` in a skill controls which tools the skill can invoke, not which ruleset applies to a file path. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-ci-cd:28", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team runs `claude -p` in a GitHub Actions workflow. The workflow currently has `ANTHROPIC_API_KEY` set as an environment variable in the job. A security engineer flags that the key is scoped too broadly. What is the correct scoping approach for this CI key?", "opts": ["Use a separate, dedicated API key for CI with minimal necessary permissions, stored as a GitHub Actions secret scoped to the specific repository, rotated on a regular schedule", "Move the API key to a GitHub Actions secret and reference it as `${{ secrets.ANTHROPIC_API_KEY }}` in the workflow YAML, but keep it available to all jobs in the workflow", "Hash the API key before storing it in the environment so even if the environment is printed in logs, the raw key is not exposed", "Pass the API key as a command-line argument to `claude -p` instead of via environment variable so it is not visible in the job's environment dump"], "answerIdx": 0, "explanation": "**A)** The principle of least privilege applied to CI API keys: a dedicated key for CI limits blast radius if compromised, GitHub Actions secrets scoping to a specific repository limits cross-repo exposure, and rotation limits the window of a compromised key. B is wrong because making the key available to all jobs in the workflow is broader than necessary — only the review job needs it. C is wrong because hashing the key before storage would make it unusable as an API credential; the API requires the actual key. D is wrong because command-line arguments are visible in process listings (`ps aux`) on shared runners, which is worse than environment variable exposure. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:16", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction prompt includes 8 few-shot examples for real estate listings. In production, 12% of extractions swap `listing_price` and `assessed_value`. All 8 examples have `listing_price` greater than `assessed_value`. What is the most direct fix?", "opts": ["Add a `minimum` constraint on `listing_price` set to the maximum historical `assessed_value` to enforce the typical relationship structurally at the schema level.", "Replace the 8 examples with 20 new examples drawn from a wider price range, reducing field confusion through greater variety in example magnitude distributions.", "Add a system prompt instruction: \"listing_price is always greater than assessed_value; use this to disambiguate when both values appear close together.\"", "Add a few-shot example where `listing_price` is lower than `assessed_value` (e.g., a distressed property) to break the model's learned magnitude-based disambiguation heuristic."], "answerIdx": 3, "explanation": "**D)** The model learned an implicit heuristic from the examples: \"listing_price > assessed_value.\" This causes field swaps when a listing violates that pattern. Adding a counterexample where listing_price is lower breaks this false heuristic and teaches the model to use field identity, not relative magnitude, for disambiguation. A) encodes a typical-but-not-universal relationship as a hard constraint, rejecting valid documents where assessed value exceeds listing price. B) more volume without a counterexample will not eliminate the learned magnitude heuristic. C) reinforces the same flawed heuristic. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-customer-support:5", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your support agent omits critical context in 40% of responses — sometimes policy details, sometimes next steps, sometimes estimated timelines — with no consistent pattern to which detail is missing across case types. You added a response template to the system prompt two weeks ago with no measurable improvement. What should you try next?", "opts": ["Add a PostLLMResponse hook that scores completeness using keyword detection and automatically retries if the score is below a threshold", "Add five few-shot examples covering the five most common support case types to show fully detailed responses for each category", "Add a self-critique step (evaluator-optimizer) where a second pass evaluates each draft response against explicit criteria: policy context, next steps, and timelines", "Switch to a structured output schema requiring the model to populate `policy`, `next_steps`, and `timeline` JSON fields before returning a natural language response"], "answerIdx": 2, "explanation": "**C)** Variable gaps across diverse case types signal case-specific omissions that cannot be covered by fixed examples. Self-critique evaluates each response against explicit criteria regardless of case type — catching gaps the few-shot bank never encountered. B is wrong precisely because the gaps vary; few-shot examples cover only the patterns in the training set and cannot generalize to novel case-specific omissions. A adds scoring-and-retry overhead but does not fix the generation process itself; retrying a response that didn't critique itself will often produce the same omission. D enforces schema shape but does not ensure content quality — the model can populate fields with vague placeholder language. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:12", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A web research subagent makes a database query that fails with a 503 Service Unavailable response. The subagent has a 3-retry exponential backoff handler built in. After 3 retries over 45 seconds, all still returning 503, the subagent determines the failure is unresolvable. What should it return to the coordinator?", "opts": ["A success response with a confidence score of 0.0, allowing the synthesis agent to apply its own gap-detection logic to identify the missing data", "An empty result set with a log entry, so the coordinator can count completed subagents and not block on this one while other work proceeds", "A generic \"search service unavailable\" message so the coordinator knows to skip this result without needing to reason about the specific failure details", "A structured error payload with failure type \"service-unavailable\", the original query, the number of retries attempted, and any partial results accumulated before the failure"], "answerIdx": 3, "explanation": "**D)** After exhausting local recovery (3 retries), the subagent has done what it can — now the coordinator needs maximum information to decide next steps: try an alternative data source, skip this topic area, adjust the research scope, or surface the gap to the user. A structured error payload with failure type, original query, retry count, and partial results gives the coordinator everything it needs for an intelligent decision. A is wrong because returning success with a 0.0 confidence score is semantically deceptive — it instructs the synthesis agent to handle what is actually a data access error as if it were a confidence problem. B is wrong because an empty result set silently conflates \"access failure after retries\" with \"valid empty result\" — the coordinator cannot distinguish between the two without explicit error context. C is wrong because \"search service unavailable\" strips the query context the coordinator needs to assess whether a reformulated query or alternative source would help. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-code-generation:4", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "Your `/analyze-deps` skill runs a broad dependency analysis across hundreds of files. After invoking it, the verbose output consumes thousands of tokens in the main conversation, leaving insufficient context for the implementation work that follows. What is the minimum-change fix?", "opts": ["Add `context: fork` to the skill frontmatter so it runs in an isolated sub-agent context and returns a summary to the main session.", "Change the skill's model to `haiku` in frontmatter to reduce output verbosity at the cost of analysis depth overall.", "Split the skill into two: one for analysis and one for summarization, invoking them in sequence each time manually.", "Add `output: summary` to the skill frontmatter so Claude compresses the analysis into a short digest automatically."], "answerIdx": 0, "explanation": "**A)** `context: fork` runs the skill in an isolated sub-agent context, preventing verbose intermediate output from consuming the main conversation's context window. The sub-agent returns a summary to the main session. B is wrong because changing the model controls output quality, not context isolation — the token consumption problem remains. D is wrong because `output: summary` is not a valid skill frontmatter field. C is wrong because splitting into two skills doesn't address the root problem: even a separate summary skill would still dump content into the main conversation context. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-ci-cd:21", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A CI pipeline sends `claude -p` the full PR diff for every review. On a large refactor PR (4,200 lines of diff), the pipeline times out at the 60-second CI step limit. Smaller PRs complete in under 10 seconds. What is the most targeted fix?", "opts": ["Increase the CI step timeout to 5 minutes for all claude review steps, giving large PRs enough time to complete without changing the workflow logic", "Add a PR size gate: when diff exceeds a threshold, switch to per-file batch analysis using the Message Batches API and poll for results asynchronously outside the blocking CI step", "Truncate the diff at 1,000 lines before sending to claude to keep all reviews within the timeout window", "Switch to `claude -p` with a lower `max_tokens` limit on large PRs to force shorter responses and reduce processing time"], "answerIdx": 1, "explanation": "**B)** Large PRs warrant a different processing strategy. Routing oversized diffs to the Message Batches API and polling asynchronously decouples the analysis from the blocking CI step — the review completes in the background and results are posted when available. A is wrong because increasing the timeout for all steps degrades CI throughput for the common case (small PRs that finish in 10 seconds) and doesn't address the root cause. C is wrong because truncating the diff introduces false negatives — the omitted code is unreviewed. D is wrong because limiting `max_tokens` on the response doesn't reduce the input processing time; the model still needs to process the full diff input. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:24", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "You build an extraction prompt for research abstracts using few-shot examples drawn entirely from biology papers. When applied to chemistry and physics abstracts, `methodology` and `apparatus` fields have poor accuracy. What is the most direct cause?", "opts": ["Extraction accuracy degrades whenever the test distribution is from a different academic year than the training examples, due to terminology drift in scientific publishing.", "A universal schema cannot capture methodology fields across different scientific disciplines; domain-specific schemas are required to achieve consistent extraction quality.", "Few-shot examples from biology teach domain-specific terminology patterns for \"methodology\"; chemistry and physics use different terminology that was never demonstrated, so the model applies biology heuristics incorrectly.", "The model has insufficient training data for chemistry and physics domains and cannot generalize extraction patterns across scientific disciplines without fine-tuning."], "answerIdx": 2, "explanation": "**C)** Few-shot examples communicate more than just format — they also teach which text patterns map to which schema fields. Biology examples for \"methodology\" might train on phrases like \"cell culture protocol\" or \"PCR amplification,\" which are absent from chemistry and physics papers. Adding domain-stratified examples corrects the learned extraction heuristics for each scientific domain. A) invents a temporal drift mechanism with no documented basis. B) overstates schema inflexibility; the same schema can work across domains with better examples. D) is false — the model has broad scientific knowledge. (source: practice-tes
