ts/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-developer-productivity:15", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "A team's automated release workflow calls `claude -p` to generate CHANGELOG entries from `git log --oneline v1.2.0..HEAD`. The generated entry is well-formatted but CI sometimes fails because `claude -p` exits with code 1 even when the model produces valid output. What is most likely causing the non-zero exit?", "opts": ["The model detected a security risk in the commit messages and self-reports a failure exit code when potentially dangerous terms like \"force push\" or \"delete\" appear in the commit history.", "`claude -p` exits 1 when the model's response exceeds the configured `max_tokens`, which the CI script interprets as failure even though partial output was written to stdout.", "The `claude -p` subprocess exits 1 due to an unhandled execution error — likely a network timeout, rate limit, or API error — not a model content issue.", "`claude -p` returns exit code 1 when the model's output contains markdown formatting because the CLI validates output against a plain-text schema before exiting cleanly."], "answerIdx": 2, "explanation": "**C)** `claude -p` exit codes reflect execution-level errors: network failures, rate limits, timeouts, and API errors. They do not encode content semantics. The intermittent nature (sometimes fails, not always) points to transient API issues like rate limiting, not a content-based trigger. A) is false — the CLI does not inspect model output for dangerous terms. B) is a plausible distractor but `max_tokens` truncation produces a 200 OK response with valid output, not a CLI exit 1. D) describes a non-existent output validation mechanism in the CLI. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:16", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A multi-agent research system terminates its workflow when a subagent returns the phrase \"Research objectives have been fully addressed and no further investigation is warranted.\" The coordinator's termination logic parses this sentence to detect completion. In a later run, a different subagent returns \"The research objectives appear partially addressed; further investigation may be warranted in some areas.\" The coordinator terminates prematurely, treating this as a completion signal. What design principle does the coordinator's termination logic violate?", "opts": ["Termination should be driven by structural signals from subagent outputs — such as a `status: \"complete\"` field or absence of pending tasks — not by parsing natural language sentiment", "Coordinators should enforce a minimum workflow duration to prevent premature termination caused by subagents that complete their tasks faster than expected", "Workflow termination decisions should require consensus from all subagents rather than relying on a single subagent's completion assessment", "Subagents should not include termination-relevant language in their output text, delegating all completion signaling to a dedicated workflow state machine"], "answerIdx": 0, "explanation": "**A)** Natural language parsing for workflow termination is a well-documented anti-pattern: language is inherently ambiguous, and minor phrasing variations (hedging words, conditional language) can produce false positive or false negative termination triggers. Structural signals — a `status` field, a boolean `is_complete` flag, or a documented absence of pending task records — are unambiguous and immune to paraphrase. B is wrong because a minimum workflow duration is an arbitrary constraint that doesn't address the parsing problem and would cause unnecessary delays in legitimately fast completions. C is wrong because consensus from all subagents is not a general requirement for termination — many workflows terminate correctly when one agent finishes a sequential step; the problem is parsing, not voting. D is wrong because constraining subagent output language is not scalable — it places the burden on every subagent author to avoid certain phrasings, and the coordinator should not depend on subagent authors remembering this constraint. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:8", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team wants to automate nightly technical debt reports across 80 repositories and run blocking pre-merge style checks on every push. Both workflows will use Claude Code. Which API choice correctly matches each workflow?", "opts": ["Synchronous API for nightly reports; Message Batches API for pre-merge style checks — higher throughput in batch mode is better for nightly volume", "Message Batches API for nightly reports; synchronous API for pre-merge style checks — nightly is latency-tolerant and batch saves ~50%; pre-merge blocks developers", "Message Batches API for both — nightly has high volume and pre-merge has many concurrent pushes, so batch handles scale for both", "Synchronous API for both — unified error handling reduces operational complexity across all 80 repositories"], "answerIdx": 1, "explanation": "**B)** The decision framework is: blocking workflows require synchronous API; deferred or latency-tolerant workflows qualify for Message Batches API and its ~50% cost savings. Nightly reports are non-blocking and can tolerate up to 24 hours of processing time. Pre-merge checks must complete before developers can merge. A reverses the logic — pre-merge cannot use batch because the developer is actively waiting. C means pre-merge hooks could stall for hours, blocking the entire development team. D is correct on error handling simplicity but sacrifices significant cost savings on the nightly workflow. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-ci-cd:10", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A `claude -p` invocation in CI is hitting the API rate limit during peak push hours (9–11 AM), causing jobs to fail. The team wants to handle this gracefully without dropping any reviews. What is the correct approach?", "opts": ["Switch to the Message Batches API for all CI invocations since batch requests bypass rate limits on the synchronous API", "Add a 30-second `sleep` before each `claude -p` call during business hours to spread load and avoid hitting the rate limit", "Implement exponential backoff with jitter on non-zero exit codes from `claude -p`, treating rate limit failures as transient and retrying after a delay", "Cap concurrent CI jobs to 1 using GitHub Actions concurrency groups so rate limits are never reached"], "answerIdx": 2, "explanation": "**C)** Rate limit errors return non-zero exit codes from `claude -p`. Exponential backoff with jitter is the standard pattern for transient API errors — it retries automatically while spreading load to reduce collision probability. A is wrong because the Message Batches API has its own rate limits and does not serve as a bypass for synchronous limits; also, switching to batch would make pre-merge checks non-blocking. B is wrong because a fixed sleep introduces unnecessary delay on every invocation, degrades CI throughput, and may still collide during sustained load. D is wrong because serializing all CI jobs to 1 creates a queue that would delay reviews by hours on a busy repository and doesn't actually solve the rate limit — it just shifts when it happens. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:11", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You are migrating a 200,000-line monolith to microservices. You want Claude to help design service boundaries, identify shared data models, and plan the extraction sequence. Which approach is correct?", "opts": ["Execute directly with a large context window: paste the full codebase into the conversation before issuing the design prompt.", "Use plan mode to explore the codebase, map dependencies, and design the extraction approach before any code is generated.", "Execute directly: ask Claude to identify the first service to extract and begin scaffolding it, then iterate service by service.", "Create a skill with exemplar microservices so Claude has concrete output templates to follow during each extraction step."], "answerIdx": 1, "explanation": "**B)** Multi-file architectural restructuring with decisions about service boundaries, shared model ownership, and sequencing is exactly when plan mode prevents costly mistakes. Planning first surfaces hidden coupling and sequencing risks before any code is written. A is wrong because pasting a 200k-line codebase into a single context is impractical and doesn't substitute for structured architectural analysis. C is wrong because starting execution without a dependency map risks creating circular dependencies or splitting incorrectly coupled services, which is expensive to reverse. D is wrong because exemplar templates guide output format, not architectural analysis — they don't help identify service boundaries or dependencies. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-multi-agent-research:24", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "During a research run, a coordinator assigns the following task to a subagent: \"Research the economic impact of remote work.\" The subagent returns high-quality findings covering productivity metrics, real estate market effects, and corporate cost savings. A post-run review reveals that the research omitted mental health costs, commute savings for workers, and geographic talent distribution — all topics in the original brief. The subagent logs show no errors. What is the most likely root cause?", "opts": ["The subagent used a retrieval depth setting too shallow to surface the less-frequently-cited mental health and geographic distribution literature", "The synthesis agent applied implicit relevance filtering that downweighted worker-centered findings relative to corporate findings during integration", "The coordinator's task prompt was underspecified — it named the general topic but did not enumerate the specific subtopics required, leaving the subagent to interpret scope autonomously", "The subagent's web search API had a topic bias toward corporate-focused economic literature, causing it to systematically underweight worker-centered outcomes"], "answerIdx": 2, "explanation": "**C)** When a subagent executes correctly (no errors, high-quality output) but covers the wrong scope, the root cause is the task decomposition — specifically the coordinator's prompt for that subagent. \"Research the economic impact of remote work\" is a valid instruction that an agent can execute correctly while still missing large topic areas that weren't enumerated. The fix is an explicit task spec naming required subtopics. A is wrong because retrieval depth affects the depth of coverage within a topic, not whether a topic is pursued at all — underspecified scope is a different problem from shallow retrieval. B is wrong because synthesis filtering is a downstream step — the synthesis agent cannot surface findings the subagents never produced. D is wrong because there is no evidence of API bias — the subagent successfully found relevant economic literature; it simply wasn't directed to cover worker-centered outcomes. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:27", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A subagent is tasked with extracting key facts from a set of research papers and returning them to the coordinator. An engineer notices the subagent is also generating 2–3 paragraph analytical summaries for each paper, even though the coordinator only uses the extracted key facts. The summaries consume about 60% of the subagent's output tokens. What is the correct diagnosis?", "opts": ["The coordinator's output parsing logic is not filtering out the summary sections, causing them to be passed downstream despite being unnecessary", "The subagent's task prompt does not clearly specify output format — it requests \"extract key facts\" but doesn't explicitly restrict the output to structured facts only, allowing the subagent to include additional analytical content", "The synthesis agent is requesting summaries from the subagent through a back-channel that the coordinator is not aware of, bypassing the intended output format", "The subagent has insufficient context about the downstream use of its outputs, causing it to default to producing maximum information in case any detail might be needed later"], "answerIdx": 1, "explanation": "**B)** This is an output specification gap. \"Extract key facts\" is a reasonable instruction, but without a clear output format constraint (e.g., return a JSON array of fact objects with no prose summaries), the subagent fills the gap with additional analytical content it deems useful. The fix is a structured output specification in the task prompt. A is wrong because even if the coordinator filters out summaries, the token cost has already been paid — the correct fix is preventing generation, not filtering output. C is wrong because there is no evidence of back-channel communication; the simplest explanation is prompt underspecification. D is wrong because \"insufficient context about downstream use\" is a reasonable-sounding explanation but is not the root cause — the agent is generating summaries because nothing in its prompt explicitly prohibits them, not because it's uncertain what the coordinator needs. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-customer-support:24", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your support agent's tool for selecting few-shot examples to surface for ambiguous tool selection scenarios is currently grouped by tool name: five examples for `lookup_order`, five for `get_account_info`. Edge-case accuracy is 62%. What restructuring of the few-shot bank would most directly improve edge-case selection?", "opts": ["Double the example count to ten per tool — larger example banks give the model more selection patterns to match against in ambiguous cases", "Replace grouping-by-tool with 4–6 examples targeting ambiguous edge cases, each showing the reasoning for why one tool was chosen over the available alternatives", "Add a one-sentence rule before each tool's example group explaining the primary selection criterion to give the model a declarative anchor before the examples", "Replace few-shot examples with a comprehensive \"use when / do not use when\" table for each tool so declarative rules replace worked examples for edge cases"], "answerIdx": 1, "explanation": "**B)** Few-shot examples in ambiguous scenarios work best when they target the actual ambiguous cases and show comparative reasoning — \"I chose X over Y because...\" — rather than grouping clean, unambiguous examples by tool. This teaches the model the decision process for the hard cases. A doubles examples without changing structure; more unambiguous examples don't help with ambiguous edge cases. C adds declarative anchors, but declarative rules are less effective than worked examples for teaching nuanced decision-making. D replaces worked examples with declarative rules — the opposite of what evidence shows works for ambiguous selection. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-structured-extraction:29", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction pipeline handles 200 documents per hour. After adding a JSON schema validation gate, you collect one week of failure logs. You find 70% of all failures involve three fields: `tax_id_number`, `iban`, and `routing_number`. What action most directly improves first-pass success rate for these fields?", "opts": ["Remove `tax_id_number`, `iban`, and `routing_number` from the schema and collect them in a single `financial_identifiers` free-text field to reduce schema validation failures.", "Add `pattern` constraints to these fields matching their known formats (e.g., IBAN regex, 9-digit routing number) and include format examples in the prompt alongside the schema.", "Route all documents to human pre-review to verify these three fields exist in the source document before extraction, eliminating failures caused by genuinely absent values.", "Add few-shot examples that specifically demonstrate correct extraction of `tax_id_number`, `iban`, and `routing_number` with realistic formatting variations across document types."], "answerIdx": 1, "explanation": "**B)** Format-specific fields like IBAN and routing numbers have strict structural patterns. Adding regex `pattern` constraints makes the schema enforce the correct format structurally, and including format examples in the prompt shows the model what compliant values look like. The combination of schema enforcement and demonstrated examples is more robust than either alone. A) removing fields loses structured data. C) pre-routing to humans is expensive and doesn't fix the extraction quality problem. D) few-shot examples help but without `pattern` constraints the model can still produce non-conforming format strings. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-developer-productivity:23", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You are building a git workflow automation where `claude -p` reads a PR diff and outputs a list of suggested commit message improvements. The workflow must run on every push without any human confirmation step. Which combination of flags is appropriate?", "opts": ["`claude -p --dangerously-skip-permissions --output-format json` — skip permissions to avoid interactive prompts and use JSON for machine-parseable output in the CI pipeline.", "`claude -p --non-interactive --output-format json` — explicitly set non-interactive mode alongside JSON output to prevent the model from pausing for human input during the workflow.", "`claude -p --output-format stream-json --no-stream-events` — use streaming JSON for incremental output and suppress event metadata to produce a clean single-line parseable stream.", "`claude -p --output-format json` — prompt mode is already non-interactive by design; no extra flags are needed to suppress confirmation prompts when running in a pipeline."], "answerIdx": 3, "explanation": "**D)** `claude -p` (prompt mode) is already non-interactive by design — it accepts a prompt, runs the model, and exits. No additional flags are needed to suppress confirmation prompts; that behavior is implicit in `-p` mode. A) adds `--dangerously-skip-permissions`, which is unnecessary for a read-only review task and introduces unnecessary risk. B) `--non-interactive` is redundant in `-p` mode. C) `--no-stream-events` is not a documented flag, and streaming mode adds complexity without benefit for a single-shot output task. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:3", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "After conversations exceed 25 turns and summarization triggers, customers are re-escalating because the agent quoted their refund amount as \"$47\" when the confirmed amount was \"$147.23.\" Summarization is working correctly and compressing conversation length. What is the architectural root cause and fix?", "opts": ["Extract precise transactional values — amounts, dates, order IDs — into a persistent case facts block outside summarized history so they survive any summarization pass", "Add an external database retrieval step that re-fetches the original order data before each response after turn 25 to restore lost precision", "The summarization threshold is too aggressive — reduce from turn 25 to turn 10 to shorten the summarization window and reduce precision loss", "The summarization prompt needs an explicit instruction to preserve all numerical values verbatim to prevent paraphrasing during compression"], "answerIdx": 0, "explanation": "**A)** Summarization compresses by design — it will paraphrase or lose precise numeric values regardless of how well it is tuned. The correct fix is architectural: a structured case facts block persists outside the summary loop and is never overwritten. B adds database overhead every turn when a zero-cost persistent block achieves the same result. C delays the problem without preventing it; any summarization window still collapses precise values eventually. D relies on a generative process to preserve exact figures — still lossy and unreliable. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:2", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team runs two automated Claude Code workflows: a pre-merge security check that blocks the pull request until complete, and a Friday-night full-codebase dependency audit. The team wants to reduce API costs without changing workflow frequency. Which API routing is correct?", "opts": ["Message Batches API for both — batch processing reduces costs uniformly and the overnight window has slack to absorb any latency", "Synchronous API for both — consistent API usage simplifies error handling and avoids managing two different response polling patterns", "Message Batches API for the pre-merge check; synchronous for the overnight audit — batch tolerates higher request concurrency needed during business hours", "Synchronous API for the pre-merge check; Message Batches API for the overnight audit — batch saves ~50% on non-blocking work"], "answerIdx": 3, "explanation": "**D)** The pre-merge check is blocking — a developer is waiting for the result before merging, so it requires a synchronous response. The overnight audit is deferred and latency-tolerant, which makes it an ideal candidate for the Message Batches API (~50% cost reduction). A is wrong because using Batch for the pre-merge check means developers may wait up to 24 hours for a merge decision. B is wrong because it misses the 50% savings available on the overnight workflow. C is wrong — it reverses the routing: batch during blocking work would stall developers, while the overnight audit has no concurrency constraint that requires synchronous throughput. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-structured-extraction:5", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your invoice extraction pipeline uses a two-pass approach: first extract all fields, then run JSON schema validation. The validation gate rejects 8% of documents. Of those rejections, your logs show that 60% are `required` field violations where the field is genuinely absent from the invoice. What is the correct architectural response?", "opts": ["Audit required fields against document reality: make fields optional/nullable when source documents may legitimately omit them, and reserve `required` for fields that are always present.", "Add a pre-extraction classifier that detects incomplete invoices and routes them to a human queue before extraction is attempted on each document.", "Lower the validation strictness threshold so that required-field violations below a severity cutoff are automatically promoted to warnings rather than hard failures.", "Increase the retry budget for failed extractions to 3 attempts, since more attempts improve the chance the model locates hidden field values on subsequent passes."], "answerIdx": 0, "explanation": "**A)** When 60% of validation failures are genuinely absent fields, the schema is wrong — not the documents. Required fields should reflect fields structurally guaranteed to exist. Fields that are sometimes absent should be nullable so the model can return null without violating the schema. B) adds upstream complexity instead of fixing the schema design. C) weakens validation without addressing the cause. D) retrying cannot surface information that does not exist in the source. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-multi-agent-research:11", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A synthesis agent needs to verify facts from its research findings. Instrumentation shows that 85% of verifications are simple single-fact lookups (e.g., \"Is this statistic from this source?\"), while 15% require multi-step web searches combining 3+ sources. Currently all verifications route through the coordinator to a dedicated web search agent, adding 4–6 seconds of round-trip latency per fact check. What tool configuration best addresses this?", "opts": ["Have the synthesis agent cache all facts it verifies proactively, building a local knowledge store that eliminates repeat lookups in future synthesis runs", "Give the synthesis agent full access to the same web search tool the dedicated agent uses, eliminating all coordinator round-trips for verification tasks", "Give the synthesis agent a scoped `verify_fact` tool for the simple 85% of lookups, while preserving the coordinator → web search agent path for complex 15% cases", "Batch all verifications and send them in a single coordinator request at the end of synthesis, accumulating latency in one round-trip instead of many small ones"], "answerIdx": 2, "explanation": "**C)** This is the least-privilege principle combined with practical optimization. A scoped `verify_fact` tool handles the 85% of cases efficiently without requiring coordinator involvement, while the coordinator path is preserved for complex multi-source verifications where the web search agent's full capabilities are genuinely needed. The tool scoping also prevents the synthesis agent from acquiring web search capabilities beyond its role. A is wrong because proactive caching adds architectural complexity and storage overhead for unknown future needs — it's over-engineering for a problem that scoped tooling already solves cleanly. B is wrong because giving the synthesis agent full web search access violates separation of concerns — the synthesis agent's role is integration, not research, and broad tool access creates uncontrolled side effects. D is wrong because batching all verifications to the end introduces accumulated latency (the synthesis agent cannot use verification results to inform ongoing synthesis) and doesn't improve total token cost. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-multi-agent-research:6", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "After two web research subagents complete their work, the coordinator must integrate their findings into a final report. An engineer suggests having the two subagents directly pass their outputs to each other and produce a merged summary before returning anything to the coordinator. What is wrong with this approach?", "opts": ["The merged summary would lose individual source attribution because each subagent only tracks its own sources, not the other's citation metadata", "Direct subagent communication doubles context window usage because both agents must hold the full combined output in their context simultaneously", "Subagents cannot invoke other subagents — the SDK only allows coordinators to initiate subagent calls, making direct agent-to-agent communication technically blocked", "It bypasses the coordinator's routing role: the orchestrator-workers pattern requires findings to flow back through the coordinator, which routes to the synthesis agent designed for unification"], "answerIdx": 3, "explanation": "**D)** In the orchestrator-workers pattern, the coordinator collects results from workers and routes them to the next appropriate component — in this case, a synthesis agent specifically designed for unification. Having subagents communicate directly and self-synthesize bypasses the coordinator's visibility, breaks the consistent control flow, and routes integration work to agents not designed for it. The coordinator needs to see both result sets to make informed routing decisions. A is wrong because source attribution is preserved in well-structured outputs regardless of which agent does the merging. B is wrong because context window usage depends on implementation; the coordinator holding both outputs centrally has the same cost as the agents holding them directly. C is wrong because agent-to-agent communication is architecturally possible — the argument against it is design correctness, not technical impossibility. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-developer-productivity:25", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "An agent in a financial reporting workflow calls a `generate_report` tool that takes 30 seconds to run. The agentic loop times out consistently after ~25 seconds. The developer increases the HTTP client timeout to 60 seconds but the loop still fails with what looks like a mid-turn termination. What is the architectural problem?", "opts": ["The `generate_report` tool exceeds the maximum tool execution time of 20 seconds enforced by the Claude API, which returns `stop_reason: \"max_tokens\"` as a generic fallback error code for timeout events.", "The HTTP timeout was already the binding constraint; now that it is 60 seconds, the developer should also increase `max_tokens` to prevent the response from being truncated before `generate_report` returns.", "A blocking 30-second tool call occupies the entire agentic loop turn; the correct pattern is to make `generate_report` async — submit the job, receive a job ID, and poll for completion with a lightweight status tool.", "The model is re-calling `generate_report` multiple times within the same turn because it does not receive an intermediate acknowledgement; add a synchronous `acknowledge_report_start` tool call first."], "answerIdx": 2, "explanation": "**C)** A tool that takes 30 seconds blocks the entire agentic loop turn. The correct pattern for long-running operations is an async model: submit the job, receive a job ID, and poll for completion with a lightweight `get_report_status` tool. A) describes a fabricated \"20-second enforcement\" rule that does not exist in the API. B) conflates HTTP timeout with output truncation — increasing `max_tokens` does not affect tool execution time. D) invents a synchronous acknowledgement pattern that does not address the blocking execution problem. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-code-generation:9", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You want certain coding standards to be active whenever Claude edits files in `src/api/` but you do NOT want those standards applied to `src/api/__tests__/`. The rules file is at `.claude/rules/api-standards.md`. Which frontmatter achieves this?", "opts": ["`globs: [\"src/api/**\", \"!src/api/__tests__/**\"]` with a `priority: high` field to ensure exclusion is respected.", "`globs: \"src/api/**/*.ts\"` without a negation pattern, relying on the test file glob in a separate rules file to override.", "`globs: [\"src/api/**\", \"exclude: src/api/__tests__/**\"]` where `exclude` is a sibling key to the glob list.", "`globs: \"src/api/**\"` combined with a second rules file at `.claude/rules/test-overrides.md` with `globs: \"src/api/__tests__/**\"` that explicitly disables conflicting rules."], "answerIdx": 0, "explanation": "**A)** YAML frontmatter glob arrays support negation patterns with `!` prefix, so `[\"src/api/**\", \"!src/api/__tests__/**\"]` correctly includes all `src/api/` files while excluding the test subdirectory. B is wrong because `src/api/**/*.ts` would only match `.ts` files and doesn't cleanly exclude `__tests__`; it also relies on a separate file to \"override,\" which creates maintenance coupling. C is wrong because `exclude` is not a valid sibling key in the `globs` frontmatter — negation is done inline with `!`, not via a separate field. D is wrong because creating a second rules file to \"disable\" conflicting rules is fragile and undocumented; rule priority ordering is not guaranteed. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-customer-support:26", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "You are adding a new tool `check_warranty_status` to an agent that already selects tools accurately across 5 existing tools. In the first week after deployment, tool selection accuracy drops 9% across all tools, including ones unrelated to warranty. No tool descriptions changed. What is the cause?", "opts": ["The model requires additional few-shot examples for the new tool — without worked examples, it over-selects `check_warranty_status` and under-selects adjacent tools", "The new tool was placed last in the tool list — the model has a recency bias for recently defined tools, which is bleeding into unrelated selections", "Adding a sixth tool increased selection surface area beyond the reliable threshold — evaluate whether `check_warranty_status` can be surfaced only for warranty-relevant sessions rather than being always available", "The new tool description conflicts with an existing tool description — review both for overlapping scope language and add differentiation"], "answerIdx": 2, "explanation": "**C)** A 9% accuracy drop across all tools — including those unrelated to warranty — after adding a single new tool is the hallmark of selection noise from an oversized tool set. More candidates means more surface area for selection errors. The correct response is to evaluate whether the new tool needs to be always-available or can be scoped to contexts where warranty is relevant. D is plausible for a targeted accuracy drop on adjacent tools but doesn't explain degradation across unrelated tools. B is speculative about positional bias with no documentation support. A would explain over-selection of the new tool but not degradation in unrelated tool selections. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-customer-support:22", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent handles escalation by evaluating the customer's tone. You want to replace this with a principled escalation trigger. Which scenario represents a legitimate policy-based escalation trigger rather than a complexity or sentiment signal?", "opts": ["The ticket involves both a return and a shipping complaint — two concerns simultaneously exceeds the self-service scope threshold", "The agent's `process_refund` tool returned an error on the third consecutive attempt — repeated tool failures indicate a technical escalation is needed", "The customer uses phrases like \"I'm very upset\" and \"this is unacceptable\" — emotional language signals the case has exceeded self-service complexity thresholds", "The agent has applied the relevant policy accurately and the customer explicitly requests to speak with a human agent despite receiving a valid resolution"], "answerIdx": 3, "explanation": "**D)** An explicit customer request for human escalation is a legitimate, non-ambiguous trigger — the customer has stated their preference and it must be honored regardless of whether the agent could technically resolve the issue. C is the sentiment anti-pattern — emotional language is not a complexity signal. B describes a technical tool failure, which should trigger a tool retry or error handling workflow, not a customer-facing escalation. A is wrong — multi-concern tickets are not inherently escalation triggers; agents can handle multiple concerns when the policy covers each. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:15", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "Two research subagents have tool names that both contain \"analyze\": the web research agent has a tool called `analyze_content` and the document agent has a tool called `analyze_document`. The coordinator is observed routing web search tasks to the document agent and document tasks to the web agent with a 52% error rate. What is the most effective fix?", "opts": ["Add a pre-routing classifier agent that examines each task description and selects the correct target agent using a fine-tuned task-to-agent mapping model", "Prepend few-shot examples to the coordinator's system prompt showing correct routing decisions for each agent, biasing the model toward the right choices in ambiguous cases", "Rename the web research agent's tool to `extract_web_results` and update its description to explicitly reference web searches and URLs, eliminating the semantic overlap with `analyze_document`", "Expand the document agent's tool description to include explicit exclusion language stating it does not handle web content, reducing ambiguity by defining a negative boundary"], "answerIdx": 2, "explanation": "**C)** The root cause is semantic overlap between tool names: both start with \"analyze_\" and a model routing by name or short description will confuse them. Renaming `analyze_content` to `extract_web_results` and updating the description to reference web searches and URLs makes the two tools unambiguously distinct — the coordinator can no longer misroute because the names and descriptions no longer overlap. This fixes the root cause at the interface level. A is wrong because adding a classifier agent adds complexity and latency without fixing the underlying ambiguity — the classifier itself will face the same naming confusion unless the tools are renamed. B is wrong because few-shot examples provide probabilistic guidance but don't eliminate the ambiguity; under novel task descriptions, the coordinator can still misroute, and the fix remains fragile. D is wrong because adding exclusion language to the document agent's description only defines what it doesn't do — it doesn't clarify what the web agent does, so the web agent's tool name remains ambiguous relative to the document agent's name. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-developer-productivity:3", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You want to automatically inject today's date, the current git branch, and the last 5 commit messages into every prompt a developer submits inside Claude Code. The context should appear before the user's message without requiring the developer to type anything. Which mechanism achieves this?", "opts": ["Add a `UserPromptSubmit` hook that reads `git log --oneline -5` and `git branch --show-current` and prepends the results to `prompt` in the hook's output JSON before the model call.", "Create a `PreToolUse` hook that matches on tool name `\"*\"` and injects git context into the tool's input parameters so the model sees it alongside each tool invocation.", "Write a CLAUDE.md file at the project root that includes static instructions to \"always check the git log before answering,\" relying on the model to retrieve git context each session.", "Add a `PostToolUse` hook that appends git context to every tool result, so the model sees the context alongside each piece of tool output rather than at the start of the turn."], "answerIdx": 0, "explanation": "**A)** `UserPromptSubmit` fires before the user's message reaches the model and allows the hook to modify the `prompt` field — the correct injection point for per-turn context like git state and date. B) is the wrong hook event: `PreToolUse` fires before individual tool calls, not before the user's message, so it cannot inject context before the model's first reasoning step. C) offloads responsibility to the model with probabilistic compliance. D) injects context after tool calls, which is too late for prompt-level context and doesn't reach turns that involve no tools. (source: docs/cli.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-multi-agent-research:18", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A research synthesis agent receives outputs from 6 subagents. Three subagents completed successfully with high-quality findings. Two subagents returned partial results with explicit gap annotations. One subagent returned a structured access failure. What is the correct output structure for the synthesis agent to produce?", "opts": ["Return only the synthesis of the 3 successful subagent outputs, discarding partial and failed inputs to ensure output quality is not contaminated by incomplete data", "Block output and escalate to the coordinator, since producing a synthesis with known gaps and failures could mislead the final report consumer", "Produce a structured synthesis with coverage annotations: synthesized findings clearly attributed to sources, explicit notation of which topic areas have partial coverage and which had access failures", "Synthesize all 6 inputs treating partial results and access failures as low-confidence sources, weighting them proportionally less in the final output without explicit annotation"], "answerIdx": 2, "explanation": "**C)** The correct approach is graceful degradation with transparency. The 3 successful outputs have real value; discarding them would be wasteful. Producing synthesis output with explicit coverage annotations — which areas are well-supported, which have partial coverage, which had access failures — gives the report consumer (or the coordinator deciding next steps) full information about confidence levels. This is preferable to withholding output or silently weighting down incomplete sources. A is wrong because discarding partial results throws away genuine findings simply because they're incomplete — the annotations exist precisely to communicate partial coverage without discarding the data. B is wrong because blocking on known gaps preempts the coordinator's or consumer's ability to make their own judgment about whether partial synthesis is sufficient — in many cases it is, and halting loses all the completed work. D is wrong because silently weighting down incomplete sources is deceptive — the consumer cannot distinguish between \"this topic was well-researched and had weak findings\" and \"this topic had an access failure and data is missing.\" (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-customer-support:23", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "You observe that when customers describe variable types of context gaps in their tickets — sometimes missing policy context, sometimes missing timeline estimates, sometimes missing next-steps clarity — few-shot examples covering 6 representative case types improved completeness by only 4%. What does this signal and what should you try instead?", "opts": ["The few-shot examples are the right approach but need to be drawn from real resolved cases — replace synthetic examples with production case examples for better representativeness", "The model is not attending to few-shot examples due to context length — move the examples closer to the end of the system prompt for better recency weighting", "The few-shot examples are too generic — add 20 more examples spanning all identified gap types to increase coverage breadth", "The context gaps are variable and case-specific, not pattern-predictable; few-shot cannot cover the variation — add a self-critique step evaluating each response against explicit completeness criteria before delivery"], "answerIdx": 3, "explanation": "**D)** A 4% improvement from 6 examples confirms the gaps are too varied to be covered by a fixed example bank. Few-shot works when gaps are consistent and predictable; when gaps are variable and case-specific, self-critique catches omissions dynamically regardless of case type. C adds more examples to a strategy that has already shown it cannot generalize — scaling a failing approach. B is speculative about attention mechanics and misdiagnoses the issue. A improves example quality but does not change the fundamental limitation: few-shot cannot generalize to gaps not represented in the example set. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:13", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A coordinator receives findings from two research subagents and needs to produce a unified final report. The coordinator is considering whether to directly merge and write the final report itself, or route both result sets to a specialized synthesis agent. What is the primary argument for routing through the synthesis agent?", "opts": ["The orchestrator-workers pattern assigns the coordinator responsibility for routing and state management — synthesis is a specialized task delegated to a component designed for it", "Direct coordinator synthesis would require the coordinator to retain both result sets in its context window, consuming tokens that are better reserved for routing and error recovery", "Synthesis agents have access to larger context windows than coordinators, making them technically capable of processing both result sets simultaneously without truncation", "Synthesis agents apply citation normalization and cross-source deduplication algorithms that the coordinator's general-purpose reasoning cannot replicate accurately"], "answerIdx": 0, "explanation": "**A)** The orchestrator-workers pattern defines the coordinator's role as orchestration: collecting results, managing state, and routing to the next appropriate component. Synthesis is a distinct specialized task — the synthesis agent is designed for it, while the coordinator is designed for control flow. Routing through the synthesis agent preserves separation of concerns and keeps the coordinator focused on its job. B is wrong because the coordinator must hold result sets to route them regardless; retaining them for synthesis vs routing them to a synthesis agent has roughly equivalent context cost at the coordinator level. C is wrong because context window size is an implementation detail that varies by deployment — this is not a principled architectural argument. D is wrong because synthesis agents don't necessarily apply distinct algorithms — the architectural argument for routing is separation of concerns, not a claim about specialized algorithmic capabilities. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-structured-extraction:7", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction pipeline processes 500 insurance claim forms per day. First-pass extraction succeeds on 91% of forms. The remaining 9% fail JSON schema validation. You want to minimize total cost while maintaining >95% overall success. What multi-pass strategy is optimal?", "opts": ["Retry all 9% with the same prompt at a lower temperature setting (0.2) to reduce output variance and improve schema compliance on the second pass.", "Escalate all 9% directly to human review to avoid spending additional API cost on documents with persistent extraction difficulty.", "Run a targeted re-extraction pass for the 9% failures: include the original document, the failed JSON output, and the specific validation errors so the model can self-correct against concrete feedback.", "Retry all 9% using a higher model tier for the second pass, since greater model capability reliably resolves schema non-compliance failures without other changes."], "answerIdx": 2, "explanation": "**C)** Retry-with-error-feedback is the effective multi-pass pattern. Including the failed extraction and specific validation errors gives the model concrete information about what went wrong. Blind retries at lower temperature (A) are unlikely to produce different schema-compliant output without error context. Escalating all failures (B) wastes human capacity on cases the model can self-correct. A model-tier upgrade (D) without error feedback has weak marginal impact on structured output failures. (source: practice-tests/test-08-validation-multipass.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-structured-extraction:30", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your extraction pipeline processes long technical specifications (average 120 pages) using 40-page chunks. After merging, `component_id` values extracted in chunk 1 appear in `assembly_references` fields in chunks 2 and 3 — but the merge step cannot verify whether a reference in chunk 3 points to a real component from chunk 1 or a fabricated identifier. What extraction design resolves this cross-chunk reference integrity problem?", "opts": ["Increase chunk overlap to 20 pages so that component definitions from chunk 1 always appear within the context window when processing chunks 2 and 3.", "Extract all `component_id` values across all chunks in a first pass to build a reference manifest, then run a second extraction pass where each chunk receives the full manifest as context for reference resolution.", "Add a post-processing graph traversal that walks all `assembly_references` in the merged output and flags any reference ID not present in the merged `component_id` list as potentially fabricated.", "Add a prompt instruction: \"Only include assembly references for components you have already encountered in the current document chunk\" to prevent forward references within each chunk."], "answerIdx": 1, "explanation": "**B)** A two-pass extraction strategy resolves cross-chunk reference integrity. Pass 1 extracts all `component_id` values across all chunks to build a complete manifest. Pass 2 runs extraction with the full manifest as context, enabling the model to validate that `assembly_references` resolve to real components and produce null or a flag for unresolvable references. C) is a valuable validation complement but flags errors after the fact rather than preventing fabrication during extraction. A) 20-page overlap helps for adjacent chunks but does not guarantee chunk 1 IDs are in scope when processing chunk 3 of a 40-page-per-chunk document. D) prevents forward references within a chunk but does not help resolve backward references to IDs defined in an earlier chunk. (source: practice-tests/test-10-advanced-context.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-multi-agent-research:22", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A subagent has been running for 4 minutes and has successfully retrieved 14 of 15 target documents when its process receives a context limit warning indicating it has 2,000 tokens remaining. The 15th document is a 40-page PDF that would consume approximately 8,000 tokens to process. What should the subagent do?", "opts": ["Terminate immediately without returning results to preserve context tokens for the coordinator's error handling and retry logic", "Attempt to process the first section of the PDF (approximately 500 tokens) and return partial analysis of the 15th document alongside the completed 14", "Silently skip the 15th document and return the 14 completed analyses, allowing the synthesis agent to infer the gap from the document count in the task spec", "Return the 14 completed document analyses with a structured note indicating the 15th document was not processed due to context limit, including the document ID and its original task scope"], "answerIdx": 3, "explanation": "**D)** The subagent should return the maximum useful work completed (14 documents) with explicit, structured notation of what was not completed and why. This gives the coordinator the information it needs: 14 high-quality results and a clear accounting of the gap, including which document was missed and the reason. The coordinator can then decide whether to dispatch a focused subagent for just the 15th document. A is wrong because terminating without returning results discards 14 completed analyses that represent significant work; the subagent should return what it has. B is wrong because processing 500 tokens of a 40-page document produces a misleadingly incomplete analysis — the subagent would be implying coverage of a document it barely touched, which misrepresents the result. C is wrong because silently skipping the document makes the gap invisible unless the coordinator independently counts and cross-references — structured error context is always required. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-ci-cd:26", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team runs five `claude -p` review jobs in parallel on every push. Each job analyzes a different aspect: security, performance, test coverage, documentation, and style. Occasionally, multiple jobs report findings about the same line of code, producing redundant PR comments. What is the most architecturally clean solution?", "opts": ["Add deduplication logic to each individual job's prompt, instructing each reviewer to avoid findings that might overlap with the other four categories", "Merge all five review concerns into a single prompt so one instance handles all categories and produces one unified output", "Post all findings as-is and rely on the developer to recognize and ignore redundant comments about the same line", "Add a coordinator step after all five jobs complete: collect their JSON outputs and pass them to a sixth `claude -p` call that deduplicates and consolidates findings before posting to the PR"], "answerIdx": 3, "explanation": "**D)** A coordinator step that consolidates outputs from parallel jobs is the cleanest architectural pattern: each reviewer stays focused on its domain, and a dedicated pass handles cross-job deduplication with full visibility into all findings. A is wrong because asking reviewers to anticipate and avoid another reviewer's findings creates awkward inter-domain coupling and is unreliable — reviewers don't know what the other jobs will produce. B is wrong because merging all five concerns into one prompt recreates the attention dilution problem and loses the specialization of focused reviewers. C is wrong because this passes the deduplication burden to the developer, degrading the value of the automated review. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-developer-productivity:19", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "You are designing a tool set. `grep_files` searches file contents by regex. `find_symbol` searches by symbol name using an AST index. A junior engineer proposes merging both into a single `search_codebase` tool to reduce the total tool count. What is the correct analysis?", "opts": ["Merging is correct — fewer tools reduces decision complexity and the merged tool can route internally based on input type detection to the appropriate backend.", "Keep them separate — each tool has a distinct input contract, execution path, and use case; merging creates an overloaded interface where the model cannot reliably distinguish intent from a single name.", "Merging is justified only if the combined description remains under 200 characters; longer descriptions degrade model tool selection accuracy to unacceptable levels.", "Merge only `grep_files` and `find_symbol` since both search code, but keep a separate `search_codebase` meta-tool that delegates to either based on a `mode` parameter in its input schema."], "answerIdx": 1, "explanation": "**B)** Splitting semantically distinct operations into separate named tools is the documented best practice. Each tool — regex content search and AST symbol lookup — has a different input contract, execution path, and use case. A single merged tool forces the model to interpret a `mode` or `query_type` parameter, which is exactly the kind of ambiguous decision surface that causes selection errors. A) inverts the principle. D) adds a `mode` parameter, which recreates the same decision problem inside the merged tool. C) invents a character-count rule that has no basis in tool design documentation. (source: practice-tests/test-04-tool-design-mcp.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-customer-support:8", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your agent calls `process_refund` before completing `get_customer` in 8% of sessions, processing refunds for unverified customers. Explicit ordering instructions have been in the system prompt for three weeks with no improvement. What provides a deterministic guarantee that the sequence is always followed?", "opts": ["Add five few-shot examples demonstrating the correct `get_customer` → `lookup_order` → `process_refund` sequence across different case contexts", "Add a chain-of-thought instruction so the agent reasons step-by-step through the required verification sequence before taking any tool action", "Implement a programmatic prerequisite that blocks `lookup_order` and `process_refund` from executing until `get_customer` returns a verified customer ID", "Add a PreToolUse hook that logs when `process_refund` fires without a prior `get_customer` in the session and sends an alert to the engineering team"], "answerIdx": 2, "explanation": "**C)** A programmatic prerequisite is a code-level architectural guarantee — it is structurally impossible for downstream tools to fire without the prerequisite completing, regardless of LLM behavior. The scenario confirms prompt instructions have already failed, meaning this is not a guidance problem. A is wrong because few-shot examples improve average behavior probabilistically but cannot eliminate 8% edge cases. B is wrong for the same reason — chain-of-thought is LLM-driven and still has a failure rate. D only detects violations after the unauthorized refund has already been committed; it prevents nothing. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-multi-agent-research:10", "moduleId": "multi-agent-research", "moduleName": "Multi-Agent Research System", "prompt": "A document retrieval subagent is supposed to extract text from internal knowledge base documents but is observed making ad-hoc HTTP requests to external websites when the document content mentions an external URL. The behavior stems from the agent having access to a general-purpose `fetch_url` tool. How should this be fixed?", "opts": ["Replace the general `fetch_url` tool with a scoped `load_document` tool that validates inputs against internal document ID formats, making external URL fetching structurally impossible for this agent", "Route all tool calls through the coordinator, which validates each request against an allowlist of permitted domains before forwarding to the actual tool", "Add explicit instructions to the subagent's system prompt prohibiting external URL fetching, and add a monitoring hook to alert when external requests occur", "Configure domain-based URL filtering on `fetch_url` to block known external domains, updating the blocklist as new prohibited domains are encountered"], "answerIdx": 0, "explanation": "**A)** The fix must address the root cause at the interface level. If the subagent has access to a general-purpose `fetch_url` tool, the undesired behavior is possible — prompt instructions only make it probabilistically less likely. Replacing the tool with a scoped `load_document` that validates inputs against internal document ID formats makes external URL fetching structurally impossible — the tool simply cannot accept an external URL. This is the least-privilege principle applied to tool design. B is wrong because routing tool calls through the coordinator adds latency and couples the coordinator to every tool call, introducing a bottleneck and single point of failure. C is wrong because prompt instructions are probabilistic controls — a sufficiently ambiguous scenario may still lead the agent to rationalize an external fetch, and monitoring adds overhead without preventing the behavior. D is wrong because blocklist maintenance is reactive and incomplete — new external domains require manual updates, and the blocklist will always lag behind actual usage patterns. (source: real-exam-questions/scenario-02-multi-agent-research.md)", "source": "practice-tests/module-banks/module-multi-agent-research.md"}, {"id": "module-customer-support:14", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "Your support agent runs an agentic loop. You need it to continue processing when there are pending tool results but stop cleanly once the model signals completion. You want the most reliable, API-native termination mechanism. What should you check on each loop iteration?", "opts": ["Set an iteration cap of 10 as the primary stopping mechanism and treat `stop_reason` as a secondary fallback check", "Check whether the content array contains any text blocks — if a text block is present without an accompanying tool_use block, stop the loop", "Parse the model's text output for completion signals like \"I've resolved your issue\" or \"Is there anything else I can help with?\" to decide whether to continue", "Check `stop_reason` on each API response — continue the loop when it returns `\"tool_use\"`, stop when it returns `\"end_turn\"`"], "answerIdx": 3, "explanation": "**D)** `stop_reason` is the API's canonical, deterministic signal for loop control: `\"tool_use\"` means the model expects tool results to be returned; `\"end_turn\"` means the response is complete. No interpretation required. C is a natural language parsing anti-pattern — completion phrases can appear mid-conversation, are sensitive to model version changes, and are unreliable as control signals. A makes an arbitrary iteration cap the primary mechanism, which will cut off legitimate long-running workflows; iteration caps should be safety fallbacks only. B is incorrect because the content array can contain both text and tool_use blocks simultaneously — text presence alone is not a stop signal. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-ci-cd:19", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A developer is designing a CI pipeline where Claude Code will automatically push remediation commits for findings it identifies during code review. The pipeline will run autonomously on every PR without human approval of individual commits. What trust level concern does this raise?", "opts": ["Automated agents pushing commits without human approval at each step operates at a higher autonomy level than is appropriate for most CI contexts; the pipeline should surface findings for human review rather than auto-commit fixes", "None — Claude Code in `-p` mode cannot push commits, so the design is safe by default", "The concern is purely about API key rotation — automated pipelines should use short-lived tokens rather than long-lived API keys to prevent credential exposure", "The pipeline is safe as long as Claude Code is constrained to a branch and the changes are reviewed before merge to main"], "answerIdx": 0, "explanation": "**A)** Auto-committing fixes without human approval in the loop is a high-autonomy pattern that raises significant trust concerns. Automated agents can introduce regressions, misidentify the root cause, or make changes with unintended side effects — and without a human approval gate, these changes enter the codebase unchecked. The appropriate pattern for CI is to surface findings as review comments and require human action to implement fixes. B is wrong because `-p` mode governs output format, not what tools or shell commands Claude has permission to run; the pipeline can still push commits via configured tools. C identifies a real security practice but is not the primary concern here. D is wrong because reviewing auto-commits before merge to main still means unreviewed code is in a branch and may be built, tested, or merged by automation before a human sees it. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-code-generation:16", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer wants to add exemplar endpoints to help Claude generate consistent API routes. The exemplars are only needed when creating new endpoints — not during bug fixes, refactoring, or reviews. What is the optimal placement?", "opts": ["Create a skill containing the exemplar code, invoked on-demand via slash command only when generating a new endpoint.", "Add the exemplar code directly to the root CLAUDE.md so Claude always has a concrete reference for any API-related task.", "Store exemplars in a `docs/exemplars/` directory and include them via `@import` in the project CLAUDE.md at the top.", "Place the exemplars in a `.claude/rules/` file with a glob matching `src/api/**` so they load for any API file edit."], "answerIdx": 0, "explanation": "**A)** Exemplar code needed only for one specific task type belongs in a skill loaded on-demand. This ensures exemplar tokens are consumed only when creating new endpoints, not during unrelated tasks like debugging or reviewing. B is wrong because root CLAUDE.md loads for every task — exemplar code in it wastes context on refactoring, bug fixes, and reviews where it adds no value. C is wrong because `@import` in CLAUDE.md still loads the exemplars for every task (same problem as B). D is wrong because path-specific rules with an `src/api/**` glob load during any edit to API files, including bug fixes and reviews — not just new endpoint creation. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-ci-cd:30", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "prompt": "A team wants to deploy automated Claude Code review on a monorepo with services owned by different teams. Each team has different review priorities: the payments team wants strict security review, the frontend team wants accessibility and performance, and the data team wants schema migration safety. What is the correct CLAUDE.md architecture?", "opts": ["One global CLAUDE.md at the repository root that covers all three concern types, with conditional logic that routes different file paths to different review criteria", "One CLAUDE.md per service directory, each scoped to that service's review priorities; the root CLAUDE.md contains only shared conventions that apply across all services", "A single CLAUDE.md at the repository root with review criteria for all teams listed in order of priority; Claude will focus on the most relevant criteria based on which files changed", "No CLAUDE.md — pass all review criteria as inline instructions in each `claude -p` invocation to keep configuration co-located with the CI workflow definition"], "answerIdx": 1, "explanation": "**B)** Per-service CLAUDE.md files allow each team to own and maintain their review configuration independently, scoped precisely to their directory. The root CLAUDE.md handles shared conventions (code style, general constraints) that apply everywhere. A is wrong because a single CLAUDE.md with conditional path logic becomes a monolithic configuration file that no single team owns or maintains well. C is wrong because \"Claude will focus on the most relevant criteria\" is ambiguous — Claude processes all instructions and doesn't automatically prioritize by file path unless explicitly instructed to do so. D is wrong because embedding all review criteria inline in CI workflow YAML is hard to maintain, creates duplication across multiple workflow files, and removes the ability for teams to version their own review criteria independently. (source: real-exam-questions/scenario-03-ci-cd.md)", "source": "practice-tests/module-banks/module-ci-cd.md"}, {"id": "module-customer-support:19", "moduleId": "customer-support", "moduleName": "Customer Support Resolution Agent", "prompt": "A customer's opening message states: \"My order is late AND I was charged a fee I didn't authorize AND I want to close my account.\" The agent investigates the late order and responds only to that concern, making no mention of the fee dispute or account closure request. No tool calls fail. What is the most accurate diagnosis?", "opts": ["The context window is insufficient to hold all three concerns simultaneously — increasing `max_tokens` would allow the model to track parallel issues through the full conversation", "The agent begins resolving the first concern it encounters before inventorying all concerns the customer stated, treating resolution of the first as completion of the ticket", "The ticket requires preprocessing decomposition into three sub-tickets — without routing architecture, multi-concern tickets will always suffer from concern drop", "The `close_account` tool requires elevated permissions, so the agent silently drops concerns it cannot independently action rather than acknowledging them"], "answerIdx": 1, "explanation": "**B)** The failure is that the agent starts acting on the first concern without first identifying and acknowledging all concerns. This is a multi-concern tracking behavioral gap, not a tool, token, or routing problem. A is wrong because `max_tokens` affects response length — the issue occurs before any tool calls begin and is not a capacity problem. C over-architects the fix; teaching the agent to enumerate concerns before acting is a prompt-level change, not an architectural one. D is speculative — the scenario states no tool calls fail, and silently dropping acknowledged concerns is a behavioral failure regardless of permission requirements. (source: real-exam-questions/scenario-04-customer-support.md)", "source": "practice-tests/module-banks/module-customer-support.md"}, {"id": "module-structured-extraction:1", "moduleId": "structured-extraction", "moduleName": "Structured Data Extraction", "prompt": "Your schema for extracting medical records has `primary_diagnosis` marked as `required`. When processing intake forms where a diagnosis has not yet been assigned, the model returns values like \"Unspecified condition, pending evaluation.\" Downstream code treats these as real diagnoses. What is the root cause?", "opts": ["The prompt lacks a \"do not invent diagnoses\" instruction, which would signal to the model that fabrication is unacceptable in medical contexts.", "The model is hallucinating because the input documents are too short to provide sufficient context for reliable diagnosis extraction.", "Required fields force the model to produce a value even when the source document contains none, causing fabrication that looks like real data.", "Post-processing validation is missing; a rules-based checker would catch invented diagnosis strings before they reach downstream code."], "answerIdx": 2, "explanation": "**C)** When a field is `required`, the schema enforces that a value must always be present, so the model produces plausible-sounding content rather than returning null. The fix is to make `primary_diagnosis` optional (nullable) so the model can return null when the intake form genuinely lacks a diagnosis. A) is less reliable than schema design — prompt instructions compete with the schema constraint. B) misattributes cause to document length. D) adds complexity when the schema fix is simpler and addresses the root cause. (source: practice-tests/test-07-prompt-engineering.md)", "source": "practice-tests/module-banks/module-structured-extraction.md"}, {"id": "module-developer-productivity:16", "moduleId": "developer-productivity", "moduleName": "Developer Productivity with Claude", "prompt": "Your agentic loop handles a database migration workflow. The loop must execute `validate_schema`, then `run_migration`, then `verify_migration` in strict order, with no step skipping allowed. A developer argues for model-driven ordering: \"Claude is smart enough to call them in the right sequence.\" What is the specific risk?", "opts": ["The model may skip `validate_schema` when it deems the schema already valid from prior context, bypassing a critical safety gate that must always execute before migrations run regardless of prior knowledge.", "Model-driven tool ordering is reliable for known sequences; the real risk is that the model may call `verify_migration` twice due to context window limitations on long-running migrations.", "Model-driven ordering adds API round-trip latency because the model must emit a full reasoning step before each tool call, which triples the total time per migration workflow cycle.", "The model will correctly sequence the tools in simple cases but will confuse the order only when the migration runs against a replica database rather than the primary instance."], "answerIdx": 0, "explanation": "**A)** In model-driven loops, the model makes dynamic decisions based on context — including deciding to skip steps it considers redundant. For a safety-critical sequence like schema validation before migration, the model may omit `validate_schema` if it \"knows\" the schema from prior conversation state. This is the documented reason to use programmatic enforcement (forced tool choice or orchestration layer checks) for non-negotiable prerequisites. B) describes a real but secondary concern. C) is false — reasoning steps do not triple latency. D) invents a scenario-specific failure mode not rooted in how model-driven loops work. (source: practice-tests/test-01-agentic-loops.md)", "source": "practice-tests/module-banks/module-developer-productivity.md"}, {"id": "module-code-generation:29", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "A developer has two skills: `/generate-migration` (in `.claude/skills/`) and `/check-migration` (in `~/.claude/skills/`). They want to chain them: generate a migration, then automatically check it. They attempt to invoke `/check-migration` from within the body of `/generate-migration` using a markdown callout `> /check-migration`. What happens?", "opts": ["The callout invokes `/check-migration` but forces the user-scoped version from `~/.claude/skills/`, ignoring the project skill directory.", "The callout invokes `/check-migration` as a sub-skill only when both skills declare a matching `context` value in their frontmatter.", "The callout syntax is treated as a plain blockquote; no sub-skill runs. Skills must be chained via a Bash subprocess call to `claude -p`.", "The callout invokes `/check-migration` as a sub-skill, inheriting the parent's `allowed-tools` and `context` frontmatter settings."], "answerIdx": 2, "explanation": "**C)** Skill markdown files are instruction text, not executable scripts. A `>` blockquote in a skill body is plain markdown — Claude Code's skill runner does not parse blockquotes as sub-skill invocation syntax. To chain skills programmatically, the correct approach is calling `claude -p \"/check-migration ...\"` inside a Bash tool call within the skill. D is wrong because `>` callout chaining is not a supported skill composition mechanism. B is wrong because `context` frontmatter matching doesn't gate sub-skill calls — the feature doesn't exist as described. A is wrong for the same reason as D — the callout doesn't invoke anything. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-code-generation:6", "moduleId": "code-generation", "moduleName": "Code Generation with Claude Code", "prompt": "You are building a Claude Code pipeline where Claude acts as a subagent invoked by an orchestrator script. The script calls Claude non-interactively to process each file in a batch. Which flag is required to run Claude Code as a non-interactive subagent that reads from stdin and exits after one response?", "opts": ["`--headless` combined with `--once` to execute a single turn and return the output to stdout.", "`--no-interactive` with `--stdin` to disable the REPL and pipe input to the model in batch mode.", "`--batch` with `--input-file` pointing to a file containing the prompt for non-interactive processing.", "`-p` (print mode) with the prompt passed as an argument for headless single-turn execution."], "answerIdx": 3, "explanation": "**D)** The `-p` flag (print mode) runs Claude Code non-interactively: it accepts the prompt as an argument (or from stdin), executes one turn, prints the response to stdout, and exits. This is the documented pattern for using Claude Code as a subagent in orchestration pipelines. A is wrong because `--headless` and `--once` do not exist as Claude Code CLI options. B is wrong because `--no-interactive` and `--stdin` are not valid Claude Code flags. C is wrong because `--batch` and `--input-file` are not valid Claude Code flags. (source: real-exam-questions/scenario-01-code-generation.md)", "source": "practice-tests/module-banks/module-code-generation.md"}, {"id": "module-ci-cd:5", "moduleId": "ci-cd", "moduleName": "Claude Code for CI/CD", "promp
